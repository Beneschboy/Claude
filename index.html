  if(phase==='idle'){
    var demo=[{r:'K',s:'♠',red:false,ok:true},{r:'9',s:'♥',red:true,ok:true},{r:'3',s:'♦',red:true,ok:false}];
    return(
      html`<div className="flex flex-col items-center w-full max-w-xl text-center screen-enter">
        <div className="text-5xl mb-3">\u{1F0A1}</div>
        <p className="text-gray-900 text-xl font-bold mb-2">Kartenduell</p>
        <p className="text-gray-600 text-sm mb-5 max-w-md leading-relaxed">
          Jede Runde zieht jede·r eine Karte. Die Karten werden nach Wert sortiert —
          wer unter der roten Linie landet, scheidet aus.
        </p>
        <div className="kd-table kd-felt w-full px-4 py-5 mb-4">
          <p className="text-emerald-100/70 text-xs font-bold uppercase tracking-widest mb-3">So funktioniert's</p>
          <div className="flex items-end justify-center gap-3 mb-3">
            ${demo.map(function(d,i){
              return html`<div key=${i} className="rounded-lg bg-white border-2 flex flex-col items-center justify-center relative"
                style=${{width:62,height:88,borderColor:d.ok?'rgba(34,197,94,.9)':'rgba(220,38,38,.95)',
                  boxShadow:d.ok?'0 0 0 2px rgba(34,197,94,.3)':'0 0 18px rgba(220,38,38,.55)'}}>
                <span className="font-black" style=${{fontSize:22,color:d.red?'#dc2626':'#111827'}}>${d.r}${d.s}</span>
                <span className="absolute font-black text-red-600" style=${{bottom:6,fontSize:9}}>${d.ok?'':'RAUS'}</span>
              </div>`;
            })}
          </div>
          <div className="flex items-center gap-2 justify-center">
            <div className="h-px flex-1 max-w-24" style=${{background:'rgba(248,113,113,.7)'}}></div>
            <span className="px-2.5 py-0.5 rounded-full bg-red-600 text-white font-black" style=${{fontSize:10}}>niedrigste fliegt raus</span>
            <div className="h-px flex-1 max-w-24" style=${{background:'rgba(248,113,113,.7)'}}></div>
          </div>
        </div>
        <p className="text-gray-500 text-xs mb-1">Kartenwerte: A = 14 · K = 13 · D = 12 · B = 11 · 10 … 2</p>
        <p className="text-gray-500 text-xs mb-6">${n} Spieler·innen · ${planRounds(n,5).length} Runden</p>
        <button onClick=${start} className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95" style=${{background:'linear-gradient(135deg,#1e3a8a,#312e81)',boxShadow:'0 8px 24px rgba(30,58,138,0.30)'}}>\u{1F0CF} Karten austeilen</button>
      </div>`
    );
  }

  var activeCards=cards.filter(function(c){return !c.out;});

  return(
    html`<div className="flex flex-col items-center w-full max-w-5xl screen-enter">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-3">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#1e3a8a,#4338ca,#be123c)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F0A1} Kartenduell</h2>

        ${roundTotal>0&&phase==='running'&&html`<div className="flex items-center gap-1.5 justify-center mt-2">
          ${Array.from({length:roundTotal},function(_,i){
            return html`<span key=${i} className=${"kd-dot "+(i===roundIdx?"on":(i<roundIdx?"done":""))}></span>`;
          })}
        </div>`}
      </div>

      <div className="w-full rounded-xl bg-indigo-50 border border-indigo-200 px-4 py-2 mb-3 text-center">
        <span className="text-indigo-900 text-xs font-semibold">Regel: höchste Karte = sicher · niedrigste = raus</span>
        <span className="text-indigo-500 text-xs ml-2">A 14 · K 13 · D 12 · B 11 · 10–2</span>
      </div>

      <div className="kd-table kd-felt w-full px-4 py-5 mb-4">
        <div className="flex items-center justify-between mb-3 px-1">
          <span className="text-emerald-100/80 font-bold uppercase tracking-widest" style=${{fontSize:10}}>\u{2705} Sicher</span>
          <span className="text-emerald-100/50 font-semibold" style=${{fontSize:10}}>${activeCards.length} Karten im Spiel</span>
        </div>
        <div className="flex flex-wrap justify-center items-start gap-2">
          ${activeCards.map(tableCard)}
          ${cut&&html`<div className="kd-cut flex items-center gap-2 w-full my-1" style=${{order:cut.order}}>
            <div className="h-0 flex-1" style=${{borderTop:'2px dashed rgba(248,113,113,.85)'}}></div>
            <span className="px-3 py-1 rounded-full bg-red-600 text-white font-black shadow-lg whitespace-nowrap" style=${{fontSize:11}}>
              \u{2702} darunter: ${cut.k} raus</span>
            <div className="h-0 flex-1" style=${{borderTop:'2px dashed rgba(248,113,113,.85)'}}></div>
          </div>`}
        </div>
      </div>

      ${tray.length>0&&html`<div className="w-full mb-4">
        <p className="text-gray-500 text-center mb-2" style=${{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em'}}>Ausgeschieden (${tray.length})</p>
        <div className="flex flex-wrap gap-1.5 justify-center bg-gray-50 rounded-xl p-2.5 border border-gray-200">
          ${tray.map(function(e,i){
            var su=KD_SUITS[e.suit]||KD_SUITS[0];
            return html`<div key=${i} className="flex flex-col items-center" style=${{width:52}}>
              <div className="kd-tray-card flex items-center justify-center" style=${{width:34,height:46}}>
                <span className="font-black" style=${{fontSize:13,color:su.red?'#dc2626':'#111827'}}>${KD_RANKS[e.rank]}${su.s}</span>
                <span className="absolute text-white bg-gray-500 rounded-full font-bold flex items-center justify-center"
                  style=${{fontSize:8,width:14,height:14,top:-5,right:-5}}>${e.round}</span>
              </div>
              <span className="text-gray-600 font-semibold mt-1 text-center leading-tight" style=${{fontSize:9}}>${truncName(e.name,9)}</span>
            </div>`;
          })}
        </div>
      </div>`}

      ${winner&&html`<div className="winner-enter mb-5">
        <div className="winner-card rounded-2xl px-10 py-6 text-white text-center shadow-2xl border-2 border-amber-400/40" style=${{background:'linear-gradient(135deg,#1e3a8a,#312e81)'}}>
          <div className="text-amber-200 text-sm font-semibold tracking-widest uppercase mb-1">\u{1F0CF} Letzte Karte</div>
          <div className="text-4xl font-black tracking-tight">${winner}</div>
          <div className="mt-2 text-2xl">\u{1F389}\u{1F3C6}\u{1F389}</div>
          <${CopyButton} modeName="Kartenduell" winner=${winner}/>
        </div>
      </div>`}

      <div className="flex gap-3 mt-1 flex-wrap justify-center">
        ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='done'&&html`<span className="flex gap-3">
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </span>`}
      </div>
    </div>`
  );
}

function BallonMode(props){

  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];

  var _popping=useState([]);var popping=_popping[0];var setPopping=_popping[1];

  var _el=useState([]);var eliminated=_el[0];var setEliminated=_el[1];
  var timers=useRef([]);var audioRef=useRef(null);

  var END_T=14000;var GROW_MS=END_T+900;

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  useEffect(function(){return function(){clearT();stopAH(audioRef.current);audioRef.current=null;};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  function playPump(){
    try{
      var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      var buf=c.createBuffer(1,Math.floor(c.sampleRate*0.13),c.sampleRate);
      var d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.25*(i/d.length);
      var src=c.createBufferSource();src.buffer=buf;
      var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=780+Math.random()*320;
      var g=c.createGain();g.gain.setValueAtTime(0.26,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.13);
      src.connect(f);f.connect(g);g.connect(m);src.start(now);
    }catch(e){}
  }
  function playStep(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;
      aT(c,ah.master,190+Math.random()*60,c.currentTime,0.06,0.09,'triangle');}catch(e){}
  }
  function playPop(){
    try{
      var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      var buf=c.createBuffer(1,Math.floor(c.sampleRate*0.12),c.sampleRate);
      var d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.4);
      var src=c.createBufferSource();src.buffer=buf;
      var g=c.createGain();g.gain.setValueAtTime(0.75,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.12);
      src.connect(g);g.connect(m);src.start(now);
      aT(c,m,110,now,0.10,0.45,'square');
      aT(c,m,55,now+0.02,0.16,0.30,'sine');
    }catch(e){}
  }

  var n=names.length;
  var cols=n<=6?3:n<=12?4:n<=24?6:8;
  var baseW=n>24?66:n>12?92:118;
  var w=baseW;
  var h=Math.round(w*1.18);
  var fs=Math.max(9,Math.min(17,Math.round(w*0.185)));
  var nameMax=Math.max(5,Math.floor(w/(fs*0.56)));
  var cellH=Math.round(h*1.12)+26;
  var figSc=Math.max(0.58,Math.min(1,w/118));
  var aliveCount=alive.length;

  /* Zielposition neben dem Ballon berechnen */
  function beneTarget(i,sc){
    var cont=gridRef.current;var cell=cellRefs.current[i];
    if(!cont||!cell)return null;
    var cr=cont.getBoundingClientRect();var er=cell.getBoundingClientRect();
    var cx=er.left-cr.left+er.width/2;
    var by=er.top-cr.top+er.height-(h*sc*0.5+10);
    var fromRight=cx<cr.width*0.28;
    var gap=w*sc*0.5+36*figSc;
    return {x:fromRight?cx+gap:cx-gap,y:by+12*figSc,flip:fromRight};
  }

  function start(){
    if(phase==='running')return;
    clearT();stopAH(audioRef.current);
    var ah=createAudioCtx();audioRef.current=ah;playObstacleMusic(ah);

    var nn=names.length;
    var winnerIdx=Math.floor(Math.random()*nn);
    setAlive(names.map(function(_,i){return i;}));
    setPopping([]);setBursts([]);setEliminated([]);setWinner(null);setShowConfetti(false);
    setBene({show:false,x:-120,y:cellH*0.45,flip:false,travel:900,stab:0});
    setPhase('running');setStatusText('\u{1F4A8} Die Pumpe läuft — alle Ballons wachsen!');

    var order=shuffle(names.map(function(_,i){return i;}).filter(function(i){return i!==winnerIdx;}));
    var startT=1400;
    var stepT=order.length<=1?0:((END_T-startT)/(order.length-1));
    // Benesch taucht genau einmal auf — irgendwo im mittleren Drittel
    var beneAt=order.length<3?0:(Math.floor(order.length*0.3)+Math.floor(Math.random()*Math.max(1,Math.round(order.length*0.45))));
    if(beneAt>order.length-1)beneAt=order.length-1;

    for(var pt=0;pt<Math.floor(GROW_MS/620);pt++){
      (function(k){later(function(){playPump();},200+k*620);})(pt);
    }

    order.forEach(function(idx,i){
      var at=order.length<=1?END_T:(startT+i*stepT);
      var sc=0.52+0.54*Math.min(1,at/GROW_MS);

      // Benesch: einmaliger Auftritt bei genau diesem Ballon
      if(i===beneAt){
        var TRAVEL=1200;
        later(function(){
          var tg=beneTarget(idx,sc);
          if(!tg)return;
          // erst unsichtbar am Rand platzieren …
          setBene({show:true,x:tg.flip?(gridRef.current?gridRef.current.clientWidth+120:900):-120,
            y:tg.y,flip:tg.flip,travel:0,stab:0});
        },Math.max(0,at-TRAVEL-60));
        later(function(){
          var tg=beneTarget(idx,sc);
          if(!tg)return;
          playStep();
          setBene(function(b){return {show:true,x:tg.x,y:tg.y,flip:tg.flip,travel:TRAVEL,stab:b.stab};});
        },Math.max(0,at-TRAVEL));
        later(function(){playStep();},Math.max(0,at-TRAVEL*0.5));
        later(function(){
          setBene(function(b){return Object.assign({},b,{stab:b.stab+1});});
        },Math.max(0,at-160));
        // … und wieder abtreten
        later(function(){
          playStep();
          setBene(function(b){return Object.assign({},b,{
            x:b.flip?(gridRef.current?gridRef.current.clientWidth+130:900):-130,travel:1000});});
        },at+700);
        later(function(){setBene(function(b){return Object.assign({},b,{show:false});});},at+1750);
      }

      later(function(){
        playPop();
        setPopping(function(p){return p.concat([idx]);});
        var shards=[];
        for(var s=0;s<13;s++){
          var a=(s/13)*Math.PI*2+Math.random()*0.5;
          var dist=34+Math.random()*54;
          shards.push({dx:Math.round(Math.cos(a)*dist),dy:Math.round(Math.sin(a)*dist-14),
            rot:Math.round(140+Math.random()*300),w:4+Math.random()*8,h:3+Math.random()*6});
        }
        setBursts(function(p){return p.concat([{id:idx,sc:sc,shards:shards}]);});
        setEliminated(function(p){return p.concat([{name:names[idx],color:BALL_COLORS[idx%BALL_COLORS.length]}]);});
        setStatusText(i===beneAt
          ? '\u{1F9F7} Benesch sticht '+names[idx]+'s Ballon!'
          : '\u{1F4A5} '+names[idx]+'s Ballon ist geplatzt!');
      },at);
      later(function(){
        setAlive(function(p){return p.filter(function(x){return x!==idx;});});
        setPopping(function(p){return p.filter(function(x){return x!==idx;});});
        setBursts(function(p){return p.filter(function(b){return b.id!==idx;});});
      },at+760);
    });

    later(function(){
      var wName=names[winnerIdx];
      setPhase('done');setWinner(wName);setShowConfetti(true);
      setStatusText('\u{1F3C6} '+wName+'s Ballon hält als Einziger!');
      onResult(wName);
      stopAH(audioRef.current);audioRef.current=null;
    },END_T+900);
  }

  function reset(){
    clearT();stopAH(audioRef.current);audioRef.current=null;
    setPhase('idle');setAlive([]);setPopping([]);setBursts([]);setEliminated([]);
    setBene({show:false,x:-90,y:0,flip:false,travel:600,stab:0});
    setWinner(null);setShowConfetti(false);setStatusText('');
  }

  if(phase==='idle'){
    return(
      html`<div className="flex flex-col items-center w-full max-w-lg text-center screen-enter">
        <div className="text-5xl mb-3">\u{1F388}</div>
        <p className="text-gray-900 text-xl font-bold mb-2">Ballon-Wettpumpen</p>
        <p className="text-gray-600 text-sm mb-4 max-w-sm leading-relaxed">
          Alle Ballons werden gleichzeitig aufgepumpt und werden dabei immer größer.
          Einer nach dem anderen platzt — wer hält am längsten durch?
        </p>
        <p className="text-gray-400 text-xs mb-6 italic">Und irgendwann taucht Benesch mit seiner Nadel auf…</p>
        <p className="text-gray-500 text-xs mb-6">${n} Ballons</p>
        <button onClick=${start} className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95" style=${{background:'linear-gradient(135deg,#ec4899,#f43f5e)',boxShadow:'0 8px 24px rgba(236,72,153,0.30)'}}>\u{1F4A8} Pumpe an!</button>
      </div>`
    );
  }

  function burstFor(i){
    for(var b=0;b<bursts.length;b++)if(bursts[b].id===i)return bursts[b];
    return null;
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-4xl screen-enter">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-4 w-full flex flex-col items-center">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#ec4899,#f43f5e,#f59e0b)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F388} Ballon-Wettpumpen</h2>
        <p role="status" aria-live="polite" className="text-gray-800 text-base font-semibold">${statusText}</p>
        ${phase==='running'&&html`<p className="text-gray-500 text-xs mt-0.5">${aliveCount} von ${n} Ballons heil</p>`}
        ${phase==='running'&&html`<div className="mt-2 w-full max-w-xs">
          <div className="flex items-center justify-between mb-1">
            <span className="text-gray-400" style=${{fontSize:9,letterSpacing:'0.1em'}}>DRUCK</span>
            <span className="text-gray-400" style=${{fontSize:9}}>\u{1F4A8}</span>
          </div>
          <div className="w-full h-2 rounded-full bg-gray-200 overflow-hidden">
            <div className="bl-pressure" style=${{animationDuration:GROW_MS+'ms'}}></div>
          </div>
        </div>`}
      </div>

      <div ref=${gridRef} className="relative w-full mb-5">
        <div className="w-full grid gap-2 justify-items-center" style=${{gridTemplateColumns:'repeat('+cols+',minmax(0,1fr))'}}>
          ${names.map(function(nm,i){return {nm:nm,i:i};}).filter(function(e){
            return alive.indexOf(e.i)>=0||popping.indexOf(e.i)>=0;
          }).map(function(e){
            var nm=e.nm;var i=e.i;
            var isAlive=alive.indexOf(i)>=0;
            var isPopping=popping.indexOf(i)>=0;
            var col=BALL_COLORS[i%BALL_COLORS.length];
            var isWin=winner!==null&&isAlive;
            var bu=burstFor(i);
            var growDur=Math.round(GROW_MS*(0.90+((i%5)*0.045)));
            return html`<div key=${i} className="bl-cell" ref=${function(el){cellRefs.current[i]=el;}}
              style=${{height:cellH,position:'relative'}}>
              <div className="bl-grow" style=${{animationDuration:growDur+'ms'}}>
                <div className=${"bl-bob"+(isWin?" bl-champ":"")} style=${{display:'flex',flexDirection:'column',alignItems:'center',animationDelay:((i%7)*0.22)+'s'}}>
                  <div className=${isPopping?"bl-pop":""} style=${{display:'flex',flexDirection:'column',alignItems:'center'}}>
                    <div className="bl-balloon" style=${{
                      width:w,height:h,fontSize:fs,
                      background:'radial-gradient(circle at 34% 26%,'+col+'ff,'+col+'cc 52%,'+col+'80)',
                      boxShadow:isWin
                        ?'0 0 0 3px rgba(251,191,36,.75),0 10px 26px rgba(0,0,0,.20),inset -7px -9px 16px rgba(0,0,0,.20),inset 7px 7px 14px rgba(255,255,255,.30)'
                        :undefined
                    }}>
                      ${truncName(nm,nameMax)}
                      <div className="bl-shine"></div>
                    </div>
                    <div className="bl-knot"></div>
                  </div>
                </div>
              </div>
              ${bu&&html`<div style=${{position:'absolute',left:0,right:0,bottom:Math.round(h*bu.sc*0.5+10),height:0,zIndex:30}}>
                <div className="bl-flash" style=${{width:h*bu.sc*1.25,height:h*bu.sc*1.25,marginLeft:-(h*bu.sc*1.25)/2,marginTop:-(h*bu.sc*1.25)/2,
                  background:'radial-gradient(circle,rgba(255,255,255,.98),'+col+'cc 45%,'+col+'00 72%)'}}></div>
                <div className="bl-ring" style=${{width:h*bu.sc*0.95,height:h*bu.sc*0.95,marginLeft:-(h*bu.sc*0.95)/2,marginTop:-(h*bu.sc*0.95)/2}}></div>
                ${bu.shards.map(function(s,si){
                  return html`<div key=${si} className="bl-shard" style=${{
                    width:s.w,height:s.h,borderRadius:'40% 60% 55% 45%',background:col,
                    animationDelay:(si%3)*0.02+'s',
                    ['--sx']:s.dx+'px',['--sy']:s.dy+'px',['--sr']:s.rot+'deg'}}></div>`;
                })}
                <div className="bl-bang" style=${{fontSize:Math.max(13,Math.round(h*bu.sc*0.24))}}>PENG!</div>
              </div>`}
            </div>`;
          })}
        </div>

        ${bene.show&&html`<div className="bn-wrap" style=${{
            left:bene.x,top:bene.y,
            transform:'translate(-50%,-50%) scale('+figSc+')',
            transition:'left '+bene.travel+'ms cubic-bezier(.4,0,.35,1),top '+bene.travel+'ms cubic-bezier(.4,0,.35,1)'}}>
          <div className="bn-fig">
            <div key=${'s'+bene.stab} className=${bene.flip?"bn-stab-l":"bn-stab-r"}>
              <${BeneschFigure} flip=${bene.flip}/>
            </div>
          </div>
          <div className="bn-tag" style=${{fontSize:11}}>Benesch</div>
        </div>`}
      </div>

      ${eliminated.length>0&&!winner&&html`<div className="w-full max-w-3xl mb-4">
        <p className="text-gray-500 text-center mb-1.5" style=${{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em'}}>Geplatzt</p>
        <div className="flex flex-wrap gap-1.5 justify-center bg-gray-50 rounded-xl p-2.5 border border-gray-200">
          ${eliminated.map(function(e,i){return html`<div key=${i} className="tray-ball tray-pop" style=${{background:'radial-gradient(circle at 35% 30%,'+e.color+'dd,'+e.color+'aa)',animationDelay:(i*0.03)+'s'}}>${truncName(e.name,8)}</div>`;})}
        </div>
      </div>`}

      ${winner&&html`<div className="winner-enter mb-5">
        <div className=${"winner-card bg-gradient-to-br "+CARD_COLORS[nameToColorIdx(winner)]+" rounded-2xl px-10 py-6 text-white text-center shadow-2xl border-2 border-amber-400/40"}>
          <div className="text-amber-200 text-sm font-semibold tracking-widest uppercase mb-1">\u{1F388} Letzter Ballon</div>
          <div className="text-4xl font-black tracking-tight">${winner}</div>
          <div className="mt-2 text-2xl">\u{1F389}\u{1F3C6}\u{1F389}</div>
          <${CopyButton} modeName="Ballon-Wettpumpen" winner=${winner}/>
        </div>
      </div>`}

      <div className="flex gap-3 mt-1 flex-wrap justify-center">
        ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='done'&&html`<span className="flex gap-3">
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-pink-50 text-pink-700 border border-pink-200 hover:bg-pink-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </span>`}
      </div>
    </div>`
  );
}

        className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
    </div>
    <p className="text-gray-500 text-xs mb-6">${total} Personen → ca. ${Math.ceil(total/value)} pro Gruppe</p>
  </div>`;
}

function splitGroups(n,ng){
  var shuffled=shuffle(Array.from({length:n},function(_,i){return i;}));
  var groups=[];for(var g=0;g<ng;g++)groups.push([]);
  shuffled.forEach(function(idx,i){groups[i%ng].push(idx);});
  return groups;
}

function groupPalette(gi){return GROUP_COLORS[gi%GROUP_COLORS.length];}

  return html`<svg width="102" height="62" viewBox="0 0 102 62" aria-hidden="true">
    <ellipse cx="51" cy="52" rx="36" ry="7" fill="rgba(0,0,0,0.35)"/>

function TauziehenMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var maxGroups=Math.min(4,Math.max(2,Math.floor(names.length/2)));
  var _ng=useState(function(){return Math.min(2,maxGroups);});var numGroups=_ng[0];var setNumGroups=_ng[1];
  var _ph=useState('pick');var phase=_ph[0];var setPhase=_ph[1];
  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];
  var _groups=useState([]);var groups=_groups[0];var setGroups=_groups[1];
  var _live=useState([]);var liveGroups=_live[0];var setLiveGroups=_live[1];
  var _pulled=useState(0);var pulledN=_pulled[0];var setPulledN=_pulled[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var canvasRef=useRef(null);var gRef=useRef(null);var rafRef=useRef(null);
  var timers=useRef([]);var audioRef=useRef(null);

  var AW=860;
  var AH=numGroups===2?450:560;
  var CX=AW/2;var CY=numGroups===2?AH*0.56:AH*0.52;

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  function doCleanup(){
    clearT();
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  useEffect(function(){return function(){doCleanup();};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='pick'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase,numGroups]);

  /* ── Sound ── */
  function playTug(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      aT(c,m,68+Math.random()*26,now,0.18,0.34,'triangle');
      aT(c,m,190,now+0.04,0.09,0.16,'square');
      var buf=c.createBuffer(1,Math.floor(c.sampleRate*0.14),c.sampleRate);
      var d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.6)*0.5;
      var src=c.createBufferSource();src.buffer=buf;
      var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1600;
      var g=c.createGain();g.gain.setValueAtTime(0.22,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.14);
      src.connect(f);f.connect(g);g.connect(m);src.start(now);
    }catch(e){}
  }
  function playCheer(len){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      var dur=len||0.9;
      var buf=c.createBuffer(1,Math.floor(c.sampleRate*dur),c.sampleRate);
      var d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++){
        var e=Math.sin(Math.PI*(i/d.length));
        d[i]=(Math.random()*2-1)*e*0.6;
      }
      var src=c.createBufferSource();src.buffer=buf;
      var f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=0.7;
      var g=c.createGain();g.gain.value=0.32;
      src.connect(f);f.connect(g);g.connect(m);src.start(now);
    }catch(e){}
  }
  function playWhistle(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      var o=c.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(2100,now);
      o.frequency.setValueAtTime(2450,now+0.10);
      o.frequency.setValueAtTime(2100,now+0.20);
      var g=c.createGain();g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(0.20,now+0.03);
      g.gain.setValueAtTime(0.20,now+0.28);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.42);
      o.connect(g);g.connect(m);o.start(now);o.stop(now+0.45);
    }catch(e){}
  }

  /* ── Geometrie ── */
  function teamDir(i,ng){
    if(ng===2)return[{x:-1,y:0},{x:1,y:0}][i];
    if(ng===3)return[{x:-1,y:-0.34},{x:1,y:-0.34},{x:0,y:1}][i];
    return[{x:-1,y:-0.62},{x:1,y:-0.62},{x:-1,y:0.62},{x:1,y:0.62}][i];
  }
  function norm(v){var l=Math.sqrt(v.x*v.x+v.y*v.y)||1;return{x:v.x/l,y:v.y/l};}

  function start(){
    if(phase==='running')return;
    doCleanup();
    var ah=createAudioCtx();audioRef.current=ah;playObstacleMusic(ah);

    var ng=numGroups;
    var built=splitGroups(names.length,ng);
    var Rx=AW*0.40,Ry=AH*0.34;

    var teams=[];
    built.forEach(function(gr,gi){
      var d=teamDir(gi,ng);
      var anchor={x:CX+d.x*Rx,y:CY+d.y*Ry};
      var u=norm({x:anchor.x-CX,y:anchor.y-CY});
      var m=gr.length;
      var rows=m>5?2:1;
      var rowLen=Math.ceil(m/rows);
      teams.push({gi:gi,anchor:anchor,u:u,perp:{x:-u.y,y:u.x},

        color:groupPalette(gi).light,surge:0,cheer:0});
    });

    var people=[];
    built.forEach(function(gr,gi){
      var tm=teams[gi];
      gr.forEach(function(idx,j){
        var row=tm.rows>1?(j%2):0;
        var pos=tm.rows>1?Math.floor(j/2):j;
        var span=0.46;
        var stepT=tm.rowLen>1?span/(Math.ceil(tm.total/tm.rows)-1||1):0;
        var ca=Math.random()*Math.PI*2;var cr=28+Math.random()*46;
        people.push({
          id:idx,name:names[idx],team:gi,color:groupPalette(gi).light,
          slotT:0.13+pos*stepT,side:tm.rows>1?(row===0?-1:1):0,
          x:CX+Math.cos(ca)*cr,y:CY+Math.sin(ca)*cr*0.6,
          ca:ca,cr:cr,jitter:Math.random()*Math.PI*2,walk:Math.random()*6,
          pulled:false,tug:0,slide:0
        });
      });
    });

    var g2={people:people,teams:teams,ng:ng,done:false,final:false,finalTeam:-1,
      knot:{x:CX,y:CY},knotV:{x:0,y:0},shake:0,dust:[],floats:[],t:0,ropeT:0};
    gRef.current=g2;
    setGroups(built);
    setLiveGroups(built.map(function(){return [];}));
    setPulledN(0);setShowConfetti(false);
    setPhase('running');setStatusText('\u{1FAA2} Das Seil ist gespannt — auf die Plätze!');
    playWhistle();

    var order=shuffle(people.map(function(_,i){return i;}));
    var startT=1200;var endT=13500;
    order.forEach(function(pi,i){
      var at=order.length<=1?endT:(startT+i*((endT-startT)/(order.length-1)));
      later(function(){
        var gg=gRef.current;if(!gg||gg.done)return;
        var p=gg.people[pi];if(!p)return;
        p.pulled=true;p.tug=1;p.slide=1;
        var tm=gg.teams[p.team];
        tm.pulled++;tm.surge=1;tm.cheer=1;
        gg.shake=Math.min(1,gg.shake+0.7);
        gg.ropeT=1;
        // Staubwolke am Startpunkt
        for(var d=0;d<14;d++){
          var da=Math.random()*Math.PI*2;
          gg.dust.push({x:p.x,y:p.y+8,vx:Math.cos(da)*(1+Math.random()*2.4),
            vy:-Math.abs(Math.sin(da))*1.6-0.3,r:2+Math.random()*4,life:26,maxLife:26,c:'rgba(214,203,180,'});
        }
        gg.floats.push({x:p.x,y:p.y-24,txt:'RUCK!',color:tm.color,life:38,maxLife:38});
        playTug();
        if(Math.random()<0.45)playCheer(0.5);
        setPulledN(function(v){return v+1;});
        setLiveGroups(function(prev){
          var nx=prev.map(function(a){return a.slice();});
          if(nx[p.team])nx[p.team].push(p.id);
          return nx;
        });
        setStatusText('\u{1F4AA} Gruppe '+(p.team+1)+' reißt '+p.name+' herüber!');
      },at);
    });

    // Schlusspfiff: das stärkste Team zieht durch
    later(function(){
      var gg=gRef.current;if(!gg||gg.done)return;
      var best=0;
      for(var i=1;i<gg.teams.length;i++)if(gg.teams[i].total>gg.teams[best].total)best=i;
      gg.final=true;gg.finalTeam=best;
      gg.teams[best].surge=1;gg.shake=1;
      playWhistle();playCheer(1.6);
      setStatusText('\u{1F3C1} Endspurt — Gruppe '+(best+1)+' zieht durch!');

      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  /* ── Update ── */
  function ropePoint(g,tm,t){
    return{x:tm.anchor.x+(g.knot.x-tm.anchor.x)*t,
           y:tm.anchor.y+(g.knot.y-tm.anchor.y)*t};
  }

  function update(g,dt){
    g.t+=dt;
    if(g.shake>0)g.shake=Math.max(0,g.shake-0.045*dt);
    if(g.ropeT>0)g.ropeT=Math.max(0,g.ropeT-0.03*dt);

    // Kräfteverhältnis → Knotenposition
    var tot=0;
    for(var i=0;i<g.teams.length;i++){
      var tm=g.teams[i];
      if(tm.surge>0)tm.surge=Math.max(0,tm.surge-0.028*dt);
      if(tm.cheer>0)tm.cheer=Math.max(0,tm.cheer-0.012*dt);
      tot+=tm.pulled+0.25;
    }
    var tx=CX,ty=CY;
    var K=g.ng===2?150:120;
    for(var j=0;j<g.teams.length;j++){
      var t2=g.teams[j];
      var share=(t2.pulled+0.25)/tot-1/g.ng;
      var extra=t2.surge*0.30+(g.final&&g.finalTeam===j?1.6:0);
      tx+=t2.u.x*(share*K*2.2+extra*46);
      ty+=t2.u.y*(share*K*2.2+extra*46);
    }
    // Zittern im Kräftegleichgewicht
    tx+=Math.sin(g.t*0.09)*4.5+Math.sin(g.t*0.031)*3;
    ty+=Math.cos(g.t*0.077)*3.2;
    g.knot.x+=(tx-g.knot.x)*0.055*dt;
    g.knot.y+=(ty-g.knot.y)*0.055*dt;

    for(var p2=0;p2<g.people.length;p2++){
      var p=g.people[p2];
      p.jitter+=0.05*dt;
      if(p.tug>0)p.tug=Math.max(0,p.tug-0.024*dt);
      if(p.slide>0)p.slide=Math.max(0,p.slide-0.035*dt);
      var gx,gy,ease;
      if(p.pulled){
        var tm2=g.teams[p.team];
        var rp=ropePoint(g,tm2,p.slotT);
        gx=rp.x+tm2.perp.x*p.side*15;
        gy=rp.y+tm2.perp.y*p.side*15;
        // Ruck: kurz nach vorn Richtung Knoten, dann zurückstemmen
        var back=Math.sin(p.tug*Math.PI*3)*p.tug*20;
        gx+=(g.knot.x-gx)*0.0+tm2.u.x*back*-1;
        gy+=tm2.u.y*back*-1;
        gx+=Math.sin(p.jitter*2.4)*1.6;
        gy+=Math.cos(p.jitter*2.1)*1.4;
        ease=0.085;
        p.walk+=(0.05+p.tug*0.35)*dt;
        if(p.slide>0.35&&Math.random()<0.35){
          g.dust.push({x:p.x,y:p.y+9,vx:(Math.random()-0.5)*1.2,vy:-0.4-Math.random()*0.8,
            r:1.6+Math.random()*3,life:20,maxLife:20,c:'rgba(214,203,180,'});
        }
      }else{
        p.ca+=0.006*dt;
        gx=g.knot.x+Math.cos(p.ca)*p.cr;
        gy=g.knot.y+Math.sin(p.ca)*p.cr*0.62;
        gx+=Math.cos(p.jitter)*4;gy+=Math.sin(p.jitter*1.3)*3;
        ease=0.06;
        p.walk+=0.04*dt;
      }
      p.x+=(gx-p.x)*ease*dt;p.y+=(gy-p.y)*ease*dt;
    }

    for(var d2=g.dust.length-1;d2>=0;d2--){
      var du=g.dust[d2];
      du.x+=du.vx*dt;du.y+=du.vy*dt;du.vy+=0.045*dt;du.vx*=0.97;du.life-=dt;
      du.r+=0.12*dt;
      if(du.life<=0)g.dust.splice(d2,1);
    }
    for(var f2=g.floats.length-1;f2>=0;f2--){
      var fl=g.floats[f2];
      fl.y-=0.55*dt;fl.life-=dt;
      if(fl.life<=0)g.floats.splice(f2,1);
    }
  }

  /* ── Hintergrund (einmalig) ── */
  function buildField(g){
    var c=document.createElement('canvas');
    c.width=AW*2;c.height=AH*2;
    var t=c.getContext('2d');t.setTransform(2,0,0,2,0,0);
    var R=(function(){var s=771123;return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;};})();

    // Himmel + Tribüne
    var sky=t.createLinearGradient(0,0,0,AH*0.34);
    sky.addColorStop(0,'#101a2c');sky.addColorStop(1,'#16243a');
    t.fillStyle=sky;t.fillRect(0,0,AW,AH*0.34);
    // Zuschauer
    for(var row=0;row<5;row++){
      var ry=14+row*13;
      for(var s2=0;s2<Math.ceil(AW/13);s2++){
        var sx=6+s2*13+((row%2)*6);
        var cc=['#f59e0b','#ef4444','#3b82f6','#22c55e','#a855f7','#e2e8f0','#f472b6'][Math.floor(R()*7)];
        t.globalAlpha=0.30+R()*0.35;
        t.fillStyle=cc;
        t.beginPath();t.arc(sx,ry,3.1,0,Math.PI*2);t.fill();
        t.fillRect(sx-2.6,ry+2,5.2,5);
      }
    }
    t.globalAlpha=1;
    // Bande
    t.fillStyle='#1f2937';t.fillRect(0,AH*0.30-8,AW,16);
    t.fillStyle='rgba(255,255,255,0.07)';t.fillRect(0,AH*0.30-8,AW,4);

    // Rasen mit Mähstreifen
    var grass=t.createLinearGradient(0,AH*0.30,0,AH);
    grass.addColorStop(0,'#2a6b34');grass.addColorStop(1,'#17421f');
    t.fillStyle=grass;t.fillRect(0,AH*0.30,AW,AH*0.70);
    for(var st=0;st<12;st++){
      t.fillStyle=st%2===0?'rgba(255,255,255,0.030)':'rgba(0,0,0,0.05)';
      t.fillRect(st*(AW/12),AH*0.30,AW/12,AH*0.70);
    }
    // Flutlicht-Kegel
    for(var fl2=0;fl2<2;fl2++){
      var fx=fl2===0?AW*0.18:AW*0.82;
      var lg=t.createRadialGradient(fx,AH*0.18,10,fx,AH*0.85,AH*0.85);
      lg.addColorStop(0,'rgba(255,255,220,0.13)');
      lg.addColorStop(1,'rgba(255,255,220,0)');
      t.fillStyle=lg;t.fillRect(0,AH*0.18,AW,AH);
      t.fillStyle='rgba(255,250,200,0.85)';
      t.beginPath();t.ellipse(fx,AH*0.30-14,9,5,0,0,Math.PI*2);t.fill();
      t.fillStyle='#334155';t.fillRect(fx-2,AH*0.30-14,4,12);
    }
    return c;
  }

  /* ── Draw ── */
  function draw(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    var sh=g.shake;
    var ox=sh>0?(Math.random()-0.5)*sh*7:0;
    var oy=sh>0?(Math.random()-0.5)*sh*7:0;
    ctx.setTransform(2,0,0,2,ox*2,oy*2);

    if(!g._bg)g._bg=buildField(g);
    ctx.drawImage(g._bg,0,0,AW,AH);

    // Mittellinie + Teamlinien (Kreide)
    ctx.save();
    ctx.setLineDash([9,8]);ctx.strokeStyle='rgba(255,255,255,0.30)';ctx.lineWidth=2;
    if(g.ng===2){
      ctx.beginPath();ctx.moveTo(CX,AH*0.32);ctx.lineTo(CX,AH-8);ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,0.16)';
      ctx.beginPath();ctx.moveTo(CX-110,AH*0.32);ctx.lineTo(CX-110,AH-8);ctx.stroke();
      ctx.beginPath();ctx.moveTo(CX+110,AH*0.32);ctx.lineTo(CX+110,AH-8);ctx.stroke();
    }else{
      ctx.beginPath();ctx.arc(CX,CY,120,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();

    // Schlammloch unter dem Knoten
    ctx.save();
    var mg=ctx.createRadialGradient(CX,CY,6,CX,CY,74);
    mg.addColorStop(0,'rgba(60,42,22,0.85)');
    mg.addColorStop(0.7,'rgba(46,33,18,0.55)');
    mg.addColorStop(1,'rgba(46,33,18,0)');
    ctx.fillStyle=mg;
    ctx.beginPath();ctx.ellipse(CX,CY,74,30,0,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(120,90,50,0.35)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(CX,CY,74,30,0,0,Math.PI*2);ctx.stroke();
    ctx.restore();

    // ── Seile
    for(var t3=0;t3<g.teams.length;t3++){
      var tm=g.teams[t3];
      var tension=Math.min(1,(tm.pulled+0.4)/Math.max(1,tm.total));
      var sag=(1-tension)*16+6-g.ropeT*4;
      var mx=(tm.anchor.x+g.knot.x)/2+tm.perp.x*0;
      var my=(tm.anchor.y+g.knot.y)/2+sag;
      ctx.save();
      ctx.lineCap='round';
      ctx.strokeStyle='rgba(0,0,0,0.35)';ctx.lineWidth=11;
      ctx.beginPath();ctx.moveTo(tm.anchor.x,tm.anchor.y+4);
      ctx.quadraticCurveTo(mx,my+5,g.knot.x,g.knot.y+4);ctx.stroke();
      ctx.strokeStyle='#8b5a2b';ctx.lineWidth=9;
      ctx.beginPath();ctx.moveTo(tm.anchor.x,tm.anchor.y);
      ctx.quadraticCurveTo(mx,my,g.knot.x,g.knot.y);ctx.stroke();
      ctx.strokeStyle='rgba(214,168,96,0.55)';ctx.lineWidth=3;
      ctx.setLineDash([7,7]);ctx.lineDashOffset=-now*0.006;
      ctx.beginPath();ctx.moveTo(tm.anchor.x,tm.anchor.y);
      ctx.quadraticCurveTo(mx,my,g.knot.x,g.knot.y);ctx.stroke();
      ctx.restore();
      // Endpfosten
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.beginPath();ctx.ellipse(tm.anchor.x,tm.anchor.y+16,14,5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#475569';
      hRR(ctx,tm.anchor.x-5,tm.anchor.y-18,10,34,4);ctx.fill();
      ctx.fillStyle=tm.color;
      hRR(ctx,tm.anchor.x-5,tm.anchor.y-18,10,7,3);ctx.fill();
      ctx.restore();
    }

    // ── Knoten mit Fahne
    ctx.save();
    var kw=1+g.ropeT*0.25;
    ctx.translate(g.knot.x,g.knot.y);
    ctx.fillStyle='rgba(0,0,0,0.40)';
    ctx.beginPath();ctx.ellipse(0,16,15,5,0,0,Math.PI*2);ctx.fill();
    ctx.scale(kw,kw);
    ctx.fillStyle='#a16207';
    ctx.beginPath();ctx.arc(0,0,12,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#7c4a06';ctx.lineWidth=2.5;ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(-2,-3,6,0.4,3.1);ctx.stroke();
    ctx.fillStyle='#dc2626';
    ctx.fillRect(-1.6,-34,3.2,24);
    ctx.beginPath();ctx.moveTo(1.6,-34);ctx.lineTo(20,-29);ctx.lineTo(1.6,-24);ctx.closePath();ctx.fill();
    ctx.restore();

    // ── Figuren (nach y sortiert)
    var order=g.people.slice().sort(function(a,b){return a.y-b.y;});
    for(var oi=0;oi<order.length;oi++){
      var p=order[oi];
      var tm4=g.teams[p.team];
      var u=g.ng===2?16:14;
      var dirFace,lean;
      if(p.pulled){
        // Blick zum Knoten, Körper nach hinten gestemmt
        dirFace=(g.knot.x-p.x)<0?-1:1;
        lean=(0.22+p.tug*0.18)*(dirFace>0?1:1);
      }else{dirFace=(g.knot.x-p.x)<0?-1:1;lean=0.04;}

      // Speed-Lines beim Herüberziehen
      if(p.slide>0.15){
        ctx.save();ctx.globalAlpha=p.slide*0.5;
        ctx.strokeStyle=p.color;ctx.lineWidth=2;
        for(var sl=0;sl<3;sl++){
          var lx=p.x-tm4.u.x*(16+sl*11);
          var ly=p.y-tm4.u.y*(16+sl*11)+(sl-1)*6;
          ctx.beginPath();ctx.moveTo(lx,ly);
          ctx.lineTo(lx-tm4.u.x*13,ly-tm4.u.y*13);ctx.stroke();
        }
        ctx.restore();
      }

      drawHero(ctx,{x:p.x,y:p.y,s:u,
        color:p.pulled?p.color:'#7c8798',
        walk:p.walk,face:dirFace,hair:p.id%6,skin:(p.id*3)%4,
        gear:p.pulled?'band':null,
        lean:p.pulled?(dirFace>0?lean:-lean):0,
        glow:p.tug>0.3?'rgba(251,191,36,'+p.tug+')':null});

      // Namensschild
      ctx.save();
      var nm=truncName(p.name,10);
      var fs=fitFont(ctx,nm,u*3.6,g.ng===2?12:11,8);
      var tw=ctx.measureText(nm).width;
      var ly2=p.y-u*1.95;
      ctx.fillStyle=p.pulled?'rgba(2,6,23,0.72)':'rgba(2,6,23,0.5)';
      hRR(ctx,p.x-tw/2-5,ly2-fs*0.72,tw+10,fs*1.44,fs*0.5);ctx.fill();
      ctx.fillStyle=p.pulled?p.color:'#94a3b8';
      ctx.fillRect(p.x-tw/2-5,ly2-fs*0.72,2.5,fs*1.44);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=p.pulled?'#fff':'rgba(255,255,255,0.6)';
      ctx.fillText(nm,p.x,ly2);
      ctx.restore();
    }

    // Staub
    for(var di=0;di<g.dust.length;di++){
      var du=g.dust[di];
      var a=Math.max(0,du.life/du.maxLife);
      ctx.fillStyle=du.c+(a*0.55)+')';
      ctx.beginPath();ctx.arc(du.x,du.y,du.r,0,Math.PI*2);ctx.fill();
    }

    // RUCK!-Texte
    for(var fi=0;fi<g.floats.length;fi++){
      var fo=g.floats[fi];
      var fa=Math.max(0,fo.life/fo.maxLife);
      ctx.save();ctx.globalAlpha=fa;
      ctx.font='900 20px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=4;ctx.lineJoin='round';
      ctx.strokeText(fo.txt,fo.x,fo.y);
      ctx.fillStyle=fo.color;ctx.fillText(fo.txt,fo.x,fo.y);
      ctx.restore();
    }

    // ── Team-Banner mit Kraftbalken
    for(var s3=0;s3<g.teams.length;s3++){
      var tmm=g.teams[s3];
      var lbl='Gruppe '+(tmm.gi+1);
      var bw=132,bh=42;
      var bx=Math.max(8,Math.min(AW-bw-8,tmm.anchor.x-bw/2));
      var by=tmm.u.y>0.3?Math.min(AH-bh-6,tmm.anchor.y+46):Math.max(AH*0.32,tmm.anchor.y-bh-46);
      ctx.save();
      if(tmm.cheer>0){ctx.shadowColor=tmm.color;ctx.shadowBlur=16*tmm.cheer;}
      ctx.fillStyle='rgba(2,6,23,0.78)';
      hRR(ctx,bx,by,bw,bh,9);ctx.fill();
      ctx.strokeStyle=tmm.color;ctx.lineWidth=2;ctx.stroke();
      ctx.restore();
      ctx.fillStyle=tmm.color;
      hRR(ctx,bx,by,5,bh,2.5);ctx.fill();
      ctx.font='bold 13px Inter,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(lbl,bx+13,by+13);
      ctx.font='bold 12px Inter,sans-serif';ctx.textAlign='right';
      ctx.fillStyle=tmm.color;ctx.fillText(tmm.pulled+'/'+tmm.total,bx+bw-11,by+13);
      // Kraftbalken
      ctx.fillStyle='rgba(255,255,255,0.14)';
      hRR(ctx,bx+13,by+25,bw-26,7,3.5);ctx.fill();
      var frac=tmm.total?tmm.pulled/tmm.total:0;
      ctx.fillStyle=tmm.color;
      if(frac>0){hRR(ctx,bx+13,by+25,(bw-26)*frac,7,3.5);ctx.fill();}
      // Muskel-Icons
      ctx.font='11px sans-serif';ctx.textAlign='left';
      ctx.globalAlpha=0.35+0.65*Math.min(1,frac);
      ctx.fillText('\u{1F4AA}',bx+13,by+38);
      ctx.globalAlpha=1;
    }

    // Zähler oben
    var pulledTot=0;
    for(var pc=0;pc<g.people.length;pc++)if(g.people[pc].pulled)pulledTot++;
    ctx.save();
    ctx.fillStyle='rgba(2,6,23,0.65)';
    hRR(ctx,CX-72,AH*0.32+4,144,24,8);ctx.fill();
    ctx.strokeStyle='rgba(163,230,53,0.4)';ctx.lineWidth=1;ctx.stroke();
    ctx.font='bold 12px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#d9f99d';
    ctx.fillText('\u{1FAA2} '+pulledTot+' / '+g.people.length+' am Seil',CX,AH*0.32+16);
    ctx.restore();
  }

  function reset(){
    doCleanup();gRef.current=null;
    setPhase('pick');setGroups([]);setLiveGroups([]);setPulledN(0);setShowConfetti(false);setStatusText('');
    if(canvasRef.current){var c=canvasRef.current.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,AW*2,AH*2);}
  }

  if(phase==='pick'){
    return(
      html`<div className="flex flex-col items-center w-full max-w-lg text-center screen-enter">
        <div className="text-5xl mb-3">\u{1FAA2}</div>
        <p className="text-gray-900 text-xl font-bold mb-2">Tauziehen</p>
        <p className="text-gray-600 text-sm mb-6 max-w-sm leading-relaxed">
          Alle stehen am Knoten über dem Schlammloch. Ein Team nach dem anderen reißt seine Leute
          herüber — je mehr am Seil, desto weiter wandert der Knoten auf ihre Seite.
        </p>
        <${GroupCountPicker} value=${numGroups} setValue=${setNumGroups} max=${maxGroups} total=${names.length} label="Wie viele Teams?"/>
        <button onClick=${start} className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95" style=${{background:'linear-gradient(135deg,#65a30d,#3f6212)',boxShadow:'0 8px 24px rgba(101,163,13,0.30)'}}>\u{1FAA2} Seil spannen!</button>
      </div>`
    );
  }

  var shown=phase==='done'?groups:liveGroups;
  var gridCols=Math.min(Math.max(shown.length,1),4);

  return(
    html`<div className="flex flex-col items-center w-full max-w-5xl screen-enter">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-3">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#65a30d,#a16207,#7c2d12)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1FAA2} Tauziehen</h2>
        <p role="status" aria-live="polite" className="text-gray-800 text-base font-semibold">${statusText}</p>
        ${phase==='running'&&html`<p className="text-gray-500 text-xs mt-0.5">${pulledN} von ${names.length} herübergezogen</p>`}
      </div>

      <div className="relative w-full mb-4 rounded-2xl overflow-hidden border border-lime-900/40 shadow-2xl">
        <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{display:'block',width:'100%',height:'auto'}} role="img" aria-label="Tauziehen"/>
      </div>

      ${shown.length>0&&html`<div className="w-full grid gap-3 mb-5" style=${{gridTemplateColumns:'repeat('+gridCols+',minmax(0,1fr))'}}>
        ${shown.map(function(g,gi){
          return html`<div key=${gi} className="rounded-xl overflow-hidden border border-gray-200 shadow-md">
            <div className=${"px-3 py-2 text-center bg-gradient-to-br "+groupPalette(gi).bg}>
              <span className="text-white font-bold text-sm">Gruppe ${gi+1}</span>
              <span className="text-white/70 text-xs ml-1">(${g.length})</span>
            </div>
            <div className="bg-white p-2 space-y-1 min-h-8">
              ${g.map(function(idx,ni){return html`<div key=${ni} className=${"text-gray-800 text-sm font-medium px-2 py-1 rounded bg-gray-50 fade-in "+(ni===g.length-1&&phase==='running'?"name-pop":"")}>${names[idx]}</div>`;})}
            </div>
          </div>`;
        })}
      </div>`}

      <div className="flex gap-3 mt-1 flex-wrap justify-center">
        ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='done'&&html`<span className="flex gap-3">
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-lime-50 text-lime-800 border border-lime-300 hover:bg-lime-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </span>`}
      </div>
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   ENDBOSS — 1:1 gegen Prof. Benesch

/* ═══════════════════════════════════════════════════════
   ENDBOSS — Textbausteine, Baukasten, Verlaufs-Archetypen
   Reine Logik, ohne React — pro Duell wird ein Archetyp
   gewürfelt, der den kompletten Verlauf bestimmt.
   ═══════════════════════════════════════════════════════ */
var EB_P_LINES=[
  {t:'{H} startet mit einer Fangfrage!',p:'question'},
  {t:'{H} kennt die Jahreszahl auswendig!',p:'book'},
  {t:'{H} zitiert eine Formel fehlerfrei!',p:'formula'},
  {t:'{H} findet einen Fehler an der Tafel!',p:'question'},

function ebPick(a){return a[Math.floor(Math.random()*a.length)];}
function ebRi(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function ebQueue(pool){
  var bag=shuffle(pool.slice());var i=0;
  return function(){
    if(i>=bag.length){bag=shuffle(pool.slice());i=0;}
    return bag[i++];
  };
}

/* ── Baukasten: Zustand + Bausteine, aus denen ein Archetyp seinen Verlauf setzt ── */
function ebMakeKit(){
  var B={s:[],t:0,bHp:100,pHp:100};
  B.nextP=ebQueue(EB_P_LINES);
  B.nextB=ebQueue(EB_B_LINES);
  B.nextCrit=ebQueue(EB_CRITS);
  B.nextLow=ebQueue(EB_LOWS);
  B.nextMiss=ebQueue(EB_MISS);
  B.beatLo=2020;B.beatHi=2480;
  B.beat=function(){return ebRi(B.beatLo,B.beatHi);};

  B.A=function(dt,who,dmg,text,opt){
    B.t+=dt;B.s.push(Object.assign({t:B.t,who:who,dmg:dmg,text:text},opt||{}));
  };
  /* Herausforderer drückt Benesch auf 'target' Wissen */
  B.pTo=function(target,opt,line){
    var d=Math.max(1,Math.round(B.bHp-target));B.bHp-=d;
    var L=line||B.nextP();
    B.A(B.beat(),'p',d,L.t,Object.assign({proj:L.p},opt||{}));
  };
  /* Benesch drückt den Herausforderer auf 'target' Wissen */
  B.bTo=function(target,opt,line){
    var d=Math.max(1,Math.round(B.pHp-target));B.pHp-=d;
    var L=line||B.nextB();
    B.A(B.beat(),'b',d,L.t,Object.assign({proj:L.p},opt||{}));
  };
  /* Schlagabtausch über n Runden, beide Kurven linear auf ihr Ziel */
  B.exchange=function(n,bEnd,pEnd,pFirst){
    var b0=B.bHp,p0=B.pHp;
    var first=Math.random()<(pFirst===undefined?0.6:pFirst);
    for(var i=1;i<=n;i++){
      var bt=Math.round(b0+(bEnd-b0)*(i/n));
      var pt=Math.round(p0+(pEnd-p0)*(i/n));
      if(first){B.pTo(bt);B.bTo(pt);}else{B.bTo(pt);B.pTo(bt);}
    }
  };
  B.miss=function(){
    var ms=B.nextMiss();
    B.A(B.beat(),'miss',0,ms.t,{proj:ebPick(['question','plane','book']),banner:ms.b,bcolor:'#94a3b8'});
  };
  /* Crit + „Benesch überlegt" — er sinkt auf lowTo */
  B.fakeOut=function(lowTo){
    var c=B.nextCrit();
    B.pTo(Math.min(B.bHp-1,lowTo+ebRi(14,24)),{crit:true,banner:c.b},{t:c.t,p:c.p});
    var low=B.nextLow();
    B.pTo(lowTo,{banner:low.b,bcolor:'#4ade80'},{t:low.t,p:ebPick(EB_P_LINES).p});
  };
  B.phase2=function(healTo,lines){
    B.A(ebRi(2200,2600),'x',0,ebPick(EB_PRE),{pause:true});
    var ph=ebPick(lines||EB_PHASE2);
    B.A(ebRi(1400,1800),'rage',0,ph.t,{banner:ph.b,bcolor:'#ef4444',heal:healTo});
    B.bHp=healTo;
  };
  /* Grosser Abschluss mit Vorbereitung und Ultimate */
  B.ultimate=function(){
    B.A(ebRi(2100,2600),'x',0,ebPick(EB_PRE),{pause:true,banner:'…',bcolor:'#f59e0b',bsize:30});
    var fin=Math.random()<0.10
      ?{t:'Angesagte Schularbeit — ohne Ansage.',b:'SURPRISE-TEST!!!',p:'test'}
      :ebPick(EB_FINISH);
    B.A(ebRi(1500,1900),'ult',0,fin.b.replace('!!!','!'),
      {banner:fin.b,bcolor:'#ef4444',bsize:fin.b.length>12?32:40});
    B.A(ebRi(1300,1700),'b',99,fin.t,{proj:fin.p,crit:true,final:true});
    B.pHp=0;
  };
  /* Leises Ende: der Rest geht als gewöhnlicher Treffer, kein „-ALLES" */
  B.quietEnd=function(){
    if(B.pHp<=0)return;
    var q=ebPick(EB_QUIET_END);
    B.bTo(0,{banner:q.b,bcolor:'#f59e0b',bsize:32},{t:q.t,p:q.p});
  };
  return B;
}

/* Kein Archetyp zweimal hintereinander */
var ebLastArch=null;
function ebPickArchetype(){
  var pool=EB_ARCHETYPES.filter(function(a){return a.id!==ebLastArch;});
  if(!pool.length)pool=EB_ARCHETYPES;
  var total=0;pool.forEach(function(a){total+=a.weight;});
  var r=Math.random()*total;
  for(var i=0;i<pool.length;i++){
    r-=pool[i].weight;
    if(r<=0){ebLastArch=pool[i].id;return pool[i];}
  }
  ebLastArch=pool[pool.length-1].id;return pool[pool.length-1];
}

/* Die Boss-Musik läuft 60 s und loopt nicht — OFFSET 3200 + Nachlauf 2100 abgezogen */
var EB_MAX_T=54000;
function ebFitBudget(s){
  if(!s.length)return s;
  var last=s[s.length-1].t;
  if(last<=EB_MAX_T)return s;
  var k=EB_MAX_T/last;
  for(var i=0;i<s.length;i++)s[i].t=Math.round(s[i].t*k);
  return s;
}

function ebBuildScript(){
  var arch=ebPickArchetype();
  var B=ebMakeKit();
  arch.build(B);
  B.quietEnd(); // Sicherung, falls ein Archetyp den Herausforderer stehen lässt
  ebFitBudget(B.s);
  return {events:B.s,arch:arch};
}

  function showBanner(txt,color,size){
    var id=banIdRef.current++;
    setBanner({id:id,txt:txt,color:color||'#fbbf24',size:size||44});
    later(function(){setBanner(function(b){return b&&b.id===id?null:b;});},1500);
  }


  function start(){
    if(phase==='fight')return;
    doCleanup();
    var ah=createAudioCtx();audioRef.current=ah;playBossMusic(ah);

    var g={pPose:0,bPose:0,pHit:0,bHit:0,pHp:100,bHp:100,
      proj:[],parts:[],dmgs:[],shake:0,rage:0,t:0,
      bLow:0,pLow:0,bKnee:0,ended:false,flash:0,zoom:0,dust:[]};
    gRef.current=g;

    var built=ebBuildScript();
    var arch=built.arch;
    var script=built.events;
    setArchInfo(arch);

    setHpP(100);setHpB(100);setRage(false);setRoundN(0);
    setLogText('Prof. Benesch betritt den Raum. Wissensduell!');
    setPhase('fight');
    showBanner('ENDBOSS',' #fbbf24'.trim(),52);
    later(function(){showBanner('PROF. BENESCH','#ef4444',38);},1400);
    later(function(){setLogText(arch.intro);},2600);

    var OFFSET=3200;
    script.forEach(function(ev,i){
      later(function(){
        var gg=gRef.current;if(!gg||gg.ended)return;
        setRoundN(i+1);
        if(ev.text)setLogText(ev.text.replace('{H}',hero));
        if(ev.banner)showBanner(ev.banner,ev.bcolor||'#fbbf24',ev.bsize||44);

        if(ev.who==='rage'){
          gg.rage=1;gg.flash=1;gg.shake=1;setRage(true);
          sRage();
          later(function(){
            var g2=gRef.current;if(!g2)return;
            g2.bHp=ev.heal;setHpB(ev.heal);sHeal();
            for(var q=0;q<26;q++){
              var a=Math.random()*Math.PI*2;
              g2.parts.push({x:BX,y:GROUND-70,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2-1,
                life:34,maxLife:34,c:'#ef4444',r:2.6});
            }
          },900);
          return;
        }
        if(ev.who==='ult'){
          gg.flash=1;gg.shake=1;gg.bPose=1;
          sRage();
          for(var q2=0;q2<40;q2++){
            var a2=Math.random()*Math.PI*2;
            gg.parts.push({x:BX,y:GROUND-70,vx:Math.cos(a2)*5,vy:Math.sin(a2)*5,
              life:40,maxLife:40,c:q2%2?'#ef4444':'#fde68a',r:3});
          }
          return;
        }
        if(ev.who==='x'){gg.bPose=0;gg.pPose=0;return;}

        var fromP=(ev.who==='p'||ev.who==='miss');
        if(fromP){gg.pPose=1;later(function(){var g3=gRef.current;if(g3)g3.pPose=0;},420);}
        else{gg.bPose=1;later(function(){var g3=gRef.current;if(g3)g3.bPose=0;},420);}
        sSwing();

        if(ev.proj){
          gg.proj.push({x:fromP?PX+34:BX-38,y:GROUND-(fromP?52:78),
            tx:fromP?BX-24:PX+22,ty:GROUND-(fromP?76:52),
            t:0,dur:fromP?26:24,type:ev.proj,rot:0,miss:ev.who==='miss',
            crit:!!ev.crit,dmg:ev.dmg,toBoss:fromP,final:!!ev.final});
        }
      },OFFSET+ev.t);
    });

    var lastT=script.length?script[script.length-1].t:0;
    later(function(){
      var gg=gRef.current;if(!gg)return;
      gg.ended=true;
      setPhase('done');
      setLogText(arch.outro);
      showBanner(arch.endBanner,'#ef4444',34);
      sDefeat();
      onResult('Prof. Benesch');
      later(function(){stopAH(audioRef.current);audioRef.current=null;},2200);
    },OFFSET+lastT+2100);

    var last=performance.now();
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-last)/16.67);last=now;
      update(gg,dt);draw(gg,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function applyDamage(g,pr){
    var dmg=pr.dmg;
    if(pr.toBoss){
      g.bHp=Math.max(pr.final?0:1,g.bHp-dmg);
      g.bHit=1;setHpB(Math.round(g.bHp));
      if(g.bHp<=12)g.bKnee=1;
    }else{
      g.pHp=Math.max(0,g.pHp-(pr.final?g.pHp:dmg));
      g.pHit=1;setHpP(Math.round(g.pHp));
    }
    g.shake=Math.min(1,g.shake+(pr.crit?0.9:0.45));
    g.dmgs.push({x:pr.tx,y:pr.ty-20,txt:'-'+(pr.final?'ALLES':dmg)+' Wissen',
      color:pr.crit?'#fde68a':'#fca5a5',life:44,maxLife:44,big:!!pr.crit});
    if(pr.crit)sCrit();else sHit(dmg);
    for(var i=0;i<(pr.crit?26:14);i++){
      var a=Math.random()*Math.PI*2;var sp=1.6+Math.random()*(pr.crit?5:3);
      g.parts.push({x:pr.tx,y:pr.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,
        life:26,maxLife:26,c:pr.crit?'#fde68a':(pr.toBoss?'#fca5a5':'#93c5fd'),r:2.2});
    }
  }

  function update(g,dt){
    g.t+=dt;
    if(g.shake>0)g.shake=Math.max(0,g.shake-0.05*dt);
    if(g.flash>0)g.flash=Math.max(0,g.flash-0.035*dt);
    if(g.pHit>0)g.pHit=Math.max(0,g.pHit-0.06*dt);
    if(g.bHit>0)g.bHit=Math.max(0,g.bHit-0.06*dt);
    if(g.rage>0&&g.rage<1)g.rage=Math.min(1,g.rage+0.02*dt);
    if(g.bKnee>0&&g.bHp>20)g.bKnee=Math.max(0,g.bKnee-0.02*dt);

    for(var i=g.proj.length-1;i>=0;i--){
      var pr=g.proj[i];
      pr.t+=dt;pr.rot+=0.28*dt;
      var k=Math.min(1,pr.t/pr.dur);
      pr.cx=pr.x+(pr.tx-pr.x)*k;
      pr.cy=pr.y+(pr.ty-pr.y)*k-Math.sin(k*Math.PI)*46;
      if(k>=1){
        if(pr.miss){
          g.dmgs.push({x:pr.tx,y:pr.ty-24,txt:'DANEBEN',color:'#cbd5e1',life:40,maxLife:40});
        }else if(pr.dmg>0){
          applyDamage(g,pr);
        }
        g.proj.splice(i,1);
      }
    }
    for(var p=g.parts.length-1;p>=0;p--){
      var pt=g.parts[p];
      pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=0.13*dt;pt.life-=dt;
      if(pt.life<=0)g.parts.splice(p,1);
    }
    for(var d=g.dmgs.length-1;d>=0;d--){
      var dm=g.dmgs[d];
      dm.y-=0.65*dt;dm.life-=dt;
      if(dm.life<=0)g.dmgs.splice(d,1);
    }
    if(Math.random()<0.15*dt){
      g.dust.push({x:Math.random()*AW,y:AH,vy:-0.25-Math.random()*0.4,
        x0:Math.random()*6,life:150,maxLife:150,r:0.8+Math.random()*1.4});
    }
    for(var u=g.dust.length-1;u>=0;u--){
      var du=g.dust[u];
      du.y+=du.vy*dt;du.life-=dt;
      if(du.life<=0)g.dust.splice(u,1);
    }
  }
  /* ── Prof. Benesch — junger, cooler Lehrer ── */
  function drawBoss(ctx,g,now){
    var breathe=Math.sin(now/620)*3;
    var knee=g.bKnee;
    var x=BX,y=GROUND-knee*14;
    var lunge=g.bPose?-26:0;
    var hit=g.bHit;
    var rage=g.rage>0;

    ctx.save();
    ctx.translate(x+lunge,y+breathe*0.4);
    if(knee>0)ctx.rotate(knee*0.09);
    if(hit>0)ctx.translate((Math.random()-0.5)*hit*7,0);
    ctx.scale(-(1+(rage?0.05:0)),1+(rage?0.05:0)); // schaut nach links
    if(rage){
      ctx.shadowColor='rgba(239,68,68,'+(0.55+0.45*Math.sin(now/180))+')';
      ctx.shadowBlur=34;
    }

    // Schatten
    ctx.fillStyle='rgba(0,0,0,0.42)';
    ctx.beginPath();ctx.ellipse(0,4,44,10,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=rage?26:0;

    // Slim-Jeans
    ctx.fillStyle='#2f3f57';
    hRR(ctx,-19,-54,16,54,6);ctx.fill();
    hRR(ctx,4,-54,16,54,6);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.07)';
    hRR(ctx,-19,-54,5,54,3);ctx.fill();
    // Sneaker
    ctx.fillStyle='#f8fafc';
    hRR(ctx,-22,-8,22,10,5);ctx.fill();
    hRR(ctx,2,-8,22,10,5);ctx.fill();
    ctx.fillStyle='#111827';
    hRR(ctx,-22,-3,22,5,2.5);ctx.fill();
    hRR(ctx,2,-3,22,5,2.5);ctx.fill();
    ctx.fillStyle=rage?'#ef4444':'#38bdf8';
    hRR(ctx,-20,-6,7,3,1.5);ctx.fill();
    hRR(ctx,4,-6,7,3,1.5);ctx.fill();

    // Hinterer Arm (aufgekrempelter Ärmel)
    ctx.fillStyle='#1f3350';
    hRR(ctx,-39,-104,15,26,7);ctx.fill();
    ctx.fillStyle='#f0c49b';
    hRR(ctx,-38,-82,13,26,6);ctx.fill();

    // Oberkörper: schmales Hemd, Kragen offen
    var sg=ctx.createLinearGradient(-27,-114,26,-50);
    sg.addColorStop(0,rage?'#3b1220':'#254168');
    sg.addColorStop(0.5,rage?'#5b1524':'#2c4d78');
    sg.addColorStop(1,rage?'#2a0d16':'#1d3455');
    ctx.fillStyle=sg;
    hRR(ctx,-26,-114,52,66,11);ctx.fill();
    // Knopfleiste
    ctx.strokeStyle='rgba(255,255,255,0.16)';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(2,-96);ctx.lineTo(2,-52);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.30)';
    for(var bt=0;bt<3;bt++){ctx.beginPath();ctx.arc(2,-88+bt*14,1.7,0,Math.PI*2);ctx.fill();}
    // Offener Kragen
    ctx.fillStyle='#f0c49b';
    ctx.beginPath();ctx.moveTo(-9,-114);ctx.lineTo(9,-114);ctx.lineTo(3,-96);ctx.lineTo(-3,-96);ctx.closePath();ctx.fill();
    ctx.fillStyle=rage?'#7f1d1d':'#1d3455';
    ctx.beginPath();ctx.moveTo(-13,-115);ctx.lineTo(-2,-113);ctx.lineTo(-6,-97);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(13,-115);ctx.lineTo(2,-113);ctx.lineTo(6,-97);ctx.closePath();ctx.fill();
    // Lanyard mit Lehrer-Ausweis
    ctx.strokeStyle=rage?'#ef4444':'#f59e0b';ctx.lineWidth=2.4;
    ctx.beginPath();ctx.moveTo(-8,-112);ctx.lineTo(-2,-84);ctx.moveTo(10,-112);ctx.lineTo(3,-84);ctx.stroke();
    ctx.fillStyle='#f8fafc';
    hRR(ctx,-6,-84,17,12,2.5);ctx.fill();
    ctx.fillStyle=rage?'#ef4444':'#2563eb';
    hRR(ctx,-6,-84,17,3.5,1.5);ctx.fill();
    ctx.fillStyle='#94a3b8';
    ctx.fillRect(-3.5,-78,11,1.4);ctx.fillRect(-3.5,-75.5,8,1.4);

    // Kopf
    var hy=-140;
    ctx.fillStyle='#f0c49b';
    ctx.beginPath();ctx.ellipse(0,hy,23,26,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(-22,hy+3,4.5,6.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(22,hy+3,4.5,6.5,0,0,Math.PI*2);ctx.fill();
    // Kinnschatten / Dreitagebart
    ctx.fillStyle='rgba(122,97,54,0.22)';
    ctx.beginPath();ctx.ellipse(1,hy+14,15,9,0,0,Math.PI);ctx.fill();

    // Moderne Frisur: kurze Seiten, Quiff nach oben — dunkelblond
    ctx.fillStyle='#7a6136';
    ctx.beginPath();ctx.arc(0,hy-3,23,Math.PI*1.02,Math.PI*1.98);ctx.closePath();ctx.fill();
    ctx.fillRect(-23,hy-6,7,10);
    ctx.fillRect(16,hy-6,7,10);
    ctx.fillStyle='#9d7f47';
    ctx.beginPath();
    ctx.moveTo(-19,hy-16);
    ctx.quadraticCurveTo(-10,hy-40,10,hy-32);
    ctx.quadraticCurveTo(20,hy-28,20,hy-16);
    ctx.quadraticCurveTo(2,hy-25,-19,hy-16);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.20)';
    ctx.beginPath();
    ctx.moveTo(-12,hy-19);ctx.quadraticCurveTo(-4,hy-31,8,hy-27);
    ctx.quadraticCurveTo(-2,hy-24,-12,hy-19);ctx.closePath();ctx.fill();

    // Brille (schmal) bzw. Sonnenbrille in Phase 2
    if(rage){
      ctx.fillStyle='#0f172a';
      hRR(ctx,-21,hy-10,42,15,4);ctx.fill();
      ctx.fillStyle='rgba(239,68,68,'+(0.55+0.35*Math.sin(now/150))+')';
      hRR(ctx,-19,hy-8,17,11,3);ctx.fill();
      hRR(ctx,3,hy-8,17,11,3);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.6)';
      ctx.beginPath();ctx.moveTo(-17,hy+1);ctx.lineTo(-9,hy-7);ctx.lineTo(-6,hy-7);ctx.lineTo(-14,hy+1);ctx.closePath();ctx.fill();
    }else{
      ctx.strokeStyle='#1f2937';ctx.lineWidth=2.1;
      hRR(ctx,-19,hy-9,16,13,4);ctx.stroke();
      hRR(ctx,3,hy-9,16,13,4);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-3,hy-3);ctx.lineTo(3,hy-3);ctx.stroke();
      var glint=0.3+0.7*Math.max(0,Math.sin(now/700));
      ctx.fillStyle='rgba(191,219,254,'+(0.30*glint)+')';
      hRR(ctx,-19,hy-9,16,13,4);ctx.fill();
      hRR(ctx,3,hy-9,16,13,4);ctx.fill();
      ctx.fillStyle='#111827';
      ctx.beginPath();ctx.arc(-11,hy-2,2.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(11,hy-2,2.5,0,Math.PI*2);ctx.fill();
    }
    // Brauen
    ctx.strokeStyle='#6d5730';ctx.lineWidth=2.8;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(-19,hy-13);ctx.lineTo(-5,hy-11);
    ctx.moveTo(19,hy-13);ctx.lineTo(5,hy-11);ctx.stroke();
    // Mund — lässiges Halbgrinsen
    ctx.strokeStyle='#8a4b3a';ctx.lineWidth=2.2;
    ctx.beginPath();
    if(knee>0.3)ctx.arc(1,hy+13,6,0.2,Math.PI-0.2);
    else{ctx.moveTo(-6,hy+13);ctx.quadraticCurveTo(2,hy+18,9,hy+11);}
    ctx.stroke();

    // Vorderer Arm: Ärmel gekrempelt + Smartwatch + Marker/Tablet
    var swing=g.bPose?-0.9:Math.sin(now/620)*0.10;
    ctx.save();
    ctx.translate(25,-105);ctx.rotate(swing);
    ctx.fillStyle=rage?'#5b1524':'#254168';
    hRR(ctx,-7,0,15,24,7);ctx.fill();
    ctx.fillStyle=rage?'#7f1d1d':'#1d3455';
    hRR(ctx,-8,20,17,6,3);ctx.fill();
    ctx.fillStyle='#f0c49b';
    hRR(ctx,-6,24,13,24,6);ctx.fill();
    // Smartwatch
    ctx.fillStyle='#111827';
    hRR(ctx,-7,32,15,7,2);ctx.fill();
    ctx.fillStyle=rage?'#ef4444':'#22d3ee';
    hRR(ctx,-4,33.5,9,4,1.5);ctx.fill();
    ctx.fillStyle='#f0c49b';
    ctx.beginPath();ctx.arc(0.5,50,7.5,0,Math.PI*2);ctx.fill();
    if(rage){
      // Roter Marker mit Leuchten
      ctx.fillStyle='#dc2626';
      hRR(ctx,-3.5,46,8,26,3.5);ctx.fill();
      ctx.fillStyle='#7f1d1d';
      hRR(ctx,-3.5,46,8,6,3);ctx.fill();
      ctx.fillStyle='#fca5a5';
      ctx.beginPath();ctx.moveTo(-3.5,72);ctx.lineTo(4.5,72);ctx.lineTo(0.5,80);ctx.closePath();ctx.fill();
      ctx.shadowColor='#ef4444';ctx.shadowBlur=16;
      ctx.fillStyle='rgba(239,68,68,0.55)';
      ctx.beginPath();ctx.arc(0.5,75,7,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
    }else{
      // Tablet
      ctx.fillStyle='#111827';
      hRR(ctx,-13,44,27,20,3);ctx.fill();
      ctx.fillStyle='#1e3a8a';
      hRR(ctx,-11,46,23,16,2);ctx.fill();
      ctx.fillStyle='rgba(147,197,253,0.7)';
      ctx.fillRect(-8,50,17,1.6);ctx.fillRect(-8,54,12,1.6);ctx.fillRect(-8,58,15,1.6);
    }
    ctx.restore();
    ctx.restore();

    // Treffer-Blitz
    if(hit>0.05){
      ctx.save();
      ctx.globalAlpha=hit*0.55;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(x,y-72,50,84,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }


  /* ── Held/in (Schüler-Look) ── */
  function drawHeroFig(ctx,g,now){
    var x=PX+(g.pPose?26:0);
    var y=GROUND;
    var hit=g.pHit;
    var down=g.pHp<=0;
    ctx.save();
    if(hit>0)ctx.translate((Math.random()-0.5)*hit*6,0);
    if(down){ctx.translate(x,y);ctx.rotate(-1.3);ctx.translate(-x,-y);}
    // Rucksack
    ctx.fillStyle='#1d4ed8';
    hRR(ctx,x-30,y-64,16,32,6);ctx.fill();
    ctx.fillStyle='#1e3a8a';
    hRR(ctx,x-30,y-56,16,7,3);ctx.fill();
    drawHero(ctx,{x:x,y:y-30,s:30,color:'#22c55e',
      walk:g.pPose?1.3:Math.sin(now/420)*0.35,
      face:1,hair:2,skin:0,gear:'cap',
      lean:g.pPose?-0.22:0.02,
      dead:down,
      glow:hit>0.2?'rgba(147,197,253,0.9)':null});
    ctx.restore();
    if(hit>0.05){
      ctx.save();ctx.globalAlpha=hit*0.5;ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(x,y-42,34,52,0,0,Math.PI*2);ctx.fill();ctx.restore();
    }
  }

  function drawProj(ctx,pr,now){
    ctx.save();
    ctx.translate(pr.cx||pr.x,pr.cy||pr.y);
    ctx.rotate(pr.rot*(pr.toBoss?1:-1));
    if(pr.type==='plane'){
      ctx.fillStyle='#f8fafc';
      ctx.beginPath();ctx.moveTo(-13,-8);ctx.lineTo(15,0);ctx.lineTo(-13,8);ctx.lineTo(-8,0);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;ctx.stroke();
    }else if(pr.type==='eraser'){
      ctx.fillStyle='#f472b6';hRR(ctx,-9,-6,18,12,3);ctx.fill();
      ctx.fillStyle='#fbcfe8';hRR(ctx,-9,-6,18,4,2);ctx.fill();
    }else if(pr.type==='chalk'){
      ctx.fillStyle='#f8fafc';hRR(ctx,-12,-4,24,8,4);ctx.fill();
      ctx.fillStyle='rgba(0,0,0,0.12)';hRR(ctx,-12,0,24,4,2);ctx.fill();
    }else if(pr.type==='homework'){
      ctx.fillStyle='#fef3c7';hRR(ctx,-11,-13,22,26,2);ctx.fill();
      ctx.strokeStyle='#d97706';ctx.lineWidth=1;
      for(var i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-7,-8+i*6);ctx.lineTo(7,-8+i*6);ctx.stroke();}
    }else if(pr.type==='question'){
      ctx.fillStyle='#60a5fa';
      ctx.font='900 26px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=4;ctx.lineJoin='round';
      ctx.strokeText('?',0,0);ctx.fillText('?',0,0);
    }else if(pr.type==='pointer'){
      ctx.fillStyle='#8b5a2b';hRR(ctx,-18,-3,36,6,3);ctx.fill();
      ctx.fillStyle='#111827';hRR(ctx,12,-4,8,8,3);ctx.fill();
    }else if(pr.type==='book'){
      ctx.fillStyle='#1d4ed8';hRR(ctx,-14,-11,28,22,3);ctx.fill();
      ctx.fillStyle='#f8fafc';hRR(ctx,-11,-8,22,16,2);ctx.fill();
      ctx.strokeStyle='#93c5fd';ctx.lineWidth=1;
      for(var bk=0;bk<3;bk++){ctx.beginPath();ctx.moveTo(-7,-4+bk*5);ctx.lineTo(7,-4+bk*5);ctx.stroke();}
      ctx.fillStyle='#facc15';hRR(ctx,-2,-11,4,8,1);ctx.fill();
    }else if(pr.type==='formula'){
      ctx.fillStyle='#a78bfa';
      ctx.font='900 20px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.65)';ctx.lineWidth=4;ctx.lineJoin='round';
      ctx.strokeText('x²',0,0);ctx.fillText('x²',0,0);
    }else if(pr.type==='test'){
      ctx.shadowColor='#ef4444';ctx.shadowBlur=16;
      ctx.fillStyle='#ffffff';hRR(ctx,-16,-20,32,40,3);ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='#cbd5e1';ctx.lineWidth=1;
      for(var j=0;j<5;j++){ctx.beginPath();ctx.moveTo(-11,-13+j*7);ctx.lineTo(11,-13+j*7);ctx.stroke();}
      ctx.fillStyle='#dc2626';ctx.font='900 24px Inter,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('5',0,2);
    }else if(pr.type==='pen'){
      ctx.shadowColor='#ef4444';ctx.shadowBlur=18;

  function buildArena(){

  }

  function draw(g,now){
    var cv=canvasRef.current;if(!cv)return;

    ctx.fillStyle=g.rage>0?'#fca5a5':'#fcd34d';ctx.fillText('PROF. BENESCH',BX,GROUND+22);

    if(g.flash>0.02){
      ctx.fillStyle='rgba(255,255,255,'+(g.flash*0.55)+')';
      ctx.fillRect(0,0,AW,AH);
    }
  }

  function reset(){

  if(phase==='idle'){

  var bossPct=Math.max(0,Math.min(100,hpB));

            <span className="text-gray-800 text-sm font-black">PROF. BENESCH</span>

/* ═══════════════════════════════════════════════════════
   STAFFELLAUF — hier gewinnt eine ganze Gruppe
   ═══════════════════════════════════════════════════════ */
function StaffellaufMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var maxGroups=Math.min(6,Math.max(2,Math.floor(names.length/2)));
  var _ng=useState(function(){return Math.min(3,maxGroups);});var numGroups=_ng[0];var setNumGroups=_ng[1];
  var _ph=useState('pick');var phase=_ph[0];var setPhase=_ph[1];
  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];
  var _groups=useState([]);var groups=_groups[0];var setGroups=_groups[1];
  var _rank=useState([]);var ranking=_rank[0];var setRanking=_rank[1];
  var _cd=useState(null);var countdown=_cd[0];var setCountdown=_cd[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var canvasRef=useRef(null);var gRef=useRef(null);var rafRef=useRef(null);
  var timers=useRef([]);var audioRef=useRef(null);

  var AW=820;
  var laneH=78;
  var AH=0;

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  function doCleanup(){
    clearT();
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  useEffect(function(){return function(){doCleanup();};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='pick'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase,numGroups]);

  function playBeep(f){try{var ah=audioRef.current;if(!ah)return;aT(ah.ctx,ah.master,f,ah.ctx.currentTime,0.16,0.24,'square');}catch(e){}}
  function playPass(){try{var ah=audioRef.current;if(!ah)return;aT(ah.ctx,ah.master,660,ah.ctx.currentTime,0.07,0.15,'triangle');}catch(e){}}
  function playFinish(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){aT(c,m,f,now+i*0.1,0.28,0.2,'triangle');});}catch(e){}
  }

  function start(){
    if(phase==='running')return;
    doCleanup();
    var ah=createAudioCtx();audioRef.current=ah;

    var ng=numGroups;
    var built=splitGroups(names.length,ng);
    var winnerGroup=Math.floor(Math.random()*ng);
    var others=[];for(var i=0;i<ng;i++){if(i!==winnerGroup)others.push(i);}
    others=shuffle(others);
    var finishOrder=[winnerGroup].concat(others);

    var RACE_MS=12000;
    var finishAt={};
    finishOrder.forEach(function(gi,pos){finishAt[gi]=RACE_MS-((finishOrder.length-1-pos)*0)+pos*520;});

    var lanes=built.map(function(g,gi){
      return {gi:gi,members:g,finishAt:finishAt[gi],p:0,lastRunner:-1,arrived:false,
        wob:Math.random()*Math.PI*2};
    });

    AH=Math.round(58+(ng-0.5)*laneH+16);
    if(canvasRef.current){canvasRef.current.width=AW*2;canvasRef.current.height=AH*2;}

    var g2={lanes:lanes,ng:ng,AH:AH,startT:0,done:false,confetti:[],order:[]};
    gRef.current=g2;
    setGroups(built);setRanking([]);setShowConfetti(false);
    setPhase('running');setStatusText('');

    setCountdown(3);
    later(function(){setCountdown(2);playBeep(440);},800);
    later(function(){setCountdown(1);playBeep(440);},1600);
    later(function(){setCountdown('LOS! \u{1F3C3}');playBeep(880);},2400);
    later(function(){
      setCountdown(null);setStatusText('\u{1F3C3} Der Staffellauf läuft!');
      var gg=gRef.current;if(gg)gg.startT=performance.now();
    },3200);

    finishOrder.forEach(function(gi,pos){
      later(function(){
        var gg=gRef.current;if(!gg)return;
        var lane=gg.lanes[gi];if(!lane||lane.arrived)return;
        lane.arrived=true;lane.p=1;
        gg.order.push(gi);
        setRanking(function(prev){return prev.concat([gi]);});
        if(pos===0){
          playFinish();
          setStatusText('\u{1F3C6} Gruppe '+(gi+1)+' gewinnt den Staffellauf!');
        }
      },3200+finishAt[gi]);
    });

    later(function(){
      var gg=gRef.current;if(!gg)return;
      gg.done=true;
      setPhase('done');setShowConfetti(true);
      onResult('Gruppe '+(winnerGroup+1));
      stopAH(audioRef.current);audioRef.current=null;
      later(function(){if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}},1600);
    },3200+finishAt[finishOrder[finishOrder.length-1]]+700);

    var last=performance.now();
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-last)/16.67);last=now;
      update(gg,dt,now);draw(gg,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function update(g,dt,now){
    if(!g.startT)return;
    var el=now-g.startT;
    for(var i=0;i<g.lanes.length;i++){
      var lane=g.lanes[i];
      lane.wob+=0.07*dt;
      if(lane.arrived){lane.p=1;continue;}
      var raw=Math.min(1,el/lane.finishAt);
      // Leichtes Auf und Ab, damit sich die Führung anfühlt wie ein echtes Rennen
      lane.p=Math.max(0,Math.min(0.995,raw+Math.sin(lane.wob*0.6)*0.018*(1-raw)));
      var runnerIdx=Math.min(lane.members.length-1,Math.floor(lane.p*lane.members.length));
      if(runnerIdx!==lane.lastRunner){
        if(lane.lastRunner>=0)playPass();
        lane.lastRunner=runnerIdx;
      }
    }
  }

  function draw(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);
    var H=g.AH;

    ctx.fillStyle='#132018';ctx.fillRect(0,0,AW,H);
    var trackX0=118;var trackX1=AW-52;

    // Ziel-Zielflagge
    for(var cy2=0;cy2<H;cy2+=12){
      for(var cx2=0;cx2<2;cx2++){
        ctx.fillStyle=((Math.floor(cy2/12)+cx2)%2===0)?'#ffffff':'#111827';
        ctx.fillRect(trackX1+cx2*9,cy2,9,12);
      }
    }
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(trackX0-2,0,2,H);

    for(var i=0;i<g.lanes.length;i++){
      var lane=g.lanes[i];
      var y=58+i*laneH;
      var col=groupPalette(lane.gi).light;

      // Bahn
      ctx.fillStyle=i%2===0?'rgba(255,255,255,0.030)':'rgba(255,255,255,0.055)';
      ctx.fillRect(0,y-laneH/2+6,AW,laneH-12);
      ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(trackX0,y+laneH/2-6);ctx.lineTo(trackX1,y+laneH/2-6);ctx.stroke();

      // Gruppenlabel links
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(30,y,15,0,Math.PI*2);ctx.fill();
      ctx.font='bold 14px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(String(lane.gi+1),30,y);
      ctx.font='bold 12px Inter,sans-serif';ctx.textAlign='left';
      ctx.fillStyle='rgba(255,255,255,0.72)';
      ctx.fillText('Gruppe '+(lane.gi+1)+' ('+lane.members.length+')',50,y);

      // Wechselzonen
      var segs=lane.members.length;
      for(var s=1;s<segs;s++){
        var sx=trackX0+(trackX1-trackX0)*(s/segs);
        ctx.strokeStyle='rgba(255,255,255,0.13)';ctx.lineWidth=1;
        ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.moveTo(sx,y-laneH/2+10);ctx.lineTo(sx,y+laneH/2-10);ctx.stroke();
        ctx.setLineDash([]);
      }

      // Fortschrittsbalken
      var px=trackX0+(trackX1-trackX0)*lane.p;
      ctx.strokeStyle=col+'66';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(trackX0,y+laneH/2-14);ctx.lineTo(px,y+laneH/2-14);ctx.stroke();

      // Läufer mit Namen
      var ri=Math.min(lane.members.length-1,Math.floor(lane.p*lane.members.length));
      var runnerName=names[lane.members[ri]]||'';
      var bob=Math.sin(lane.wob*2)*2.5;
      ctx.font='24px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(lane.arrived?'\u{1F3C6}':'\u{1F3C3}',px,y-6+bob);

      var nm=truncName(runnerName,14);
      ctx.font='bold 13px Inter,sans-serif';
      var tw=ctx.measureText(nm).width;
      var bx=Math.max(trackX0+tw/2+6,Math.min(trackX1-tw/2-6,px));
      ctx.fillStyle=col;
      var rw=tw+14;var rh=19;
      ctx.beginPath();
      ctx.moveTo(bx-rw/2+6,y+16-rh/2);ctx.lineTo(bx+rw/2-6,y+16-rh/2);
      ctx.quadraticCurveTo(bx+rw/2,y+16-rh/2,bx+rw/2,y+16-rh/2+6);
      ctx.lineTo(bx+rw/2,y+16+rh/2-6);
      ctx.quadraticCurveTo(bx+rw/2,y+16+rh/2,bx+rw/2-6,y+16+rh/2);
      ctx.lineTo(bx-rw/2+6,y+16+rh/2);
      ctx.quadraticCurveTo(bx-rw/2,y+16+rh/2,bx-rw/2,y+16+rh/2-6);
      ctx.lineTo(bx-rw/2,y+16-rh/2+6);
      ctx.quadraticCurveTo(bx-rw/2,y+16-rh/2,bx-rw/2+6,y+16-rh/2);
      ctx.closePath();ctx.fill();
      ctx.font='bold 13px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(nm,bx,y+16);

      }
    }

    ctx.font='bold 12px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillText('START',trackX0,14);
    ctx.fillStyle='rgba(251,191,36,0.95)';
    ctx.fillText('\u{1F3C1} ZIEL',trackX1-42,14);
  }

      ${groups.length>0&&html`<div className="w-full grid gap-3 mb-5" style=${{gridTemplateColumns:'repeat('+Math.min(groups.length,3)+',minmax(0,1fr))'}}>

        ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}

function CopyButton(props){
  var modeName=props.modeName||'Generator';
  var winner=props.winner||'';
  var _copied=React.useState(false);var copied=_copied[0];var setCopied=_copied[1];
  function doCopy(){
    var text=modeName+': '+winner+' hat gewonnen! — Beneschgenerator';
    navigator.clipboard&&navigator.clipboard.writeText(text).then(function(){
      setCopied(true);setTimeout(function(){setCopied(false);},1500);
    }).catch(function(){setCopied(true);setTimeout(function(){setCopied(false);},1500);});
  }
  return html`<button onClick=${doCopy} className="mt-3 px-4 py-1.5 rounded-lg text-xs font-semibold border border-white/45 bg-white/15 text-white hover:bg-white/30 transition-all">${copied?'✓ Kopiert!':'📋 Ergebnis kopieren'}</button>`;
}

  function exportList(){if(!activeList)return;var data=JSON.stringify(activeList,null,2);var a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(data);a.download=(activeList.name||'liste')+'.json';a.click();}
  function importList(e){
