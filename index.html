            var baseDmg2=isLast?(!winnerIsA?curA:15+Math.floor(Math.random()*15)):15+Math.floor(Math.random()*20);
            var dmg2=isCrit2?baseDmg2+15+Math.floor(Math.random()*10):baseDmg2;
            curA=Math.max(0,curA-dmg2);
            if(isLast&&winnerIsA)curB=0;
            if(isLast&&!winnerIsA)curA=0;
            setHp(function(prev){var n=Object.assign({},prev);n[hpAKey]=curA;n[hpBKey]=curB;return n});
            setShakes(function(prev){var n=Object.assign({},prev);n[skAKey]=true;return n});
            spawnDmgFloat(dmg2,isCrit2,slot,true);
            if(isCrit2){setCritFlash({txt:'\u{1F4A5} KRITISCH! \u2212'+dmg2,id:Date.now()});later(function(){setCritFlash(null);},900);}
            later(function(){setShakes(function(prev){var n=Object.assign({},prev);n[skAKey]=false;return n})},350);
          }
        },hitTime);
      })(h,h===hits-1,hitT);
      hitT+=gap;
    }
    t=hitT+250;

    var matchWinner=winnerIsA?matchObj.a:matchObj.b;
    var matchLoser=winnerIsA?matchObj.b:matchObj.a;
    later(function(){
      setMatch({a:matchObj.a,b:matchObj.b,state:'done',winner:matchWinner});
      log.push(matchWinner+' besiegt '+matchLoser);
      setFightLog(log.slice());
    },t);
    later(function(){onDoneCallback(matchWinner)},t+500);
    return t+600;
  }

  function startTournament(){
    clearT();stopAH(audioRef.current);
    var ah=createAudioCtx();audioRef.current=ah;playBattleMusic(ah);
    setChampion(null);setShowConfetti(false);setFightLog([]);setMatch1(null);setMatch2(null);
    var pool=shuffle(names);
    runRound(pool,[]);
  }

  function runRound(pool,logSoFar){
    var bk=buildBracket(pool);
    setBracket(bk);setRoundLabel(getRoundName(pool.length));setPhase('fighting');

    var log=logSoFar.slice();
    var isFinalRound=pool.length===2;
    if(isFinalRound){
      log.push('\u26A1 FINALE! '+pool[0]+' vs '+pool[1]);
      setFightLog(log.slice());
    }
    var updatedBk=bk.map(function(m){return Object.assign({},m)});
    var roundWinners=[];
    var pairsDone=0;
    var totalPairs=bk.length;
    var t=isFinalRound?800:300;

    // Process matches in pairs of 2
    for(var pi=0;pi<bk.length;pi+=2){
      (function(pairStart,currentT){
        var m1=updatedBk[pairStart];
        var m2=pairStart+1<updatedBk.length?updatedBk[pairStart+1]:null;

        var done1=false;var done2=!m2;var w1=null;var w2=null;

        function checkPairDone(){
          if(done1&&done2){
            if(w1)roundWinners.push(w1);
            if(w2)roundWinners.push(w2);
            updatedBk[pairStart].state='done';updatedBk[pairStart].winner=w1;
            if(m2){updatedBk[pairStart+1].state='done';updatedBk[pairStart+1].winner=w2}
            setBracket(updatedBk.map(function(x){return Object.assign({},x)}));
            pairsDone+=(m2?2:1);
            if(pairsDone>=totalPairs){
              later(function(){
                setMatch1(null);setMatch2(null);
                if(roundWinners.length===1){
                  setChampion(roundWinners[0]);setPhase('winner');setShowConfetti(true);onResult(roundWinners[0]);
                  stopAH(audioRef.current);audioRef.current=null;
                  log.push('\u{1F3C6} '+roundWinners[0]+' ist Champion!');setFightLog(log.slice());
                }else{
                  runRound(roundWinners,log);
                }
              },600);
            }
          }
        }

        var endT1=simulateFight(1,m1,currentT,log,function(winner){w1=winner;done1=true;checkPairDone()});
        if(m2){
          simulateFight(2,m2,currentT+100,log,function(winner){w2=winner;done2=true;checkPairDone()});
        }

      })(pi,t);
      t+=3500; // enough for a fight
    }
  }

  function resetBattle(){clearT();stopAH(audioRef.current);audioRef.current=null;setPhase('idle');setChampion(null);setShowConfetti(false);setFightLog([]);setBracket([]);setMatch1(null);setMatch2(null)}

  function renderMatchArena(matchObj,slotIdx){
    if(!matchObj)return null;
    if(!matchObj.b){
      return html`<div className="flex-1 bg-white border border-gray-200 rounded-2xl p-4 text-center">
        <div className=${"inline-block bg-gradient-to-br "+CARD_COLORS[nameToColorIdx(matchObj.a)]+" rounded-xl px-5 py-2 text-white font-bold text-lg mb-1"}>${matchObj.a}</div>
        <p className="text-gray-500 text-xs">Freilos</p>
      </div>`;
    }
    var hpAKey=slotIdx===1?'a1':'a2';var hpBKey=slotIdx===1?'b1':'b2';
    var vsKey='s'+slotIdx;var skA=shakes[slotIdx===1?'a1':'a2'];var skB=shakes[slotIdx===1?'b1':'b2'];
    var hpAVal=hp[hpAKey];var hpBVal=hp[hpBKey];

    return(
      html`<div className="flex-1 bg-white border border-gray-200 rounded-2xl p-4 relative overflow-hidden">
        <div className="flex items-center gap-3">
          <div className=${"flex-1 text-center"+(skA?" shake":"")}>
            <div className=${"bg-gradient-to-br "+CARD_COLORS[nameToColorIdx(matchObj.a)]+" rounded-lg p-3 mb-1.5"+(matchObj.winner===matchObj.a?" ring-2 ring-green-400":"")+(matchObj.winner===matchObj.b?" opacity-30 grayscale":"")}>
              <div className="text-white font-bold text-lg truncate" style=${{textShadow:'0 1px 3px rgba(0,0,0,.45)'}}>${matchObj.a}</div>
            </div>
            <div className="h-2.5 bg-gray-200 rounded-full overflow-hidden"><div role="progressbar" aria-valuenow=${hpAVal} aria-valuemin=${0} aria-valuemax=${100} aria-label=${matchObj.a+" Lebenspunkte"} className="h-full rounded-full" style=${{width:hpAVal+'%',background:hpAVal>=60?'#22c55e':hpAVal>=30?'#f59e0b':'#ef4444',transition:'width .3s ease-out'}}/></div>
          </div>
          <div className="w-10 text-center flex-shrink-0">
            ${showVs[vsKey]?html`<div className="vs-pop text-xl font-black text-amber-400">VS</div>`:html`<div className="text-lg">\u2694\uFE0F</div>`}
          </div>
          <div className=${"flex-1 text-center"+(skB?" shake":"")}>
            <div className=${"bg-gradient-to-br "+CARD_COLORS[nameToColorIdx(matchObj.b)]+" rounded-lg p-3 mb-1.5"+(matchObj.winner===matchObj.b?" ring-2 ring-green-400":"")+(matchObj.winner===matchObj.a?" opacity-30 grayscale":"")}>
              <div className="text-white font-bold text-lg truncate" style=${{textShadow:'0 1px 3px rgba(0,0,0,.45)'}}>${matchObj.b}</div>
            </div>
            <div className="h-2.5 bg-gray-200 rounded-full overflow-hidden"><div role="progressbar" aria-valuenow=${hpBVal} aria-valuemin=${0} aria-valuemax=${100} aria-label=${matchObj.b+" Lebenspunkte"} className="h-full rounded-full" style=${{width:hpBVal+'%',background:hpBVal>=60?'#22c55e':hpBVal>=30?'#f59e0b':'#ef4444',transition:'width .3s ease-out'}}/></div>
          </div>
        </div>
        ${matchObj.state==='done'&&matchObj.winner&&html`<div className="absolute inset-0 flex items-center justify-center bg-white/85 rounded-2xl fade-in"><div className="bg-green-50 border border-green-300 rounded-lg px-4 py-2 text-green-700 font-bold text-base">${matchObj.winner} gewinnt!</div></div>`}
      </div>`
    );
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-4xl">
      ${showConfetti&&html`<${Confetti}/>`}
      ${critFlash&&html`<div key=${critFlash.id} className="event-banner" style=${{background:'rgba(20,10,10,0.9)',border:'2px solid rgba(239,68,68,0.9)',color:'rgba(239,68,68,1)',fontSize:'22px'}}>${critFlash.txt}</div>`}
      <div className="text-center mb-4">
        ${roundLabel&&html`<div role="status" aria-live="polite" className="inline-block px-4 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-600 text-sm font-bold mb-2">${roundLabel}</div>`}
      </div>
      ${(match1||match2)&&html`<div className="w-full flex gap-4 mb-5 relative">
        ${renderMatchArena(match1,1)}
        ${renderMatchArena(match2,2)}
        ${dmgFloats.map(function(f){return html`<div key=${f.id} className="br-dmg" style=${{left:f.x+'%',top:f.y+'%',color:f.crit?'#fbbf24':'#ef4444',fontSize:f.crit?'19px':'15px'}}>${f.txt}</div>`;})}
      </div>`}
      ${champion&&html`<div className="winner-enter mb-5"><div className=${"winner-card bg-gradient-to-br "+CARD_COLORS[nameToColorIdx(champion)]+" rounded-2xl px-10 py-6 text-white text-center shadow-2xl border-2 border-amber-400/40"}><div className="text-amber-200 text-sm font-semibold tracking-widest uppercase mb-1">Champion</div><div className="text-4xl font-black tracking-tight">${champion}</div><div className="mt-2 text-2xl">\u{1F389}\u{1F3C6}\u{1F389}</div><${CopyButton} modeName="Turnier" winner=${champion}/></div></div>`}
      ${fightLog.length>0&&html`<div className="w-full max-w-md mb-4"><p className="text-gray-500 text-center mb-1.5" style=${{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em'}}>Kampfprotokoll</p><div className="bg-gray-50 rounded-xl p-3 border border-gray-200 max-h-32 overflow-y-auto space-y-1">${fightLog.map(function(entry,i){
        var isChamp=entry.indexOf('\u{1F3C6}')>=0;var isFinale=entry.indexOf('FINALE')>=0||entry.indexOf('FINAL')>=0;
        return html`<div key=${i} className=${"text-xs font-mono "+(isChamp?'text-amber-600 font-bold':isFinale?'text-yellow-600':entry.indexOf('besiegt')>=0?'text-green-600':'text-gray-500')}>${entry}</div>`
      })}</div></div>`}
      ${bracket.length>1&&!champion&&html`<div className="w-full max-w-lg mb-4"><p className="text-gray-500 text-center mb-1.5" style=${{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em'}}>Bracket</p><div className="grid gap-2" style=${{gridTemplateColumns:"repeat("+Math.min(bracket.length,4)+",1fr)"}}>${bracket.map(function(m,i){var bc=m.state==='fighting'?'border-amber-500/40':m.state==='done'?'border-green-500/20':'border-gray-200';return html`<div key=${i} className=${"bg-gray-50 border rounded-lg p-2 text-center text-sm "+bc}><div className=${"font-semibold truncate "+(m.winner===m.a?"text-green-600":m.state==='done'?"text-gray-400":"text-gray-700")}>${m.a}</div>${m.b?html`<span><div className="text-gray-400 my-0.5" style=${{fontSize:10}}>vs</div><div className=${"font-semibold truncate "+(m.winner===m.b?"text-green-600":m.state==='done'?"text-gray-400":"text-gray-700")}>${m.b}</div></span>`:html`<div className="text-gray-400 mt-0.5 italic" style=${{fontSize:10}}>Freilos</div>`}</div>`})}</div></div>`}
      <div data-result-actions className="flex gap-3 mt-2">
        ${phase==='idle'&&html`<button onClick=${startTournament} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-amber-500 to-orange-600 hover:from-amber-400 hover:to-orange-500 text-white shadow-lg shadow-amber-500/20 transition-all active:scale-95">Turnier starten</button>`}
        ${phase==='fighting'&&html`<button onClick=${function(){resetBattle();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='winner'&&html`<span><button onClick=${resetBattle} className="px-6 py-3 rounded-xl font-semibold bg-amber-100 text-amber-700 border border-amber-300 hover:bg-amber-200 transition-all mr-3">Nochmal</button><button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button></span>`}
      </div>
    </div>`
  );
}






/* ═══════════════════════════════════════════════════════
   SPIELPLATZ MODE — Horizontaler Parcours mit Zonenkampf
   ═══════════════════════════════════════════════════════ */
function SpielplatzMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _winner=useState(null);var winner=_winner[0];var setWinner=_winner[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _cd=useState(null);var countdown=_cd[0];var setCountdown=_cd[1];
  var _zm=useState('');var zoneMsg=_zm[0];var setZoneMsg=_zm[1];
  var _an=useState(0);var aliveN=_an[0];var setAliveN=_an[1];
  var canvasRef=useRef(null);
  var audioRef=useRef(null);
  var animRef=useRef(null);
  var gRef=useRef(null);
  var timers=useRef([]);
  function clearT(){timers.current.forEach(clearTimeout);timers.current=[]}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms))}
  useEffect(function(){return function(){clearT();if(animRef.current)cancelAnimationFrame(animRef.current);stopAH(audioRef.current);};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();startRace();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  var SPL_AW=900;
  var SPL_ZONES=[
    {name:'Feuerzone',  emoji:'\u{1F525}',xPct:[0.12,0.30],elimRate:0.30,bgColor:'rgba(239,68,68,0.20)',  borderColor:'rgba(239,68,68,0.75)',  flashColor:'rgba(255,80,30,',  labelColor:'#fca5a5',ringColor:'#ef4444',   ambiColor:['#ef4444','#f97316','#fbbf24']},
    {name:'Wasserzone', emoji:'\u{1F30A}',xPct:[0.34,0.51],elimRate:0.25,bgColor:'rgba(59,130,246,0.20)', borderColor:'rgba(59,130,246,0.75)', flashColor:'rgba(30,100,255,', labelColor:'#93c5fd',ringColor:'#3b82f6',   ambiColor:['#3b82f6','#0ea5e9','#38bdf8']},
    {name:'Sturmzone',  emoji:'\u{1F32A}\uFE0F',xPct:[0.55,0.72],elimRate:0.32,bgColor:'rgba(148,163,184,0.22)',borderColor:'rgba(148,163,184,0.75)',flashColor:'rgba(140,160,180,',labelColor:'#cbd5e1',ringColor:'#94a3b8',ambiColor:['#94a3b8','#cbd5e1','#ffffff']},
    {name:'Minenfeld',  emoji:'\u{1F4A3}',xPct:[0.76,0.91],elimRate:1.00,bgColor:'rgba(5,5,18,0.50)',     borderColor:'rgba(239,68,68,0.65)',  flashColor:'rgba(239,68,68,',  labelColor:'#f87171',ringColor:'#ef4444',   ambiColor:['#fbbf24','#ef4444','#dc2626']},
  ];
  var ZONE_TIMES=[3500,7000,10500,13500];

  function splRR(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
  }

  function startRace(){
    clearT();if(animRef.current)cancelAnimationFrame(animRef.current);
    stopAH(audioRef.current);
    var ah=createAudioCtx();audioRef.current=ah;
    playObstacleMusic(ah);
    setWinner(null);setShowConfetti(false);setZoneMsg('');setAliveN(names.length);setPhase('countdown');

    var n=names.length;
    var charH=n<=10?40:n<=20?30:23;
    var AH=Math.max(300,n*charH+80);
    if(canvasRef.current){canvasRef.current.width=SPL_AW*2;canvasRef.current.height=AH*2;}
    var finishX=SPL_AW*0.92;
    var startX=60;
    var winIdx=Math.floor(secureRandom()*n);

    var chars=names.map(function(name,i){
      var tt=n===1?0.5:i/(n-1);
      var laneY=40+tt*(AH-80);
      var isWin=i===winIdx;
      return {
        id:i,name:name,
        color:BALL_COLORS[i%BALL_COLORS.length],
        x:startX,laneY:laneY,
        wobble:Math.random()*Math.PI*2,
        wobbleSpd:0.045+Math.random()*0.045,
        speed:0.78+Math.random()*0.04,
        alive:true,elimT:0,elimEmoji:'\u{1F4A5}',
        trail:[],
      };
    });

    gRef.current={
      chars:chars,n:n,AH:AH,charH:charH,
      winIdx:winIdx,finishX:finishX,
      done:false,
      activeZone:null,zoneFlashT:0,
      particles:[],
      shockwaves:[],
      raceX:startX,
      mineActive:false,
    };

    var CDOffset=3300;
    setCountdown(3);
    later(function(){setCountdown(2);},900);
    later(function(){setCountdown(1);},1800);
    later(function(){setCountdown('LOS! \u{1F3C3}');},2700);
    later(function(){setCountdown(null);setPhase('racing');splStartLoop();},CDOffset);

    for(var zi=0;zi<SPL_ZONES.length;zi++){
      (function(zIdx){
        var zone=SPL_ZONES[zIdx];
        later(function(){
          var g=gRef.current;if(!g||g.done)return;
          setZoneMsg(zone.emoji+' '+zone.name+' schlägt zu!');
          g.activeZone=zIdx;g.zoneFlashT=0;
          if(zIdx===3) g.mineActive=true;
          // Shockwave ring from zone center
          var zCx=(zone.xPct[0]+zone.xPct[1])/2*SPL_AW;
          var zMaxR=Math.max(g.AH*0.75,(zone.xPct[1]-zone.xPct[0])*SPL_AW*0.9);
          g.shockwaves.push({x:zCx,y:g.AH/2,r:10,maxR:zMaxR,alpha:0.95,color:zone.ringColor,speed:zMaxR/52,t:0});
          // Second delayed ring
          later(function(){
            var g2=gRef.current;if(!g2||g2.done)return;
            g2.shockwaves.push({x:zCx,y:g2.AH/2,r:5,maxR:zMaxR*0.7,alpha:0.7,color:zone.ringColor,speed:zMaxR*0.7/40,t:0});
          },200);
        },CDOffset+ZONE_TIMES[zIdx]);

        later(function(){
          var g=gRef.current;if(!g||g.done)return;
          var alive=g.chars.filter(function(c){return c.alive;});
          var nonWin=alive.filter(function(c){return c.id!==g.winIdx;});
          var toKill;
          if(zIdx===3){toKill=nonWin;}
          else{var kc=Math.max(1,Math.round(nonWin.length*zone.elimRate));toKill=shuffle(nonWin.slice()).slice(0,Math.min(kc,nonWin.length));}
          for(var ki=0;ki<toKill.length;ki++){
            var vc=toKill[ki];
            vc.alive=false;vc.elimT=0;vc.elimEmoji=zone.emoji;
            // Character-colored burst
            for(var pi=0;pi<18;pi++){
              var ang=Math.random()*Math.PI*2;
              var spd=1.8+Math.random()*3.5;
              g.particles.push({x:vc.x,y:vc.laneY,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1.0,life:35+Math.random()*15,maxLife:50,color:vc.color,size:2.5+Math.random()*2.5,gravity:0.09});
            }
            // Zone-color sparks
            for(var si=0;si<10;si++){
              var ang2=Math.random()*Math.PI*2;var spd2=2.5+Math.random()*3;
              var ac=zone.ambiColor[Math.floor(Math.random()*zone.ambiColor.length)];
              g.particles.push({x:vc.x,y:vc.laneY,vx:Math.cos(ang2)*spd2,vy:Math.sin(ang2)*spd2-1.5,life:20+Math.random()*15,maxLife:35,color:ac,size:1.5+Math.random()*2,gravity:0.06});
            }
          }
          var leftAlive=g.chars.filter(function(c){return c.alive;}).length;
          setAliveN(leftAlive);
          (function(killed,left,ze){
            setZoneMsg(ze.emoji+' '+killed+' eliminiert! Noch '+left+' im Rennen');
            later(function(){setZoneMsg('');},2200);
          })(toKill.length,leftAlive,zone);
        },CDOffset+(zIdx===3?15600:ZONE_TIMES[zIdx]+800));
      })(zi);
    }

    later(function(){
      var g=gRef.current;if(!g)return;
      g.done=true;
      var wName=names[g.winIdx];
      var wc=g.chars[g.winIdx];
      // Golden finish burst
      if(wc){
        for(var pi=0;pi<35;pi++){
          var ang=Math.random()*Math.PI*2;var spd=2+Math.random()*5;
          var gc=['#fbbf24','#f59e0b','#fde68a','#fff'];
          g.particles.push({x:g.finishX,y:wc.laneY,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-2.5,life:55+Math.random()*25,maxLife:80,color:gc[Math.floor(Math.random()*gc.length)],size:2.5+Math.random()*3,gravity:0.04});
        }
      }
      later(function(){if(animRef.current)cancelAnimationFrame(animRef.current);},900);
      setPhase('winner');setWinner(wName);setShowConfetti(true);setZoneMsg('');onResult(wName);
      stopAH(audioRef.current);audioRef.current=null;
    },CDOffset+16700);
  }

  function splStartLoop(){
    var g=gRef.current;if(!g)return;
    var lastT=performance.now();
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-lastT)/16.67);lastT=now;
      splUpdate(gg,dt);splDraw(gg);
      animRef.current=requestAnimationFrame(loop);
    }
    animRef.current=requestAnimationFrame(loop);
  }

  function splUpdate(g,dt){
    // Ambient zone particles
    if(g.activeZone!==null&&g.activeZone<3){
      var az2=SPL_ZONES[g.activeZone];
      var azx1b=az2.xPct[0]*SPL_AW,azx2b=az2.xPct[1]*SPL_AW;
      if(Math.random()<0.5*dt){
        var ac2=az2.ambiColor[Math.floor(Math.random()*az2.ambiColor.length)];
        if(g.activeZone===0){ // fire: embers float UP
          g.particles.push({x:azx1b+Math.random()*(azx2b-azx1b),y:g.AH-Math.random()*25,vx:(Math.random()-0.5)*0.8,vy:-(0.8+Math.random()*2.0),life:22+Math.random()*18,maxLife:40,color:ac2,size:1.5+Math.random()*2.0,gravity:-0.02,ambient:true});
        } else if(g.activeZone===1){ // water: drops drift right
          g.particles.push({x:azx1b+Math.random()*15,y:Math.random()*g.AH,vx:1.0+Math.random()*1.5,vy:(Math.random()-0.5)*0.5,life:18+Math.random()*12,maxLife:30,color:ac2,size:1.5+Math.random()*2.5,gravity:0,ambient:true});
        } else if(g.activeZone===2){ // storm: swirling dust
          g.particles.push({x:azx1b+Math.random()*(azx2b-azx1b),y:Math.random()*g.AH,vx:(Math.random()-0.5)*3.0,vy:(Math.random()-0.5)*3.0,life:12+Math.random()*12,maxLife:24,color:ac2,size:1+Math.random()*2,gravity:0,ambient:true});
        }
      }
    }
    // Subtle persistent fire embers in fire zone always
    var fz0=SPL_ZONES[0];
    if(Math.random()<0.10*dt){
      var fzx1=fz0.xPct[0]*SPL_AW,fzx2=fz0.xPct[1]*SPL_AW;
      g.particles.push({x:fzx1+Math.random()*(fzx2-fzx1),y:g.AH-5,vx:(Math.random()-0.5)*0.5,vy:-(0.4+Math.random()*0.9),life:14+Math.random()*12,maxLife:26,color:Math.random()<0.5?'rgba(239,68,68,0.7)':'rgba(249,115,22,0.6)',size:1+Math.random()*1.5,gravity:-0.01,ambient:true});
    }

    // Update particles
    for(var pi=g.particles.length-1;pi>=0;pi--){
      var p=g.particles[pi];
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.vy+=(p.gravity||0)*dt;
      p.life-=dt;
      if(p.life<=0)g.particles.splice(pi,1);
    }

    // Update shockwaves
    for(var si=g.shockwaves.length-1;si>=0;si--){
      var sw=g.shockwaves[si];
      sw.r+=sw.speed*dt;
      sw.t+=dt;
      sw.alpha=Math.max(0,0.95*(1-sw.t/52));
      if(sw.alpha<0.01)g.shockwaves.splice(si,1);
    }

    // Global race progress — ALL alive chars share this x before the minefield
    g.raceX=Math.min(g.finishX,g.raceX+0.80*dt);
    var minePassed=g.mineActive;

    // Update characters + trails
    for(var i=0;i<g.chars.length;i++){
      var c=g.chars[i];
      c.wobble+=c.wobbleSpd*dt;
      var tcy=c.laneY+Math.sin(c.wobble)*2.8;
      if(c.alive){
        if(minePassed){
          // Minenfeld: winner rockets ahead, others crawl
          var mineSpd=c.id===g.winIdx?0.80*2.2:0.80*0.20;
          c.x+=mineSpd*dt;
          if(c.x>g.finishX)c.x=g.finishX;
        } else {
          // Vor dem Minenfeld: exakt synchron
          c.x=g.raceX;
        }
        c.trail.push({x:c.x,y:tcy});
        if(c.trail.length>10)c.trail.shift();
      } else {
        c.elimT+=dt*0.04;
        c.trail=[];
      }
    }

    if(g.activeZone!==null){
      g.zoneFlashT+=dt;
      if(g.zoneFlashT>180)g.activeZone=null;
    }
  }

  function splBuildBg(g){
    var AH=g.AH;var charH=g.charH;
    var c=document.createElement('canvas');
    c.width=SPL_AW*2;c.height=AH*2;
    var t=c.getContext('2d');t.setTransform(2,0,0,2,0,0);
    var R=(function(){var s=990117;return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;};})();

    // Grundboden
    var bgGrd=t.createLinearGradient(0,0,0,AH);
    bgGrd.addColorStop(0,'#16321f');bgGrd.addColorStop(0.5,'#12291b');bgGrd.addColorStop(1,'#0c1d14');
    t.fillStyle=bgGrd;t.fillRect(0,0,SPL_AW,AH);
    for(var i=0;i<160;i++){
      t.fillStyle='rgba('+(30+R()*40|0)+','+(80+R()*60|0)+','+(45+R()*35|0)+',0.30)';
      var px=R()*SPL_AW,py=R()*AH,pr=6+R()*22;
      t.beginPath();t.ellipse(px,py,pr,pr*0.5,0,0,Math.PI*2);t.fill();
    }

    // Zonen
    for(var zi=0;zi<SPL_ZONES.length;zi++){
      var z=SPL_ZONES[zi];
      var zx1=z.xPct[0]*SPL_AW,zx2=z.xPct[1]*SPL_AW,zw=zx2-zx1;
      t.save();
      t.beginPath();t.rect(zx1,0,zw,AH);t.clip();
      if(zi===0){
        var fg=t.createLinearGradient(0,0,0,AH);
        fg.addColorStop(0,'#3b0a06');fg.addColorStop(0.5,'#5c1206');fg.addColorStop(1,'#2b0704');
        t.fillStyle=fg;t.fillRect(zx1,0,zw,AH);
        for(var cr=0;cr<26;cr++){
          t.strokeStyle='rgba(251,146,60,'+(0.25+R()*0.45)+')';t.lineWidth=1+R()*2.2;
          t.beginPath();
          var sx=zx1+R()*zw,sy=R()*AH;t.moveTo(sx,sy);
          for(var k=0;k<3;k++){sx+=(R()-0.5)*44;sy+=(R()-0.5)*40;t.lineTo(sx,sy);}
          t.stroke();
        }
        for(var rk=0;rk<14;rk++){
          t.fillStyle='rgba(30,10,6,0.75)';
          t.beginPath();t.ellipse(zx1+R()*zw,R()*AH,7+R()*12,5+R()*7,R()*3,0,Math.PI*2);t.fill();
        }
      }else if(zi===1){
        var wg=t.createLinearGradient(0,0,0,AH);
        wg.addColorStop(0,'#062a4a');wg.addColorStop(0.5,'#0a3f68');wg.addColorStop(1,'#052236');
        t.fillStyle=wg;t.fillRect(zx1,0,zw,AH);
        t.strokeStyle='rgba(147,197,253,0.16)';t.lineWidth=1.2;
        for(var wl=0;wl<Math.ceil(AH/14);wl++){
          t.beginPath();
          for(var wx=zx1;wx<=zx2;wx+=8)t.lineTo(wx,wl*14+Math.sin(wx*0.06+wl)*3);
          t.stroke();
        }
        for(var st=0;st<10;st++){
          t.fillStyle='rgba(203,213,225,0.20)';
          t.beginPath();t.ellipse(zx1+R()*zw,R()*AH,6+R()*10,4+R()*6,R()*3,0,Math.PI*2);t.fill();
        }
      }else if(zi===2){
        var stg=t.createLinearGradient(0,0,0,AH);
        stg.addColorStop(0,'#232c3a');stg.addColorStop(0.5,'#2d3745');stg.addColorStop(1,'#1b222c');
        t.fillStyle=stg;t.fillRect(zx1,0,zw,AH);
        for(var cl=0;cl<12;cl++){
          t.fillStyle='rgba(203,213,225,'+(0.05+R()*0.07)+')';
          var cx=zx1+R()*zw,cy=R()*AH,crr=18+R()*40;
          t.beginPath();t.ellipse(cx,cy,crr,crr*0.42,0,0,Math.PI*2);t.fill();
        }
      }else{
        var mg=t.createLinearGradient(0,0,0,AH);
        mg.addColorStop(0,'#0b0b14');mg.addColorStop(0.5,'#14141f');mg.addColorStop(1,'#08080f');
        t.fillStyle=mg;t.fillRect(zx1,0,zw,AH);
        t.save();t.globalAlpha=0.20;
        for(var s2=-AH;s2<zw+AH;s2+=26){
          t.fillStyle=(Math.round(s2/26)%2===0)?'#f59e0b':'#111827';
          t.beginPath();
          t.moveTo(zx1+s2,0);t.lineTo(zx1+s2+13,0);
          t.lineTo(zx1+s2+13-AH,AH);t.lineTo(zx1+s2-AH,AH);t.closePath();t.fill();
        }
        t.restore();
      }
      t.restore();
      // Zonengrenzen
      t.save();
      t.shadowColor=z.ringColor;t.shadowBlur=8;
      t.strokeStyle=z.borderColor;t.lineWidth=2.5;
      t.beginPath();t.moveTo(zx1,0);t.lineTo(zx1,AH);t.stroke();
      t.beginPath();t.moveTo(zx2,0);t.lineTo(zx2,AH);t.stroke();
      t.restore();
    }

    // Bahnlinien (Kreidestriche)
    t.save();
    t.setLineDash([12,10]);
    t.strokeStyle='rgba(255,255,255,0.13)';t.lineWidth=1.4;
    for(var li=0;li<g.chars.length;li++){
      var ly=g.chars[li].laneY+charH/2;
      t.beginPath();t.moveTo(0,ly);t.lineTo(SPL_AW,ly);t.stroke();
    }
    t.restore();

    // Startgatter
    t.fillStyle='rgba(15,23,42,0.75)';t.fillRect(0,0,44,AH);
    t.strokeStyle='rgba(148,163,184,0.5)';t.lineWidth=2;
    t.beginPath();t.moveTo(44,0);t.lineTo(44,AH);t.stroke();
    for(var sq=0;sq<Math.ceil(AH/14);sq++){
      t.fillStyle=sq%2===0?'rgba(255,255,255,0.85)':'rgba(17,24,39,0.9)';
      t.fillRect(36,sq*14,8,14);
    }

    // Ziel: Karomuster
    var fx=g.finishX;
    for(var fy=0;fy<Math.ceil(AH/12);fy++){
      for(var fxi=0;fxi<3;fxi++){
        t.fillStyle=((fy+fxi)%2===0)?'rgba(255,255,255,0.92)':'rgba(17,24,39,0.92)';
        t.fillRect(fx-6+fxi*8,fy*12,8,12);
      }
    }
    return c;
  }

  function splDraw(g){
    var canvas=canvasRef.current;if(!canvas)return;
    var ctx=canvas.getContext('2d');
    var AH=g.AH;var charH=g.charH;
    var now=Date.now();
    ctx.setTransform(2,0,0,2,0,0);
    ctx.clearRect(0,0,SPL_AW,AH);

    if(!g._bg||g._bgH!==AH){g._bg=splBuildBg(g);g._bgH=AH;}
    ctx.drawImage(g._bg,0,0,SPL_AW,AH);

    // ── Animierte Zonen-Effekte
    for(var zi=0;zi<SPL_ZONES.length;zi++){
      var z=SPL_ZONES[zi];
      var zx1=z.xPct[0]*SPL_AW,zx2=z.xPct[1]*SPL_AW,zw=zx2-zx1;
      ctx.save();
      ctx.beginPath();ctx.rect(zx1,0,zw,AH);ctx.clip();
      if(zi===0){
        for(var fl=0;fl<Math.ceil(zw/26);fl++){
          var fxp=zx1+13+fl*26;
          var ph=now*0.006+fl*1.7;
          var fh=16+Math.sin(ph)*7+Math.sin(ph*2.3)*4;
          for(var fy2=0;fy2<Math.ceil(AH/70)+1;fy2++){
            var fby=fy2*70+((now*0.02+fl*23)%70);
            var fgr=ctx.createRadialGradient(fxp,fby,1,fxp,fby,fh);
            fgr.addColorStop(0,'rgba(254,240,138,0.55)');
            fgr.addColorStop(0.45,'rgba(249,115,22,0.30)');
            fgr.addColorStop(1,'rgba(239,68,68,0)');
            ctx.fillStyle=fgr;
            ctx.beginPath();ctx.ellipse(fxp,fby,fh*0.55,fh,0,0,Math.PI*2);ctx.fill();
          }
        }
        for(var em=0;em<18;em++){
          var ex=zx1+((em*97+now*0.03)%zw);
          var ey=AH-((now*0.05+em*61)%(AH+30));
          ctx.fillStyle='rgba(253,186,116,'+(0.25+0.5*Math.abs(Math.sin(em+now*0.002)))+')';
          ctx.beginPath();ctx.arc(ex,ey,1.3,0,Math.PI*2);ctx.fill();
        }
      }else if(zi===1){
        ctx.strokeStyle='rgba(186,230,253,0.22)';ctx.lineWidth=1.6;
        for(var wv=0;wv<Math.ceil(AH/20);wv++){
          ctx.beginPath();
          for(var wx2=zx1;wx2<=zx2;wx2+=8){
            ctx.lineTo(wx2,wv*20+10+Math.sin(wx2*0.05+now*0.0022+wv)*4);
          }
          ctx.stroke();
        }
        for(var bu=0;bu<22;bu++){
          var bx=zx1+((bu*73+now*0.012)%zw);
          var by=AH-((now*0.045+bu*57)%(AH+24));
          ctx.fillStyle='rgba(224,242,254,0.35)';
          ctx.beginPath();ctx.arc(bx,by,1+((bu%3)*0.9),0,Math.PI*2);ctx.fill();
        }
      }else if(zi===2){
        ctx.strokeStyle='rgba(226,232,240,0.20)';ctx.lineWidth=1.4;
        for(var wd=0;wd<26;wd++){
          var wsx=zx1+((wd*61+now*0.22)%(zw+70))-35;
          var wsy=(wd*37)%AH;
          ctx.beginPath();ctx.moveTo(wsx,wsy);
          ctx.quadraticCurveTo(wsx+18,wsy-6,wsx+38,wsy+2);ctx.stroke();
        }
        if((now%2300)<90){
          ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fillRect(zx1,0,zw,AH);
        }
      }else{
        for(var mn=0;mn<Math.ceil(zw/44);mn++){
          for(var mr=0;mr<Math.ceil(AH/54);mr++){
            var mx=zx1+18+mn*44+((mr%2)*18);
            var my=22+mr*54;
            if(mx>zx2-8||my>AH-8)continue;
            var bl=0.45+0.55*Math.sin(now*0.005+mn*1.3+mr);
            ctx.fillStyle='#1f2937';
            ctx.beginPath();ctx.arc(mx,my,5,0,Math.PI*2);ctx.fill();
            ctx.strokeStyle='#374151';ctx.lineWidth=1.4;
            for(var sp2=0;sp2<6;sp2++){
              var sa2=sp2*Math.PI/3;
              ctx.beginPath();ctx.moveTo(mx+Math.cos(sa2)*5,my+Math.sin(sa2)*5);
              ctx.lineTo(mx+Math.cos(sa2)*8,my+Math.sin(sa2)*8);ctx.stroke();
            }
            ctx.fillStyle='rgba(239,68,68,'+bl+')';
            ctx.beginPath();ctx.arc(mx,my-1,2,0,Math.PI*2);ctx.fill();
          }
        }
      }
      ctx.restore();
      // Zonenlabel
      ctx.save();
      var lw=ctx.measureText('').width;
      ctx.font='bold 11px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      var lbl=z.emoji+' '+z.name;
      var lww=ctx.measureText(lbl).width+16;
      ctx.fillStyle='rgba(2,6,23,0.62)';
      hRR(ctx,(zx1+zx2)/2-lww/2,4,lww,18,9);ctx.fill();
      ctx.strokeStyle=z.borderColor;ctx.lineWidth=1;ctx.stroke();
      ctx.fillStyle=z.labelColor;ctx.fillText(lbl,(zx1+zx2)/2,13);
      ctx.restore();
    }

    // Aktive Zone: Blitz-Overlay
    if(g.activeZone!==null){
      var azf=SPL_ZONES[g.activeZone];
      var azfx1=azf.xPct[0]*SPL_AW,azfx2=azf.xPct[1]*SPL_AW;
      var fa=Math.max(0,0.45*(1-g.zoneFlashT/180))*(0.55+0.45*Math.sin(g.zoneFlashT*1.1));
      ctx.globalAlpha=fa;
      ctx.fillStyle=azf.flashColor+'0.9)';
      ctx.fillRect(azfx1,0,azfx2-azfx1,AH);
      ctx.globalAlpha=1.0;
      if(g.zoneFlashT<60){
        var scanY=(g.zoneFlashT/60)*AH;
        ctx.globalAlpha=fa*0.6;
        ctx.fillStyle=azf.flashColor+'0.5)';
        ctx.fillRect(azfx1,scanY-6,azfx2-azfx1,12);
        ctx.globalAlpha=1.0;
      }
    }

    // Schockwellen
    for(var si=0;si<g.shockwaves.length;si++){
      var sw=g.shockwaves[si];
      ctx.save();
      ctx.globalAlpha=sw.alpha;
      ctx.strokeStyle=sw.color;ctx.lineWidth=3.5;
      ctx.shadowColor=sw.color;ctx.shadowBlur=10;
      ctx.beginPath();ctx.arc(sw.x,sw.y,sw.r,0,Math.PI*2);ctx.stroke();
      if(sw.r>25){
        ctx.lineWidth=1.5;ctx.globalAlpha=sw.alpha*0.45;
        ctx.beginPath();ctx.arc(sw.x,sw.y,sw.r*0.65,0,Math.PI*2);ctx.stroke();
      }
      ctx.restore();
    }

    // START / ZIEL
    ctx.save();
    ctx.font='bold 10px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.save();ctx.translate(14,AH/2);ctx.rotate(-Math.PI/2);
    ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fillText('START',0,0);ctx.restore();
    ctx.shadowColor='rgba(251,191,36,0.8)';ctx.shadowBlur=12;
    ctx.fillStyle='rgba(251,191,36,0.95)';
    ctx.fillText('\u{1F3C6} ZIEL',g.finishX+2,11);
    ctx.restore();

    var nameFS=charH<=23?10:charH<=30?12:13;
    var u=Math.max(7,charH*0.30);

    // Staub-Spuren
    for(var ci=0;ci<g.chars.length;ci++){
      var c0=g.chars[ci];
      if(!c0.alive||c0.trail.length<2)continue;
      for(var ti=0;ti<c0.trail.length-1;ti++){
        var tR=ti/c0.trail.length;
        ctx.globalAlpha=tR*0.22;
        ctx.fillStyle='rgba(226,232,240,0.9)';
        ctx.beginPath();
        ctx.arc(c0.trail[ti].x-u*0.4,c0.trail[ti].y+u*1.0,u*(0.16+0.30*tR),0,Math.PI*2);
        ctx.fill();
      }
      ctx.globalAlpha=1;
    }

    // Figuren
    for(var ci2=0;ci2<g.chars.length;ci2++){
      var c=g.chars[ci2];
      if(!c.alive&&c.elimT>1.5)continue;
      var alive=c.alive;
      var alpha=alive?1.0:Math.max(0,1.0-c.elimT*0.67);
      var cy=c.laneY+(alive?Math.sin(c.wobble)*2.2:0);
      var isWinAhead=c.id===g.winIdx&&alive&&g.mineActive;

      // Namensschild links neben der Figur
      ctx.save();ctx.globalAlpha=alpha;
      var lbl2=truncName(c.name,charH<=23?9:12);
      ctx.font='bold '+nameFS+'px Inter,sans-serif';
      var tw2=ctx.measureText(lbl2).width;
      var boxW=tw2+16;
      var bx2=Math.max(2,c.x-u*1.25-boxW);
      ctx.fillStyle='rgba(2,6,23,0.66)';
      hRR(ctx,bx2,cy-nameFS*0.85,boxW,nameFS*1.7,nameFS*0.85);ctx.fill();
      ctx.fillStyle=c.color;
      ctx.beginPath();ctx.arc(bx2+7,cy,3.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.textAlign='left';ctx.textBaseline='middle';
      ctx.fillText(lbl2,bx2+13,cy);
      ctx.restore();

      if(isWinAhead){
        ctx.save();
        var gp=0.5+0.5*Math.sin(now/260);
        ctx.strokeStyle='rgba(251,191,36,'+(0.4+gp*0.5)+')';ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(c.x,cy+u*1.28,u*1.0,u*0.34,0,0,Math.PI*2);ctx.stroke();
        ctx.restore();
      }

      drawHero(ctx,{x:c.x,y:cy,s:u,color:c.color,
        walk:c.wobble*2.2+ci2,
        face:1,alpha:alpha,hair:c.id%6,skin:(c.id*7)%4,
        gear:'cap',dead:!alive,
        lean:alive?-0.10:0.9,
        glow:isWinAhead?'rgba(251,191,36,0.9)':null});

      if(!alive&&c.elimT<1.0){
        ctx.save();
        ctx.globalAlpha=Math.max(0,(1-c.elimT)*alpha);
        ctx.font='17px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(c.elimEmoji,c.x,cy-u*1.9-c.elimT*22);
        ctx.restore();
      }
    }

    // Partikel
    for(var pi=0;pi<g.particles.length;pi++){
      var p=g.particles[pi];
      var palpha=Math.max(0,p.life/p.maxLife);
      ctx.globalAlpha=palpha;
      ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.4,p.size*palpha),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1.0;
  }

  function resetRace(){
    clearT();if(animRef.current)cancelAnimationFrame(animRef.current);
    stopAH(audioRef.current);audioRef.current=null;gRef.current=null;
    setPhase('idle');setWinner(null);setShowConfetti(false);setCountdown(null);setZoneMsg('');setAliveN(0);
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-5xl screen-enter">
      ${showConfetti&&html`<${Confetti}/>`}

      <div className="text-center mb-3">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#f97316,#ef4444,#8b5cf6)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F3D7}\uFE0F Spielplatz-Parcours</h2>
        ${zoneMsg&&html`<div role="status" aria-live="polite" className="text-base font-bold text-amber-500 mt-1">${zoneMsg}</div>`}
        ${phase==='racing'&&!zoneMsg&&html`<p className="bg-info text-gray-500 text-sm mt-1">${aliveN} von ${names.length} noch im Rennen</p>`}
        ${phase==='idle'&&html`<p className="text-gray-500 text-sm mt-1">${names.length} Teilnehmer \u2014 4 gnadenlose Zonen warten</p>`}
      </div>

      ${countdown!==null&&html`
        <div className="text-7xl font-black gradient-text countdown-pop text-center mb-4" style=${{minWidth:'120px'}}>${countdown}</div>
      `}

      <div className="w-full rounded-2xl overflow-hidden mb-4" style=${{border:'1px solid rgba(255,255,255,0.08)',background:'#08101e',boxShadow:'0 24px 70px rgba(0,0,0,0.55),0 0 0 1px rgba(255,255,255,0.05)'}}>
        <canvas ref=${canvasRef} width=${SPL_AW*2} height=${600} style=${{width:'100%',height:'auto',display:'block'}}/>
      </div>

      ${phase==='winner'&&winner&&html`
        <div className="winner-enter mb-4 w-full flex justify-center">
          <div className=${"winner-card bg-gradient-to-br "+CARD_COLORS[nameToColorIdx(winner)]+" rounded-2xl px-10 py-6 text-white text-center shadow-2xl border-2 border-amber-400/40"}>
            <div className="text-amber-200 text-sm font-semibold tracking-widest uppercase mb-1">\u{1F3D7}\uFE0F Spielplatz-Sieger</div>
            <div className="text-4xl font-black tracking-tight">${winner}</div>
            <div className="mt-2 text-2xl">\u{1F389}\u{1F3C6}\u{1F389}</div>
            <${CopyButton} modeName="Spielplatz" winner=${winner}/>
          </div>
        </div>
      `}

      <div data-result-actions className="flex gap-3 mt-1">
        ${phase==='idle'&&html`<button onClick=${startRace} className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all" style=${{background:'linear-gradient(135deg,#f97316,#ef4444)',boxShadow:'0 8px 24px rgba(249,115,22,0.28)'}}>Parcours starten</button>`}
        ${phase==='countdown'&&html`<button disabled className="px-8 py-3 rounded-xl font-bold bg-gray-200 text-gray-400 cursor-not-allowed">Startet gleich\u2026</button>`}
        ${phase==='racing'&&html`<button onClick=${function(){resetRace();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">\u2715 Abbrechen</button>`}
        ${phase==='winner'&&html`<span><button onClick=${resetRace} className="px-6 py-3 rounded-xl font-semibold transition-all mr-3" style=${{background:'rgba(249,115,22,0.12)',color:'#fb923c',border:'1px solid rgba(249,115,22,0.35)'}}>Nochmal</button><button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button></span>`}
      </div>
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   GROUP QUICK MODE — instant group assignment
   ═══════════════════════════════════════════════════════ */
function GroupQuickMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var maxGroups=Math.min(10,names.length);
  var maxSize=Math.min(20,names.length-1);
  var _gm=useState('count');var groupMode=_gm[0];var setGroupMode=_gm[1];
  var _gc=useState(Math.min(2,maxGroups));var groupCount=_gc[0];var setGroupCount=_gc[1];
  var _gs=useState(Math.max(2,Math.ceil(names.length/3)));var groupSize=_gs[0];var setGroupSize=_gs[1];
  var _gr=useState(null);var groups=_gr[0];var setGroups=_gr[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _sh=useState(null);var shuffleDisplay=_sh[0];var setShuffleDisplay=_sh[1];
  var timers=useRef([]);
  function clearTQ(){timers.current.forEach(clearTimeout);timers.current=[];}
  function laterQ(fn,ms){timers.current.push(setTimeout(fn,ms));}
  useEffect(function(){return function(){clearTQ()}},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&!groups&&!shuffleDisplay){e.preventDefault();buildGroups();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  });

  function buildGroups(){
    clearTQ();
    // Start shuffle animation
    var shuffleRounds=12;
    for(var r=0;r<shuffleRounds;r++){
      (function(ri){
        laterQ(function(){
          setShuffleDisplay(shuffle(names.slice()));
        },ri*150);
      })(r);
    }
    laterQ(function(){
      var actualCount=groupMode==='size'?Math.max(1,Math.ceil(names.length/groupSize)):groupCount;
      var shuffled=shuffleApart(names,roundRobinGroup(actualCount),APART_RULES);
      var result=Array.from({length:actualCount},function(){return[];});
      for(var i=0;i<shuffled.length;i++){result[i%actualCount].push(shuffled[i]);}
      setShuffleDisplay(null);
      setGroups(result);
      setShowConfetti(true);
      onResult(actualCount+' Gruppen');
      laterQ(function(){setShowConfetti(false);},3500);
    },shuffleRounds*150+200);
  }
  function reset(){setGroups(null);setShowConfetti(false);setShuffleDisplay(null);clearTQ();}

  var actualCount=groupMode==='size'?Math.max(1,Math.ceil(names.length/groupSize)):groupCount;
  var numCols=actualCount<=2?2:actualCount<=4?Math.min(actualCount,4):actualCount<=6?3:4;

  if(shuffleDisplay){
    var sCols=Math.min(6,Math.ceil(Math.sqrt(shuffleDisplay.length)));
    return(
      html`<div className="flex flex-col items-center w-full max-w-2xl">
        <p className="text-gray-700 text-lg mb-4 font-bold">\u{1F500} Mischen...</p>
        <div className="w-full grid gap-2" style=${{gridTemplateColumns:'repeat('+sCols+',1fr)'}}>
          ${shuffleDisplay.map(function(name,i){
            return html`<div key=${i} className="text-gray-700 text-sm font-medium px-3 py-2 rounded-lg bg-gray-100 border border-gray-200 text-center transition-all" style=${{animation:'pulse 0.3s ease-in-out'}}>${name}</div>`;
          })}
        </div>
      </div>`
    );
  }

  if(!groups){
    return(
      html`<div className="flex flex-col items-center w-full max-w-lg">
        <div className="text-center mb-8">
          <div className="group-mode-toggle mb-6 inline-flex">
            <button onClick=${function(){setGroupMode('count')}} className=${"group-mode-btn "+(groupMode==='count'?"active":"inactive")}>Anzahl Gruppen</button>
            <button onClick=${function(){setGroupMode('size')}} className=${"group-mode-btn "+(groupMode==='size'?"active":"inactive")}>\u00E0 N Personen</button>
          </div>
          ${groupMode==='count'?(html`
          <p className="text-gray-700 text-sm mb-4">Wie viele Gruppen?</p>
          <div className="flex items-center gap-5 justify-center">
            <button aria-label="Weniger Gruppen" onClick=${function(){setGroupCount(function(g){return Math.max(2,g-1)})}} disabled=${groupCount<=2}
              className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">\u2212</button>
            <span aria-live="polite" className="text-6xl font-black gradient-text w-20 text-center">${groupCount}</span>
            <button aria-label="Mehr Gruppen" onClick=${function(){setGroupCount(function(g){return Math.min(maxGroups,g+1)})}} disabled=${groupCount>=maxGroups}
              className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
          </div>
          <p className="text-gray-600 text-xs mt-3">ca. ${Math.ceil(names.length/groupCount)} Personen pro Gruppe</p>
          `):(html`
          <p className="text-gray-700 text-sm mb-4">Wie viele Personen pro Gruppe?</p>
          <div className="flex items-center gap-5 justify-center">
            <button aria-label="Weniger Personen pro Gruppe" onClick=${function(){setGroupSize(function(s){return Math.max(2,s-1)})}} disabled=${groupSize<=2}
              className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">\u2212</button>
            <span aria-live="polite" className="text-6xl font-black gradient-text w-20 text-center">${groupSize}</span>
            <button aria-label="Mehr Personen pro Gruppe" onClick=${function(){setGroupSize(function(s){return Math.min(maxSize,s+1)})}} disabled=${groupSize>=maxSize}
              className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
          </div>
          <p className="text-gray-600 text-xs mt-3">\u2192 ${actualCount} Gruppen (${names.length} Personen)</p>
          `)}
        </div>
        <button onClick=${buildGroups} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-400 hover:to-cyan-500 text-white shadow-lg shadow-teal-500/20 transition-all">Gruppen erstellen</button>
      </div>`
    );
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-3xl fade-in-up">
      ${showConfetti&&html`<${Confetti}/>`}
      <div data-result className="w-full grid gap-4 mb-6" style=${{gridTemplateColumns:'repeat('+numCols+',1fr)'}}>
        ${groups.map(function(group,gi){
          return(
            html`<div key=${gi} className="rounded-2xl overflow-hidden border border-gray-200 shadow-md fade-in" style=${{animationDelay:(gi*0.08)+'s'}}>
              <div className=${"bg-gradient-to-br "+GROUP_COLORS[gi%GROUP_COLORS.length].bg+" px-4 py-2.5"}>
                <span className="text-white font-bold bg-group-title">Gruppe ${gi+1}</span>
                <span className="text-white/60 text-xs ml-2">${group.length} Personen</span>
              </div>
              <div className="bg-white p-3 space-y-1">
                ${group.map(function(name,ni){
                  return html`<div key=${ni} className="bg-member text-gray-700 text-sm font-medium px-2 py-1.5 rounded-lg bg-gray-50 border border-gray-100">${name}</div>`;
                })}
              </div>
            </div>`
          );
        })}
      </div>
      <div data-result-actions className="flex gap-3">
        <${GroupCopyButton} modeName="Gruppen sofort" groups=${groups} onReport=${props.onGroups}/>
        <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-teal-50 text-teal-700 border border-teal-200 hover:bg-teal-100 transition-all">Nochmal</button>
        <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button>
      </div>
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   SUPER MARIO GRUPPEN — Jump'n'Run-Level mit Pipes
   ═══════════════════════════════════════════════════════ */
function GroupAnimMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var maxGroups=Math.min(10,names.length);
  var maxSize=Math.min(20,names.length-1);
  var _gm=useState('count');var groupMode=_gm[0];var setGroupMode=_gm[1];
  var _gc=useState(Math.min(2,maxGroups));var groupCount=_gc[0];var setGroupCount=_gc[1];
  var _gs=useState(Math.max(2,Math.ceil(names.length/3)));var groupSize=_gs[0];var setGroupSize=_gs[1];
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _groups=useState([]);var groups=_groups[0];var setGroups=_groups[1];
  var _hud=useState({coins:0,done:0,total:0});var hud=_hud[0];var setHud=_hud[1];
  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var canvasRef=useRef(null);var gRef=useRef(null);var rafRef=useRef(null);
  var timers=useRef([]);var audioRef=useRef(null);

  var AW=900;var AH=380;
  var GROUND=AH-54;
  var GRAV=0.42;

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  function doCleanup(){
    clearT();
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  useEffect(function(){return function(){doCleanup();};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();startGame();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  });

  var actualCount=groupMode==='size'?Math.max(1,Math.ceil(names.length/groupSize)):groupCount;

  /* ── Sounds ── */
  function sJump(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var now=c.currentTime;
    var o=c.createOscillator();o.type='square';
    o.frequency.setValueAtTime(320,now);o.frequency.exponentialRampToValueAtTime(760,now+0.11);
    var g=c.createGain();g.gain.setValueAtTime(0.13,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);
    o.connect(g);g.connect(ah.master);o.start(now);o.stop(now+0.16);}catch(e){}}
  function sCoin(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var now=c.currentTime;
    aT(c,ah.master,987.77,now,0.07,0.14,'square');
    aT(c,ah.master,1318.5,now+0.07,0.16,0.13,'square');}catch(e){}}
  function sStomp(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var now=c.currentTime;
    aT(c,ah.master,180,now,0.09,0.26,'square');
    aT(c,ah.master,90,now+0.04,0.12,0.20,'triangle');}catch(e){}}
  function sPipe(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var now=c.currentTime;
    var o=c.createOscillator();o.type='square';
    o.frequency.setValueAtTime(620,now);o.frequency.exponentialRampToValueAtTime(150,now+0.28);
    var g=c.createGain();g.gain.setValueAtTime(0.16,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.32);
    o.connect(g);g.connect(ah.master);o.start(now);o.stop(now+0.34);}catch(e){}}
  function sBump(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;
    aT(c,ah.master,240,c.currentTime,0.06,0.18,'square');}catch(e){}}

  /* ── Level ── */
  function buildLevel(count){
    var pipes=[];
    var pw=Math.max(30,Math.min(58,Math.round(660/count)-8));
    for(var i=0;i<count;i++){
      var px=150+(i+0.5)/count*700;
      pipes.push({gi:i,x:px,w:pw,h:74,squash:0,plant:0,plantT:Math.random()*200});
    }
    function nearPipe(x,pad){
      for(var p=0;p<pipes.length;p++)if(Math.abs(pipes[p].x-x)<pipes[p].w/2+pad)return true;
      return false;
    }
    var pits=[];
    [0.30,0.63].forEach(function(fr){
      var cx=90+fr*(AW-180);
      var tries=0;
      while(nearPipe(cx,60)&&tries<8){cx+=64;tries++;}
      if(cx<AW-120)pits.push({x1:cx-34,x2:cx+34});
    });
    function inPit(x,pad){
      for(var q=0;q<pits.length;q++)if(x>pits[q].x1-pad&&x<pits[q].x2+pad)return true;
      return false;
    }
    var goombas=[];
    [0.16,0.40,0.56,0.78,0.90].forEach(function(fr,gi2){
      var gx=70+fr*(AW-140);
      if(nearPipe(gx,54)||inPit(gx,50))return;
      goombas.push({x:gx,home:gx,dir:gi2%2?1:-1,range:32,squash:0,alive:true,anim:Math.random()*6});
    });
    var blocks=[];
    [0.22,0.50,0.74].forEach(function(fr){
      var bx=80+fr*(AW-160);
      for(var b=0;b<3;b++){
        var x=bx+b*30;
        if(nearPipe(x,40))continue;
        blocks.push({x:x,y:GROUND-124,type:b===1?'q':'b',bump:0,used:false});
      }
    });
    var coins=[];
    pits.forEach(function(p){
      var cx2=(p.x1+p.x2)/2;
      for(var k=-2;k<=2;k++)coins.push({x:cx2+k*22,y:GROUND-66-Math.round(22-Math.abs(k)*7),t:0,taken:0});
    });
    goombas.forEach(function(gb){
      for(var k2=-1;k2<=1;k2++)coins.push({x:gb.home+k2*24,y:GROUND-86,t:0,taken:0});
    });
    return{pipes:pipes,pits:pits,goombas:goombas,blocks:blocks,coins:coins};
  }

  function startGame(){
    doCleanup();
    var ah=createAudioCtx();audioRef.current=ah;playMarioMusic(ah);
    setShowConfetti(false);

    var count=actualCount;
    var lvl=buildLevel(count);
    var shuffled=shuffleApart(names,roundRobinGroup(count),APART_RULES);
    var STAG=Math.max(160,Math.min(420,Math.round(7000/names.length)));

    var runners=shuffled.map(function(nm,i){
      var gi=i%count;
      return{id:i,name:nm,gi:gi,color:BALL_COLORS[i%BALL_COLORS.length],
        x:-30-i*4,y:GROUND,vy:0,air:false,walk:Math.random()*6,
        delay:i*STAG,started:false,state:'run',pipeT:0,done:false,
        hop:0,skin:(i*3)%4,hair:i%6};
    });

    var g={lvl:lvl,runners:runners,pipes:lvl.pipes,coins:0,done:0,
      floats:[],dust:[],sparks:[],t:0,shake:0,finished:false,total:names.length,
      maxT:(names.length-1)*STAG+15000,forced:false};
    gRef.current=g;

    setGroups(Array.from({length:count},function(){return[];}));
    setHud({coins:0,done:0,total:names.length});
    setStatusText('\u{1F3AE} Level 1-1 — los geht’s!');
    setPhase('running');

    var last=performance.now();var t0=last;
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-last)/16.67);last=now;
      gg.t=now-t0;
      update(gg,dt);draw(gg,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function addFloat(g,x,y,txt,color){
    g.floats.push({x:x,y:y,txt:txt,color:color,life:44,maxLife:44});
  }
  function addDust(g,x,y,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI;
      g.dust.push({x:x,y:y,vx:Math.cos(a)*(0.6+Math.random()*1.6)*(Math.random()<0.5?-1:1),
        vy:-Math.abs(Math.sin(a))*1.2-0.2,r:1.6+Math.random()*3,life:20,maxLife:20});
    }
  }

  function update(g,dt){
    var lvl=g.lvl;
    if(g.shake>0)g.shake=Math.max(0,g.shake-0.05*dt);

    // Gumbas
    for(var i=0;i<lvl.goombas.length;i++){
      var gb=lvl.goombas[i];
      if(gb.squash>0){
        gb.squash-=0.008*dt;
        if(gb.squash<=0){gb.squash=0;gb.alive=true;}
        continue;
      }
      gb.anim+=0.12*dt;
      gb.x+=gb.dir*0.55*dt;
      if(gb.x>gb.home+gb.range){gb.x=gb.home+gb.range;gb.dir=-1;}
      if(gb.x<gb.home-gb.range){gb.x=gb.home-gb.range;gb.dir=1;}
    }
    // Blöcke
    for(var b=0;b<lvl.blocks.length;b++){
      var bl=lvl.blocks[b];
      if(bl.bump>0)bl.bump=Math.max(0,bl.bump-0.07*dt);
    }
    // Münzen
    for(var c=0;c<lvl.coins.length;c++){
      var co=lvl.coins[c];
      co.t+=0.10*dt;
      if(co.taken>0){co.taken-=0.012*dt;if(co.taken<0)co.taken=0;}
    }
    // Pipes
    for(var p=0;p<lvl.pipes.length;p++){
      var pp=lvl.pipes[p];
      if(pp.squash>0)pp.squash=Math.max(0,pp.squash-0.05*dt);
      pp.plantT-=dt;
      if(pp.plantT<=0){pp.plant=Math.min(1,pp.plant+0.03*dt);if(pp.plant>=1)pp.plantT=90+Math.random()*160;}
      else if(pp.plant>0)pp.plant=Math.max(0,pp.plant-0.03*dt);
    }

    // Sicherheitsnetz (sehr langsame Rechner): nach maxT alle Übrigen direkt in ihre Röhre schicken
    if(!g.forced&&g.t>g.maxT){
      g.forced=true;
      g.runners.forEach(function(rf){
        if(rf.done||rf.state==='dive')return;
        rf.started=true;rf.state='dive';rf.pipeT=0;rf.x=lvl.pipes[rf.gi].x;rf.vy=0;rf.air=false;
      });
    }

    for(var r=0;r<g.runners.length;r++){
      var ru=g.runners[r];
      if(ru.done)continue;
      if(!ru.started){
        if(g.t>=ru.delay){ru.started=true;ru.x=-24;}
        else continue;
      }
      var pipe=lvl.pipes[ru.gi];

      if(ru.state==='dive'){
        ru.pipeT+=0.035*dt;
        ru.y=GROUND-pipe.h+4+ru.pipeT*70;
        if(ru.pipeT>=1){
          ru.done=true;
          pipe.squash=1;g.shake=Math.min(1,g.shake+0.4);
          g.done++;
          sPipe();
          for(var s=0;s<10;s++){
            var sa=Math.random()*Math.PI*2;
            g.sparks.push({x:pipe.x,y:GROUND-pipe.h,vx:Math.cos(sa)*2.2,vy:-Math.abs(Math.sin(sa))*2.6-1,
              life:26,maxLife:26,c:'#fbbf24'});
          }
          addFloat(g,pipe.x,GROUND-pipe.h-16,'\u{1FA99}+1','#fde68a');
          (function(rr){
            setGroups(function(prev){
              var n2=prev.map(function(a){return a.slice();});
              n2[rr.gi]=n2[rr.gi].concat([rr.name]);return n2;
            });
            setStatusText('\u{1F7E2} '+rr.name+' → Gruppe '+(rr.gi+1)+'!');
          })(ru);
        }
        continue;
      }

      // horizontal
      var atPipe=Math.abs(ru.x-pipe.x)<3.2;
      if(ru.state==='run'){
        if(!atPipe&&ru.x<pipe.x)ru.x+=2.75*dt;
        else if(!ru.air){
          ru.state='enter';ru.vy=-8.2;ru.air=true;sJump();
        }
      }else if(ru.state==='enter'){
        ru.x+=(pipe.x-ru.x)*0.22*dt;
      }
      ru.walk+=ru.air?0:0.20*dt;

      // Sprungentscheidungen
      if(!ru.air&&ru.state==='run'){
        var jump=false;
        for(var q=0;q<lvl.pits.length;q++){
          var pit=lvl.pits[q];
          if(ru.x>pit.x1-64&&ru.x<pit.x1-8)jump=true;
        }
        for(var q2=0;q2<lvl.goombas.length;q2++){
          var gb2=lvl.goombas[q2];
          if(gb2.squash>0)continue;
          var d=gb2.x-ru.x;
          if(d>16&&d<58)jump=true;
        }
        for(var q3=0;q3<lvl.blocks.length;q3++){
          var bl2=lvl.blocks[q3];
          if(!bl2.used&&Math.abs(bl2.x-ru.x-16)<8)jump=true;
        }
        if(ru.hop<=0&&Math.random()<0.006*dt)jump=true;
        if(jump){ru.vy=-8.4;ru.air=true;ru.hop=60;sJump();}
      }
      if(ru.hop>0)ru.hop-=dt;

      // Physik
      ru.vy+=GRAV*dt;
      ru.y+=ru.vy*dt;

      // Blockstoß
      if(ru.vy<0){
        for(var q4=0;q4<lvl.blocks.length;q4++){
          var bl3=lvl.blocks[q4];
          if(Math.abs(bl3.x+13-ru.x)<15&&Math.abs(ru.y-38-(bl3.y+26))<10){
            if(bl3.bump<=0){
              bl3.bump=1;ru.vy=1.2;sBump();
              if(bl3.type==='q'&&!bl3.used){
                bl3.used=true;g.coins++;
                addFloat(g,bl3.x+13,bl3.y-10,'\u{1FA99}','#fde68a');
                sCoin();
              }else{
                addDust(g,bl3.x+13,bl3.y+8,5);
              }
            }
          }
        }
      }

      // Gumba stampfen
      for(var q5=0;q5<lvl.goombas.length;q5++){
        var gb3=lvl.goombas[q5];
        if(gb3.squash>0)continue;
        if(Math.abs(gb3.x-ru.x)<16&&ru.y>GROUND-24&&ru.y<GROUND+6){
          if(ru.vy>0){
            gb3.squash=1;ru.vy=-6.4;ru.air=true;
            g.shake=Math.min(1,g.shake+0.3);
            addFloat(g,gb3.x,GROUND-30,'100','#fff');
            addDust(g,gb3.x,GROUND-4,8);
            sStomp();
          }
        }
      }

      // Landen
      if(ru.y>=GROUND){
        var overPit=false;
        for(var q6=0;q6<lvl.pits.length;q6++){
          var pit2=lvl.pits[q6];
          if(ru.x>pit2.x1&&ru.x<pit2.x2)overPit=true;
        }
        ru.y=GROUND;
        if(ru.air){addDust(g,ru.x,GROUND,4);}
        ru.vy=0;ru.air=false;
        if(overPit&&ru.state==='run'){ru.vy=-8.6;ru.air=true;}
        // Röhre verfehlt (bei niedriger Bildrate reicht der erste Sprung nicht): mit mehr Schwung nochmal
        if(ru.state==='enter'){ru.vy=-9.6;ru.air=true;}
      }

      // Pipe-Eintritt
      if(ru.state==='enter'&&ru.vy>0&&ru.y<=GROUND-pipe.h+6&&Math.abs(ru.x-pipe.x)<10){
        ru.state='dive';ru.pipeT=0;ru.vy=0;
      }

      // Münzen einsammeln
      for(var q7=0;q7<lvl.coins.length;q7++){
        var co2=lvl.coins[q7];
        if(co2.taken>0)continue;
        if(Math.abs(co2.x-ru.x)<15&&Math.abs(co2.y-(ru.y-24))<20){
          co2.taken=1;g.coins++;sCoin();
          g.sparks.push({x:co2.x,y:co2.y,vx:0,vy:-1.6,life:22,maxLife:22,c:'#fde68a'});
        }
      }
    }

    // Partikel
    for(var d2=g.dust.length-1;d2>=0;d2--){
      var du=g.dust[d2];
      du.x+=du.vx*dt;du.y+=du.vy*dt;du.vy+=0.06*dt;du.life-=dt;du.r+=0.09*dt;
      if(du.life<=0)g.dust.splice(d2,1);
    }
    for(var s2=g.sparks.length-1;s2>=0;s2--){
      var sp=g.sparks[s2];
      sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vy+=0.10*dt;sp.life-=dt;
      if(sp.life<=0)g.sparks.splice(s2,1);
    }
    for(var f2=g.floats.length-1;f2>=0;f2--){
      var fo=g.floats[f2];
      fo.y-=0.7*dt;fo.life-=dt;
      if(fo.life<=0)g.floats.splice(f2,1);
    }

    // HUD (gedrosselt)
    if(!g._hudT||g.t-g._hudT>140){
      g._hudT=g.t;
      setHud({coins:g.coins,done:g.done,total:g.total});
    }

    if(!g.finished&&g.done>=g.runners.length){
      g.finished=true;
      later(function(){
        setPhase('done');setShowConfetti(true);
        setStatusText('\u{1F3C1} Level geschafft — '+actualCount+' Gruppen!');
        setHud({coins:g.coins,done:g.done,total:g.total});
        onResult(actualCount+' Gruppen');
        stopAH(audioRef.current);audioRef.current=null;
        later(function(){if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}},1600);
      },700);
    }
  }

  /* ── Hintergrund ── */
  function buildBg(){
    var c=document.createElement('canvas');
    c.width=AW*2;c.height=AH*2;
    var t=c.getContext('2d');t.setTransform(2,0,0,2,0,0);
    var sky=t.createLinearGradient(0,0,0,AH);
    sky.addColorStop(0,'#5c94fc');sky.addColorStop(0.62,'#79aefd');sky.addColorStop(1,'#a8cbff');
    t.fillStyle=sky;t.fillRect(0,0,AW,AH);
    // Hügel
    function hill(cx,r,col){
      t.fillStyle=col;
      t.beginPath();t.moveTo(cx-r,GROUND);
      t.quadraticCurveTo(cx-r*0.5,GROUND-r*0.95,cx,GROUND-r);
      t.quadraticCurveTo(cx+r*0.5,GROUND-r*0.95,cx+r,GROUND);
      t.closePath();t.fill();
    }
    hill(150,74,'#2f9e44');hill(430,58,'#2f9e44');hill(760,84,'#2f9e44');
    hill(280,44,'#37b24d');hill(600,50,'#37b24d');
    // Büsche
    function bush(x,s){
      t.fillStyle='#2b8a3e';
      t.beginPath();t.arc(x,GROUND-6*s,11*s,Math.PI,0);t.fill();
      t.beginPath();t.arc(x-14*s,GROUND-3*s,8*s,Math.PI,0);t.fill();
      t.beginPath();t.arc(x+14*s,GROUND-3*s,8*s,Math.PI,0);t.fill();
      t.fillRect(x-22*s,GROUND-4*s,44*s,4*s);
    }
    bush(90,1);bush(330,0.8);bush(520,1.1);bush(830,0.9);
    // Burg
    t.fillStyle='#7f5539';
    t.fillRect(AW-118,GROUND-96,96,96);
    t.fillRect(AW-126,GROUND-112,16,20);
    t.fillRect(AW-96,GROUND-118,16,26);
    t.fillRect(AW-56,GROUND-112,16,20);
    t.fillStyle='#5c3d24';
    t.fillRect(AW-84,GROUND-42,30,42);
    t.beginPath();t.arc(AW-69,GROUND-42,15,Math.PI,0);t.fill();
    t.fillStyle='rgba(0,0,0,0.18)';
    for(var br=0;br<10;br++)t.fillRect(AW-118,GROUND-96+br*10,96,1.5);
    return c;
  }

  /* ── Draw ── */
  function draw(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    var sh=g.shake;
    var ox=sh>0?(Math.random()-0.5)*sh*5:0;
    var oy=sh>0?(Math.random()-0.5)*sh*5:0;
    ctx.setTransform(2,0,0,2,ox*2,oy*2);
    var lvl=g.lvl;

    if(!g._bg)g._bg=buildBg();
    ctx.drawImage(g._bg,0,0,AW,AH);

    // Wolken (ziehend)
    for(var cl=0;cl<5;cl++){
      var cx=((cl*231+now*0.012)%(AW+180))-90;
      var cy=24+((cl*37)%56);
      var s=0.8+(cl%3)*0.25;
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.beginPath();ctx.arc(cx,cy,11*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+13*s,cy-5*s,14*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+28*s,cy,11*s,0,Math.PI*2);ctx.fill();
      ctx.fillRect(cx,cy,28*s,11*s);
    }

    // Boden mit Löchern
    var segs=[[0,AW]];
    lvl.pits.forEach(function(p){
      var ns=[];
      segs.forEach(function(sg){
        if(p.x2<=sg[0]||p.x1>=sg[1]){ns.push(sg);return;}
        if(p.x1>sg[0])ns.push([sg[0],p.x1]);
        if(p.x2<sg[1])ns.push([p.x2,sg[1]]);
      });
      segs=ns;
    });
    segs.forEach(function(sg){
      var w=sg[1]-sg[0];
      ctx.fillStyle='#3cb043';ctx.fillRect(sg[0],GROUND,w,8);
      ctx.fillStyle='#2f9e44';ctx.fillRect(sg[0],GROUND,w,3);
      var dg=ctx.createLinearGradient(0,GROUND+8,0,AH);
      dg.addColorStop(0,'#b5651d');dg.addColorStop(1,'#7c3f0f');
      ctx.fillStyle=dg;ctx.fillRect(sg[0],GROUND+8,w,AH-GROUND-8);
      ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1;
      for(var bx=Math.ceil(sg[0]/26)*26;bx<sg[1];bx+=26){
        ctx.beginPath();ctx.moveTo(bx,GROUND+8);ctx.lineTo(bx,AH);ctx.stroke();
      }
      ctx.beginPath();ctx.moveTo(sg[0],GROUND+30);ctx.lineTo(sg[1],GROUND+30);ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.fillRect(sg[0],GROUND+8,2,AH-GROUND-8);
      ctx.fillRect(sg[1]-2,GROUND+8,2,AH-GROUND-8);
    });

    // Blöcke
    lvl.blocks.forEach(function(bl){
      var by=bl.y-bl.bump*7;
      if(bl.type==='q'){
        ctx.fillStyle=bl.used?'#8d6b3f':'#f5a524';
        ctx.fillRect(bl.x,by,26,26);
        ctx.strokeStyle='#4a2b0a';ctx.lineWidth=2.4;ctx.strokeRect(bl.x+1,by+1,24,24);
        ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(bl.x+3,by+3,20,4);
        if(!bl.used){
          ctx.fillStyle='#fff';ctx.font='900 15px monospace';
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('?',bl.x+13,by+14);
        }
        ctx.fillStyle='#4a2b0a';
        [[3,3],[20,3],[3,20],[20,20]].forEach(function(d){ctx.fillRect(bl.x+d[0],by+d[1],3,3);});
      }else{
        ctx.fillStyle='#c1662f';ctx.fillRect(bl.x,by,26,26);
        ctx.strokeStyle='#7c3f0f';ctx.lineWidth=2;ctx.strokeRect(bl.x+1,by+1,24,24);
        ctx.strokeStyle='rgba(0,0,0,0.30)';ctx.lineWidth=1.4;
        ctx.beginPath();ctx.moveTo(bl.x,by+13);ctx.lineTo(bl.x+26,by+13);
        ctx.moveTo(bl.x+13,by);ctx.lineTo(bl.x+13,by+13);
        ctx.moveTo(bl.x+6,by+13);ctx.lineTo(bl.x+6,by+26);
        ctx.moveTo(bl.x+20,by+13);ctx.lineTo(bl.x+20,by+26);
        ctx.stroke();
      }
    });

    // Münzen
    lvl.coins.forEach(function(co){
      if(co.taken>0)return;
      var wsc=Math.abs(Math.cos(co.t));
      ctx.save();ctx.translate(co.x,co.y);
      ctx.fillStyle='#fbbf24';
      ctx.beginPath();ctx.ellipse(0,0,Math.max(1.5,8*wsc),8,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#b45309';ctx.lineWidth=1.5;ctx.stroke();
      if(wsc>0.45){
        ctx.fillStyle='rgba(255,255,255,0.55)';
        ctx.fillRect(-1.5*wsc,-4,3*wsc,8);
      }
      ctx.restore();
    });

    // Gumbas
    lvl.goombas.forEach(function(gb){
      var sq=gb.squash>0;
      ctx.save();ctx.translate(gb.x,GROUND);
      ctx.fillStyle='rgba(0,0,0,0.28)';
      ctx.beginPath();ctx.ellipse(0,0,13,4,0,0,Math.PI*2);ctx.fill();
      if(sq){
        ctx.fillStyle='#8b5a2b';
        ctx.beginPath();ctx.ellipse(0,-4,15,4.5,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#5b3a18';
        ctx.beginPath();ctx.ellipse(0,-2,15,3,0,0,Math.PI*2);ctx.fill();
        ctx.restore();return;
      }
      var wob=Math.sin(gb.anim)*0.10;
      ctx.rotate(wob);
      ctx.fillStyle='#5b3a18';
      ctx.beginPath();ctx.ellipse(-6,-2,5,3,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(6,-2,5,3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#8b5a2b';
      ctx.beginPath();ctx.ellipse(0,-13,13,12,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c98b52';
      ctx.beginPath();ctx.ellipse(0,-9,10,7,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(-4.6,-16,3.2,4,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(4.6,-16,3.2,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.arc(-4.2+gb.dir*0.8,-16,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(5+gb.dir*0.8,-16,1.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#111';ctx.lineWidth=1.6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-8,-21);ctx.lineTo(-2,-18.5);
      ctx.moveTo(8,-21);ctx.lineTo(2,-18.5);ctx.stroke();
      ctx.restore();
    });

    // Pipes
    lvl.pipes.forEach(function(pp){
      var h=pp.h-pp.squash*6;
      var w=pp.w+pp.squash*5;
      var x=pp.x-w/2;
      var top=GROUND-h;
      // Piranha
      if(pp.plant>0.02){
        var ph=pp.plant*30;
        ctx.save();
        ctx.fillStyle='#16a34a';
        ctx.fillRect(pp.x-3,top-ph,6,ph);
        ctx.fillStyle='#dc2626';
        ctx.beginPath();ctx.arc(pp.x,top-ph-6,9,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';
        for(var sp3=0;sp3<5;sp3++){
          ctx.beginPath();
          ctx.arc(pp.x-6+sp3*3,top-ph-9+((sp3%2)*2),1.5,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle='#fecdd3';
        ctx.beginPath();ctx.arc(pp.x-3,top-ph-9,2,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(pp.x+3,top-ph-9,2,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
      // Rohr
      var bg2=ctx.createLinearGradient(x,0,x+w,0);
      bg2.addColorStop(0,'#14532d');bg2.addColorStop(0.28,'#4ade80');
      bg2.addColorStop(0.55,'#22c55e');bg2.addColorStop(1,'#14532d');
      ctx.fillStyle=bg2;ctx.fillRect(x+4,top+16,w-8,h-16);
      ctx.strokeStyle='#14532d';ctx.lineWidth=2;ctx.strokeRect(x+4,top+16,w-8,h-16);
      var lipW=w+10;
      var lg2=ctx.createLinearGradient(pp.x-lipW/2,0,pp.x+lipW/2,0);
      lg2.addColorStop(0,'#14532d');lg2.addColorStop(0.28,'#86efac');
      lg2.addColorStop(0.55,'#22c55e');lg2.addColorStop(1,'#14532d');
      ctx.fillStyle=lg2;ctx.fillRect(pp.x-lipW/2,top,lipW,18);
      ctx.strokeStyle='#14532d';ctx.lineWidth=2;ctx.strokeRect(pp.x-lipW/2,top,lipW,18);
      ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(pp.x-lipW/2+4,top+2,lipW-8,5);
      // Label
      ctx.fillStyle='#fff';
      ctx.font='900 '+Math.max(10,Math.min(15,Math.round(w*0.34)))+'px monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=3;ctx.lineJoin='round';
      ctx.strokeText('G'+(pp.gi+1),pp.x,top+42);
      ctx.fillText('G'+(pp.gi+1),pp.x,top+42);
    });

    // Läufer
    for(var r=0;r<g.runners.length;r++){
      var ru=g.runners[r];
      if(ru.done||!ru.started)continue;
      var clip=null;
      if(ru.state==='dive'){
        var pipe2=lvl.pipes[ru.gi];
        clip=GROUND-pipe2.h;
      }
      ctx.save();
      if(clip!==null){ctx.beginPath();ctx.rect(0,0,AW,clip);ctx.clip();}
      drawHero(ctx,{x:ru.x,y:ru.y-19,s:14,color:ru.color,
        walk:ru.air?1.25:ru.walk*2.2,face:1,hair:ru.hair,skin:ru.skin,
        gear:'cap',lean:ru.air?-0.12:-0.05});
      // Namensschild
      var nm=truncName(ru.name,9);
      var fs=fitFont(ctx,nm,74,11,8);
      var tw=ctx.measureText(nm).width;
      var ly=ru.y-56;
      ctx.fillStyle='rgba(2,6,23,0.66)';
      hRR(ctx,ru.x-tw/2-5,ly-fs*0.72,tw+10,fs*1.44,fs*0.5);ctx.fill();
      ctx.fillStyle=ru.color;ctx.fillRect(ru.x-tw/2-5,ly-fs*0.72,2.5,fs*1.44);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(nm,ru.x,ly);
      ctx.restore();
    }

    // Partikel
    for(var d3=0;d3<g.dust.length;d3++){
      var du2=g.dust[d3];
      ctx.fillStyle='rgba(226,214,190,'+(du2.life/du2.maxLife*0.7)+')';
      ctx.beginPath();ctx.arc(du2.x,du2.y,du2.r,0,Math.PI*2);ctx.fill();
    }
    for(var s4=0;s4<g.sparks.length;s4++){
      var sp4=g.sparks[s4];
      ctx.globalAlpha=Math.max(0,sp4.life/sp4.maxLife);
      ctx.fillStyle=sp4.c;
      ctx.beginPath();ctx.arc(sp4.x,sp4.y,2.4,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    for(var f3=0;f3<g.floats.length;f3++){
      var fo2=g.floats[f3];
      ctx.save();ctx.globalAlpha=Math.max(0,fo2.life/fo2.maxLife);
      ctx.font='900 15px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineWidth=3.5;ctx.lineJoin='round';
      ctx.strokeText(fo2.txt,fo2.x,fo2.y);
      ctx.fillStyle=fo2.color;ctx.fillText(fo2.txt,fo2.x,fo2.y);
      ctx.restore();
    }

    // HUD-Leiste
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,AW,26);
    ctx.font='900 13px monospace';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.textAlign='left';
    ctx.fillText('WORLD 1-1',14,13);
    ctx.textAlign='center';
    ctx.fillText('\u{1FA99} x '+g.coins,AW*0.42,13);
    ctx.fillText('\u{1F7E2} '+g.done+' / '+g.total,AW*0.62,13);
    ctx.textAlign='right';
    ctx.fillText('GRUPPEN x '+lvl.pipes.length,AW-14,13);
    ctx.restore();
  }

  function reset(){
    doCleanup();gRef.current=null;
    setPhase('idle');setGroups([]);setShowConfetti(false);setStatusText('');
    setHud({coins:0,done:0,total:0});
    if(canvasRef.current){var c=canvasRef.current.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,AW*2,AH*2);}
  }

  var numCols=Math.min(actualCount,5);

  if(phase==='idle'){
    return(
      html`<div className="flex flex-col items-center w-full max-w-lg text-center">
        <div className="text-5xl mb-3">\u{1F3AE}</div>
        <p className="text-gray-900 text-xl font-bold mb-2">Super Mario Gruppen</p>
        <p className="text-gray-600 text-sm mb-4 max-w-sm leading-relaxed">
          Alle rennen durch Welt 1-1: über Abgründe springen, Gumbas plattmachen,
          Münzen kassieren — und am Ende in die eigene Gruppen-Röhre tauchen!
        </p>
        <div className="group-mode-toggle mb-5 inline-flex">
          <button onClick=${function(){setGroupMode('count')}} className=${"group-mode-btn "+(groupMode==='count'?"active":"inactive")}>Anzahl Gruppen</button>
          <button onClick=${function(){setGroupMode('size')}} className=${"group-mode-btn "+(groupMode==='size'?"active":"inactive")}>à N Personen</button>
        </div>
        ${groupMode==='count'?(html`
        <div className="flex items-center gap-5 justify-center mb-4">
          <button aria-label="Weniger Gruppen" onClick=${function(){setGroupCount(function(g){return Math.max(2,g-1)})}} disabled=${groupCount<=2}
            className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">−</button>
          <span aria-live="polite" className="text-6xl font-black gradient-text w-20 text-center">${groupCount}</span>
          <button aria-label="Mehr Gruppen" onClick=${function(){setGroupCount(function(g){return Math.min(maxGroups,g+1)})}} disabled=${groupCount>=maxGroups}
            className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
        </div>
        <p className="text-gray-600 text-xs mb-6">ca. ${Math.ceil(names.length/groupCount)} Personen pro Gruppe</p>
        `):(html`
        <div className="flex items-center gap-5 justify-center mb-4">
          <button aria-label="Weniger Personen pro Gruppe" onClick=${function(){setGroupSize(function(s){return Math.max(2,s-1)})}} disabled=${groupSize<=2}
            className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">−</button>
          <span aria-live="polite" className="text-6xl font-black gradient-text w-20 text-center">${groupSize}</span>
          <button aria-label="Mehr Personen pro Gruppe" onClick=${function(){setGroupSize(function(s){return Math.min(maxSize,s+1)})}} disabled=${groupSize>=maxSize}
            className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
        </div>
        <p className="text-gray-600 text-xs mb-6">→ ${actualCount} Gruppen (${names.length} Personen)</p>
        `)}
        <button onClick=${startGame} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white shadow-lg shadow-green-500/20 transition-all">\u{1F3AE} Level starten!</button>
      </div>`
    );
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-4xl">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-3">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#dc2626,#f59e0b,#16a34a)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F3AE} Super Mario Gruppen</h2>
        <p role="status" aria-live="polite" className="text-gray-800 text-base font-semibold">${statusText}</p>
        ${phase==='running'&&html`<p className="bg-info text-gray-500 text-xs mt-0.5">\u{1FA99} ${hud.coins} Münzen · ${hud.done} von ${hud.total} in der Röhre</p>`}
      </div>

      <div className="relative w-full mb-4 rounded-xl overflow-hidden" style=${{border:'4px solid #d97706',boxShadow:'0 0 0 2px #92400e,0 18px 40px -16px rgba(0,0,0,.6)'}}>
        <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{display:'block',width:'100%',height:'auto'}} role="img" aria-label="Super-Mario-Level"/>
      </div>

      <div data-result className="w-full grid gap-3 mb-4" style=${{gridTemplateColumns:'repeat('+numCols+',1fr)'}}>
        ${groups.map(function(group,gi){
          return(
            html`<div key=${gi} className="rounded-xl overflow-hidden border border-gray-200 shadow-md">
              <div className=${"px-3 py-2 text-center bg-gradient-to-br "+GROUP_COLORS[gi%GROUP_COLORS.length].bg}>
                <span className="text-white font-bold text-sm bg-group-title">Gruppe ${gi+1}</span>
                <span className="text-white/60 text-xs ml-1">(${group.length})</span>
              </div>
              <div className="bg-white p-2 space-y-0.5 min-h-6">
                ${group.map(function(nm,ni){
                  return html`<div key=${ni} className=${"bg-member text-gray-800 text-sm font-medium px-2 py-1 rounded bg-gray-50 fade-in "+(ni===group.length-1?"name-pop":"")} style=${{animationDelay:(ni*0.06)+'s'}}>${nm}</div>`;
                })}
              </div>
            </div>`
          );
        })}
      </div>
      ${phase==='running'&&(
        html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`
      )}
      ${phase==='done'&&(
        html`<div data-result-actions className="flex gap-3 mt-2">
          <${GroupCopyButton} modeName="Super Mario" groups=${groups} onReport=${props.onGroups}/>
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </div>`
      )}
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   CHAOS ARENA MODE
   ═══════════════════════════════════════════════════════ */
function ChaosArenaMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _st=useState('Bereit f\u00FCr das Chaos!');var statusText=_st[0];var setStatusText=_st[1];
  var _el=useState([]);var eliminated=_el[0];var setEliminated=_el[1];
  var _wn=useState(null);var winner=_wn[0];var setWinner=_wn[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _sv=useState(0);var surviving=_sv[0];var setSurviving=_sv[1];
  var _kf=useState([]);var killFeed=_kf[0];var setKillFeed=_kf[1];
  var _eb=useState(null);var eventBanner=_eb[0];var setEventBanner=_eb[1];
  var _sw=useState([]);var shockRings=_sw[0];var setShockRings=_sw[1];
  var _shk=useState(false);var arenaShake=_shk[0];var setArenaShake=_shk[1];
