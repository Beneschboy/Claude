    var zig=[];var zLo=0;var zHi=xLanes.length-1;
    while(zLo<=zHi){zig.push(xLanes[zLo++]);if(zLo<=zHi)zig.push(xLanes[zHi--]);}
    xLanes=zig;
    for(var iy=0;iy<count;iy++){
      var tt=count===1?0.5:iy/(count-1);
      ships[iy].y=58+tt*(AH-116)+(Math.random()-0.5)*10;
      ships[iy].laneY=ships[iy].y;
      ships[iy].laneX=xLanes[iy];
      ships[iy].x=xLanes[iy]+(Math.random()-0.5)*8;
    }

    var stars=[];
    for(var si=0;si<160;si++){
      stars.push({x:Math.random()*AW,y:Math.random()*AH,r:Math.random()*1.4+0.3,vx:-(0.4+Math.random()*1.8),alpha:0.25+Math.random()*0.7});
    }

    // Schedule staggered eliminations — winner is last alive
    // Countdown 3.5 s + Rennen bis 14 s + Abspann => Gesamtlauf bleibt unter 20 s
    var elimOrder=[];for(var eo=0;eo<names.length;eo++){if(eo!==winnerIdx)elimOrder.push(eo);}
    elimOrder=shuffle(elimOrder);
    var elimStart=2200;var elimEnd=14000;
    var elimN=elimOrder.length;
    var elimSchedule=elimOrder.map(function(idx,i){
      var at=elimN<=1?elimEnd:(elimStart+i*(elimEnd-elimStart)/(elimN-1));
      return {victim:idx,at:at};
    });

    gRef.current={
      ships:ships,obstacles:[],particles:[],stars:stars,
      elimSchedule:elimSchedule,winnerIdx:winnerIdx,
      startT:0,obstacleTimer:0,done:false,lastAlive:ships.length
    };
    setAliveCount(ships.length);

    setCountdown(3);
    later(function(){playBeep(440);},0);
    later(function(){setCountdown(2);playBeep(440);},900);
    later(function(){setCountdown(1);playBeep(440);},1800);
    later(function(){setCountdown('ABFLUG! \u{1F680}');playBeep(880);},2700);
    later(function(){setCountdown(null);setPhase('racing');playEngineHum();startLoop();},3500);
  }

  function startLoop(){
    var g=gRef.current;if(!g)return;
    g.startT=performance.now();
    var lastT=g.startT;
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-lastT)/16.67);lastT=now;
      update(gg,dt);draw(gg);
      animRef.current=requestAnimationFrame(loop);
    }
    animRef.current=requestAnimationFrame(loop);
  }

  function update(g,dt){
    var elapsed=performance.now()-g.startT;

    // Scrolling stars
    for(var si=0;si<g.stars.length;si++){
      var s=g.stars[si];s.x+=s.vx*dt;
      if(s.x<-2){s.x=AW+2;s.y=Math.random()*AH;}
    }

    if(!g.done){
      g.obstacleTimer+=dt;
      if(g.obstacleTimer>9){g.obstacleTimer=0;spawnRandomObstacle(g);}
      while(g.elimSchedule.length&&g.elimSchedule[0].at<=elapsed){
        var ev=g.elimSchedule.shift();
        var victim=g.ships[ev.victim];
        if(victim&&victim.alive&&!victim.exploding){spawnHomingObstacle(g,ev.victim);}
      }
    }

    // Update ships
    var aliveShips=0;
    for(var i=0;i<g.ships.length;i++){
      var sh=g.ships[i];
      if(sh.exploding){
        sh.explodeT+=dt;
        if(sh.explodeT<5){
          for(var pp=0;pp<2;pp++){
            g.particles.push({x:sh.x+(Math.random()-0.5)*18,y:sh.y+(Math.random()-0.5)*18,vx:(Math.random()-0.5)*2.5,vy:(Math.random()-0.5)*2.5,life:18,maxLife:18,color:pp%2?'#FFB84D':'#FF3B30',size:2+Math.random()*2});
          }
        }
        if(sh.explodeT>12){sh.alive=false;sh.exploding=false;}
        continue;
      }
      if(!sh.alive)continue;
      aliveShips++;

      // AI dodge — scan for closest obstacle ahead (ignore mines targeting other ships)
      var dodge=0;var closest=null;var cd=99999;
      for(var oi=0;oi<g.obstacles.length;oi++){
        var o=g.obstacles[oi];if(o.consumed)continue;
        if(o.homing&&o.target!==i)continue; // ignore mines meant for others
        var dxo=o.x-sh.x;if(dxo<-30||dxo>220)continue;
        var dyo=o.y-sh.y;
        var dd=Math.sqrt(dxo*dxo+dyo*dyo);
        if(dd<cd){cd=dd;closest=o;}
      }
      if(closest&&cd<90){
        var ddy=closest.y-sh.y;
        dodge=ddy>0?-1:1;
        if(Math.abs(ddy)<6)dodge=Math.sin(sh.wobble)>0?-1:1;
      }else{
        dodge=(sh.laneY-sh.y)*0.005; // return to own lane, not shared center
      }
      sh.wobble+=sh.wobbleSpd*dt;
      sh.vy+=dodge*0.75*dt;
      sh.vy*=0.88;
      sh.y+=sh.vy*dt;
      sh.y+=Math.sin(sh.wobble)*sh.wobbleAmp*dt;
      if(sh.y<36){sh.y=36;sh.vy=Math.abs(sh.vy)*0.3;}
      if(sh.y>AH-36){sh.y=AH-36;sh.vy=-Math.abs(sh.vy)*0.3;}
      sh.x+=(sh.laneX-sh.x)*0.005*dt+Math.sin(sh.wobble*1.3)*0.18*dt;
      // Grenzen müssen den Bereich der Startspalten abdecken, sonst rutschen alle Schiffe
      // in eine schmale Säule und die Namensschilder liegen übereinander
      if(sh.x<44)sh.x=44;
      if(sh.x>360)sh.x=360;

      sh.trail.push({x:sh.x,y:sh.y});
      if(sh.trail.length>9)sh.trail.shift();

      // Any obstacle eliminates on collision — homing mines only hit their target
      for(var oj=0;oj<g.obstacles.length;oj++){
        var obj=g.obstacles[oj];
        if(obj.consumed)continue;
        if(obj.homing&&obj.target!==i)continue; // homing mine targets specific ship only
        if(!obj.homing&&i===g.winnerIdx)continue; // winner is immune to random obstacles
        var cdx=obj.x-sh.x;var cdy=obj.y-sh.y;
        var cdd=Math.sqrt(cdx*cdx+cdy*cdy);
        var hitR=obj.homing?obj.r+15:obj.r+10;
        if(cdd<hitR){
          sh.exploding=true;sh.explodeT=0;
          obj.consumed=true;
          // Remove from pending elim schedule
          g.elimSchedule=g.elimSchedule.filter(function(ev){return ev.victim!==i;});
          playExplosion();
          for(var bp=0;bp<20;bp++){
            g.particles.push({x:sh.x,y:sh.y,vx:(Math.random()-0.5)*5.5,vy:(Math.random()-0.5)*5.5,life:24,maxLife:24,color:bp%3===0?'#FF3B30':(bp%3===1?'#FFB84D':'#FFEA00'),size:2.5+Math.random()*2.5});
          }
          (function(nm){
            setCommentary('\u{1F4A5} '+nm+' ausgeschieden!');
            later(function(){setCommentary('');},1100);
          })(sh.name);
          break;
        }
      }
    }

    if(g.lastAlive!==aliveShips){g.lastAlive=aliveShips;setAliveCount(aliveShips);}

    // Update obstacles
    for(var ok=g.obstacles.length-1;ok>=0;ok--){
      var ob=g.obstacles[ok];
      if(ob.homing&&!ob.consumed){
        var vs=g.ships[ob.target];
        if(vs&&vs.alive&&!vs.exploding){
          var tdx=vs.x-ob.x;var tdy=vs.y-ob.y;
          var tdd=Math.sqrt(tdx*tdx+tdy*tdy);
          if(tdd>0.1){
            var sp=5.5;
            ob.vx+=(tdx/tdd*sp-ob.vx)*0.2;
            ob.vy+=(tdy/tdd*sp-ob.vy)*0.2;
          }
        }
      }
      ob.x+=ob.vx*dt;ob.y+=ob.vy*dt;
      ob.rot+=ob.rotV*dt;
      if(ob.x<-70||ob.x>AW+80||ob.y<-80||ob.y>AH+80){g.obstacles.splice(ok,1);}
    }

    // Particles
    for(var pk=g.particles.length-1;pk>=0;pk--){
      var pt=g.particles[pk];
      pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;
      pt.vy+=0.04*dt;
      pt.life-=dt;
      if(pt.life<=0)g.particles.splice(pk,1);
    }

    // Winner detection — always use the predetermined winnerIdx
    if(!g.done&&aliveShips<=1&&elapsed>2200){
      g.done=true;
      var winName=g.ships[g.winnerIdx].name;
      (function(nm){
        later(function(){setPhase('winner');setWinner(nm);setShowConfetti(true);playWin();onResult(nm);},700);
      })(winName);
    }
    if(!g.done&&elapsed>26000){
      g.done=true;
      var _winNm=g.ships[g.winnerIdx].name;setPhase('winner');setWinner(_winNm);setShowConfetti(true);playWin();onResult(_winNm);
    }
  }

  function spawnRandomObstacle(g){
    var types=['asteroid','asteroid','asteroid','comet','debris'];
    var type=types[Math.floor(Math.random()*types.length)];
    var r=14+Math.random()*14;
    g.obstacles.push({
      type:type,x:AW+40,y:40+Math.random()*(AH-80),
      vx:-(1.8+Math.random()*1.7),vy:(Math.random()-0.5)*0.5,
      r:r,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.06,
      homing:false,consumed:false
    });
  }

  function spawnHomingObstacle(g,targetIdx){
    var ts=g.ships[targetIdx];if(!ts)return;
    g.obstacles.push({
      type:'mine',x:AW+30,y:ts.y+(Math.random()-0.5)*50,
      vx:-4,vy:0,r:19,rot:0,rotV:0.12,
      homing:true,target:targetIdx,consumed:false
    });
  }

  function draw(g){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);

    // Deep space gradient
    var bg=ctx.createLinearGradient(0,0,0,AH);
    bg.addColorStop(0,'#030318');bg.addColorStop(0.5,'#0a0a28');bg.addColorStop(1,'#140828');
    ctx.fillStyle=bg;ctx.fillRect(0,0,AW,AH);

    // Nebulas
    var nb=ctx.createRadialGradient(AW*0.3,AH*0.35,10,AW*0.3,AH*0.35,320);
    nb.addColorStop(0,'rgba(139,92,246,0.18)');nb.addColorStop(1,'rgba(139,92,246,0)');
    ctx.fillStyle=nb;ctx.fillRect(0,0,AW,AH);
    var nb2=ctx.createRadialGradient(AW*0.78,AH*0.7,10,AW*0.78,AH*0.7,280);
    nb2.addColorStop(0,'rgba(236,72,153,0.13)');nb2.addColorStop(1,'rgba(236,72,153,0)');
    ctx.fillStyle=nb2;ctx.fillRect(0,0,AW,AH);

    // Stars
    for(var si=0;si<g.stars.length;si++){
      var s=g.stars[si];
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+s.alpha+')';ctx.fill();
    }

    // Obstacles
    for(var oi=0;oi<g.obstacles.length;oi++){
      var o=g.obstacles[oi];
      ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
      if(o.type==='asteroid'){
        var grd=ctx.createRadialGradient(-o.r*0.3,-o.r*0.3,o.r*0.1,0,0,o.r);
        grd.addColorStop(0,'#9B8466');grd.addColorStop(0.6,'#5D4A37');grd.addColorStop(1,'#2E2218');
        ctx.fillStyle=grd;
        ctx.beginPath();
        var pts=9;
        for(var pi2=0;pi2<pts;pi2++){
          var a=pi2*Math.PI*2/pts;
          var rr=o.r*(0.82+Math.sin(a*4+o.rotV*100)*0.18);
          var px=Math.cos(a)*rr;var py=Math.sin(a)*rr;
          if(pi2===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(0,0,0,0.4)';
        ctx.beginPath();ctx.arc(-o.r*0.28,-o.r*0.15,o.r*0.22,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(o.r*0.22,o.r*0.28,o.r*0.15,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(o.r*0.15,-o.r*0.35,o.r*0.1,0,Math.PI*2);ctx.fill();
      }else if(o.type==='comet'){
        ctx.rotate(-o.rot);
        var tg=ctx.createLinearGradient(-o.r*3.2,0,0,0);
        tg.addColorStop(0,'rgba(100,200,255,0)');tg.addColorStop(1,'rgba(200,240,255,0.85)');
        ctx.fillStyle=tg;
        ctx.beginPath();
        ctx.moveTo(-o.r*3.2,-o.r*0.4);ctx.lineTo(0,-o.r);ctx.lineTo(0,o.r);ctx.lineTo(-o.r*3.2,o.r*0.4);
        ctx.closePath();ctx.fill();
        var hg=ctx.createRadialGradient(0,0,0,0,0,o.r);
        hg.addColorStop(0,'#ffffff');hg.addColorStop(0.4,'#9fdbff');hg.addColorStop(1,'#2a6bb0');
        ctx.fillStyle=hg;
        ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
      }else if(o.type==='debris'){
        ctx.fillStyle='#4B5563';ctx.fillRect(-o.r,-o.r*0.35,o.r*2,o.r*0.7);
        ctx.fillStyle='#1F2937';ctx.fillRect(-o.r*0.9,-o.r*0.65,o.r*0.45,o.r*1.3);
        ctx.strokeStyle='#9CA3AF';ctx.lineWidth=1;
        ctx.strokeRect(-o.r,-o.r*0.35,o.r*2,o.r*0.7);
        ctx.fillStyle='#FBBF24';ctx.fillRect(-o.r*0.2,-o.r*0.1,o.r*0.12,o.r*0.2);
      }else if(o.type==='mine'){
        var mg=ctx.createRadialGradient(0,0,2,0,0,o.r);
        mg.addColorStop(0,'#ff8080');mg.addColorStop(0.65,'#a01818');mg.addColorStop(1,'#300000');
        ctx.fillStyle=mg;
        ctx.beginPath();ctx.arc(0,0,o.r*0.72,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#b91c1c';
        for(var k=0;k<8;k++){
          ctx.save();ctx.rotate(k*Math.PI/4);
          ctx.beginPath();
          ctx.moveTo(o.r*0.7,-3.2);ctx.lineTo(o.r*1.25,0);ctx.lineTo(o.r*0.7,3.2);
          ctx.closePath();ctx.fill();
          ctx.restore();
        }
        var pulse=0.5+0.5*Math.sin(performance.now()*0.018);
        ctx.fillStyle='rgba(255,220,120,'+pulse+')';
        ctx.beginPath();ctx.arc(0,0,o.r*0.28,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }

    // Particles
    for(var pi3=0;pi3<g.particles.length;pi3++){
      var p=g.particles[pi3];
      ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
      ctx.beginPath();ctx.arc(p.x,p.y,p.size||2,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
    }
    ctx.globalAlpha=1;

    // Ships
    for(var shi=0;shi<g.ships.length;shi++){
      var sh=g.ships[shi];
      if(!sh.alive&&!sh.exploding)continue;

      if(!sh.exploding&&sh.trail.length>1){
        ctx.strokeStyle=sh.color+'55';
        ctx.lineWidth=3;ctx.lineCap='round';
        ctx.beginPath();
        for(var ti=0;ti<sh.trail.length;ti++){
          var tp=sh.trail[ti];
          if(ti===0)ctx.moveTo(tp.x-10,tp.y);
          else ctx.lineTo(tp.x-10,tp.y);
        }
        ctx.stroke();
      }

      var alpha=sh.exploding?Math.max(0,1-sh.explodeT/10):1;
      ctx.globalAlpha=alpha;

      if(!sh.exploding){
        var fl=4+Math.sin(performance.now()*0.02+shi)*1.8;
        var fg=ctx.createRadialGradient(sh.x-14,sh.y,0,sh.x-14,sh.y,12);
        fg.addColorStop(0,'rgba(255,240,100,0.92)');
        fg.addColorStop(0.4,'rgba(255,120,50,0.7)');
        fg.addColorStop(1,'rgba(255,50,0,0)');
        ctx.fillStyle=fg;
        ctx.beginPath();
        ctx.ellipse(sh.x-14-fl*0.5,sh.y,11+fl,4.5,0,0,Math.PI*2);
        ctx.fill();
      }

      ctx.font='26px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(sh.emoji,sh.x,sh.y);

      if(!sh.exploding){
        ctx.font='bold 14px Inter,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='top';
        ctx.strokeStyle='rgba(0,0,0,0.9)';
        ctx.lineWidth=4;ctx.lineJoin='round';
        var nm=truncName(sh.name,12);
        ctx.strokeText(nm,sh.x,sh.y+17);
        ctx.fillStyle='#ffffff';
        ctx.fillText(nm,sh.x,sh.y+17);
      }

      ctx.globalAlpha=1;
    }
  }

  return html`<div className="flex flex-col items-center w-full max-w-5xl">
    ${showConfetti&&html`<${Confetti}/>`}
    ${countdown!==null&&html`<div style=${{position:'fixed',inset:0,display:'flex',alignItems:'center',justifyContent:'center',zIndex:65,pointerEvents:'none'}}>
      <div className="countdown-pop text-7xl font-black text-white" style=${{textShadow:'0 0 50px rgba(59,130,246,0.9)'}}>${countdown}</div>
    </div>`}
    <h2 className="text-lg font-bold text-gray-800 mb-1">\u{1F680} Space Race</h2>
    <p className="text-gray-500 text-xs mb-3">Weiche den Asteroiden aus \u2014 wer überlebt, gewinnt!</p>
    ${commentary&&html`<div role="status" aria-live="polite" className="text-center mb-2 px-4 py-1.5 rounded-full font-bold text-sm fade-in" style=${{background:'linear-gradient(135deg,rgba(239,68,68,0.18),rgba(249,115,22,0.18))',border:'1px solid rgba(249,115,22,0.35)',color:'#c2410c'}}>${commentary}</div>`}
    ${phase==='racing'&&!commentary&&html`<div className="bg-info text-xs text-indigo-500 font-bold mb-2">\u{1F6F8} ${aliveCount} / ${names.length} noch im All</div>`}
    <div className="w-full rounded-2xl p-2 mb-4 relative overflow-hidden" style=${{background:'rgba(3,3,20,0.85)',border:'1px solid rgba(99,102,241,0.35)',boxShadow:'0 0 35px rgba(99,102,241,0.25)'}}>
      <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{width:'100%',height:'auto',display:'block',borderRadius:'0.75rem'}}/>
    </div>
    ${winner&&html`<div className="winner-enter mb-4 w-full max-w-sm text-center">
      <div className="winner-card rounded-2xl px-8 py-5 text-white shadow-2xl border-2 border-amber-400/40" style=${{background:'linear-gradient(135deg,#0f2027,#1e3a5f)'}}>
        <div className="text-amber-200 text-xs font-semibold tracking-widest uppercase mb-1">\u{1F680} Space Race \u2014 Sieger</div>
        <div className="text-3xl font-black">${winner}</div>
        <div className="mt-2 text-xl">\u{1F389}\u{1F3C6}\u{1F680}</div>
        <${CopyButton} modeName="Space Race" winner=${winner}/>
      </div>
    </div>`}
    <div data-result-actions className="flex gap-3 mt-2 flex-wrap justify-center">
      ${phase==='idle'&&html`<button onClick=${startRace} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white shadow-lg transition-all active:scale-95">\u{1F680} Abheben!</button>`}
      ${(phase==='countdown'||phase==='racing')&&html`<button onClick=${function(){clearT();if(animRef.current)cancelAnimationFrame(animRef.current);stopAH(audioRef.current);onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">\u2715 Abbrechen</button>`}
      ${phase==='winner'&&html`<span className="flex gap-3">
        <button onClick=${startRace} className="px-6 py-3 rounded-xl font-semibold bg-blue-100 text-blue-700 border border-blue-200 hover:bg-blue-200 transition-all">Nochmal</button>
        <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button>
      </span>`}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   REIHENFOLGE MODE — zufällige Startaufstellung 1…N
   ═══════════════════════════════════════════════════════ */
var PODIUM=['#f59e0b','#94a3b8','#b45309'];

function ReihenfolgeMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _or=useState([]);var order=_or[0];var setOrder=_or[1];
  var _pl=useState(function(){return names.map(function(_,i){return i;});});var pool=_pl[0];var setPool=_pl[1];
  var _hi=useState(-1);var hiIdx=_hi[0];var setHiIdx=_hi[1];
  var _st=useState('Bereit für die Auslosung');var statusText=_st[0];var setStatusText=_st[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var timers=useRef([]);
  var audioRef=useRef(null);

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  useEffect(function(){return function(){clearT();stopAH(audioRef.current);audioRef.current=null;};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  function start(){
    if(phase==='running')return;
    clearT();stopAH(audioRef.current);
    var ah=createAudioCtx();audioRef.current=ah;playOrderMusic(ah);
    var n=names.length;
    var drawn=shuffle(names.map(function(_,i){return i;}));
    setOrder([]);setPool(names.map(function(_,i){return i;}));setHiIdx(-1);
    setShowConfetti(false);setPhase('running');setStatusText('Die Reihenfolge wird ausgelost…');

    // Gesamtdauer bleibt unter 20 s, egal ob 2 oder 50 Namen
    var per=Math.max(260,Math.min(1300,Math.round(12000/n)));
    var rem=names.map(function(_,i){return i;});
    var t=350;
    drawn.forEach(function(idx,i){
      var scans=Math.max(2,Math.min(6,Math.floor(per/120)));
      for(var s=0;s<scans;s++){
        (function(si,snapshot){
          later(function(){
            if(!snapshot.length)return;
            setHiIdx(snapshot[Math.floor(Math.random()*snapshot.length)]);
          },t+si*(per*0.55/scans));
        })(s,rem.slice());
      }
      later(function(){
        setHiIdx(-1);
        setOrder(function(p){return p.concat([idx]);});
        setPool(function(p){return p.filter(function(x){return x!==idx;});});
        setStatusText('Platz '+(i+1)+': '+names[idx]);
      },t+per*0.66);
      rem.splice(rem.indexOf(idx),1);
      t+=per;
    });

    later(function(){
      setPhase('done');setShowConfetti(true);
      setStatusText('\u{1F3C1} Reihenfolge steht — '+names[drawn[0]]+' fängt an!');
      onResult(names[drawn[0]]+' beginnt');
      stopAH(audioRef.current);audioRef.current=null;
    },t+350);
  }

  function reset(){
    clearT();stopAH(audioRef.current);audioRef.current=null;
    setPhase('idle');setOrder([]);setPool(names.map(function(_,i){return i;}));
    setHiIdx(-1);setShowConfetti(false);setStatusText('Bereit für die Auslosung');
  }

  var listCols=names.length<=8?1:names.length<=22?2:3;
  var listRows=Math.ceil(names.length/listCols);

  return(
    html`<div className="flex flex-col items-center w-full max-w-4xl screen-enter">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-4">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#b45309,#d97706,#6d28d9)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F522} Reihenfolge</h2>
        <p role="status" aria-live="polite" className="text-gray-700 text-base font-medium">${statusText}</p>
        ${phase==='running'&&html`<p className="bg-info text-gray-500 text-xs mt-0.5">${order.length}/${names.length} vergeben</p>`}
      </div>

      ${pool.length>0&&html`<div className="w-full mb-5">
        <p className="text-gray-500 text-center mb-2" style=${{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em'}}>Noch im Topf (${pool.length})</p>
        <div className="flex flex-wrap gap-2 justify-center bg-gray-50 rounded-2xl p-3 border border-gray-200">
          ${pool.map(function(idx){
            var isHi=hiIdx===idx;
            return html`<span key=${idx} className=${"rf-chip"+(isHi?" spinning":"")} style=${{background:BALL_COLORS[idx%BALL_COLORS.length],opacity:isHi?1:0.82,boxShadow:isHi?'0 0 0 3px rgba(251,191,36,.65),0 4px 14px rgba(0,0,0,.2)':undefined}}>${names[idx]}</span>`;
          })}
        </div>
      </div>`}

      <div className="w-full grid gap-2 mb-5" style=${{gridTemplateColumns:'repeat('+listCols+',minmax(0,1fr))',gridTemplateRows:'repeat('+listRows+',auto)',gridAutoFlow:'column'}}>
        ${names.map(function(_,slot){
          var idx=order[slot];
          var pod=slot<3?PODIUM[slot]:null;
          if(idx===undefined){
            return html`<div key=${slot} className="rf-slot empty">
              <span className="rf-num plain">${slot+1}</span>
              <span className="text-gray-300 text-sm italic">—</span>
            </div>`;
          }
          return html`<div key=${slot} className="rf-slot rf-land" style=${{borderColor:pod?pod+'66':'#e5e7eb'}}>
            <span className=${"rf-num "+(pod?"podium":"plain")} style=${pod?{background:pod}:undefined}>${slot+1}</span>
            <span className="font-bold text-gray-900 text-base truncate">${names[idx]}</span>
          </div>`;
        })}
      </div>

      ${phase==='done'&&html`<div className="winner-enter mb-5 w-full max-w-md">
        <div className="winner-card rounded-2xl px-8 py-5 text-white text-center shadow-2xl border-2 border-amber-400/40" style=${{background:'linear-gradient(135deg,#b45309,#7c2d12)'}}>
          <div className="text-amber-200 text-xs font-semibold tracking-widest uppercase mb-1">\u{1F947} Startet</div>
          <div className="text-3xl font-black tracking-tight">${names[order[0]]}</div>
          <${CopyButton} text=${orderCopyText(order.map(function(idx){return names[idx];}))}/>
        </div>
      </div>`}

      <div data-result-actions className="flex gap-3 mt-1 flex-wrap justify-center">
        ${phase==='idle'&&html`<button onClick=${start} className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95" style=${{background:'linear-gradient(135deg,#d97706,#b45309)',boxShadow:'0 8px 24px rgba(217,119,6,0.28)'}}>\u{1F522} Reihenfolge auslosen</button>`}
        ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='done'&&html`<span className="flex gap-3">
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </span>`}
      </div>
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   PARTNER FINDEN — Memory-Suche mit Lupe
   ═══════════════════════════════════════════════════════ */
function PartnerMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _dk=useState([]);var deck=_dk[0];var setDeck=_dk[1];
  var _fl=useState([]);var flipped=_fl[0];var setFlipped=_fl[1];
  var _mt=useState([]);var matched=_mt[0];var setMatched=_mt[1];
  var _du=useState([]);var duos=_du[0];var setDuos=_du[1];
  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];
  var _hint=useState('');var hintText=_hint[0];var setHintText=_hint[1];
  var _lens=useState(null);var lens=_lens[0];var setLens=_lens[1];
  var _focus=useState(null);var focus=_focus[0];var setFocus=_focus[1];
  var _cel=useState(null);var celebrate=_cel[0];var setCelebrate=_cel[1];
  var _prog=useState([0,0]);var progress=_prog[0];var setProgress=_prog[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var timers=useRef([]);
  var audioRef=useRef(null);
  var boardRef=useRef(null);var cardRefs=useRef({});

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  useEffect(function(){return function(){clearT();stopAH(audioRef.current);audioRef.current=null;};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  function playTick(){
    try{var ah=audioRef.current;if(!ah)return;
      aT(ah.ctx,ah.master,290+Math.random()*80,ah.ctx.currentTime,0.04,0.07,'square');}catch(e){}
  }
  function playFlip(step){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      aT(c,m,step===0?440:660,now,0.09,0.18,'square');
      aT(c,m,step===0?660:880,now+0.05,0.09,0.12,'triangle');}catch(e){}
  }
  function playDrum(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      for(var i=0;i<7;i++)aT(c,m,150+i*6,now+i*0.045,0.05,0.13,'triangle');}catch(e){}
  }
  function playMatch(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){aT(c,m,f,now+i*0.07,0.24,0.20,'triangle');});
      aC(c,m,now+0.30,[659.25,783.99,1046.5],0.16,0.5,'sine');}catch(e){}
  }

  function cardCenter(ci){
    var b=boardRef.current;var el=cardRefs.current[ci];
    if(!b||!el)return null;
    var br=b.getBoundingClientRect();var er=el.getBoundingClientRect();
    return{x:er.left-br.left+er.width/2,y:er.top-br.top+er.height/2};
  }

  function start(){
    if(phase==='running')return;
    clearT();stopAH(audioRef.current);
    var ah=createAudioCtx();audioRef.current=ah;playMazeMusic(ah);

    var shuffledIdx=shuffleApart(names.map(function(_,i){return i;}),pairGroup,APART_RULES,function(i){return names[i];});
    var groupsIdx=[];
    for(var i=0;i+1<shuffledIdx.length;i+=2)groupsIdx.push([shuffledIdx[i],shuffledIdx[i+1]]);
    if(shuffledIdx.length%2===1){
      if(groupsIdx.length===0)groupsIdx.push([shuffledIdx[0]]);
      else groupsIdx[groupsIdx.length-1].push(shuffledIdx[shuffledIdx.length-1]);
    }

    var cards=[];
    groupsIdx.forEach(function(g,gi){g.forEach(function(ni){cards.push({nameIdx:ni,pair:gi});});});
    cards=shuffle(cards);

    setDeck(cards);
    setFlipped(cards.map(function(){return false;}));
    setMatched(cards.map(function(){return false;}));
    setDuos([]);setShowConfetti(false);setPhase('running');
    setLens(null);setFocus(null);setCelebrate(null);
    setProgress([0,groupsIdx.length]);
    setStatusText('Karten werden gemischt…');
    setHintText('Die Lupe sucht das erste Kartenpaar.');

    var pairs=groupsIdx.length;
    var f=Math.max(0.42,Math.min(1,24000/(pairs*2960)));
    var stepIn=Math.round(380*f);
    var stepFlip=Math.round(350*f);
    var t=700;

    function lensTo(ci,mode){
      var c=cardCenter(ci);
      if(c)setLens({x:c.x,y:c.y});
      setFocus({idx:ci,mode:mode});
    }

    groupsIdx.forEach(function(g,gi){
      var positions=[];
      cards.forEach(function(c,ci){if(c.pair===gi)positions.push(ci);});
      var pool=[];
      cards.forEach(function(c,ci){if(c.pair!==gi)pool.push(ci);});
      var decoys=shuffle(pool).slice(0,positions.length+1);

      var tc=t;
      later(function(){
        setStatusText('\u{1F50D} Team '+(gi+1)+' von '+pairs+' — die Lupe sucht…');
        setHintText('Wer gehört zusammen?');
      },tc);

      positions.forEach(function(ci,k){
        var dk=decoys[k];
        if(dk!==undefined){
          later(function(){lensTo(dk,'peek');playTick();},tc);
        }
        tc+=stepIn;
        later(function(){lensTo(ci,'lift');playTick();},tc);
        tc+=stepIn;
        later(function(){
          setFlipped(function(p){var n2=p.slice();n2[ci]=true;return n2;});
          playFlip(k);
          setHintText(k===0?'Erste Karte: '+names[cards[ci].nameIdx]+' — wer passt dazu?'
                           :'Und dazu: '+names[cards[ci].nameIdx]+'!');
        },tc);
        tc+=Math.round(stepFlip*1.4);
      });

      later(function(){playDrum();setHintText('Passt das zusammen…?');},tc-Math.round(stepFlip*0.6));

      later(function(){
        setMatched(function(p){var n2=p.slice();positions.forEach(function(ci){n2[ci]=true;});return n2;});
        setDuos(function(p){return p.concat([g.map(function(ni){return names[ni];})]);});
        setProgress(function(p){return [p[0]+1,p[1]];});
        setFocus(null);
        var a=cardCenter(positions[0]);
        var b=cardCenter(positions[positions.length-1]);
        if(a&&b){
          var sparks=[];
          for(var s=0;s<14;s++){
            var sa=Math.random()*Math.PI*2;var sd=26+Math.random()*46;
            sparks.push({dx:Math.round(Math.cos(sa)*sd),dy:Math.round(Math.sin(sa)*sd),
              r:3+Math.random()*5});
          }
          setCelebrate({key:gi,x1:a.x,y1:a.y,x2:b.x,y2:b.y,
            cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,
            color:BALL_COLORS[gi%BALL_COLORS.length],sparks:sparks,
            txt:g.length>2?'\u{1F91D} TRIO!':'\u{1F91D} MATCH!'});
          later(function(){setCelebrate(null);},1300);
        }
        setStatusText((g.length>2?'\u{1F91D} Trio':'\u{1F91D} Team')+' '+(gi+1)+': '+g.map(function(ni){return names[ni];}).join(' + '));
        setHintText('Perfektes Paar!');
        playMatch();
      },tc+Math.round(200*f));

      tc+=Math.round(200*f)+Math.round(540*f);
      t=tc;
    });

    later(function(){
      setLens(null);setFocus(null);
      setPhase('done');setShowConfetti(true);
      setStatusText('\u{1F91D} '+groupsIdx.length+' Teams stehen!');
      setHintText('Alle Karten aufgedeckt.');
      onResult(groupsIdx.length+' Teams');
      stopAH(audioRef.current);audioRef.current=null;
    },t+500);
  }

  function reset(){
    clearT();stopAH(audioRef.current);audioRef.current=null;
    setPhase('idle');setDeck([]);setFlipped([]);setMatched([]);setDuos([]);
    setLens(null);setFocus(null);setCelebrate(null);setProgress([0,0]);
    setShowConfetti(false);setStatusText('');setHintText('');
  }

  // Auf schmalen Bildschirmen weniger Spalten, sonst brechen Namen mitten im Wort um
  var vw=window.innerWidth;
  var cols=Math.min(deck.length<=8?4:deck.length<=18?6:deck.length<=32?8:10,vw<480?5:vw<768?6:10);
  var cardH=deck.length>32?70:deck.length>18?86:104;
  var cardFS=cols>=10?11:cols>=8?12:cols>=6?13:15;
  var cardMax=cols>=10?11:cols>=8?12:14;
  var duoCols=Math.min(vw<480?2:4,Math.max(1,duos.length));

  if(phase==='idle'){
    return(
      html`<div className="flex flex-col items-center w-full max-w-lg text-center screen-enter">
        <div className="text-5xl mb-3">\u{1F50D}</div>
        <p className="text-gray-900 text-xl font-bold mb-2">Partner finden</p>
        <p className="text-gray-600 text-sm mb-5 max-w-sm leading-relaxed">
          Alle Namen liegen verdeckt auf dem Tisch. Die Lupe wandert über die Karten,
          zögert, dreht eine um — und sucht dann den passenden Partner dazu.
        </p>
        <div className="mem-board w-full px-4 py-5 mb-5 flex items-center justify-center gap-3">
          <div className="rounded-xl mem-face mem-back" style=${{position:'relative',width:56,height:76,fontSize:24}}>?</div>
          <div className="text-3xl">\u{1F50D}</div>
          <div className="rounded-xl mem-face mem-back" style=${{position:'relative',width:56,height:76,fontSize:24}}>?</div>
        </div>
        <p className="text-gray-500 text-xs mb-6">
          ${names.length} Personen → ${Math.floor(names.length/2)} Teams${names.length%2===1?' (eines davon ein Trio)':''}
        </p>
        <button onClick=${start} className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95" style=${{background:'linear-gradient(135deg,#7c3aed,#2563eb)',boxShadow:'0 8px 24px rgba(124,58,237,0.28)'}}>\u{1F0CF} Karten mischen</button>
      </div>`
    );
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-5xl screen-enter">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-3">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#7c3aed,#2563eb)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F50D} Partner finden</h2>
        <p role="status" aria-live="polite" className="text-gray-800 text-base font-semibold">${statusText}</p>
        <p className="bg-info text-gray-500 text-xs mt-0.5">${hintText}</p>
        ${phase==='running'&&progress[1]>0&&html`<div className="mt-2 w-full max-w-xs mx-auto">
          <div className="w-full h-1.5 rounded-full bg-gray-200 overflow-hidden">
            <div style=${{width:(progress[0]/progress[1]*100)+'%',height:'100%',
              background:'linear-gradient(90deg,#7c3aed,#2563eb)',transition:'width .5s ease'}}></div>
          </div>
          <p className="text-gray-400 mt-1" style=${{fontSize:10}}>${progress[0]} von ${progress[1]} Teams gefunden</p>
        </div>`}
      </div>

      <div ref=${boardRef} className="mem-board w-full px-4 py-5 mb-5" style=${{position:'relative'}}>
        <div className="w-full grid gap-2" style=${{gridTemplateColumns:'repeat('+cols+',minmax(0,1fr))'}}>
          ${deck.map(function(c,ci){
            var isFlipped=flipped[ci];var isMatched=matched[ci];
            var col=BALL_COLORS[c.pair%BALL_COLORS.length];
            var fx=focus&&focus.idx===ci?(' '+focus.mode):'';
            var idle=(!isFlipped&&!isMatched&&!fx)?' idle':'';
            return html`<div key=${ci} ref=${function(el){cardRefs.current[ci]=el;}}
              className=${"mem-card"+(isFlipped?" flipped":"")+(isMatched?" matched":"")+fx+idle}
              style=${{height:cardH,animationDelay:((ci%7)*0.22)+'s'}}>
              <div className="mem-inner">
                <div className="mem-face mem-back" style=${{fontSize:Math.round(cardH*0.30)}}>?</div>
                <div className="mem-face mem-front" style=${{background:'linear-gradient(150deg,'+col+','+col+'aa)',fontSize:cardFS}}>${truncName(names[c.nameIdx],cardMax)}</div>
              </div>
            </div>`;
          })}
        </div>

        ${celebrate&&html`<svg key=${'b'+celebrate.key} className="mem-beam" width="100%" height="100%">
          <path d=${'M '+celebrate.x1+' '+celebrate.y1+' Q '+celebrate.cx+' '+(celebrate.cy-40)+' '+celebrate.x2+' '+celebrate.y2}
            fill="none" stroke=${celebrate.color} strokeWidth="4" strokeLinecap="round" opacity="0.9"/>
        </svg>`}

        ${celebrate&&celebrate.sparks.map(function(s,si){
          return html`<div key=${'s'+celebrate.key+'_'+si} className="mem-spark" style=${{
            left:celebrate.cx,top:celebrate.cy,width:s.r,height:s.r,
            background:si%3===0?'#fde68a':celebrate.color,
            animationDelay:(si%4)*0.03+'s',
            ['--sx']:s.dx+'px',['--sy']:s.dy+'px'}}></div>`;
        })}

        ${celebrate&&html`<div key=${'g'+celebrate.key} className="mem-badge" style=${{left:celebrate.cx,top:celebrate.cy,fontSize:14}}>${celebrate.txt}</div>`}

        ${lens&&html`<div className="mem-lens" style=${{left:lens.x,top:lens.y}}>
          <div className="mem-lens-inner">
            <svg width="54" height="54" viewBox="0 0 54 54">
              <circle cx="22" cy="22" r="15" fill="rgba(186,230,253,0.22)" stroke="#e2e8f0" strokeWidth="3.5"/>
              <circle cx="22" cy="22" r="15" fill="none" stroke="rgba(255,255,255,0.65)" strokeWidth="1"/>
              <path d="M17 15 Q13 18 12.5 23" stroke="rgba(255,255,255,0.85)" strokeWidth="2.2" fill="none" strokeLinecap="round"/>
              <rect x="31" y="31" width="17" height="7" rx="3.5" fill="#a16207" transform="rotate(45 31 31)"/>
              <rect x="31" y="31" width="9" height="7" rx="3.5" fill="#ca8a04" transform="rotate(45 31 31)"/>
            </svg>
          </div>
        </div>`}
      </div>

      ${duos.length>0&&html`<div data-result className="w-full grid gap-3 mb-5" style=${{gridTemplateColumns:'repeat('+duoCols+',minmax(0,1fr))'}}>
        ${duos.map(function(d,di){
          var col=BALL_COLORS[di%BALL_COLORS.length];
          return html`<div key=${di} className="rounded-xl overflow-hidden border shadow-md fade-in" style=${{borderColor:col+'66'}}>
            <div className="bg-group-title px-3 py-1.5 text-white text-xs font-bold flex items-center justify-between" style=${{background:'linear-gradient(90deg,'+col+','+col+'bb)'}}>
              <span>${d.length>2?'Trio':'Team'} ${di+1}</span><span>\u{1F91D}</span>
            </div>
            <div className="bg-white p-2 space-y-1">
              ${d.map(function(nm,ni){return html`<div key=${ni} className="bg-member text-sm font-medium text-gray-800 px-2 py-1 rounded" style=${{background:col+'12',borderLeft:'3px solid '+col}}>${nm}</div>`;})}
            </div>
          </div>`;
        })}
      </div>`}

      <div data-result-actions className="flex gap-3 mt-1 flex-wrap justify-center">
        ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='done'&&html`<span className="flex gap-3">
          <${GroupCopyButton} modeName="Partner finden" groups=${duos} labels=${duos.map(function(_,i){return 'Team '+(i+1);})} onReport=${props.onGroups}/>
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-violet-50 text-violet-700 border border-violet-200 hover:bg-violet-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </span>`}
      </div>
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   ZOMBIE-AUSBRUCH — Ansteckung statt Elimination
   ═══════════════════════════════════════════════════════ */
function zLerpHex(a,b,t){
  var ar=parseInt(a.slice(1,3),16),ag=parseInt(a.slice(3,5),16),ab=parseInt(a.slice(5,7),16);
  var br=parseInt(b.slice(1,3),16),bg=parseInt(b.slice(3,5),16),bb=parseInt(b.slice(5,7),16);
  return 'rgb('+Math.round(ar+(br-ar)*t)+','+Math.round(ag+(bg-ag)*t)+','+Math.round(ab+(bb-ab)*t)+')';
}

function ZombieMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _st=useState('Alle sind noch gesund…');var statusText=_st[0];var setStatusText=_st[1];
  var _hn=useState(0);var healthyN=_hn[0];var setHealthyN=_hn[1];
  var _wn=useState(null);var winner=_wn[0];var setWinner=_wn[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _feed=useState([]);var feed=_feed[0];var setFeed=_feed[1];
  var _bites=useState([]);var bites=_bites[0];var setBites=_bites[1];
  var canvasRef=useRef(null);
  var gRef=useRef(null);
  var rafRef=useRef(null);
  var timers=useRef([]);
  var audioRef=useRef(null);
  var biteIdRef=useRef(0);

  var AW=700;var AH=440;
  var BR=names.length>30?17:names.length>18?20:names.length>12?23:27;
  var FS=names.length>30?10:names.length>18?11:names.length>12?12:13;
  var NMAX=names.length>30?7:names.length>18?8:names.length>12?9:11;
  var SKIN_OK='#f0c49b';var SKIN_Z='#93ad63';
  var SHIRT_Z='#3f4d20';

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  function doCleanup(){
    clearT();
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  useEffect(function(){return function(){doCleanup();};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  function playBiteSound(){
    try{
      var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      aT(c,m,150,now,0.09,0.5,'sawtooth');
      aT(c,m,80,now+0.03,0.14,0.35,'square');
      var buf=c.createBuffer(1,Math.floor(c.sampleRate*0.1),c.sampleRate);
      var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.35;
      var src=c.createBufferSource();src.buffer=buf;
      var g=c.createGain();g.gain.setValueAtTime(0.4,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.1);
      src.connect(g);g.connect(m);src.start(now);
    }catch(e){}
  }
  function playGroan(){
    try{
      var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      var o=c.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(92+Math.random()*26,now);
      o.frequency.exponentialRampToValueAtTime(52,now+0.55);
      var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
      var g=c.createGain();g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(0.22,now+0.10);
      g.gain.exponentialRampToValueAtTime(0.001,now+0.6);
      o.connect(f);f.connect(g);g.connect(m);o.start(now);o.stop(now+0.65);
    }catch(e){}
  }

  function spawnBite(x,y,txt){
    var id=biteIdRef.current++;
    setBites(function(p){return p.concat([{id:id,x:x/AW*100,y:y/AH*100,txt:txt}]).slice(-8);});
    later(function(){setBites(function(p){return p.filter(function(b){return b.id!==id;});});},1000);
  }

  function initBalls(){
    var balls=[];var margin=BR*2.2;
    for(var i=0;i<names.length;i++){
      var attempts=0,x,y;
      do{
        x=margin+Math.random()*(AW-margin*2);
        y=margin+Math.random()*(AH-margin*2);
        attempts++;
      }while(attempts<70&&balls.some(function(b){return Math.sqrt(Math.pow(b.x-x,2)+Math.pow(b.y-y,2))<BR*2.4;}));
      var a=Math.random()*Math.PI*2;var sp=1.1+Math.random()*1.1;
      balls.push({id:i,name:names[i],color:BALL_COLORS[i%BALL_COLORS.length],
        x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
        wob:Math.random()*Math.PI*2,wobSpd:0.03+Math.random()*0.05,
        walk:Math.random()*Math.PI*2,face:1,hair:Math.floor(Math.random()*3),
        infected:false,turnT:0,lungeT:0,shockT:0,dripT:Math.random()*60});
    }
    return balls;
  }

  function start(){
    if(phase==='running')return;
    doCleanup();
    var ah=createAudioCtx();audioRef.current=ah;playZombieMusic(ah);

    var n=names.length;
    var winnerIdx=Math.floor(secureRandom()*n);
    var others=[];for(var i=0;i<n;i++){if(i!==winnerIdx)others.push(i);}
    others=shuffle(others);
    var patientZero=others[0];

    var debris=[];
    for(var d=0;d<26;d++){
      debris.push({x:Math.random()*AW,y:Math.random()*AH,r:1+Math.random()*3.2,a:0.05+Math.random()*0.12,
        w:3+Math.random()*16,rot:Math.random()*Math.PI});
    }
    var fog=[];
    for(var f=0;f<7;f++){
      fog.push({x:Math.random()*AW,y:40+Math.random()*(AH-80),rx:110+Math.random()*150,ry:34+Math.random()*40,
        v:0.10+Math.random()*0.22,a:0.035+Math.random()*0.05});
    }
    var lamps=[{x:AW*0.17,y:AH*0.22},{x:AW*0.82,y:AH*0.30},{x:AW*0.48,y:AH*0.80}];

    var g={balls:initBalls(),particles:[],decals:[],debris:debris,fog:fog,lamps:lamps,
      winnerIdx:winnerIdx,done:false,t:0,shake:0};
    gRef.current=g;
    setFeed([]);setBites([]);setWinner(null);setShowConfetti(false);
    setHealthyN(n);setPhase('running');setStatusText('\u{1F9EA} Der Ausbruch beginnt…');

    function infect(idx,isZero){
      var gg=gRef.current;if(!gg)return;
      var b=gg.balls[idx];if(!b||b.infected)return;
      b.infected=true;b.turnT=0;b.shockT=1;
      var nearest=null;var nd=1e9;
      for(var k=0;k<gg.balls.length;k++){
        var z=gg.balls[k];if(!z.infected||z.id===idx)continue;
        var dd=Math.pow(z.x-b.x,2)+Math.pow(z.y-b.y,2);
        if(dd<nd){nd=dd;nearest=z;}
      }
      if(nearest)nearest.lungeT=1;
      for(var p=0;p<22;p++){
        var pa=Math.random()*Math.PI*2;var ps=1.4+Math.random()*3.4;
        gg.particles.push({x:b.x,y:b.y-BR*0.3,vx:Math.cos(pa)*ps,vy:Math.sin(pa)*ps-0.9,
          life:26+Math.random()*16,maxLife:42,
          color:p%4===0?'#dc2626':(p%3===0?'#bef264':'#84cc16'),r:1.5+Math.random()*2.3});
      }
      gg.decals.push({x:b.x,y:b.y+BR*0.75,r:BR*(0.5+Math.random()*0.4),a:0.30+Math.random()*0.18,
        rot:Math.random()*Math.PI,blobs:[[0,0,1],[0.7,0.3,0.5],[-0.6,0.4,0.42],[0.2,-0.7,0.36]]});
      if(gg.decals.length>60)gg.decals.shift();
      gg.shake=Math.min(1,gg.shake+0.55);
      spawnBite(b.x,b.y,isZero?'\u{1F9EA} PATIENT NULL':'\u{1F9DF} BISS!');
      playBiteSound();if(Math.random()<0.55)playGroan();
      var left=gg.balls.filter(function(x){return !x.infected;}).length;
      setHealthyN(left);
      setFeed(function(prev){
        return prev.concat([{txt:(isZero?'\u{1F9EA} '+b.name+' ist Patient Null':'\u{1F9DF} '+b.name+' wurde infiziert'),id:Date.now()+Math.random()}]).slice(-5);
      });
      if(left<=3&&left>1)setStatusText('⚠️ Nur noch '+left+' Gesunde!');
      else if(!isZero)setStatusText(b.name+' wurde erwischt!');
    }

    var startT=900;
    var endT=14500;
    var rest=others.slice(1);
    later(function(){infect(patientZero,true);},startT);
    rest.forEach(function(idx,i){
      var at=rest.length<=1?endT:(startT+1100+i*((endT-startT-1100)/(rest.length-1)));
      later(function(){infect(idx,false);},at);
    });

    later(function(){
      var gg=gRef.current;if(!gg)return;
      gg.done=true;
      var wName=names[winnerIdx];
      var wb=gg.balls[winnerIdx];
      if(wb){
        for(var p=0;p<46;p++){
          var pa=Math.random()*Math.PI*2;var ps=1.5+Math.random()*4;
          gg.particles.push({x:wb.x,y:wb.y,vx:Math.cos(pa)*ps,vy:Math.sin(pa)*ps-2,
            life:50+Math.random()*25,maxLife:75,color:['#fbbf24','#fde68a','#ffffff'][Math.floor(Math.random()*3)],r:2+Math.random()*2.5});
        }
      }
      setPhase('done');setWinner(wName);setShowConfetti(true);
      setStatusText('\u{1F3C6} '+wName+' hat überlebt!');
      onResult(wName);
      stopAH(audioRef.current);audioRef.current=null;
      later(function(){if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}},1600);
    },endT+900);

    var last=performance.now();
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-last)/16.67);last=now;
      update(gg,dt);draw(gg,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function update(g,dt){
    g.t+=dt;
    if(g.shake>0)g.shake=Math.max(0,g.shake-0.045*dt);
    var bs=g.balls;
    for(var i=0;i<bs.length;i++){
      var b=bs[i];
      if(b.infected&&b.turnT<1)b.turnT=Math.min(1,b.turnT+0.045*dt);
      if(b.lungeT>0)b.lungeT=Math.max(0,b.lungeT-0.05*dt);
      if(b.shockT>0)b.shockT=Math.max(0,b.shockT-0.035*dt);

      var target=null;var td=1e9;
      for(var k=0;k<bs.length;k++){
        var o=bs[k];if(o.id===b.id)continue;
        if(b.infected===o.infected)continue;
        var dd=Math.pow(o.x-b.x,2)+Math.pow(o.y-b.y,2);
        if(dd<td){td=dd;target=o;}
      }
      if(target){
        var dist=Math.sqrt(td)||1;
        var ux=(target.x-b.x)/dist;var uy=(target.y-b.y)/dist;
        var pull=b.infected?0.020:(dist<90?-0.048:0);
        b.vx+=ux*pull*dt;b.vy+=uy*pull*dt;
      }
      b.wob+=b.wobSpd*dt;
      b.vx+=Math.cos(b.wob)*0.032*dt;
      b.vy+=Math.sin(b.wob*1.3)*0.032*dt;
      b.vx+=(AW/2-b.x)*0.00040*dt;
      b.vy+=(AH/2-b.y)*0.00040*dt;
      var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      var maxSp=b.infected?1.55:1.95;
      if(sp>maxSp){b.vx=b.vx/sp*maxSp;b.vy=b.vy/sp*maxSp;}
      if(sp<0.35){var ra=Math.random()*Math.PI*2;b.vx+=Math.cos(ra)*0.25;b.vy+=Math.sin(ra)*0.25;}

      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.walk+=(0.10+sp*0.22)*dt*(b.infected?0.7:1);
      if(Math.abs(b.vx)>0.12)b.face=b.vx<0?-1:1;

      // Zombies tropfen
      if(b.infected&&b.turnT>0.5){
        b.dripT-=dt;
        if(b.dripT<=0){
          b.dripT=40+Math.random()*90;
          g.particles.push({x:b.x+(Math.random()-0.5)*BR*0.7,y:b.y+BR*0.2,vx:(Math.random()-0.5)*0.2,vy:0.5+Math.random()*0.5,
            life:30,maxLife:30,color:'#84cc16',r:1.2+Math.random()});
        }
      }

      if(b.x-BR<0){b.x=BR;b.vx=Math.abs(b.vx)*0.85;}
      if(b.x+BR>AW){b.x=AW-BR;b.vx=-Math.abs(b.vx)*0.85;}
      if(b.y-BR<0){b.y=BR;b.vy=Math.abs(b.vy)*0.85;}
      if(b.y+BR>AH){b.y=AH-BR;b.vy=-Math.abs(b.vy)*0.85;}
    }
    for(var a=0;a<bs.length;a++){
      for(var c=a+1;c<bs.length;c++){
        var b1=bs[a];var b2=bs[c];
        var dx=b2.x-b1.x;var dy=b2.y-b1.y;
        var d2=Math.sqrt(dx*dx+dy*dy)||0.01;
        var minD=(b1.infected&&b2.infected)?BR*2.75:BR*2.05;
        if(d2<minD){
          var push=(minD-d2)/2;
          var nx=dx/d2;var ny=dy/d2;
          b1.x-=nx*push;b1.y-=ny*push;b2.x+=nx*push;b2.y+=ny*push;
          b1.vx-=nx*0.12;b1.vy-=ny*0.12;b2.vx+=nx*0.12;b2.vy+=ny*0.12;
        }
      }
    }
    for(var fi=0;fi<g.fog.length;fi++){
      var fg=g.fog[fi];
      fg.x+=fg.v*dt;
      if(fg.x-fg.rx>AW)fg.x=-fg.rx;
    }
    for(var p=g.particles.length-1;p>=0;p--){
      var pt=g.particles[p];
      pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=0.05*dt;pt.life-=dt;
      if(pt.life<=0)g.particles.splice(p,1);
    }
  }

  /* ── Figuren-Rendering ─────────────────────────────── */
  function limb(ctx,x,y,ang,len,w,col){
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);
    ctx.fillStyle=col;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(-w/2,0,w,len,w/2);
    else ctx.rect(-w/2,0,w,len);
    ctx.fill();
    ctx.restore();
  }

  function drawFigure(ctx,b,now){
    var s=BR/22;
    var mix=b.infected?b.turnT:0;
    var dir=b.face;
    var step=Math.sin(b.walk);
    var step2=Math.sin(b.walk+Math.PI);
    var bob=Math.abs(Math.sin(b.walk))*1.5*s;
    var skin=zLerpHex(SKIN_OK,SKIN_Z,mix);
    var shirt=zLerpHex(b.color,SHIRT_Z,mix*0.85);
    var pants=zLerpHex('#334155','#232d12',mix);
    var lunge=b.lungeT;

    ctx.save();
    ctx.translate(b.x,b.y);

    // Schatten
    ctx.fillStyle='rgba(0,0,0,0.40)';
    ctx.beginPath();ctx.ellipse(0,20*s,12*s,4.2*s,0,0,Math.PI*2);ctx.fill();

    ctx.save();
    ctx.scale(dir,1);
    ctx.translate(0,-bob);
    if(mix>0)ctx.rotate(mix*0.10+lunge*0.16);
    if(lunge>0)ctx.scale(1+lunge*0.10,1+lunge*0.10);

    // Beine
    limb(ctx,-3.6*s,5*s,step*0.55,13*s,4.4*s,pants);
    limb(ctx,3.6*s,5*s,step2*0.55,13*s,4.4*s,pants);
    ctx.fillStyle='#111827';
    ctx.beginPath();ctx.ellipse(-3.6*s+Math.sin(step*0.55)*12*s,18*s,4*s,2.2*s,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(3.6*s+Math.sin(step2*0.55)*12*s,18*s,4*s,2.2*s,0,0,Math.PI*2);ctx.fill();

    // Hinterer Arm
    var armBack=mix>0.15?(-1.45+Math.sin(b.walk*0.8)*0.10):(2.5+step2*0.45);
    limb(ctx,-5.6*s,-7*s,armBack,12*s,4*s,shirt);

    // Körper
    ctx.fillStyle=shirt;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(-6.8*s,-9*s,13.6*s,15.5*s,4*s);
    else ctx.rect(-6.8*s,-9*s,13.6*s,15.5*s);
    ctx.fill();
    // Schattenkante
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(1.5*s,-9*s,5.3*s,15.5*s,3*s);
    else ctx.rect(1.5*s,-9*s,5.3*s,15.5*s);
    ctx.fill();
    if(mix>0.35){
      // Risse im Shirt
      ctx.strokeStyle='rgba(20,30,8,0.75)';ctx.lineWidth=1.3*s;
      ctx.beginPath();ctx.moveTo(-4*s,-2*s);ctx.lineTo(-1*s,2*s);ctx.lineTo(-3*s,5*s);ctx.stroke();
      ctx.beginPath();ctx.moveTo(3*s,-5*s);ctx.lineTo(5*s,-1*s);ctx.stroke();
    }

    // Vorderer Arm
    var armFront=mix>0.15?(-1.55+Math.sin(b.walk*0.8+1)*0.10):(2.5+step*0.45);
    limb(ctx,4.4*s,-7*s,armFront,12*s,4.2*s,shirt);
    // Hand
    var hx=4.4*s+Math.sin(armFront)*12*s;var hy=-7*s+Math.cos(armFront)*12*s;
    ctx.fillStyle=skin;ctx.beginPath();ctx.arc(hx,hy,2.6*s,0,Math.PI*2);ctx.fill();

    // Kopf
    var hy0=-15.5*s+(mix>0?1.4*s:0);
    ctx.fillStyle=skin;
    ctx.beginPath();ctx.arc(0,hy0,7.4*s,0,Math.PI*2);ctx.fill();
    if(mix>0.3){
      ctx.fillStyle='rgba(60,80,25,0.45)';
      ctx.beginPath();ctx.arc(-3*s,hy0+2*s,2.2*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(4*s,hy0-1*s,1.5*s,0,Math.PI*2);ctx.fill();
    }
    // Haare
    ctx.fillStyle=zLerpHex(['#3f2a18','#1f2937','#7c3f12'][b.hair],'#2a2f18',mix);
    ctx.beginPath();
    ctx.arc(0,hy0-1.2*s,7.4*s,Math.PI*1.02,Math.PI*2.02);
    ctx.closePath();ctx.fill();
    if(b.hair===2){ctx.beginPath();ctx.arc(-6.4*s,hy0-0.5*s,2.4*s,0,Math.PI*2);ctx.fill();}

    // Gesicht
    if(mix<0.45){
      ctx.fillStyle='#1f2937';
      ctx.beginPath();ctx.arc(-2.4*s,hy0,1.5*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(3.0*s,hy0,1.5*s,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#1f2937';ctx.lineWidth=1.3*s;ctx.lineCap='round';
      ctx.beginPath();ctx.arc(0.4*s,hy0+3*s,2.2*s,0.25,Math.PI-0.25);ctx.stroke();
    }else{
      var glow=0.55+0.45*Math.sin(now/180+b.id);
      ctx.fillStyle='rgba(248,113,113,'+(0.35+glow*0.35)+')';
      ctx.beginPath();ctx.arc(-2.4*s,hy0,3.4*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(3.0*s,hy0,3.4*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#dc2626';
      ctx.beginPath();ctx.arc(-2.4*s,hy0,1.7*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(3.0*s,hy0,1.7*s,0,Math.PI*2);ctx.fill();
      // offener Mund
      ctx.fillStyle='#2a0d0d';
      ctx.beginPath();ctx.ellipse(0.6*s,hy0+3.6*s,2.6*s,2.0*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#f8fafc';
      ctx.fillRect(-0.9*s,hy0+2.2*s,1.1*s,1.3*s);
      ctx.fillRect(1.3*s,hy0+2.2*s,1.1*s,1.3*s);
    }
    ctx.restore();
    ctx.restore();
  }

  function draw(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    var sh=g.shake;
    var ox=sh>0?(Math.random()-0.5)*sh*5:0;
    var oy=sh>0?(Math.random()-0.5)*sh*5:0;
    ctx.setTransform(2,0,0,2,ox*2,oy*2);

    // Boden
    var bg=ctx.createLinearGradient(0,0,0,AH);
    bg.addColorStop(0,'#141a12');bg.addColorStop(0.5,'#0e1410');bg.addColorStop(1,'#080c08');
    ctx.fillStyle=bg;ctx.fillRect(-6,-6,AW+12,AH+12);

    // Asphaltfugen
    ctx.strokeStyle='rgba(255,255,255,0.028)';ctx.lineWidth=1;
    for(var gx=0;gx<=AW;gx+=88){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,AH);ctx.stroke();}
    for(var gy=0;gy<=AH;gy+=88){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(AW,gy);ctx.stroke();}

    // Laternenlicht
    for(var li=0;li<g.lamps.length;li++){
      var lp=g.lamps[li];
      var fl=0.82+0.18*Math.sin(now/(230+li*90))+((Math.random()<0.02)?-0.3:0);
      var lg=ctx.createRadialGradient(lp.x,lp.y,4,lp.x,lp.y,160);
      lg.addColorStop(0,'rgba(190,220,140,'+(0.16*fl)+')');
      lg.addColorStop(0.45,'rgba(140,180,90,'+(0.07*fl)+')');
      lg.addColorStop(1,'rgba(140,180,90,0)');
      ctx.fillStyle=lg;ctx.beginPath();ctx.arc(lp.x,lp.y,160,0,Math.PI*2);ctx.fill();
    }

    // Schutt
    for(var di=0;di<g.debris.length;di++){
      var db=g.debris[di];
      ctx.save();ctx.translate(db.x,db.y);ctx.rotate(db.rot);
      ctx.fillStyle='rgba(190,210,170,'+db.a+')';
      ctx.fillRect(-db.w/2,-db.r/2,db.w,db.r);
      ctx.restore();
    }

    // Blut-/Schleimflecken
    for(var dc=0;dc<g.decals.length;dc++){
      var de=g.decals[dc];
      ctx.save();ctx.translate(de.x,de.y);ctx.rotate(de.rot);ctx.scale(1,0.45);
      ctx.fillStyle='rgba(101,163,13,'+de.a+')';
      for(var bl=0;bl<de.blobs.length;bl++){
        var bb=de.blobs[bl];
        ctx.beginPath();ctx.arc(bb[0]*de.r,bb[1]*de.r,de.r*bb[2],0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }

    // Schockwellen
    for(var si=0;si<g.balls.length;si++){
      var sb=g.balls[si];
      if(sb.shockT>0){
        var pr=(1-sb.shockT)*BR*3.4;
        ctx.strokeStyle='rgba(163,230,53,'+(sb.shockT*0.55)+')';ctx.lineWidth=2.4;
        ctx.beginPath();ctx.arc(sb.x,sb.y,pr,0,Math.PI*2);ctx.stroke();
      }
    }

    // Zombie-Dunst
    for(var i=0;i<g.balls.length;i++){
      var b=g.balls[i];if(!b.infected)continue;
      var hg=ctx.createRadialGradient(b.x,b.y,BR*0.3,b.x,b.y,BR*2.1);
      hg.addColorStop(0,'rgba(132,204,22,'+(0.10+b.turnT*0.10)+')');
      hg.addColorStop(1,'rgba(132,204,22,0)');
      ctx.fillStyle=hg;ctx.beginPath();ctx.arc(b.x,b.y,BR*2.1,0,Math.PI*2);ctx.fill();
    }

    // Gewinner-Scheinwerfer
    if(g.done){
      var wb=g.balls[g.winnerIdx];
      if(wb){
        var wg=ctx.createRadialGradient(wb.x,wb.y-BR,BR*0.2,wb.x,wb.y,BR*4.2);
        wg.addColorStop(0,'rgba(253,224,71,0.30)');
        wg.addColorStop(0.5,'rgba(251,191,36,0.10)');
        wg.addColorStop(1,'rgba(251,191,36,0)');
        ctx.fillStyle=wg;ctx.beginPath();ctx.arc(wb.x,wb.y,BR*4.2,0,Math.PI*2);ctx.fill();
      }
    }

    // Figuren — nach y sortiert für saubere Überlappung
    var order=g.balls.slice().sort(function(a,b2){return a.y-b2.y;});
    for(var oi=0;oi<order.length;oi++){
      var ob=order[oi];
      var isWin=g.done&&ob.id===g.winnerIdx;
      if(isWin){
        var wp=0.6+0.4*Math.sin(now/220);
        ctx.strokeStyle='rgba(251,191,36,'+(0.45+wp*0.5)+')';ctx.lineWidth=2.6;
        ctx.beginPath();ctx.ellipse(ob.x,ob.y+BR*0.85,BR*0.95,BR*0.34,0,0,Math.PI*2);ctx.stroke();
      }
      drawFigure(ctx,ob,now);
      // Name
      var nm=truncName(ob.name,NMAX);
      fitFont(ctx,nm,BR*2.4,FS,8);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.95)';ctx.lineWidth=3.5;ctx.lineJoin='round';
      ctx.strokeText(nm,ob.x,ob.y+BR*1.30);
      ctx.fillStyle=ob.infected?'#bef264':'#ffffff';
      ctx.fillText(nm,ob.x,ob.y+BR*1.30);
    }

    // Partikel
    for(var pi=0;pi<g.particles.length;pi++){
      var p=g.particles[pi];
      var pa2=Math.max(0,p.life/p.maxLife);
      ctx.globalAlpha=pa2;ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.4,p.r*pa2),0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;

    // Nebelschwaden
    for(var fi=0;fi<g.fog.length;fi++){
      var fg=g.fog[fi];
      var fgr=ctx.createRadialGradient(fg.x,fg.y,4,fg.x,fg.y,fg.rx);
      fgr.addColorStop(0,'rgba(154,205,120,'+fg.a+')');
      fgr.addColorStop(1,'rgba(154,205,120,0)');
      ctx.fillStyle=fgr;
      ctx.save();ctx.translate(fg.x,fg.y);ctx.scale(1,fg.ry/fg.rx);
      ctx.beginPath();ctx.arc(0,0,fg.rx,0,Math.PI*2);ctx.fill();ctx.restore();
    }

    // Vignette
    if(!g.vg){
      var vg=ctx.createRadialGradient(AW/2,AH/2,AH*0.25,AW/2,AH/2,AH*0.86);
      vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.72)');
      g.vg=vg;
    }
    ctx.fillStyle=g.vg;ctx.fillRect(-6,-6,AW+12,AH+12);

    // Alarmrand wenn es eng wird
    var healthy=0;
    for(var hi=0;hi<g.balls.length;hi++)if(!g.balls[hi].infected)healthy++;
    if(!g.done&&healthy<=3&&healthy>0){
      var al=0.20+0.20*Math.sin(now/160);
      ctx.strokeStyle='rgba(220,38,38,'+al+')';ctx.lineWidth=6;
      ctx.strokeRect(3,3,AW-6,AH-6);
    }

    // HUD
    var infected=g.balls.length-healthy;
    var barW=190;
    ctx.fillStyle='rgba(0,0,0,0.62)';
    if(ctx.roundRect){ctx.beginPath();ctx.roundRect(AW-barW-14,10,barW,34,8);ctx.fill();}
    else ctx.fillRect(AW-barW-14,10,barW,34);
    var innerW=barW-20;
    ctx.fillStyle='rgba(255,255,255,0.10)';ctx.fillRect(AW-barW-4,32,innerW,6);
    ctx.fillStyle='#84cc16';ctx.fillRect(AW-barW-4,32,innerW*(infected/g.balls.length),6);
    ctx.font='bold 12px Inter,sans-serif';ctx.textBaseline='middle';
    ctx.textAlign='left';ctx.fillStyle='#4ade80';ctx.fillText('\u{1F49A} '+healthy+' gesund',AW-barW-4,21);
    ctx.textAlign='right';ctx.fillStyle='#a3e635';ctx.fillText('\u{1F9DF} '+infected,AW-18,21);
  }

  function reset(){
    doCleanup();gRef.current=null;
    setPhase('idle');setWinner(null);setShowConfetti(false);setFeed([]);setBites([]);
    setHealthyN(0);setStatusText('Alle sind noch gesund…');
    if(canvasRef.current){var c=canvasRef.current.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,AW*2,AH*2);}
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-5xl screen-enter">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-3">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#65a30d,#16a34a,#166534)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F9DF} Zombie-Ausbruch</h2>
        <p role="status" aria-live="polite" className="text-gray-800 text-base font-semibold">${statusText}</p>
        ${phase==='running'&&html`<p className="bg-info text-gray-500 text-xs mt-0.5">${healthyN} von ${names.length} noch gesund</p>`}
      </div>

      <div className="relative w-full mb-4 rounded-2xl overflow-hidden border border-lime-900/50 shadow-2xl z-frame">
        <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{display:'block',width:'100%',height:'auto'}} role="img" aria-label="Zombie-Ausbruch Spielfeld"/>
        <div className="z-scan absolute inset-0 pointer-events-none"></div>
        ${phase==='idle'&&html`<div className="absolute inset-0 flex items-center justify-center bg-gray-950/88">
          <div className="text-center">
            <div className="text-5xl mb-3">\u{1F9DF}</div>
            <p className="text-lime-300/80 text-sm font-bold tracking-widest uppercase mb-1">Quarantänezone</p>
            <p className="text-white/45 text-sm">Wer bleibt gesund?</p>
          </div>
        </div>`}
        ${feed.length>0&&phase==='running'&&html`<div className="absolute top-2 left-2 z-20 pointer-events-none" style=${{maxWidth:'55%'}}>
          ${feed.map(function(f){return html`<div key=${f.id} className="font-bold mb-1 px-2.5 py-1 rounded bg-black/75 text-lime-200 fade-in border-l-2 border-lime-500/70" style=${{fontSize:13}}>${f.txt}</div>`;})}
        </div>`}
        ${bites.map(function(b){return html`<div key=${b.id} className="z-bite" style=${{left:b.x+'%',top:b.y+'%',transform:'translate(-50%,-50%)'}}>${b.txt}</div>`;})}
      </div>

      ${winner&&html`<div className="winner-enter mb-5">
        <div className="winner-card rounded-2xl px-10 py-6 text-white text-center shadow-2xl border-2 border-lime-400/40" style=${{background:'linear-gradient(135deg,#166534,#052e16)'}}>
          <div className="text-lime-200 text-sm font-semibold tracking-widest uppercase mb-1 z-safe-badge inline-block px-3 py-0.5 rounded-full">\u{1F49A} Immun</div>
          <div className="text-4xl font-black tracking-tight">${winner}</div>
          <div className="mt-2 text-2xl">\u{1F3C6}\u{1F49A}\u{1F3C6}</div>
          <${CopyButton} modeName="Zombie-Ausbruch" winner=${winner}/>
        </div>
      </div>`}

      <div data-result-actions className="flex gap-3 mt-1 flex-wrap justify-center">
        ${phase==='idle'&&html`<button onClick=${start} className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95" style=${{background:'linear-gradient(135deg,#65a30d,#166534)',boxShadow:'0 8px 24px rgba(101,163,13,0.30)'}}>\u{1F9DF} Ausbruch starten</button>`}
        ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='done'&&html`<span className="flex gap-3">
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-lime-50 text-lime-800 border border-lime-300 hover:bg-lime-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </span>`}
      </div>
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   HELPER: Rundenplan — verteilt n-1 Ausscheider auf wenige
   Runden, die letzten beiden entfernen je genau einen.
   ═══════════════════════════════════════════════════════ */
function planRounds(n,maxRounds){
  var rounds=[];var rem=n-1;
  if(rem<=0)return rounds;
  var tail=Math.min(2,rem);
  var body=rem-tail;
  var bodyRounds=body>0?Math.min((maxRounds||8)-tail,body):0;
  for(var i=0;i<bodyRounds;i++){
    var left=bodyRounds-i;
    var k=Math.max(1,Math.round(body/left));
    k=Math.min(k,body-(left-1));
    rounds.push(k);body-=k;
  }
  if(body>0)rounds.push(body);
  for(var j=0;j<tail;j++)rounds.push(1);
  return rounds;
}

function scheduleWaltz(ah,startSec,durSec){
  if(!ah)return;
  var c=ah.ctx;var m=ah.master;var t0=c.currentTime+startSec;
  var beat=0.23;var steps=Math.max(1,Math.floor(durSec/beat));
  var mel=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46];
  for(var i=0;i<steps;i++){
    var t=t0+i*beat;
    if(i%3===0)aT(c,m,130.81,t,0.13,0.34,'triangle');
    else aC(c,m,t,[261.63,329.63,392],0.09,0.13,'triangle');
    aT(c,m,mel[i%mel.length],t,0.11,0.15,'square');
  }
}

/* ═══════════════════════════════════════════════════════
   REISE NACH JERUSALEM — pro Runde fehlen Stühle
   ═══════════════════════════════════════════════════════ */
function ReiseJerusalemMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _st=useState('Bereit — die Musik spielt gleich!');var statusText=_st[0];var setStatusText=_st[1];
  var _rl=useState('');var roundLabel=_rl[0];var setRoundLabel=_rl[1];
  var _wn=useState(null);var winner=_wn[0];var setWinner=_wn[1];
  var _el=useState([]);var eliminated=_el[0];var setEliminated=_el[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _flash=useState(0);var stopFlash=_flash[0];var setStopFlash=_flash[1];
  var canvasRef=useRef(null);var gRef=useRef(null);var rafRef=useRef(null);
  var timers=useRef([]);var audioRef=useRef(null);

  var AW=760;var AH=560;
  var CX=AW/2;var CY=AH/2;
  var RC=150;var RP=182;

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  function doCleanup(){
    clearT();
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  useEffect(function(){return function(){doCleanup();};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  function playStopChord(){
    try{
      var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      aC(c,m,now,[196,246.94,293.66],0.22,0.55,'sawtooth');
      aT(c,m,65,now,0.2,0.45);
    }catch(e){}
  }

  function start(){
    if(phase==='running')return;
    doCleanup();
    var ah=createAudioCtx();audioRef.current=ah;
    var n=names.length;
    var winnerIdx=Math.floor(secureRandom()*n);

    var players=names.map(function(nm,i){
      return {id:i,name:nm,color:BALL_COLORS[i%BALL_COLORS.length],
        alive:true,angle:(i/n)*Math.PI*2,seatAngle:null,
        r:RP,targetR:RP,elimT:0};
    });
    var g={players:players,chairs:[],spin:0,spinning:false,winnerIdx:winnerIdx,done:false,flash:0};
    gRef.current=g;

    setEliminated([]);setWinner(null);setShowConfetti(false);setPhase('running');
    setStatusText('\u{1F3B5} Die Musik spielt…');setRoundLabel('');

    var plan=planRounds(n,8);
    var alive=names.map(function(_,i){return i;});
    var t=500;

    plan.forEach(function(k,ri){
      var isLast=ri>=plan.length-2;
      var circleMs=isLast?1300:850;
      var seatMs=520;
      var revealMs=isLast?800:520;
      var chairsN=alive.length-k;

      (function(kk,chairs,roundIdx,aliveSnapshot,tCircle){
        later(function(){
          var gg=gRef.current;if(!gg||gg.done)return;
          gg.chairs=[];
          for(var c=0;c<chairs;c++)gg.chairs.push({angle:(c/Math.max(1,chairs))*Math.PI*2-Math.PI/2});
          gg.spinning=true;
          gg.players.forEach(function(p){if(p.alive)p.seatAngle=null;});
          setRoundLabel('Runde '+(roundIdx+1)+' · '+chairs+' Stuhl'+(chairs===1?'':'e')+' für '+aliveSnapshot.length);
          setStatusText('\u{1F3B5} Die Musik spielt…');
        },tCircle);
        scheduleWaltz(audioRef.current,tCircle/1000,circleMs/1000);
      })(k,chairsN,ri,alive.slice(),t);

      // Musik stoppt — freie Stühle werden besetzt
      var victims=shuffle(alive.filter(function(idx){return idx!==winnerIdx;})).slice(0,k);
      var seated=alive.filter(function(idx){return victims.indexOf(idx)<0;});

      (function(seatedList,victimList,tStop){
        later(function(){
          var gg=gRef.current;if(!gg||gg.done)return;
          gg.spinning=false;gg.flash=1;
          setStopFlash(function(v){return v+1;});
          playStopChord();
          setStatusText('\u{1F507} Musik aus — schnell hinsetzen!');
          // Jeder Sitzende bekommt den nächstgelegenen freien Stuhl
          var free=gg.chairs.map(function(c,ci){return ci;});
          seatedList.forEach(function(idx){
            var p=gg.players[idx];if(!p)return;
            var best=0;var bestD=1e9;
            for(var fi=0;fi<free.length;fi++){
              var ca=gg.chairs[free[fi]].angle;
              var d=Math.abs(Math.atan2(Math.sin(ca-p.angle),Math.cos(ca-p.angle)));
              if(d<bestD){bestD=d;best=fi;}
            }
            p.seatAngle=gg.chairs[free[best]].angle;
            p.targetR=RC;
            free.splice(best,1);
          });
        },tStop);
      })(seated,victims,t+circleMs);

      (function(victimList,tOut){
        later(function(){
          var gg=gRef.current;if(!gg||gg.done)return;
          var outNames=[];
          victimList.forEach(function(idx){
            var p=gg.players[idx];if(!p)return;
            p.alive=false;p.elimT=0;
            outNames.push({name:p.name,color:p.color});
          });
          setEliminated(function(prev){return prev.concat(outNames);});
          setStatusText(victimList.length===1
            ? gg.players[victimList[0]].name+' hat keinen Stuhl mehr!'
            : victimList.length+' ohne Stuhl — raus!');
        },tOut);
      })(victims,t+circleMs+seatMs);

      alive=seated;
      t+=circleMs+seatMs+revealMs;
    });

    later(function(){
      var gg=gRef.current;if(!gg)return;
      gg.done=true;
      var wName=names[winnerIdx];
      setPhase('done');setWinner(wName);setShowConfetti(true);
      setStatusText('\u{1F3C6} '+wName+' sitzt als Einzige·r!');
      setRoundLabel('');
      onResult(wName);
      stopAH(audioRef.current);audioRef.current=null;
      later(function(){if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}},1600);
    },t+300);

    var last=performance.now();
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-last)/16.67);last=now;
      update(gg,dt);draw(gg);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function update(g,dt){
    if(g.spinning)g.spin+=0.022*dt;
    if(g.flash>0)g.flash=Math.max(0,g.flash-0.035*dt);
    for(var i=0;i<g.players.length;i++){
      var p=g.players[i];
      if(!p.alive){p.elimT+=dt*0.035;continue;}
      if(p.seatAngle!==null){
        var d=Math.atan2(Math.sin(p.seatAngle-p.angle),Math.cos(p.seatAngle-p.angle));
        p.angle+=d*0.22*dt;
        p.r+=(RC-p.r)*0.18*dt;
      }else{
        p.angle+=0.022*dt;
        p.r+=(RP-p.r)*0.12*dt;
      }
    }
  }

  function draw(g){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);

    var bg=ctx.createRadialGradient(CX,CY,40,CX,CY,AW*0.6);
    bg.addColorStop(0,'#1b1436');bg.addColorStop(1,'#0a0718');
    ctx.fillStyle=bg;ctx.fillRect(0,0,AW,AH);

    // Tanzfläche
    ctx.beginPath();ctx.arc(CX,CY,RC-26,0,Math.PI*2);
    ctx.fillStyle='rgba(139,92,246,0.07)';ctx.fill();
    ctx.strokeStyle='rgba(139,92,246,0.22)';ctx.lineWidth=1.5;ctx.stroke();

    // Stop-Blitz
    if(g.flash>0){
      ctx.fillStyle='rgba(251,191,36,'+(g.flash*0.16)+')';
      ctx.fillRect(0,0,AW,AH);
    }

    var aliveN=g.players.filter(function(p){return p.alive;}).length;
    var BR=Math.max(9,Math.min(24,Math.round((2*Math.PI*RP)/(Math.max(1,aliveN)*2.4))));
    var labelFS=Math.max(10,Math.min(15,Math.round(BR*0.85)));

    // Stühle
    for(var c=0;c<g.chairs.length;c++){
      var ca=g.chairs[c].angle;
      var cx=CX+Math.cos(ca)*RC;var cy=CY+Math.sin(ca)*RC;
      ctx.save();ctx.translate(cx,cy);ctx.rotate(ca+Math.PI/2);
      ctx.fillStyle='#92400e';
      ctx.fillRect(-11,-9,22,18);
      ctx.fillStyle='#b45309';
      ctx.fillRect(-11,-9,22,5);
      ctx.strokeStyle='rgba(0,0,0,0.45)';ctx.lineWidth=1;
      ctx.strokeRect(-11,-9,22,18);
      ctx.restore();
    }

    // Spieler + radiale Namen
    for(var i=0;i<g.players.length;i++){
      var p=g.players[i];
      if(!p.alive&&p.elimT>1.4)continue;
      var a=p.angle;
      var px=CX+Math.cos(a)*p.r;var py=CY+Math.sin(a)*p.r;
      var alpha=p.alive?1:Math.max(0,1-p.elimT*0.75);
      var isWin=g.done&&p.id===g.winnerIdx;

      ctx.save();ctx.globalAlpha=alpha;

      if(isWin){
        var wp=0.6+0.4*Math.sin(Date.now()/230);
        ctx.beginPath();ctx.arc(px,py,BR+8+wp*4,0,Math.PI*2);
        ctx.strokeStyle='rgba(251,191,36,'+(0.5+wp*0.5)+')';ctx.lineWidth=3;ctx.stroke();
      }

      var col=p.alive?p.color:'#6b7280';
      ctx.beginPath();ctx.arc(px,py,BR,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
      ctx.beginPath();ctx.arc(px-BR*0.28,py-BR*0.28,BR*0.28,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.32)';ctx.fill();
      if(!p.alive){
        ctx.strokeStyle='rgba(239,68,68,0.75)';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(px-BR*0.5,py-BR*0.5);ctx.lineTo(px+BR*0.5,py+BR*0.5);ctx.stroke();
        ctx.beginPath();ctx.moveTo(px+BR*0.5,py-BR*0.5);ctx.lineTo(px-BR*0.5,py+BR*0.5);ctx.stroke();
      }

      // Name radial nach außen — nie kopfüber
      var nm=truncName(p.name,11);
      ctx.translate(px,py);
      var abs=((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      var flip=(abs>Math.PI/2&&abs<Math.PI*1.5);
      ctx.rotate(a+(flip?Math.PI:0));
      ctx.font='bold '+labelFS+'px Inter,sans-serif';
      ctx.textAlign=flip?'right':'left';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=3.5;ctx.lineJoin='round';
      var tx=flip?-(BR+7):(BR+7);
      ctx.strokeText(nm,tx,0);
      ctx.fillStyle=p.alive?'#fff':'rgba(255,255,255,0.55)';
      ctx.fillText(nm,tx,0);
      ctx.restore();
    }

    // HUD
    ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(10,10,132,26);
    ctx.font='bold 13px Inter,sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle='#fbbf24';
    ctx.fillText('\u{1FA91} '+g.chairs.length+(g.chairs.length===1?' Stuhl':' Stühle')+' · \u{1F464} '+aliveN,18,23);
  }

  function reset(){
    doCleanup();gRef.current=null;
    setPhase('idle');setWinner(null);setEliminated([]);setShowConfetti(false);
    setRoundLabel('');setStatusText('Bereit — die Musik spielt gleich!');
    if(canvasRef.current){var c=canvasRef.current.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,AW*2,AH*2);}

  return(
    html`<div className="flex flex-col items-center w-full max-w-5xl screen-enter">

        <p role="status" aria-live="polite" className="text-gray-800 text-base font-semibold">${statusText}</p>
        ${roundLabel&&html`<div className="inline-block mt-1 px-4 py-1 rounded-full bg-violet-500/10 border border-violet-500/25 text-violet-700 text-sm font-bold">${roundLabel}</div>`}
      </div>

      <div className="relative w-full mb-4 rounded-2xl overflow-hidden border border-violet-900/40 shadow-xl">
        <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{display:'block',width:'100%',height:'auto'}} role="img" aria-label="Stuhlkreis"/>
        ${phase==='idle'&&html`<div className="absolute inset-0 flex items-center justify-center bg-gray-950/85">
          <div className="text-center"><div className="text-5xl mb-3">\u{1FA91}</div><p className="text-white/50 text-sm">Wer ergattert den letzten Stuhl?</p></div>
        </div>`}
      </div>

      ${eliminated.length>0&&html`<div className="w-full max-w-3xl mb-4">
        <p className="text-gray-500 text-center mb-1.5" style=${{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em'}}>Ohne Stuhl</p>
        <div className="flex flex-wrap gap-1.5 justify-center bg-gray-50 rounded-xl p-2.5 border border-gray-200">
          ${eliminated.map(function(e,i){return html`<div key=${i} className="tray-ball tray-pop" style=${{background:'radial-gradient(circle at 35% 30%,'+e.color+'dd,'+e.color+'aa)',animationDelay:(i*0.03)+'s'}}>${truncName(e.name,8)}</div>`;})}
        </div>
      </div>`}

      ${winner&&html`<div className="winner-enter mb-5">
        <div className=${"winner-card bg-gradient-to-br "+CARD_COLORS[nameToColorIdx(winner)]+" rounded-2xl px-10 py-6 text-white text-center shadow-2xl border-2 border-amber-400/40"}>
          <div className="text-amber-200 text-sm font-semibold tracking-widest uppercase mb-1">\u{1FA91} Letzter Stuhl</div>

      <div data-result-actions className="flex gap-3 mt-1 flex-wrap justify-center">
