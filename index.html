          })}
        </div>
      </div>`
    );
  }

  if(!groups){
    return(
      html`<div className="flex flex-col items-center w-full max-w-lg">
        <div className="text-center mb-8">
          <div className="group-mode-toggle mb-6 inline-flex">
            <button onClick=${function(){setGroupMode('count')}} className=${"group-mode-btn "+(groupMode==='count'?"active":"inactive")}>Anzahl Gruppen</button>
            <button onClick=${function(){setGroupMode('size')}} className=${"group-mode-btn "+(groupMode==='size'?"active":"inactive")}>\u00E0 N Personen</button>
          </div>
          ${groupMode==='count'?(html`
          <p className="text-gray-700 text-sm mb-4">Wie viele Gruppen?</p>
          <div className="flex items-center gap-5 justify-center">
            <button onClick=${function(){setGroupCount(function(g){return Math.max(2,g-1)})}} disabled=${groupCount<=2}
              className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">\u2212</button>
            <span className="text-6xl font-black gradient-text w-20 text-center">${groupCount}</span>
            <button onClick=${function(){setGroupCount(function(g){return Math.min(maxGroups,g+1)})}} disabled=${groupCount>=maxGroups}
              className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
          </div>
          <p className="text-gray-600 text-xs mt-3">ca. ${Math.ceil(names.length/groupCount)} Personen pro Gruppe</p>
          `):(html`
          <p className="text-gray-700 text-sm mb-4">Wie viele Personen pro Gruppe?</p>
          <div className="flex items-center gap-5 justify-center">
            <button onClick=${function(){setGroupSize(function(s){return Math.max(2,s-1)})}} disabled=${groupSize<=2}
              className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">\u2212</button>
            <span className="text-6xl font-black gradient-text w-20 text-center">${groupSize}</span>
            <button onClick=${function(){setGroupSize(function(s){return Math.min(maxSize,s+1)})}} disabled=${groupSize>=maxSize}
              className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
          </div>
          <p className="text-gray-600 text-xs mt-3">\u2192 ${actualCount} Gruppen (${names.length} Personen)</p>
          `)}
        </div>
        <button onClick=${buildGroups} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-400 hover:to-cyan-500 text-white shadow-lg shadow-teal-500/20 transition-all">Gruppen erstellen</button>
      </div>`
    );
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-3xl fade-in-up">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="w-full grid gap-4 mb-6" style=${{gridTemplateColumns:'repeat('+numCols+',1fr)'}}>
        ${groups.map(function(group,gi){
          return(
            html`<div key=${gi} className="rounded-2xl overflow-hidden border border-gray-200 shadow-md fade-in" style=${{animationDelay:(gi*0.08)+'s'}}>
              <div className=${"bg-gradient-to-br "+GROUP_COLORS[gi%GROUP_COLORS.length].bg+" px-4 py-2.5"}>
                <span className="text-white font-bold">Gruppe ${gi+1}</span>
                <span className="text-white/60 text-xs ml-2">${group.length} Personen</span>
              </div>
              <div className="bg-white p-3 space-y-1">

                  return html`<div key=${ni} className="text-gray-700 text-sm font-medium px-2 py-1.5 rounded-lg bg-gray-50 border border-gray-100">${name}</div>`;
                })}
              </div>
            </div>`
          );
        })}
      </div>
      <div className="flex gap-3">
        <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-teal-50 text-teal-700 border border-teal-200 hover:bg-teal-100 transition-all">Nochmal</button>
        <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button>
      </div>
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   SUPER MARIO GRUPPEN — Jump'n'Run-Level mit Pipes
   ═══════════════════════════════════════════════════════ */
function GroupAnimMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var maxGroups=Math.min(10,names.length);
  var maxSize=Math.min(20,names.length-1);
  var _gm=useState('count');var groupMode=_gm[0];var setGroupMode=_gm[1];
  var _gc=useState(Math.min(2,maxGroups));var groupCount=_gc[0];var setGroupCount=_gc[1];
  var _gs=useState(Math.max(2,Math.ceil(names.length/3)));var groupSize=_gs[0];var setGroupSize=_gs[1];
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _groups=useState([]);var groups=_groups[0];var setGroups=_groups[1];
  var _hud=useState({coins:0,done:0,total:0});var hud=_hud[0];var setHud=_hud[1];
  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var canvasRef=useRef(null);var gRef=useRef(null);var rafRef=useRef(null);
  var timers=useRef([]);var audioRef=useRef(null);

  var AW=900;var AH=380;
  var GROUND=AH-54;
  var GRAV=0.42;

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  function doCleanup(){
    clearT();
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  useEffect(function(){return function(){doCleanup();};},[]);

  var actualCount=groupMode==='size'?Math.max(1,Math.ceil(names.length/groupSize)):groupCount;

  /* ── Sounds ── */
  function sJump(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var now=c.currentTime;
    var o=c.createOscillator();o.type='square';
    o.frequency.setValueAtTime(320,now);o.frequency.exponentialRampToValueAtTime(760,now+0.11);
    var g=c.createGain();g.gain.setValueAtTime(0.13,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.15);
    o.connect(g);g.connect(ah.master);o.start(now);o.stop(now+0.16);}catch(e){}}
  function sCoin(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var now=c.currentTime;
    aT(c,ah.master,987.77,now,0.07,0.14,'square');
    aT(c,ah.master,1318.5,now+0.07,0.16,0.13,'square');}catch(e){}}
  function sStomp(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var now=c.currentTime;
    aT(c,ah.master,180,now,0.09,0.26,'square');
    aT(c,ah.master,90,now+0.04,0.12,0.20,'triangle');}catch(e){}}
  function sPipe(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var now=c.currentTime;
    var o=c.createOscillator();o.type='square';
    o.frequency.setValueAtTime(620,now);o.frequency.exponentialRampToValueAtTime(150,now+0.28);
    var g=c.createGain();g.gain.setValueAtTime(0.16,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.32);
    o.connect(g);g.connect(ah.master);o.start(now);o.stop(now+0.34);}catch(e){}}
  function sBump(){try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;
    aT(c,ah.master,240,c.currentTime,0.06,0.18,'square');}catch(e){}}

  /* ── Level ── */
  function buildLevel(count){
    var pipes=[];
    var pw=Math.max(30,Math.min(58,Math.round(660/count)-8));
    for(var i=0;i<count;i++){
      var px=150+(i+0.5)/count*700;
      pipes.push({gi:i,x:px,w:pw,h:74,squash:0,plant:0,plantT:Math.random()*200});
    }
    function nearPipe(x,pad){
      for(var p=0;p<pipes.length;p++)if(Math.abs(pipes[p].x-x)<pipes[p].w/2+pad)return true;
      return false;
    }
    var pits=[];
    [0.30,0.63].forEach(function(fr){
      var cx=90+fr*(AW-180);
      var tries=0;
      while(nearPipe(cx,60)&&tries<8){cx+=64;tries++;}
      if(cx<AW-120)pits.push({x1:cx-34,x2:cx+34});
    });
    function inPit(x,pad){
      for(var q=0;q<pits.length;q++)if(x>pits[q].x1-pad&&x<pits[q].x2+pad)return true;
      return false;
    }
    var goombas=[];
    [0.16,0.40,0.56,0.78,0.90].forEach(function(fr,gi2){
      var gx=70+fr*(AW-140);
      if(nearPipe(gx,54)||inPit(gx,50))return;
      goombas.push({x:gx,home:gx,dir:gi2%2?1:-1,range:32,squash:0,alive:true,anim:Math.random()*6});
    });
    var blocks=[];
    [0.22,0.50,0.74].forEach(function(fr){
      var bx=80+fr*(AW-160);
      for(var b=0;b<3;b++){
        var x=bx+b*30;
        if(nearPipe(x,40))continue;
        blocks.push({x:x,y:GROUND-124,type:b===1?'q':'b',bump:0,used:false});
      }
    });
    var coins=[];
    pits.forEach(function(p){
      var cx2=(p.x1+p.x2)/2;
      for(var k=-2;k<=2;k++)coins.push({x:cx2+k*22,y:GROUND-66-Math.round(22-Math.abs(k)*7),t:0,taken:0});
    });
    goombas.forEach(function(gb){
      for(var k2=-1;k2<=1;k2++)coins.push({x:gb.home+k2*24,y:GROUND-86,t:0,taken:0});
    });
    return{pipes:pipes,pits:pits,goombas:goombas,blocks:blocks,coins:coins};
  }

  function startGame(){
    doCleanup();
    var ah=createAudioCtx();audioRef.current=ah;playMarioMusic(ah);
    setShowConfetti(false);

    var count=actualCount;
    var lvl=buildLevel(count);
    var shuffled=shuffle(names.slice());
    var STAG=Math.max(160,Math.min(420,Math.round(7000/names.length)));

    var runners=shuffled.map(function(nm,i){
      var gi=i%count;
      return{id:i,name:nm,gi:gi,color:BALL_COLORS[i%BALL_COLORS.length],
        x:-30-i*4,y:GROUND,vy:0,air:false,walk:Math.random()*6,
        delay:i*STAG,started:false,state:'run',pipeT:0,done:false,
        hop:0,skin:(i*3)%4,hair:i%6};
    });

    var g={lvl:lvl,runners:runners,pipes:lvl.pipes,coins:0,done:0,
      floats:[],dust:[],sparks:[],t:0,shake:0,finished:false,total:names.length};
    gRef.current=g;

    setGroups(Array.from({length:count},function(){return[];}));
    setHud({coins:0,done:0,total:names.length});
    setStatusText('\u{1F3AE} Level 1-1 — los geht’s!');
    setPhase('running');

    var last=performance.now();var t0=last;
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-last)/16.67);last=now;
      gg.t=now-t0;
      update(gg,dt);draw(gg,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function addFloat(g,x,y,txt,color){
    g.floats.push({x:x,y:y,txt:txt,color:color,life:44,maxLife:44});
  }
  function addDust(g,x,y,n){
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI;
      g.dust.push({x:x,y:y,vx:Math.cos(a)*(0.6+Math.random()*1.6)*(Math.random()<0.5?-1:1),
        vy:-Math.abs(Math.sin(a))*1.2-0.2,r:1.6+Math.random()*3,life:20,maxLife:20});
    }
  }

  function update(g,dt){
    var lvl=g.lvl;
    if(g.shake>0)g.shake=Math.max(0,g.shake-0.05*dt);

    // Gumbas
    for(var i=0;i<lvl.goombas.length;i++){
      var gb=lvl.goombas[i];
      if(gb.squash>0){
        gb.squash-=0.008*dt;
        if(gb.squash<=0){gb.squash=0;gb.alive=true;}
        continue;
      }
      gb.anim+=0.12*dt;
      gb.x+=gb.dir*0.55*dt;
      if(gb.x>gb.home+gb.range){gb.x=gb.home+gb.range;gb.dir=-1;}
      if(gb.x<gb.home-gb.range){gb.x=gb.home-gb.range;gb.dir=1;}
    }
    // Blöcke
    for(var b=0;b<lvl.blocks.length;b++){
      var bl=lvl.blocks[b];
      if(bl.bump>0)bl.bump=Math.max(0,bl.bump-0.07*dt);
    }
    // Münzen
    for(var c=0;c<lvl.coins.length;c++){
      var co=lvl.coins[c];
      co.t+=0.10*dt;
      if(co.taken>0){co.taken-=0.012*dt;if(co.taken<0)co.taken=0;}
    }
    // Pipes
    for(var p=0;p<lvl.pipes.length;p++){
      var pp=lvl.pipes[p];
      if(pp.squash>0)pp.squash=Math.max(0,pp.squash-0.05*dt);
      pp.plantT-=dt;
      if(pp.plantT<=0){pp.plant=Math.min(1,pp.plant+0.03*dt);if(pp.plant>=1)pp.plantT=90+Math.random()*160;}
      else if(pp.plant>0)pp.plant=Math.max(0,pp.plant-0.03*dt);
    }

    for(var r=0;r<g.runners.length;r++){
      var ru=g.runners[r];
      if(ru.done)continue;
      if(!ru.started){
        if(g.t>=ru.delay){ru.started=true;ru.x=-24;}
        else continue;
      }
      var pipe=lvl.pipes[ru.gi];

      if(ru.state==='dive'){
        ru.pipeT+=0.035*dt;
        ru.y=GROUND-pipe.h+4+ru.pipeT*70;
        if(ru.pipeT>=1){
          ru.done=true;
          pipe.squash=1;g.shake=Math.min(1,g.shake+0.4);
          g.done++;
          sPipe();
          for(var s=0;s<10;s++){
            var sa=Math.random()*Math.PI*2;
            g.sparks.push({x:pipe.x,y:GROUND-pipe.h,vx:Math.cos(sa)*2.2,vy:-Math.abs(Math.sin(sa))*2.6-1,
              life:26,maxLife:26,c:'#fbbf24'});
          }
          addFloat(g,pipe.x,GROUND-pipe.h-16,'\u{1FA99}+1','#fde68a');
          (function(rr){
            setGroups(function(prev){
              var n2=prev.map(function(a){return a.slice();});
              n2[rr.gi]=n2[rr.gi].concat([rr.name]);return n2;
            });
            setStatusText('\u{1F7E2} '+rr.name+' → Gruppe '+(rr.gi+1)+'!');
          })(ru);
        }
        continue;
      }

      // horizontal
      var atPipe=Math.abs(ru.x-pipe.x)<3.2;
      if(ru.state==='run'){
        if(!atPipe&&ru.x<pipe.x)ru.x+=2.75*dt;
        else if(!ru.air){
          ru.state='enter';ru.vy=-8.2;ru.air=true;sJump();
        }
      }else if(ru.state==='enter'){
        ru.x+=(pipe.x-ru.x)*0.22*dt;
      }
      ru.walk+=ru.air?0:0.20*dt;

      // Sprungentscheidungen
      if(!ru.air&&ru.state==='run'){
        var jump=false;
        for(var q=0;q<lvl.pits.length;q++){
          var pit=lvl.pits[q];
          if(ru.x>pit.x1-64&&ru.x<pit.x1-8)jump=true;
        }
        for(var q2=0;q2<lvl.goombas.length;q2++){
          var gb2=lvl.goombas[q2];
          if(gb2.squash>0)continue;
          var d=gb2.x-ru.x;
          if(d>16&&d<58)jump=true;
        }
        for(var q3=0;q3<lvl.blocks.length;q3++){
          var bl2=lvl.blocks[q3];
          if(!bl2.used&&Math.abs(bl2.x-ru.x-16)<8)jump=true;
        }
        if(ru.hop<=0&&Math.random()<0.006*dt)jump=true;
        if(jump){ru.vy=-8.4;ru.air=true;ru.hop=60;sJump();}
      }
      if(ru.hop>0)ru.hop-=dt;

      // Physik
      ru.vy+=GRAV*dt;
      ru.y+=ru.vy*dt;

      // Blockstoß
      if(ru.vy<0){
        for(var q4=0;q4<lvl.blocks.length;q4++){
          var bl3=lvl.blocks[q4];
          if(Math.abs(bl3.x+13-ru.x)<15&&Math.abs(ru.y-38-(bl3.y+26))<10){
            if(bl3.bump<=0){
              bl3.bump=1;ru.vy=1.2;sBump();
              if(bl3.type==='q'&&!bl3.used){
                bl3.used=true;g.coins++;
                addFloat(g,bl3.x+13,bl3.y-10,'\u{1FA99}','#fde68a');
                sCoin();
              }else{
                addDust(g,bl3.x+13,bl3.y+8,5);
              }
            }
          }
        }
      }

      // Gumba stampfen
      for(var q5=0;q5<lvl.goombas.length;q5++){
        var gb3=lvl.goombas[q5];
        if(gb3.squash>0)continue;
        if(Math.abs(gb3.x-ru.x)<16&&ru.y>GROUND-24&&ru.y<GROUND+6){
          if(ru.vy>0){
            gb3.squash=1;ru.vy=-6.4;ru.air=true;
            g.shake=Math.min(1,g.shake+0.3);
            addFloat(g,gb3.x,GROUND-30,'100','#fff');
            addDust(g,gb3.x,GROUND-4,8);
            sStomp();
          }
        }
      }

      // Landen
      if(ru.y>=GROUND){
        var overPit=false;
        for(var q6=0;q6<lvl.pits.length;q6++){
          var pit2=lvl.pits[q6];
          if(ru.x>pit2.x1&&ru.x<pit2.x2)overPit=true;
        }
        ru.y=GROUND;
        if(ru.air){addDust(g,ru.x,GROUND,4);}
        ru.vy=0;ru.air=false;
        if(overPit&&ru.state==='run'){ru.vy=-8.6;ru.air=true;}
      }

      // Pipe-Eintritt
      if(ru.state==='enter'&&ru.vy>0&&ru.y<=GROUND-pipe.h+6&&Math.abs(ru.x-pipe.x)<10){
        ru.state='dive';ru.pipeT=0;ru.vy=0;
      }

      // Münzen einsammeln
      for(var q7=0;q7<lvl.coins.length;q7++){
        var co2=lvl.coins[q7];
        if(co2.taken>0)continue;
        if(Math.abs(co2.x-ru.x)<15&&Math.abs(co2.y-(ru.y-24))<20){
          co2.taken=1;g.coins++;sCoin();
          g.sparks.push({x:co2.x,y:co2.y,vx:0,vy:-1.6,life:22,maxLife:22,c:'#fde68a'});
        }
      }
    }

    // Partikel
    for(var d2=g.dust.length-1;d2>=0;d2--){
      var du=g.dust[d2];
      du.x+=du.vx*dt;du.y+=du.vy*dt;du.vy+=0.06*dt;du.life-=dt;du.r+=0.09*dt;
      if(du.life<=0)g.dust.splice(d2,1);
    }
    for(var s2=g.sparks.length-1;s2>=0;s2--){
      var sp=g.sparks[s2];
      sp.x+=sp.vx*dt;sp.y+=sp.vy*dt;sp.vy+=0.10*dt;sp.life-=dt;
      if(sp.life<=0)g.sparks.splice(s2,1);
    }
    for(var f2=g.floats.length-1;f2>=0;f2--){
      var fo=g.floats[f2];
      fo.y-=0.7*dt;fo.life-=dt;
      if(fo.life<=0)g.floats.splice(f2,1);
    }

    // HUD (gedrosselt)
    if(!g._hudT||g.t-g._hudT>140){
      g._hudT=g.t;
      setHud({coins:g.coins,done:g.done,total:g.total});
    }

    if(!g.finished&&g.done>=g.runners.length){
      g.finished=true;
      later(function(){
        setPhase('done');setShowConfetti(true);
        setStatusText('\u{1F3C1} Level geschafft — '+actualCount+' Gruppen!');
        setHud({coins:g.coins,done:g.done,total:g.total});
        onResult(actualCount+' Gruppen');
        stopAH(audioRef.current);audioRef.current=null;
        later(function(){if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}},1600);
      },700);
    }
  }

  /* ── Hintergrund ── */
  function buildBg(){
    var c=document.createElement('canvas');
    c.width=AW*2;c.height=AH*2;
    var t=c.getContext('2d');t.setTransform(2,0,0,2,0,0);
    var sky=t.createLinearGradient(0,0,0,AH);
    sky.addColorStop(0,'#5c94fc');sky.addColorStop(0.62,'#79aefd');sky.addColorStop(1,'#a8cbff');
    t.fillStyle=sky;t.fillRect(0,0,AW,AH);
    // Hügel
    function hill(cx,r,col){
      t.fillStyle=col;
      t.beginPath();t.moveTo(cx-r,GROUND);
      t.quadraticCurveTo(cx-r*0.5,GROUND-r*0.95,cx,GROUND-r);
      t.quadraticCurveTo(cx+r*0.5,GROUND-r*0.95,cx+r,GROUND);
      t.closePath();t.fill();
    }
    hill(150,74,'#2f9e44');hill(430,58,'#2f9e44');hill(760,84,'#2f9e44');
    hill(280,44,'#37b24d');hill(600,50,'#37b24d');
    // Büsche
    function bush(x,s){
      t.fillStyle='#2b8a3e';
      t.beginPath();t.arc(x,GROUND-6*s,11*s,Math.PI,0);t.fill();
      t.beginPath();t.arc(x-14*s,GROUND-3*s,8*s,Math.PI,0);t.fill();
      t.beginPath();t.arc(x+14*s,GROUND-3*s,8*s,Math.PI,0);t.fill();
      t.fillRect(x-22*s,GROUND-4*s,44*s,4*s);
    }
    bush(90,1);bush(330,0.8);bush(520,1.1);bush(830,0.9);
    // Burg
    t.fillStyle='#7f5539';
    t.fillRect(AW-118,GROUND-96,96,96);
    t.fillRect(AW-126,GROUND-112,16,20);
    t.fillRect(AW-96,GROUND-118,16,26);
    t.fillRect(AW-56,GROUND-112,16,20);
    t.fillStyle='#5c3d24';
    t.fillRect(AW-84,GROUND-42,30,42);
    t.beginPath();t.arc(AW-69,GROUND-42,15,Math.PI,0);t.fill();
    t.fillStyle='rgba(0,0,0,0.18)';
    for(var br=0;br<10;br++)t.fillRect(AW-118,GROUND-96+br*10,96,1.5);
    return c;
  }

  /* ── Draw ── */
  function draw(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    var sh=g.shake;
    var ox=sh>0?(Math.random()-0.5)*sh*5:0;
    var oy=sh>0?(Math.random()-0.5)*sh*5:0;
    ctx.setTransform(2,0,0,2,ox*2,oy*2);
    var lvl=g.lvl;

    if(!g._bg)g._bg=buildBg();
    ctx.drawImage(g._bg,0,0,AW,AH);

    // Wolken (ziehend)
    for(var cl=0;cl<5;cl++){
      var cx=((cl*231+now*0.012)%(AW+180))-90;
      var cy=24+((cl*37)%56);
      var s=0.8+(cl%3)*0.25;
      ctx.fillStyle='rgba(255,255,255,0.95)';
      ctx.beginPath();ctx.arc(cx,cy,11*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+13*s,cy-5*s,14*s,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(cx+28*s,cy,11*s,0,Math.PI*2);ctx.fill();
      ctx.fillRect(cx,cy,28*s,11*s);
    }

    // Boden mit Löchern
    var segs=[[0,AW]];
    lvl.pits.forEach(function(p){
      var ns=[];
      segs.forEach(function(sg){
        if(p.x2<=sg[0]||p.x1>=sg[1]){ns.push(sg);return;}
        if(p.x1>sg[0])ns.push([sg[0],p.x1]);
        if(p.x2<sg[1])ns.push([p.x2,sg[1]]);
      });
      segs=ns;
    });
    segs.forEach(function(sg){
      var w=sg[1]-sg[0];
      ctx.fillStyle='#3cb043';ctx.fillRect(sg[0],GROUND,w,8);
      ctx.fillStyle='#2f9e44';ctx.fillRect(sg[0],GROUND,w,3);
      var dg=ctx.createLinearGradient(0,GROUND+8,0,AH);
      dg.addColorStop(0,'#b5651d');dg.addColorStop(1,'#7c3f0f');
      ctx.fillStyle=dg;ctx.fillRect(sg[0],GROUND+8,w,AH-GROUND-8);
      ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=1;
      for(var bx=Math.ceil(sg[0]/26)*26;bx<sg[1];bx+=26){
        ctx.beginPath();ctx.moveTo(bx,GROUND+8);ctx.lineTo(bx,AH);ctx.stroke();
      }
      ctx.beginPath();ctx.moveTo(sg[0],GROUND+30);ctx.lineTo(sg[1],GROUND+30);ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,0.35)';
      ctx.fillRect(sg[0],GROUND+8,2,AH-GROUND-8);
      ctx.fillRect(sg[1]-2,GROUND+8,2,AH-GROUND-8);
    });

    // Blöcke
    lvl.blocks.forEach(function(bl){
      var by=bl.y-bl.bump*7;
      if(bl.type==='q'){
        ctx.fillStyle=bl.used?'#8d6b3f':'#f5a524';
        ctx.fillRect(bl.x,by,26,26);
        ctx.strokeStyle='#4a2b0a';ctx.lineWidth=2.4;ctx.strokeRect(bl.x+1,by+1,24,24);
        ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(bl.x+3,by+3,20,4);
        if(!bl.used){
          ctx.fillStyle='#fff';ctx.font='900 15px monospace';
          ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillText('?',bl.x+13,by+14);
        }
        ctx.fillStyle='#4a2b0a';
        [[3,3],[20,3],[3,20],[20,20]].forEach(function(d){ctx.fillRect(bl.x+d[0],by+d[1],3,3);});
      }else{
        ctx.fillStyle='#c1662f';ctx.fillRect(bl.x,by,26,26);
        ctx.strokeStyle='#7c3f0f';ctx.lineWidth=2;ctx.strokeRect(bl.x+1,by+1,24,24);
        ctx.strokeStyle='rgba(0,0,0,0.30)';ctx.lineWidth=1.4;
        ctx.beginPath();ctx.moveTo(bl.x,by+13);ctx.lineTo(bl.x+26,by+13);
        ctx.moveTo(bl.x+13,by);ctx.lineTo(bl.x+13,by+13);
        ctx.moveTo(bl.x+6,by+13);ctx.lineTo(bl.x+6,by+26);
        ctx.moveTo(bl.x+20,by+13);ctx.lineTo(bl.x+20,by+26);
        ctx.stroke();
      }
    });

    // Münzen
    lvl.coins.forEach(function(co){
      if(co.taken>0)return;
      var wsc=Math.abs(Math.cos(co.t));
      ctx.save();ctx.translate(co.x,co.y);
      ctx.fillStyle='#fbbf24';
      ctx.beginPath();ctx.ellipse(0,0,Math.max(1.5,8*wsc),8,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#b45309';ctx.lineWidth=1.5;ctx.stroke();
      if(wsc>0.45){
        ctx.fillStyle='rgba(255,255,255,0.55)';
        ctx.fillRect(-1.5*wsc,-4,3*wsc,8);
      }
      ctx.restore();
    });

    // Gumbas
    lvl.goombas.forEach(function(gb){
      var sq=gb.squash>0;
      ctx.save();ctx.translate(gb.x,GROUND);
      ctx.fillStyle='rgba(0,0,0,0.28)';
      ctx.beginPath();ctx.ellipse(0,0,13,4,0,0,Math.PI*2);ctx.fill();
      if(sq){
        ctx.fillStyle='#8b5a2b';
        ctx.beginPath();ctx.ellipse(0,-4,15,4.5,0,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#5b3a18';
        ctx.beginPath();ctx.ellipse(0,-2,15,3,0,0,Math.PI*2);ctx.fill();
        ctx.restore();return;
      }
      var wob=Math.sin(gb.anim)*0.10;
      ctx.rotate(wob);
      ctx.fillStyle='#5b3a18';
      ctx.beginPath();ctx.ellipse(-6,-2,5,3,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(6,-2,5,3,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#8b5a2b';
      ctx.beginPath();ctx.ellipse(0,-13,13,12,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#c98b52';
      ctx.beginPath();ctx.ellipse(0,-9,10,7,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.ellipse(-4.6,-16,3.2,4,0,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(4.6,-16,3.2,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';
      ctx.beginPath();ctx.arc(-4.2+gb.dir*0.8,-16,1.5,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(5+gb.dir*0.8,-16,1.5,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#111';ctx.lineWidth=1.6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-8,-21);ctx.lineTo(-2,-18.5);
      ctx.moveTo(8,-21);ctx.lineTo(2,-18.5);ctx.stroke();
      ctx.restore();
    });

    // Pipes
    lvl.pipes.forEach(function(pp){
      var h=pp.h-pp.squash*6;
      var w=pp.w+pp.squash*5;
      var x=pp.x-w/2;
      var top=GROUND-h;
      // Piranha
      if(pp.plant>0.02){
        var ph=pp.plant*30;
        ctx.save();
        ctx.fillStyle='#16a34a';
        ctx.fillRect(pp.x-3,top-ph,6,ph);
        ctx.fillStyle='#dc2626';
        ctx.beginPath();ctx.arc(pp.x,top-ph-6,9,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';
        for(var sp3=0;sp3<5;sp3++){
          ctx.beginPath();
          ctx.arc(pp.x-6+sp3*3,top-ph-9+((sp3%2)*2),1.5,0,Math.PI*2);ctx.fill();
        }
        ctx.fillStyle='#fecdd3';
        ctx.beginPath();ctx.arc(pp.x-3,top-ph-9,2,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(pp.x+3,top-ph-9,2,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
      // Rohr
      var bg2=ctx.createLinearGradient(x,0,x+w,0);
      bg2.addColorStop(0,'#14532d');bg2.addColorStop(0.28,'#4ade80');
      bg2.addColorStop(0.55,'#22c55e');bg2.addColorStop(1,'#14532d');
      ctx.fillStyle=bg2;ctx.fillRect(x+4,top+16,w-8,h-16);
      ctx.strokeStyle='#14532d';ctx.lineWidth=2;ctx.strokeRect(x+4,top+16,w-8,h-16);
      var lipW=w+10;
      var lg2=ctx.createLinearGradient(pp.x-lipW/2,0,pp.x+lipW/2,0);
      lg2.addColorStop(0,'#14532d');lg2.addColorStop(0.28,'#86efac');
      lg2.addColorStop(0.55,'#22c55e');lg2.addColorStop(1,'#14532d');
      ctx.fillStyle=lg2;ctx.fillRect(pp.x-lipW/2,top,lipW,18);
      ctx.strokeStyle='#14532d';ctx.lineWidth=2;ctx.strokeRect(pp.x-lipW/2,top,lipW,18);
      ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(pp.x-lipW/2+4,top+2,lipW-8,5);
      // Label
      ctx.fillStyle='#fff';
      ctx.font='900 '+Math.max(10,Math.min(15,Math.round(w*0.34)))+'px monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=3;ctx.lineJoin='round';
      ctx.strokeText('G'+(pp.gi+1),pp.x,top+42);
      ctx.fillText('G'+(pp.gi+1),pp.x,top+42);
    });

    // Läufer
    for(var r=0;r<g.runners.length;r++){
      var ru=g.runners[r];
      if(ru.done||!ru.started)continue;
      var clip=null;
      if(ru.state==='dive'){
        var pipe2=lvl.pipes[ru.gi];
        clip=GROUND-pipe2.h;
      }
      ctx.save();
      if(clip!==null){ctx.beginPath();ctx.rect(0,0,AW,clip);ctx.clip();}
      drawHero(ctx,{x:ru.x,y:ru.y-19,s:14,color:ru.color,
        walk:ru.air?1.25:ru.walk*2.2,face:1,hair:ru.hair,skin:ru.skin,
        gear:'cap',lean:ru.air?-0.12:-0.05});
      // Namensschild
      var nm=truncName(ru.name,9);
      var fs=fitFont(ctx,nm,74,11,8);
      var tw=ctx.measureText(nm).width;
      var ly=ru.y-56;
      ctx.fillStyle='rgba(2,6,23,0.66)';
      hRR(ctx,ru.x-tw/2-5,ly-fs*0.72,tw+10,fs*1.44,fs*0.5);ctx.fill();
      ctx.fillStyle=ru.color;ctx.fillRect(ru.x-tw/2-5,ly-fs*0.72,2.5,fs*1.44);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(nm,ru.x,ly);
      ctx.restore();
    }

    // Partikel
    for(var d3=0;d3<g.dust.length;d3++){
      var du2=g.dust[d3];
      ctx.fillStyle='rgba(226,214,190,'+(du2.life/du2.maxLife*0.7)+')';
      ctx.beginPath();ctx.arc(du2.x,du2.y,du2.r,0,Math.PI*2);ctx.fill();
    }
    for(var s4=0;s4<g.sparks.length;s4++){
      var sp4=g.sparks[s4];
      ctx.globalAlpha=Math.max(0,sp4.life/sp4.maxLife);
      ctx.fillStyle=sp4.c;
      ctx.beginPath();ctx.arc(sp4.x,sp4.y,2.4,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    for(var f3=0;f3<g.floats.length;f3++){
      var fo2=g.floats[f3];
      ctx.save();ctx.globalAlpha=Math.max(0,fo2.life/fo2.maxLife);
      ctx.font='900 15px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineWidth=3.5;ctx.lineJoin='round';
      ctx.strokeText(fo2.txt,fo2.x,fo2.y);
      ctx.fillStyle=fo2.color;ctx.fillText(fo2.txt,fo2.x,fo2.y);
      ctx.restore();
    }

    // HUD-Leiste
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.35)';ctx.fillRect(0,0,AW,26);
    ctx.font='900 13px monospace';ctx.textBaseline='middle';ctx.fillStyle='#fff';
    ctx.textAlign='left';
    ctx.fillText('WORLD 1-1',14,13);
    ctx.textAlign='center';
    ctx.fillText('\u{1FA99} x '+g.coins,AW*0.42,13);
    ctx.fillText('\u{1F7E2} '+g.done+' / '+g.total,AW*0.62,13);
    ctx.textAlign='right';
    ctx.fillText('GRUPPEN x '+lvl.pipes.length,AW-14,13);
    ctx.restore();
  }

  function reset(){
    doCleanup();gRef.current=null;
    setPhase('idle');setGroups([]);setShowConfetti(false);setStatusText('');
    setHud({coins:0,done:0,total:0});
    if(canvasRef.current){var c=canvasRef.current.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,AW*2,AH*2);}
  }

  var numCols=Math.min(actualCount,5);

  if(phase==='idle'){
    return(
      html`<div className="flex flex-col items-center w-full max-w-lg text-center">
        <div className="text-5xl mb-3">\u{1F3AE}</div>
        <p className="text-gray-900 text-xl font-bold mb-2">Super Mario Gruppen</p>
        <p className="text-gray-600 text-sm mb-4 max-w-sm leading-relaxed">
          Alle rennen durch Welt 1-1: über Abgründe springen, Gumbas plattmachen,
          Münzen kassieren — und am Ende in die eigene Gruppen-Röhre tauchen!
        </p>
        <div className="group-mode-toggle mb-5 inline-flex">
          <button onClick=${function(){setGroupMode('count')}} className=${"group-mode-btn "+(groupMode==='count'?"active":"inactive")}>Anzahl Gruppen</button>
          <button onClick=${function(){setGroupMode('size')}} className=${"group-mode-btn "+(groupMode==='size'?"active":"inactive")}>à N Personen</button>
        </div>
        ${groupMode==='count'?(html`
        <div className="flex items-center gap-5 justify-center mb-4">
          <button onClick=${function(){setGroupCount(function(g){return Math.max(2,g-1)})}} disabled=${groupCount<=2}
            className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">−</button>
          <span className="text-6xl font-black gradient-text w-20 text-center">${groupCount}</span>
          <button onClick=${function(){setGroupCount(function(g){return Math.min(maxGroups,g+1)})}} disabled=${groupCount>=maxGroups}
            className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
        </div>
        <p className="text-gray-600 text-xs mb-6">ca. ${Math.ceil(names.length/groupCount)} Personen pro Gruppe</p>
        `):(html`
        <div className="flex items-center gap-5 justify-center mb-4">
          <button onClick=${function(){setGroupSize(function(s){return Math.max(2,s-1)})}} disabled=${groupSize<=2}
            className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">−</button>
          <span className="text-6xl font-black gradient-text w-20 text-center">${groupSize}</span>
          <button onClick=${function(){setGroupSize(function(s){return Math.min(maxSize,s+1)})}} disabled=${groupSize>=maxSize}
            className="w-12 h-12 rounded-full bg-gray-100 border border-gray-300 hover:bg-gray-200 disabled:opacity-40 text-gray-700 text-2xl font-bold transition-all">+</button>
        </div>
        <p className="text-gray-600 text-xs mb-6">→ ${actualCount} Gruppen (${names.length} Personen)</p>
        `)}
        <button onClick=${startGame} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500 text-white shadow-lg shadow-green-500/20 transition-all">\u{1F3AE} Level starten!</button>
      </div>`
    );
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-4xl">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-3">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#dc2626,#f59e0b,#16a34a)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F3AE} Super Mario Gruppen</h2>
        <p role="status" aria-live="polite" className="text-gray-800 text-base font-semibold">${statusText}</p>
        ${phase==='running'&&html`<p className="text-gray-500 text-xs mt-0.5">\u{1FA99} ${hud.coins} Münzen · ${hud.done} von ${hud.total} in der Röhre</p>`}
      </div>

      <div className="relative w-full mb-4 rounded-xl overflow-hidden" style=${{border:'4px solid #d97706',boxShadow:'0 0 0 2px #92400e,0 18px 40px -16px rgba(0,0,0,.6)'}}>
        <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{display:'block',width:'100%',height:'auto'}} role="img" aria-label="Super-Mario-Level"/>
      </div>

      <div className="w-full grid gap-3 mb-4" style=${{gridTemplateColumns:'repeat('+numCols+',1fr)'}}>
        ${groups.map(function(group,gi){
          return(
            html`<div key=${gi} className="rounded-xl overflow-hidden border border-gray-200 shadow-md">
              <div className=${"px-3 py-2 text-center bg-gradient-to-br "+GROUP_COLORS[gi%GROUP_COLORS.length].bg}>
                <span className="text-white font-bold text-sm">Gruppe ${gi+1}</span>
                <span className="text-white/60 text-xs ml-1">(${group.length})</span>
              </div>
              <div className="bg-white p-2 space-y-0.5 min-h-6">
                ${group.map(function(nm,ni){
                  return html`<div key=${ni} className=${"text-gray-800 text-sm font-medium px-2 py-1 rounded bg-gray-50 fade-in "+(ni===group.length-1?"name-pop":"")} style=${{animationDelay:(ni*0.06)+'s'}}>${nm}</div>`;
                })}
              </div>
            </div>`
          );
        })}
      </div>
      ${phase==='running'&&(
        html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`
      )}
      ${phase==='done'&&(
        html`<div className="flex gap-3 mt-2">
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-green-50 text-green-700 border border-green-200 hover:bg-green-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </div>`
      )}
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   CHAOS ARENA MODE
   ═══════════════════════════════════════════════════════ */
function ChaosArenaMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _st=useState('Bereit f\u00FCr das Chaos!');var statusText=_st[0];var setStatusText=_st[1];
  var _el=useState([]);var eliminated=_el[0];var setEliminated=_el[1];
  var _wn=useState(null);var winner=_wn[0];var setWinner=_wn[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _sv=useState(0);var surviving=_sv[0];var setSurviving=_sv[1];
  var _kf=useState([]);var killFeed=_kf[0];var setKillFeed=_kf[1];
  var _eb=useState(null);var eventBanner=_eb[0];var setEventBanner=_eb[1];
  var _sw=useState([]);var shockRings=_sw[0];var setShockRings=_sw[1];
  var _shk=useState(false);var arenaShake=_shk[0];var setArenaShake=_shk[1];
  var canvasRef=useRef(null);
  var gRef=useRef(null);
  var rafRef=useRef(null);
  var timers=useRef([]);
  var audioRef=useRef(null);

  var AW=700;var AH=440;
  var BR=names.length>30?17:names.length>18?20:names.length>12?23:27;
  var FS=names.length>30?10:names.length>18?12:names.length>12?13:15;
  var NMAX=names.length>30?7:names.length>18?8:names.length>12?9:11;

  useEffect(function(){return function(){doCleanup();}},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();startChaos();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  function doCleanup(){
    timers.current.forEach(clearTimeout);timers.current=[];
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}

  var KILL_COMMENTS=['\u{1F4A5} Brutal!','\u{1F525} Erwischt!','\u26A1 Zap!','\u{1F480} RIP!','\u{1F631} Oh nein!','\u2620 Aus!','\u{1F4A8} Weg!','\u{1F92F} Krass!','\u{1F62D} Tsch\u00FCss!','\u{1F3AF} Volltreffer!'];
  var CLOSE_COMMENTS=['\u{1F4A5} Knapp!','\u{1F525} Gerade so!','\u26A1 Haarscharf!','\u{1F62C} Fast geschafft!'];
  function addKill(name,cause,aliveLeft){
    var comment=aliveLeft<=2?CLOSE_COMMENTS[Math.floor(Math.random()*CLOSE_COMMENTS.length)]:KILL_COMMENTS[Math.floor(Math.random()*KILL_COMMENTS.length)];
    var causeEmoji={dangerZone:'\u{1F534}',shockwave:'\u26A1',magnet:'\u{1F9F2}',cut:'\u2702',gravityFlip:'\u{1F300}'};
    var entry={text:(causeEmoji[cause]||'\u{1F4A5}')+' '+name+' - '+comment,time:Date.now()};
    setKillFeed(function(prev){var next=prev.concat(entry);return next.slice(-5);});
  }

  /* ── AUDIO (uses shared helpers aT/aC/createAudioCtx/stopAH) ── */
  function startAudio(){
    try{
      var ah=createAudioCtx();if(!ah)return;audioRef.current=ah;
      var ctx=ah.ctx;var master=ah.master;
      master.gain.value=0.5;
      // Low bass drone
      var drone=ctx.createOscillator();drone.type='sawtooth';drone.frequency.value=55;
      var dg=ctx.createGain();dg.gain.value=0.35;
      var df=ctx.createBiquadFilter();df.type='lowpass';df.frequency.value=200;
      drone.connect(df);df.connect(dg);dg.connect(master);drone.start();
      if(ah.oscs)ah.oscs.push(drone);
      // Rhythm + chords
      var now=ctx.currentTime;var b=60/120;
      for(var i=0;i<90;i++){
        var t=now+i*b*0.5;
        if(i%4===0){aT(ctx,master,60,t,0.35,0.7);aT(ctx,master,45,t+0.01,0.2,0.5);}
        if(i%4===2){aT(ctx,master,80,t,0.15,0.35);}
        if(i%16===0&&i>0){aC(ctx,master,t,[220,261.6,329.6],0.18,0.5);}
        if(i%8===6){aT(ctx,master,110,t,0.25,0.25);}
        if(i%32===0&&i>0){aC(ctx,master,t,[440,523.25,659.25],0.1,1.2);}
      }
      master.gain.linearRampToValueAtTime(0.7,ctx.currentTime+6);
      master.gain.linearRampToValueAtTime(0.85,ctx.currentTime+14);
      master.gain.linearRampToValueAtTime(0.5,ctx.currentTime+21);
    }catch(e){}
  }
  function playHit(){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;
      var now=ctx.currentTime;
      aT(ctx,dest,110,now,0.1,0.9);aT(ctx,dest,165,now+0.02,0.08,0.6);
      var buf=ctx.createBuffer(1,ctx.sampleRate*0.12,ctx.sampleRate);
      var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.4;
      var src=ctx.createBufferSource();src.buffer=buf;
      var ng=ctx.createGain();ng.gain.setValueAtTime(0.5,now);ng.gain.exponentialRampToValueAtTime(0.001,now+0.12);
      var nf=ctx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=800;nf.Q.value=1;
      src.connect(nf);nf.connect(ng);ng.connect(dest);src.start(now);
    }catch(e){}
  }

  /* ── INIT ── */
  function initBalls(){
    var balls=[];var margin=BR*3;
    for(var i=0;i<names.length;i++){
      var attempts=0,x,y;
      do{x=margin+Math.random()*(AW-margin*2);y=margin+Math.random()*(AH-margin*2);attempts++;}
      while(attempts<80&&balls.some(function(b){return Math.sqrt(Math.pow(b.x-x,2)+Math.pow(b.y-y,2))<BR*2.5}));
      var ang=Math.random()*Math.PI*2,spd=1.5+Math.random()*1.5;
      balls.push({id:i,name:names[i],color:BALL_COLORS[i%BALL_COLORS.length],
        x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
        alive:true,elimT:0,elimFlash:0,elimCause:'',fakeDanger:0,targeting:0,targetCause:''});
    }
    return balls;
  }

  /* ── START ── */
  function startChaos(){
    doCleanup();
    var g={balls:initBalls(),events:[],gravity:{x:0,y:0},elimList:[],particles:[],floaters:[],done:false};
    gRef.current=g;
    setEliminated([]);setWinner(null);setShowConfetti(false);setSurviving(names.length);setKillFeed([]);
    setPhase('running');setStatusText('\u26A1 Chaos beginnt!');
    startAudio();
    scheduleDrama(g);
    var last=performance.now();
    function loop(now){
      var dt=Math.min((now-last)/16.67,3);last=now;
      var alive=g.balls.filter(function(b){return b.alive}).length;
      if(alive<=3&&alive>0)dt*=0.5;
      physicsStep(g,dt);drawFrame();
      if(!g.done)rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  /* ── DRAMA SCHEDULER (max 20s) ── */
  function scheduleDrama(g){
    var n=names.length;
    var seq=[];var t=600;
    var rem=n-1;

    // Phase 1: 0-2.5s fast chaos — eliminate ~50%
    var p1=Math.min(Math.max(1,Math.floor(n*0.5)),rem-1);
    var p1types=['dangerZone','shockwave','cut','dangerZone','shockwave'];
    for(var i=0;i<p1&&t<2500;){
      var e=Math.min(Math.floor(Math.random()*2)+1,p1-i);
      seq.push({t:t,type:p1types[i%p1types.length],elim:e});
      i+=e;t+=400+Math.floor(Math.random()*200);
    }
    rem-=p1;
    seq.push({t:Math.min(t+200,3000),type:'_s',text:'\u{1F441} Wer bleibt \u00FCbrig?'});

    // Phase 2: 3-7s mixed events — eliminate ~25%
    t=Math.max(t+400,3200);
    var p2=Math.min(Math.max(0,Math.floor(n*0.2)),rem-1);
    var p2types=['magnet','gravityFlip','dangerZone','shockwave','cut'];
    for(var j=0;j<p2&&t<7000;j++){
      seq.push({t:t,type:p2types[j%p2types.length],elim:1});
      t+=800+Math.floor(Math.random()*400);
    }
    rem-=p2;

    // Phase 3: 7-12s slow + fake drama
    t=Math.max(t+500,7500);
    seq.push({t:t,type:'_s',text:'\u{1F480} Noch wenige...'});t+=500;
    var p3=Math.max(0,rem-(n>3?2:1));
    var p3types=['dangerZone','cut','magnet'];
    for(var k=0;k<p3&&t<12000;k++){
      seq.push({t:t,type:'_f',text:''});t+=500;
      seq.push({t:t,type:p3types[k%p3types.length],elim:1});t+=1200+Math.floor(Math.random()*300);
    }
    rem-=p3;

    // Phase 4: 12-18s final drama
    t=Math.max(t+200,12500);
    seq.push({t:t,type:'_s',text:'\u{1F631} JETZT passiert\'s...'});t+=400;
    seq.push({t:t,type:'_f',text:''});t+=800;
    seq.push({t:t,type:'_s',text:'...oder doch nicht?'});t+=800;
    seq.push({t:t,type:'_f',text:''});t+=600;

    if(rem>0){
      seq.push({t:Math.min(t,16500),type:'_s',text:'\u{1F525} JETZT!'});t=Math.min(t+200,16700);
      var fTypes=['cut','dangerZone','shockwave'];
      for(var fi=0;fi<rem;fi++){seq.push({t:t,type:fTypes[fi%fTypes.length],elim:1});t+=500;}
    }
    var endT=Math.min(t+1200,19500);

    seq.forEach(function(item){
      later(function(){
        if(g.done)return;
        var alive=g.balls.filter(function(b){return b.alive}).length;
        if(item.type==='_s'){setStatusText(item.text);}
        else if(item.type==='_f'){triggerFakeDanger(g);setStatusText(['\u{1F631} FAST!','\u{1F480} ACHTUNG!','\u{1F630} Knapp...'][Math.floor(Math.random()*3)]);}
        else if(alive>1){
          var re=Math.min(item.elim,alive-1);
          if(re>0){setStatusText(evText(item.type));showEventBanner(item.type);fireEvent(g,item.type,re);}
        }
      },item.t);
    });
    later(function(){if(!g.done)checkWinner(g);},endT);
  }

  var EVENT_BANNER_DATA={
    dangerZone:{text:'\u{1F534} GEFAHRENZONE!',color:'rgba(239,68,68,0.9)'},
    shockwave:{text:'\u26A1 SCHOCKWELLE!',color:'rgba(251,191,36,0.9)'},
    magnet:{text:'\u{1F9F2} MAGNETFELD!',color:'rgba(139,92,246,0.9)'},
    cut:{text:'\u{1FA93} CUT INCOMING!',color:'rgba(250,204,21,0.9)'},
    gravityFlip:{text:'\u{1F300} GRAVITY FLIP!',color:'rgba(99,102,241,0.9)'}
  };

  function showEventBanner(type){
    var d=EVENT_BANNER_DATA[type];if(!d)return;
    setEventBanner({text:d.text,color:d.color,id:Date.now()});
    later(function(){setEventBanner(null);},1800);
    // Screen shake on every major event
    setArenaShake(false);
    later(function(){setArenaShake(true);},20);
    later(function(){setArenaShake(false);},520);
    // Add shockwave ring for shockwave events
    if(type==='shockwave'){
      var ring={id:Date.now()+Math.random(),x:50+Math.random()*30-15,y:50+Math.random()*20-10};
      setShockRings(function(prev){return prev.concat([ring]);});
      later(function(){setShockRings(function(prev){return prev.filter(function(r){return r.id!==ring.id;});});},950);
    }
  }

  function evText(t){
    return{dangerZone:'\u{1F534} GEFAHRENZONE!',shockwave:'\u26A1 SCHOCKWELLE!',magnet:'\u{1F9F2} MAGNETFELD!',cut:'\u{1FA93} CUT!',gravityFlip:'\u{1F300} GRAVITY FLIP!'}[t]||'';
  }

  function triggerFakeDanger(g){
    var alive=g.balls.filter(function(b){return b.alive});
    if(!alive.length)return;
    var ball=alive[Math.floor(Math.random()*alive.length)];
    ball.fakeDanger=1;
    later(function(){ball.fakeDanger=0;},1100);
  }

  var CAUSE_COLORS={dangerZone:'#ef4444',shockwave:'#fbbf24',magnet:'#a855f7',cut:'#facc15',gravityFlip:'#818cf8'};
  var CAUSE_FLOATS={dangerZone:'🔴 ZONE!',shockwave:'⚡ WELLE!',magnet:'🧲 MAGNET!',cut:'✂️ CUT!',gravityFlip:'🌀 FLIP!'};

  function spawnParticles(g,x,y,ballColor,count,causeType){
    var c=CAUSE_COLORS[causeType]||ballColor;
    for(var i=0;i<count;i++){
      var ang=Math.random()*Math.PI*2;
      var spd=3+Math.random()*9;
      var isSpark=i<count*0.4;
      g.particles.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-(isSpark?2:0),
        life:1,decay:0.016+Math.random()*0.018,r:isSpark?1.5+Math.random()*1.5:2.5+Math.random()*3,
        color:isSpark?'#ffffff':c,isDebris:!isSpark});
    }
    // Shockring: large expanding circle
    g.particles.push({x:x,y:y,vx:0,vy:0,life:1,decay:0.035,r:BR,maxR:BR*6,isRing:true,color:c});
  }

  function spawnFloater(g,x,y,text,color){
    g.floaters.push({x:x,y:y,vy:-1.4,text:text,color:color,life:1,decay:0.013});
  }

  /* ── Find cluster center of alive balls ── */
  function findCluster(g){
    var alive=g.balls.filter(function(b){return b.alive;});
    if(alive.length<2)return{x:AW/2,y:AH/2};
    // Find densest cluster: pick ball with most neighbors within radius
    var bestIdx=0;var bestCount=0;
    for(var i=0;i<alive.length;i++){
      var cnt=0;
      for(var j=0;j<alive.length;j++){
        if(i===j)continue;
        var d=Math.sqrt(Math.pow(alive[i].x-alive[j].x,2)+Math.pow(alive[i].y-alive[j].y,2));
        if(d<120)cnt++;
      }
      if(cnt>bestCount){bestCount=cnt;bestIdx=i;}
    }
    return{x:alive[bestIdx].x,y:alive[bestIdx].y};
  }

  /* ── FIRE EVENT (smart targeting) ── */
  function fireEvent(g,type,elimCount){
    var ev={type:type,life:0,elim:elimCount,elimsLeft:elimCount,done:false,active:false};
    var cluster=findCluster(g);
    if(type==='dangerZone'){
      ev.w=100+Math.random()*130;ev.h=85+Math.random()*100;
      // Center on cluster with some randomness
      ev.x=Math.max(10,Math.min(AW-ev.w-10,cluster.x-ev.w/2+(Math.random()-0.5)*60));
      ev.y=Math.max(10,Math.min(AH-ev.h-10,cluster.y-ev.h/2+(Math.random()-0.5)*40));
      ev.maxLife=180;
      later(function(){ev.active=true;},700);
      later(function(){ev.active=false;ev.done=true;forceRemElim(g,ev);g.events=g.events.filter(function(e){return e!==ev;});},2600);
    }else if(type==='shockwave'){
      // Center shockwave near cluster
      ev.cx=cluster.x+(Math.random()-0.5)*80;ev.cy=cluster.y+(Math.random()-0.5)*60;
      ev.cx=Math.max(40,Math.min(AW-40,ev.cx));ev.cy=Math.max(40,Math.min(AH-40,ev.cy));
      ev.r=0;ev.maxR=Math.max(AW,AH)*0.75;ev.maxLife=100;
      ev.active=true;
      later(function(){ev.done=true;forceRemElim(g,ev);g.events=g.events.filter(function(e){return e!==ev;});},2000);
    }else if(type==='magnet'){
      // Place magnet near cluster
      ev.x=cluster.x+(Math.random()-0.5)*100;ev.y=cluster.y+(Math.random()-0.5)*80;
      ev.x=Math.max(30,Math.min(AW-30,ev.x));ev.y=Math.max(30,Math.min(AH-30,ev.y));
      ev.maxLife=180;ev.active=true;
      later(function(){ev.done=true;forceRemElim(g,ev);g.events=g.events.filter(function(e){return e!==ev;});},2600);
    }else if(type==='cut'){
      // Cut through the cluster
      ev.axis=Math.random()>0.5?'h':'v';
      ev.pos=ev.axis==='h'?Math.max(BR*3,Math.min(AH-BR*3,cluster.y+(Math.random()-0.5)*30)):Math.max(BR*3,Math.min(AW-BR*3,cluster.x+(Math.random()-0.5)*30));
      ev.progress=0;ev.prevProgress=0;ev.maxLife=75;ev.active=true;
      later(function(){ev.done=true;forceRemElim(g,ev);g.events=g.events.filter(function(e){return e!==ev;});},2200);
    }else if(type==='gravityFlip'){
      var dirs=[{x:0,y:-0.14},{x:0.14,y:0},{x:-0.14,y:0},{x:0,y:0.14}];
      var d=dirs[Math.floor(Math.random()*dirs.length)];
      ev.oldGrav={x:g.gravity.x,y:g.gravity.y};g.gravity.x=d.x;g.gravity.y=d.y;
      ev.maxLife=120;ev.active=false;
      later(function(){g.gravity.x=ev.oldGrav.x;g.gravity.y=ev.oldGrav.y;ev.done=true;forceRemElim(g,ev);},1800);
      later(function(){g.events=g.events.filter(function(e){return e!==ev;});},2200);
    }
    g.events.push(ev);
  }

  /* ── FORCE REMAINING ELIMINATIONS (pre-targeting + particle burst) ── */
  function forceRemElim(g,ev){
    if(ev.elimsLeft<=0)return;
    var alive=g.balls.filter(function(b){return b.alive&&!b.condemned;});
    if(alive.length<=1)return;
    var count=Math.min(ev.elimsLeft,alive.length-1);
    var sorted=alive.slice();
    if(ev.type==='dangerZone'){var zx=ev.x+ev.w/2;var zy=ev.y+ev.h/2;sorted.sort(function(a,b){return Math.sqrt((a.x-zx)*(a.x-zx)+(a.y-zy)*(a.y-zy))-Math.sqrt((b.x-zx)*(b.x-zx)+(b.y-zy)*(b.y-zy));});}
    else if(ev.type==='magnet'){sorted.sort(function(a,b){return Math.sqrt((a.x-ev.x)*(a.x-ev.x)+(a.y-ev.y)*(a.y-ev.y))-Math.sqrt((b.x-ev.x)*(b.x-ev.x)+(b.y-ev.y)*(b.y-ev.y));});}
    else{for(var i=sorted.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=sorted[i];sorted[i]=sorted[j];sorted[j]=t;}}
    ev.elimsLeft=0;
    var targets=sorted.slice(0,count);
    // Phase 1: mark targets with pre-targeting warning (680ms)
    targets.forEach(function(ball){
      ball.targeting=1;ball.targetCause=ev.type;ball.condemned=true;
      // Push ball toward event center for visual drama
      var cx=ev.cx!=null?ev.cx:(ev.x!=null?ev.x+ev.w/2:AW/2);
      var cy=ev.cy!=null?ev.cy:(ev.y!=null?ev.y+ev.h/2:AH/2);
      var dx=cx-ball.x;var dy=cy-ball.y;var dl=Math.sqrt(dx*dx+dy*dy)||1;
      ball.vx+=dx/dl*4.5;ball.vy+=dy/dl*4.5;
    });
    // Phase 2: 680ms later — explode targets
    later(function(){
      if(g.done)return;
      var killed=[];
      targets.forEach(function(ball){
        if(!ball.alive)return;
        ball.alive=false;ball.elimT=0;ball.elimFlash=1;ball.elimCause=ev.type;
        ball.targeting=0;ball.condemned=false;
        spawnParticles(g,ball.x,ball.y,ball.color,50,ev.type);
        spawnFloater(g,ball.x,ball.y-BR-8,CAUSE_FLOATS[ev.type]||'💥 OUT!',CAUSE_COLORS[ev.type]||'#fff');
        g.elimList.push({name:ball.name,color:ball.color});
        playHit();
        killed.push(ball);
      });
      var aliveNow=g.balls.filter(function(b){return b.alive}).length;
      killed.forEach(function(ball,bi){addKill(ball.name,ev.type,aliveNow+killed.length-bi);});
      setEliminated(g.elimList.slice());
      setSurviving(aliveNow);
    },680);
  }

  /* ── CHECK WINNER ── */
  function checkWinner(g){
    if(g.done)return;
    var alive=g.balls.filter(function(b){return b.alive});
    if(alive.length===1){
      g.done=true;
      var w=alive[0].name;
      setWinner(w);setPhase('winner');setShowConfetti(true);onResult(w);
      setStatusText('\u{1F3C6} '+w+' \u00DCBERLEBT!');stopAH(audioRef.current);audioRef.current=null;
    }else if(alive.length>1){
      setStatusText('\u{1F631} Noch '+alive.length+' \u00FCbrig...');
      later(function(){
        if(g.done)return;
        var al=g.balls.filter(function(b){return b.alive});
        if(al.length>1){
          var v=al[Math.floor(Math.random()*(al.length-1))];
          v.alive=false;v.elimT=0;v.elimFlash=1;v.elimCause='cut';
          playHit();
          spawnParticles(g,v.x,v.y,v.color,50,'cut');
          spawnFloater(g,v.x,v.y-BR-8,'✂️ FINISHER!','#facc15');
          g.elimList.push({name:v.name,color:v.color});
          addKill(v.name,'cut',al.length-1);
          setEliminated(g.elimList.slice());
          setSurviving(g.balls.filter(function(b){return b.alive}).length);
        }
        later(function(){checkWinner(g);},800);
      },800);
    }
  }

  /* ── PHYSICS ── */
  function physicsStep(g,dt){
    var balls=g.balls;
    // Update cut prevProgress before advancing
    for(var ep=0;ep<g.events.length;ep++){if(g.events[ep].type==='cut')g.events[ep].prevProgress=g.events[ep].progress;}
    // Advance event life
    for(var ei=0;ei<g.events.length;ei++){
      var ev=g.events[ei];ev.life+=dt;
      if(ev.type==='shockwave')ev.r=ev.maxR*(ev.life/ev.maxLife);
      if(ev.type==='cut')ev.progress=Math.min(1,ev.life/ev.maxLife);
    }
    // Ball updates
    for(var i=0;i<balls.length;i++){
      var b=balls[i];
      if(!b.alive){b.elimT=Math.min(1,b.elimT+0.04*dt);if(b.elimFlash>0)b.elimFlash=Math.max(0,b.elimFlash-0.055*dt);continue;}
      b.vx+=g.gravity.x*dt;b.vy+=g.gravity.y*dt;
      for(var ei2=0;ei2<g.events.length;ei2++){
        var ev2=g.events[ei2];
        if(ev2.type==='magnet'){
          var dx=ev2.x-b.x;var dy=ev2.y-b.y;
          var dist=Math.sqrt(dx*dx+dy*dy);
          if(dist>3){var f=Math.min(1.5,120/(dist*dist))*dt;b.vx+=dx/dist*f;b.vy+=dy/dist*f;}
        }else if(ev2.type==='shockwave'){
          var dx2=b.x-ev2.cx;var dy2=b.y-ev2.cy;
          var dist2=Math.sqrt(dx2*dx2+dy2*dy2);
          if(dist2>0&&Math.abs(dist2-ev2.r)<50){
            var pf=Math.max(0,1-Math.abs(dist2-ev2.r)/50)*5*dt;
            b.vx+=dx2/dist2*pf;b.vy+=dy2/dist2*pf;
          }
        }
      }
      // Damping + tiny random drift
      b.vx*=Math.pow(0.990,dt);b.vy*=Math.pow(0.990,dt);
      b.vx+=(Math.random()-0.5)*0.06*dt;b.vy+=(Math.random()-0.5)*0.06*dt;
      var spd=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
      if(spd<0.3){var ra=Math.random()*Math.PI*2;b.vx+=Math.cos(ra)*0.5;b.vy+=Math.sin(ra)*0.5;} // keep moving
      if(spd>6){b.vx=b.vx/spd*6;b.vy=b.vy/spd*6;}
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      // Elastic wall bounce
      if(b.x-BR<0){b.x=BR;b.vx=Math.abs(b.vx)*0.8;}
      if(b.x+BR>AW){b.x=AW-BR;b.vx=-Math.abs(b.vx)*0.8;}
      if(b.y-BR<0){b.y=BR;b.vy=Math.abs(b.vy)*0.8;}
      if(b.y+BR>AH){b.y=AH-BR;b.vy=-Math.abs(b.vy)*0.8;}
      if(b.fakeDanger>0)b.fakeDanger=Math.max(0,b.fakeDanger-0.022*dt);
    }
    // Ball-ball collision
    for(var i2=0;i2<balls.length-1;i2++){
      for(var jj=i2+1;jj<balls.length;jj++){
        var ba=balls[i2];var bb=balls[jj];
        if(!ba.alive||!bb.alive)continue;
        var dx3=bb.x-ba.x;var dy3=bb.y-ba.y;
        var dist3=Math.sqrt(dx3*dx3+dy3*dy3);var minD=BR*2;
        if(dist3<minD&&dist3>0.01){
          var nx=dx3/dist3;var ny=dy3/dist3;var ov=(minD-dist3)/2;
          ba.x-=nx*ov;ba.y-=ny*ov;bb.x+=nx*ov;bb.y+=ny*ov;
          var rv=ba.vx-bb.vx;var rvy=ba.vy-bb.vy;var dot=rv*nx+rvy*ny;
          if(dot>0){ba.vx-=dot*nx*0.5;ba.vy-=dot*ny*0.5;bb.vx+=dot*nx*0.5;bb.vy+=dot*ny*0.5;}
        }
      }
    }
    // ── Event-based elimination detection ──
    var newElims=[];
    for(var bi3=0;bi3<balls.length;bi3++){
      var bchk=balls[bi3];
      if(!bchk.alive)continue;
      for(var ei3=0;ei3<g.events.length;ei3++){
        var evchk=g.events[ei3];
        if(!evchk.active||evchk.elimsLeft<=0||evchk.done)continue;
        var hit=false;
        if(evchk.type==='dangerZone'){
          hit=(bchk.x>=evchk.x&&bchk.x<=evchk.x+evchk.w&&bchk.y>=evchk.y&&bchk.y<=evchk.y+evchk.h);
        }else if(evchk.type==='cut'){
          var lineNow=(evchk.axis==='h')?evchk.progress*AH:evchk.progress*AW;
          var linePrev=(evchk.axis==='h')?evchk.prevProgress*AH:evchk.prevProgress*AW;
          var ballPos=(evchk.axis==='h')?bchk.y:bchk.x;
          hit=(ballPos>=Math.min(linePrev,lineNow)-BR&&ballPos<=Math.max(linePrev,lineNow)+BR);
        }else if(evchk.type==='magnet'){
          var dMag=Math.sqrt((bchk.x-evchk.x)*(bchk.x-evchk.x)+(bchk.y-evchk.y)*(bchk.y-evchk.y));
          hit=(dMag<BR*2);
        }else if(evchk.type==='shockwave'){
          var dWave=Math.sqrt((bchk.x-evchk.cx)*(bchk.x-evchk.cx)+(bchk.y-evchk.cy)*(bchk.y-evchk.cy));
          hit=(Math.abs(dWave-evchk.r)<BR*2.2&&!bchk.shockHit);
          if(hit)bchk.shockHit=true;
        }
        if(hit){
          bchk.alive=false;bchk.elimT=0;bchk.elimFlash=1;bchk.elimCause=evchk.type;
          evchk.elimsLeft--;
          newElims.push(bchk);
          break;
        }
      }
    }
    if(newElims.length>0){
      var aliveAfter=g.balls.filter(function(b){return b.alive}).length;
      newElims.forEach(function(b,bi){
        g.elimList.push({name:b.name,color:b.color});
        playHit();
        addKill(b.name,b.elimCause,aliveAfter+newElims.length-bi);
        spawnParticles(g,b.x,b.y,b.color,45,b.elimCause);
        spawnFloater(g,b.x,b.y-BR-8,CAUSE_FLOATS[b.elimCause]||'💥 OUT!',CAUSE_COLORS[b.elimCause]||'#fff');
      });
      setEliminated(g.elimList.slice());
      setSurviving(aliveAfter);
    }
    // Tick particles
    for(var pxi=g.particles.length-1;pxi>=0;pxi--){
      var pt=g.particles[pxi];
      if(!pt.isRing){pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=0.12*dt;pt.vx*=Math.pow(0.93,dt);}
      else{pt.r=BR+(1-pt.life)*(pt.maxR-BR);}
      pt.life-=pt.decay*dt;
      if(pt.life<=0)g.particles.splice(pxi,1);
    }
    // Tick floaters
    for(var fxi=g.floaters.length-1;fxi>=0;fxi--){
      var fl=g.floaters[fxi];fl.y+=fl.vy*dt;fl.life-=fl.decay*dt;
      if(fl.life<=0)g.floaters.splice(fxi,1);
    }
    // Tick targeting
    for(var txi=0;txi<g.balls.length;txi++){var tb=g.balls[txi];if(tb.targeting>0)tb.targeting=Math.max(0,tb.targeting-0.015*dt);}
  }

  /* ── DRAW ── */
  function buildArena(){
    var c=document.createElement('canvas');
    c.width=AW*2;c.height=AH*2;
    var t=c.getContext('2d');t.setTransform(2,0,0,2,0,0);

    // Boden
    var bg=t.createRadialGradient(AW/2,AH/2,20,AW/2,AH/2,Math.max(AW,AH)*0.78);
    bg.addColorStop(0,'#161a34');bg.addColorStop(0.55,'#0d1024');bg.addColorStop(1,'#05060f');
    t.fillStyle=bg;t.fillRect(0,0,AW,AH);

    // Neon-Raster
    t.strokeStyle='rgba(99,102,241,0.20)';t.lineWidth=1;
    for(var gx=0;gx<=AW;gx+=34){t.beginPath();t.moveTo(gx,0);t.lineTo(gx,AH);t.stroke();}
    for(var gy=0;gy<=AH;gy+=34){t.beginPath();t.moveTo(0,gy);t.lineTo(AW,gy);t.stroke();}
    t.strokeStyle='rgba(56,189,248,0.16)';t.lineWidth=2;
    for(var gx2=0;gx2<=AW;gx2+=136){t.beginPath();t.moveTo(gx2,0);t.lineTo(gx2,AH);t.stroke();}
    for(var gy2=0;gy2<=AH;gy2+=136){t.beginPath();t.moveTo(0,gy2);t.lineTo(AW,gy2);t.stroke();}

    // Mittelkreis
    t.save();
    t.strokeStyle='rgba(168,85,247,0.30)';t.lineWidth=2;
    t.beginPath();t.arc(AW/2,AH/2,Math.min(AW,AH)*0.30,0,Math.PI*2);t.stroke();
    t.setLineDash([6,10]);
    t.strokeStyle='rgba(56,189,248,0.28)';t.lineWidth=1.5;
    t.beginPath();t.arc(AW/2,AH/2,Math.min(AW,AH)*0.20,0,Math.PI*2);t.stroke();
    t.beginPath();t.arc(AW/2,AH/2,Math.min(AW,AH)*0.40,0,Math.PI*2);t.stroke();
    t.setLineDash([]);
    t.restore();

    // Ecken-Marker
    var corners=[[26,26,0],[AW-26,26,Math.PI/2],[AW-26,AH-26,Math.PI],[26,AH-26,-Math.PI/2]];
    for(var ci=0;ci<4;ci++){
      t.save();t.translate(corners[ci][0],corners[ci][1]);t.rotate(corners[ci][2]);
      t.strokeStyle='rgba(244,63,94,0.55)';t.lineWidth=3;t.lineCap='round';
      t.beginPath();t.moveTo(0,16);t.lineTo(0,0);t.lineTo(16,0);t.stroke();
      t.restore();
    }

    // Warnstreifen am Rand
    t.save();
    t.globalAlpha=0.30;
    for(var s=-AH;s<AW+AH;s+=22){
      t.fillStyle=(Math.round(s/22)%2===0)?'#f59e0b':'#111827';
      t.beginPath();t.moveTo(s,0);t.lineTo(s+11,0);t.lineTo(s+11-9,9);t.lineTo(s-9,9);t.closePath();t.fill();
      t.beginPath();t.moveTo(s,AH-9);t.lineTo(s+11,AH-9);t.lineTo(s+11-9,AH);t.lineTo(s-9,AH);t.closePath();t.fill();
    }
    t.restore();
    t.strokeStyle='rgba(148,163,184,0.30)';t.lineWidth=1;
    t.strokeRect(0.5,9.5,AW-1,AH-19);

    // Vignette
    var vg=t.createRadialGradient(AW/2,AH/2,AH*0.28,AW/2,AH/2,AH*0.95);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.68)');
    t.fillStyle=vg;t.fillRect(0,0,AW,AH);
    return c;
  }

  function drawFrame(){
    var canvas=canvasRef.current;if(!canvas)return;
    var g=gRef.current;if(!g)return;
    var ctx=canvas.getContext('2d');
    var now=Date.now();
    ctx.setTransform(2,0,0,2,0,0);

    if(!g.arena)g.arena=buildArena();
    ctx.drawImage(g.arena,0,0,AW,AH);

    // Puls-Ringe vom Zentrum
    for(var pr=0;pr<3;pr++){
      var pp=((now*0.00022+pr*0.33)%1);
      ctx.strokeStyle='rgba(99,102,241,'+(0.16*(1-pp))+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(AW/2,AH/2,pp*Math.max(AW,AH)*0.62,0,Math.PI*2);ctx.stroke();
    }
    // Scanline
    var scy=(now*0.06)%(AH+120)-60;
    var sgr=ctx.createLinearGradient(0,scy-26,0,scy+26);
    sgr.addColorStop(0,'rgba(56,189,248,0)');
    sgr.addColorStop(0.5,'rgba(56,189,248,0.07)');
    sgr.addColorStop(1,'rgba(56,189,248,0)');
    ctx.fillStyle=sgr;ctx.fillRect(0,scy-26,AW,52);

    for(var ei=0;ei<g.events.length;ei++){
      var ev=g.events[ei];
      if(ev.type==='dangerZone'){
        var pulse=0.5+0.5*Math.sin(ev.life*0.25);
        ctx.save();
        ctx.beginPath();ctx.rect(ev.x,ev.y,ev.w,ev.h);ctx.clip();
        ctx.fillStyle='rgba(69,10,10,0.45)';ctx.fillRect(ev.x,ev.y,ev.w,ev.h);
        ctx.globalAlpha=0.16+pulse*0.12;
        var off=(now*0.03)%28;
        for(var st=-ev.h;st<ev.w+ev.h;st+=28){
          ctx.fillStyle='#ef4444';
          ctx.beginPath();
          ctx.moveTo(ev.x+st+off,ev.y);ctx.lineTo(ev.x+st+off+14,ev.y);
          ctx.lineTo(ev.x+st+off+14-ev.h,ev.y+ev.h);ctx.lineTo(ev.x+st+off-ev.h,ev.y+ev.h);
          ctx.closePath();ctx.fill();
        }
        ctx.restore();
        ctx.save();
        ctx.shadowColor='rgba(239,68,68,0.9)';ctx.shadowBlur=12*pulse+4;
        ctx.strokeStyle='rgba(248,113,113,'+(0.65+pulse*0.35)+')';ctx.lineWidth=2.5;
        ctx.strokeRect(ev.x,ev.y,ev.w,ev.h);
        ctx.restore();
        ctx.fillStyle='rgba(254,202,202,'+(0.55+pulse*0.4)+')';
        ctx.font='bold 11px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('⚠ GEFAHRENZONE',ev.x+ev.w/2,ev.y+ev.h/2);
      }else if(ev.type==='shockwave'){
        var swA=Math.max(0,1-ev.r/ev.maxR);
        ctx.save();
        ctx.shadowColor='rgba(251,191,36,0.9)';ctx.shadowBlur=18*swA;
        ctx.beginPath();ctx.arc(ev.cx,ev.cy,Math.max(1,ev.r),0,Math.PI*2);
        ctx.strokeStyle='rgba(254,240,138,'+(swA*0.95)+')';ctx.lineWidth=3+swA*7;ctx.stroke();
        ctx.restore();
        ctx.beginPath();ctx.arc(ev.cx,ev.cy,Math.max(1,ev.r*0.72),0,Math.PI*2);
        ctx.strokeStyle='rgba(251,191,36,'+(swA*0.35)+')';ctx.lineWidth=1.5;ctx.stroke();
        ctx.beginPath();ctx.arc(ev.cx,ev.cy,Math.max(1,ev.r*0.42),0,Math.PI*2);
        ctx.strokeStyle='rgba(255,255,255,'+(swA*0.22)+')';ctx.lineWidth=1;ctx.stroke();
      }else if(ev.type==='magnet'){
        var mp=1+0.15*Math.sin(ev.life*0.25);
        ctx.save();
        var mg=ctx.createRadialGradient(ev.x,ev.y,2,ev.x,ev.y,52*mp);
        mg.addColorStop(0,'rgba(168,85,247,0.55)');
        mg.addColorStop(0.5,'rgba(139,92,246,0.16)');
        mg.addColorStop(1,'rgba(139,92,246,0)');
        ctx.fillStyle=mg;ctx.beginPath();ctx.arc(ev.x,ev.y,52*mp,0,Math.PI*2);ctx.fill();
        for(var ai=0;ai<7;ai++){
          var a0=ev.life*0.05+ai*0.9;
          ctx.strokeStyle='rgba(216,180,254,'+(0.30-ai*0.03)+')';ctx.lineWidth=1.6;
          ctx.beginPath();ctx.arc(ev.x,ev.y,20+ai*6,a0,a0+1.5);ctx.stroke();
        }
        ctx.shadowColor='rgba(168,85,247,0.95)';ctx.shadowBlur=16;
        ctx.beginPath();ctx.arc(ev.x,ev.y,15*mp,0,Math.PI*2);
        ctx.fillStyle='rgba(88,28,135,0.85)';ctx.fill();
        ctx.strokeStyle='rgba(216,180,254,0.95)';ctx.lineWidth=2;ctx.stroke();
        ctx.restore();
        ctx.font='15px serif';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('\u{1F9F2}',ev.x,ev.y);
      }else if(ev.type==='cut'){
        ctx.save();
        ctx.shadowColor='rgba(250,204,21,0.95)';ctx.shadowBlur=16;
        ctx.fillStyle='#fef08a';
        if(ev.axis==='h'){
          ctx.fillRect(0,ev.pos-2,ev.progress*AW,4);
          ctx.fillStyle='rgba(250,204,21,0.25)';ctx.fillRect(0,ev.pos-9,ev.progress*AW,18);
          if(ev.progress<0.99){
            var hx=ev.progress*AW;
            ctx.fillStyle='#fff';
            ctx.beginPath();ctx.arc(hx,ev.pos,7,0,Math.PI*2);ctx.fill();
            for(var sk=0;sk<5;sk++){
              ctx.fillStyle='rgba(253,224,71,'+(0.4+Math.random()*0.5)+')';
              ctx.beginPath();ctx.arc(hx+Math.random()*16-4,ev.pos+(Math.random()-0.5)*20,1.4,0,Math.PI*2);ctx.fill();
            }
          }
        }else{
          ctx.fillRect(ev.pos-2,0,4,ev.progress*AH);
          ctx.fillStyle='rgba(250,204,21,0.25)';ctx.fillRect(ev.pos-9,0,18,ev.progress*AH);
          if(ev.progress<0.99){
            var hy2=ev.progress*AH;
            ctx.fillStyle='#fff';
            ctx.beginPath();ctx.arc(ev.pos,hy2,7,0,Math.PI*2);ctx.fill();
            for(var sk2=0;sk2<5;sk2++){
              ctx.fillStyle='rgba(253,224,71,'+(0.4+Math.random()*0.5)+')';
              ctx.beginPath();ctx.arc(ev.pos+(Math.random()-0.5)*20,hy2+Math.random()*16-4,1.4,0,Math.PI*2);ctx.fill();
            }
          }
        }
        ctx.restore();
        ctx.fillStyle='rgba(253,224,71,0.95)';ctx.font='bold 12px Inter,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='top';
        ctx.fillText('✂ LASER-SCHNITT',ev.axis==='h'?AW*0.5:ev.pos+22,ev.axis==='h'?ev.pos-24:12);
      }else if(ev.type==='gravityFlip'){
        var ga=Math.min(0.55,ev.life/40)*0.7;
        var gAng=Math.atan2(g.gravity.y,g.gravity.x);
        ctx.save();
        ctx.fillStyle='rgba(79,70,229,'+(ga*0.10)+')';ctx.fillRect(0,0,AW,AH);
        for(var gxi=0;gxi<6;gxi++){for(var gyi=0;gyi<5;gyi++){
          var arx=AW/7*(gxi+1);var ary=AH/6*(gyi+1);
          ctx.save();ctx.translate(arx,ary);ctx.rotate(gAng);
          ctx.strokeStyle='rgba(165,180,252,'+ga+')';ctx.lineWidth=1.8;ctx.lineCap='round';
          ctx.beginPath();ctx.moveTo(-9,0);ctx.lineTo(9,0);ctx.lineTo(5,-4);ctx.moveTo(9,0);ctx.lineTo(5,4);
          ctx.stroke();ctx.restore();
        }}
        ctx.restore();
        ctx.fillStyle='rgba(165,180,252,0.85)';ctx.font='bold 12px Inter,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('\u{1F300} GRAVITATIONS-FLIP',AW/2,14);
      }
    }

    // Partikel
    for(var pdi=0;pdi<g.particles.length;pdi++){
      var pt=g.particles[pdi];
      ctx.save();ctx.globalAlpha=Math.max(0,pt.life);
      if(pt.isRing){
        ctx.beginPath();ctx.arc(pt.x,pt.y,Math.max(1,pt.r),0,Math.PI*2);
        ctx.strokeStyle=pt.color;ctx.lineWidth=3*pt.life;ctx.globalAlpha=pt.life*0.8;ctx.stroke();
      }else{
        ctx.shadowColor=pt.color;ctx.shadowBlur=pt.isDebris?7:4;
        ctx.beginPath();ctx.arc(pt.x,pt.y,Math.max(0.5,pt.r*pt.life+0.5),0,Math.PI*2);
        ctx.fillStyle=pt.color;ctx.fill();
      }
      ctx.restore();
    }
    ctx.shadowBlur=0;

    // Zielmarkierungen
    for(var tdi=0;tdi<g.balls.length;tdi++){
      var tb=g.balls[tdi];if(!tb.alive||tb.targeting<=0)continue;
      var tc=CAUSE_COLORS[tb.targetCause]||'#ef4444';
      var pulse2=0.5+0.5*Math.sin(now*0.018);
      ctx.save();
      ctx.strokeStyle=tc;ctx.lineWidth=2+pulse2*2;ctx.globalAlpha=0.4+tb.targeting*0.6;
      ctx.shadowColor=tc;ctx.shadowBlur=16;
      ctx.beginPath();ctx.arc(tb.x,tb.y,BR*1.9+pulse2*4,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(tb.x,tb.y,BR*2.7+pulse2*3,0,Math.PI*2);ctx.lineWidth=1;
      ctx.globalAlpha=0.2+tb.targeting*0.4;ctx.stroke();
      ctx.globalAlpha=tb.targeting*0.9;ctx.lineWidth=1.6;
      var chl=BR*3.6;
      ctx.beginPath();
      ctx.moveTo(tb.x-chl,tb.y);ctx.lineTo(tb.x-BR*1.3,tb.y);
      ctx.moveTo(tb.x+BR*1.3,tb.y);ctx.lineTo(tb.x+chl,tb.y);
      ctx.moveTo(tb.x,tb.y-chl);ctx.lineTo(tb.x,tb.y-BR*1.3);
      ctx.moveTo(tb.x,tb.y+BR*1.3);ctx.lineTo(tb.x,tb.y+chl);
      ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur=0;

    // Figuren
    var order=g.balls.slice().sort(function(a,b){
      if(a.alive!==b.alive)return a.alive?1:-1;
      return a.y-b.y;
    });
    for(var oi=0;oi<order.length;oi++){
      var ball=order[oi];
      var isAlive=ball.alive;
      var alpha=isAlive?1:Math.max(0,1-ball.elimT);
      if(alpha<=0)continue;
      var sc=isAlive?1:Math.max(0.4,1-ball.elimT*0.35);
      var u=BR*0.95*sc;
      var spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      var col=ball.fakeDanger>0.5?'#ef4444':ball.color;

      // Energie-Aura
      if(isAlive){
        ctx.save();ctx.globalAlpha=alpha*0.5;
        var ag=ctx.createRadialGradient(ball.x,ball.y,u*0.3,ball.x,ball.y,u*1.9);
        ag.addColorStop(0,col+'55');ag.addColorStop(1,col+'00');
        ctx.fillStyle=ag;ctx.beginPath();ctx.arc(ball.x,ball.y,u*1.9,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }

      drawHero(ctx,{x:ball.x,y:ball.y+u*0.55,s:u,color:col,
        walk:now*0.012*(0.5+spd*1.2)+ball.id*1.9,
        face:ball.vx<-0.05?-1:1,alpha:alpha,hair:ball.id%6,skin:(ball.id*5)%4,
        gear:'goggles',dead:!isAlive,
        glow:ball.fakeDanger>0?'rgba(239,68,68,'+ball.fakeDanger+')':null,
        lean:isAlive?Math.max(-0.22,Math.min(0.22,ball.vx*0.05)):0.9});

      // Name
      ctx.save();ctx.globalAlpha=alpha;
      var nameStr=truncName(ball.name,NMAX);
      var lf=fitFont(ctx,nameStr,u*3.4,FS,8);
      var tw=ctx.measureText(nameStr).width;
      var ly=ball.y-u*1.55;
      ctx.fillStyle='rgba(2,6,23,0.66)';
      hRR(ctx,ball.x-tw/2-5,ly-lf*0.72,tw+10,lf*1.44,lf*0.5);ctx.fill();
      ctx.fillStyle=col;ctx.fillRect(ball.x-tw/2-5,ly-lf*0.72,2.5,lf*1.44);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(nameStr,ball.x,ly);
      ctx.restore();

      // Explosionsringe bei frischer Elimination
      if(!isAlive&&ball.elimFlash>0){
        var bc=CAUSE_COLORS[ball.elimCause]||'#ffffff';
        ctx.save();
        for(var ri=0;ri<3;ri++){
          var rr=u*(1.4+(1-ball.elimFlash)*3.6)*(0.4+ri*0.35);
          ctx.globalAlpha=ball.elimFlash*Math.max(0,1-ri*0.28);
          ctx.strokeStyle=bc;ctx.lineWidth=(3-ri)*ball.elimFlash+0.5;
          ctx.beginPath();ctx.arc(ball.x,ball.y,rr,0,Math.PI*2);ctx.stroke();
        }
        ctx.restore();
      }
    }
    ctx.globalAlpha=1;

    // Zähler
    var aliveN=g.balls.filter(function(b){return b.alive}).length;
    ctx.save();
    ctx.fillStyle='rgba(2,6,23,0.62)';
    hRR(ctx,AW-96,AH-32,88,24,7);ctx.fill();
    ctx.strokeStyle='rgba(244,63,94,0.35)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#fecdd3';ctx.font='bold 12px Inter,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText('☠ '+aliveN+' übrig',AW-16,AH-20);
    ctx.restore();

    // Floater
    for(var fdi=0;fdi<g.floaters.length;fdi++){
      var fl=g.floaters[fdi];
      ctx.save();ctx.globalAlpha=Math.max(0,fl.life);
      ctx.font='bold 15px Inter,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor=fl.color;ctx.shadowBlur=14;
      ctx.strokeStyle='rgba(0,0,0,0.95)';ctx.lineWidth=3.5;ctx.lineJoin='round';
      ctx.strokeText(fl.text,fl.x,fl.y);
      ctx.fillStyle=fl.color;ctx.fillText(fl.text,fl.x,fl.y);
      ctx.restore();
    }
    ctx.shadowBlur=0;
  }

  /* ── RESET ── */
  function resetChaos(){
    doCleanup();setPhase('idle');setWinner(null);setEliminated([]);setShowConfetti(false);
    setSurviving(0);setStatusText('Bereit f\u00FCr das Chaos!');setKillFeed([]);
    if(canvasRef.current){var c=canvasRef.current.getContext('2d');c.clearRect(0,0,AW,AH);}
  }

  return(
    html`<div className="flex flex-col items-center w-full max-w-5xl">
      ${showConfetti&&html`<${Confetti}/>`}
      ${eventBanner&&html`<div key=${eventBanner.id} className="event-banner" style=${{background:'rgba(10,10,20,0.85)',border:'2px solid '+eventBanner.color,color:eventBanner.color}}>${eventBanner.text}</div>`}
      ${shockRings.map(function(r){return html`<div key=${r.id} className="shockwave-ring" style=${{left:r.x+'%',top:r.y+'%',transform:'translate(-50%,-50%)'}}/>`;})}
      <div className="text-center mb-3">
        <p role="status" aria-live="polite" className="text-gray-800 text-base font-semibold mb-1">${statusText}</p>
        ${phase==='running'&&html`<p className="text-gray-500 text-xs">${surviving} Teilnehmer \u00FCbrig</p>`}
      </div>
      <div className=${"relative w-full mb-4 rounded-2xl overflow-hidden border border-gray-800/60 shadow-xl shadow-red-950/20"+(arenaShake?' grid-shake':'')}>
        <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{display:'block',width:'100%',height:'auto'}} role="img" aria-label="Spielanimation"/>
        ${phase==='idle'&&html`<div className="absolute inset-0 flex items-center justify-center bg-gray-950/85 rounded-2xl"><div className="text-center"><div className="text-5xl mb-3">\u{1F4A5}</div><p className="text-white/50 text-sm">Chaos Arena wartet...</p></div></div>`}
        ${killFeed.length>0&&phase==='running'&&html`<div className="absolute top-2 left-2 z-20 pointer-events-none" style=${{maxWidth:'55%'}}>
          ${killFeed.map(function(kf,ki){return html`<div key=${kf.time+'_'+ki} className="font-bold mb-1 px-2.5 py-1 rounded bg-black/75 text-white fade-in" style=${{textShadow:'0 1px 3px rgba(0,0,0,0.8)',fontSize:13}}>${kf.text}</div>`;})}
        </div>`}
      </div>
      ${eliminated.length>0&&html`<div className="w-full max-w-3xl mb-4">
        <p className="text-gray-500 text-center mb-1.5" style=${{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em'}}>Eliminiert</p>
        <div className="flex flex-wrap gap-1.5 justify-center bg-gray-50 rounded-xl p-2.5 border border-gray-200">
          ${eliminated.map(function(e,i){return html`<div key=${i} className="tray-ball tray-pop" style=${{background:'radial-gradient(circle at 35% 30%,'+e.color+'dd,'+e.color+'aa)',animationDelay:(i*0.04)+'s'}}>${truncName(e.name,8)}</div>`;})}
        </div>
      </div>`}
      ${winner&&html`<div className="winner-enter mb-5">
        <div className=${"winner-card bg-gradient-to-br "+CARD_COLORS[nameToColorIdx(winner)]+" rounded-2xl px-10 py-6 text-white text-center shadow-2xl border-2 border-amber-400/40"}>
          <div className="text-amber-200 text-sm font-semibold tracking-widest uppercase mb-1">\u00DCberlebender</div>
          <div className="text-4xl font-black tracking-tight">${winner}</div>
          <div className="mt-2 text-2xl">\u{1F3C6}\u{1F525}\u{1F3C6}</div>
          <${CopyButton} modeName="Chaos Arena" winner=${winner}/>
        </div>
      </div>`}
      <div className="flex gap-3 mt-2">
        ${phase==='idle'&&html`<button onClick=${startChaos} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white shadow-lg shadow-red-500/20 transition-all">\u2620 Chaos starten</button>`}
        ${phase==='running'&&html`<button onClick=${function(){resetChaos();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">\u2715 Abbrechen</button>`}
        ${phase==='winner'&&html`<span>
          <button onClick=${resetChaos} className="px-6 py-3 rounded-xl font-semibold bg-red-50 text-red-700 border border-red-200 hover:bg-red-100 transition-all mr-3">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button>
        </span>`}
      </div>
    </div>`
  );
}


/* ═══════════════════════════════════════════════════════
   LABYRINTH — offenes Holzbrett, Kugeln laufen quer über
   alle Bahnen. Volle Becher schließen sich automatisch.
   Nur Kreis-Kollisionen → keine Klemmstellen.
   ═══════════════════════════════════════════════════════ */
function MarbleMazeMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('pick');var phase=_ph[0];var setPhase=_ph[1];
  var _gr=useState([]);var groups=_gr[0];var setGroups=_gr[1];
  var _cap=useState([]);var caps=_cap[0];var setCaps=_cap[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _dr=useState(0);var dropped=_dr[0];var setDropped=_dr[1];
  var _ld=useState(0);var landed=_ld[0];var setLanded=_ld[1];
  var _sc=useState(0);var score=_sc[0];var setScore=_sc[1];
  var _tlt=useState(false);var isTilting=_tlt[0];var setIsTilting=_tlt[1];
  var canvasRef=useRef(null);
  var bgCanvasRef=useRef(null);
  var rafRef=useRef(null);
  var gRef=useRef(null);
  var timers=useRef([]);
  var audioRef=useRef(null);
  var mouseRef=useRef({x:0.5,y:0.5});
  var lastBounceRef=useRef({t:0,count:0});

  var AW=700;var AH=720;
  var FRAME=30;
  var FIELD_L=FRAME;var FIELD_R=AW-FRAME;var FIELD_T=FRAME;var FIELD_B=AH-FRAME;
  var CUP_TOP=FIELD_B-104;
  var _ng=useState(4);var NUM_GROUPS=_ng[0];var setNumGroups=_ng[1];
  var MAZE_COLORS=['#C0392B','#2980B9','#27AE60','#F39C12','#8E44AD','#16A085'];

  useEffect(function(){return function(){doCleanup();}},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='pick'){e.preventDefault();startPlinko();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase,NUM_GROUPS]);

  function doCleanup(){
    timers.current.forEach(clearTimeout);timers.current=[];
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
    bgCanvasRef.current=null;
  }
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}

  /* ── AUDIO ── */
  function startAudio(){
    try{var ah=createAudioCtx();if(!ah)return;audioRef.current=ah;
      ah.master.gain.value=0.32;playMazeMusic(ah);}catch(e){}
  }
  function playBounceThrottled(type,impact){
    var now=performance.now();var lb=lastBounceRef.current;
    if(now-lb.t<90){lb.count++;if(lb.count>5)return;}else{lb.t=now;lb.count=0;}
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var d=ah.master;var ct=ctx.currentTime;
      if(type==='wood')aT(ctx,d,170+Math.min(impact,8)*26,ct,0.026,0.075,'triangle');
      else if(type==='pin')aT(ctx,d,600+Math.random()*200,ct,0.02,0.06,'sine');
      else if(type==='bumper'){aT(ctx,d,420,ct,0.07,0.16,'square');aT(ctx,d,660,ct+0.04,0.09,0.11,'square');}
      else if(type==='spin')aT(ctx,d,330+Math.random()*120,ct,0.05,0.09,'triangle');
      else if(type==='lid')aT(ctx,d,140,ct,0.05,0.12,'square');
    }catch(e){}
  }
  function playCupDrop(){
    try{var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var d=ah.master;var ct=ctx.currentTime;
      aT(ctx,d,392,ct,0.10,0.14,'triangle');
