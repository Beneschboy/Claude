      wind.connect(wf);wf.connect(wg);wg.connect(master);wind.start();
      if(ah.oscs)ah.oscs.push(wind);
      // Deep bass pulse
      var drone=ctx.createOscillator();drone.type='sawtooth';drone.frequency.value=45;
      var dg=ctx.createGain();dg.gain.value=0.25;
      var df=ctx.createBiquadFilter();df.type='lowpass';df.frequency.value=150;
      drone.connect(df);df.connect(dg);dg.connect(master);drone.start();
      if(ah.oscs)ah.oscs.push(drone);
      // Rhythmic tension
      var now=ctx.currentTime;var b=60/110;
      for(var si=0;si<80;si++){
        var t=now+si*b*0.5;
        if(si%4===0){aT(ctx,master,50,t,0.25,0.5);aT(ctx,master,37,t+0.01,0.15,0.35);}
        if(si%4===2){aT(ctx,master,70,t,0.1,0.3);}
        if(si%8===0&&si>8){aC(ctx,master,t,[196,246.94,293.66],0.12,0.6,'triangle');}
        if(si%16===0&&si>16){aC(ctx,master,t,[392,493.88,587.33],0.08,1.0,'triangle');}
        if(si>50){aT(ctx,master,55+si*0.5,t,0.15,0.15+((si-50)/30)*0.3,'triangle');}
      }
      master.gain.linearRampToValueAtTime(0.65,ctx.currentTime+8);
      master.gain.linearRampToValueAtTime(0.85,ctx.currentTime+15);
    }catch(e){}
  }
  function playElimSound(){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;var now=ctx.currentTime;
      aT(ctx,dest,90,now,0.12,0.8);aT(ctx,dest,140,now+0.02,0.08,0.5,'square');
      var buf=ctx.createBuffer(1,ctx.sampleRate*0.1,ctx.sampleRate);
      var dd=buf.getChannelData(0);for(var i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*0.5;
      var src=ctx.createBufferSource();src.buffer=buf;
      var ng=ctx.createGain();ng.gain.setValueAtTime(0.6,now);ng.gain.exponentialRampToValueAtTime(0.001,now+0.1);
      src.connect(ng);ng.connect(dest);src.start(now);
    }catch(e){}
  }
  function playVictorySound(){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;var now=ctx.currentTime;
      var fanfare=[523.25,659.25,783.99,1046.5];
      for(var i=0;i<fanfare.length;i++){aT(ctx,dest,fanfare[i],now+i*0.15,0.4,0.3,'triangle');}
      aC(ctx,dest,now+0.7,[523.25,659.25,783.99,1046.5],0.25,1.5,'triangle');
    }catch(e){}
  }

  /* ── INIT ── */
  function initPlayers(){
    var players=[];var margin=BR*3;
    for(var i=0;i<names.length;i++){
      var attempts=0,x,y;
      do{x=margin+Math.random()*(AW-margin*2);y=margin+Math.random()*(AH-margin*2);attempts++;}
      while(attempts<80&&players.some(function(p){return Math.sqrt(Math.pow(p.x-x,2)+Math.pow(p.y-y,2))<BR*2.8}));
      var ang=Math.random()*Math.PI*2;var spd=0.8+Math.random()*1.2;
      players.push({id:i,name:names[i],color:BALL_COLORS[i%BALL_COLORS.length],
        x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
        hp:100,alive:true,elimT:0,dropY:-60-Math.random()*80,dropped:false,
        stormDmgAcc:0,shieldT:0});
    }
    return players;
  }

  /* ── ZONE ── */
  function makeZone(){
    return{cx:AW/2,cy:AH/2,r:Math.max(AW,AH)*0.7,
      targetCx:AW/2,targetCy:AH/2,targetR:Math.max(AW,AH)*0.7,
      shrinking:false,phase:0};
  }

  /* ── START ── */
  function startBR(){
    doCleanup();
    var g={players:initPlayers(),zone:makeZone(),events:[],dmgNums:[],elimFlashes:[],done:false,
      startT:performance.now(),dropPhase:true,redZones:[],airdrops:[]};
    gRef.current=g;
    setEliminated([]);setWinner(null);setShowConfetti(false);setSurviving(names.length);setTickerFeed([]);setZonePhase(0);
    setPhase('running');setStatusText('\u{1F9E0} Los geht\'s!');
    startAudio();
    scheduleGame(g);
    var last=performance.now();
    function loop(now){
      var dt=Math.min((now-last)/16.67,3);last=now;
      var alive=g.players.filter(function(p){return p.alive}).length;
      if(alive<=3&&alive>0)dt*=0.55;
      updateGame(g,dt,now);drawFrame(g,now);
      if(!g.done)rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  /* ── GAME SCHEDULE ── */
  function scheduleGame(g){
    var n=names.length;var t=0;

    // Drop phase: 1.5s
    later(function(){
      g.dropPhase=false;
      setStatusText('\u{1F32B}\uFE0F Die Nebelwand zieht auf \u2014 Runde 1');setZonePhase(1);
    },1500);

    // Phase 1: Zone shrinks to 60%, 3s
    t=1800;
    later(function(){
      if(g.done)return;
      var cx=AW*0.3+Math.random()*AW*0.4;var cy=AH*0.3+Math.random()*AH*0.4;
      g.zone.targetCx=cx;g.zone.targetCy=cy;
      g.zone.targetR=Math.max(AW,AH)*0.42;g.zone.shrinking=true;g.zone.phase=1;
    },t);
    // Red zone event
    later(function(){
      if(g.done)return;
      setStatusText('❓ Fragenhagel!');
      spawnRedZone(g);
    },t+1200);

    // Phase 2: Zone shrinks to 35%, 3s
    t=5500;
    later(function(){
      if(g.done)return;
      setStatusText('\u26A0 Der Nebel wird enger \u2014 Runde 2');setZonePhase(2);
      var cx=g.zone.cx+(-0.15+Math.random()*0.3)*(AW*0.2);
      var cy=g.zone.cy+(-0.15+Math.random()*0.3)*(AH*0.2);
      cx=Math.max(AW*0.2,Math.min(AW*0.8,cx));cy=Math.max(AH*0.2,Math.min(AH*0.8,cy));
      g.zone.targetCx=cx;g.zone.targetCy=cy;
      g.zone.targetR=Math.max(AW,AH)*0.28;g.zone.phase=2;
    },t);
    later(function(){if(g.done)return;spawnRedZone(g);setStatusText('❓ Fragenhagel!');},t+1500);
    later(function(){if(g.done)return;spawnAirdrop(g);},t+800);
    later(function(){if(g.done)return;spawnMeteorShower(g);setStatusText('\u{1F4DD} Formel-Regen!');},t+2200);
    later(function(){if(g.done)return;spawnHealingStation(g);},t+3200);

    // Phase 3: Zone shrinks to 18%
    t=9000;
    later(function(){
      if(g.done)return;
      setStatusText('\u{1F525} Vorletzte Runde!');setZonePhase(3);
      g.zone.targetR=Math.max(AW,AH)*0.15;g.zone.phase=3;
    },t);
    later(function(){if(g.done)return;spawnRedZone(g);},t+1000);

    // Phase 4: Final zone
    t=12500;
    later(function(){
      if(g.done)return;
      setStatusText('\u26A1 FINALE!');setZonePhase(4);
      g.zone.targetR=Math.max(AW,AH)*0.06;g.zone.phase=4;
    },t);

    // Force end
    later(function(){if(!g.done)forceWinner(g);},18000);
  }

  function spawnRedZone(g){
    var alive=g.players.filter(function(p){return p.alive});
    if(alive.length<2)return;
    var target=alive[Math.floor(Math.random()*alive.length)];
    var rz={x:target.x+(-30+Math.random()*60),y:target.y+(-30+Math.random()*60),
      r:40+Math.random()*30,t:0,maxT:80,active:true};
    g.redZones.push(rz);
  }

  function spawnAirdrop(g){
    var alive=g.players.filter(function(p){return p.alive});
    if(alive.length<2)return;
    var lucky=alive[Math.floor(Math.random()*alive.length)];
    lucky.shieldT=120;
    g.airdrops.push({x:lucky.x,y:lucky.y,t:0,maxT:40,name:lucky.name});
    setStatusText('\u{1F4E6} Wissens-Boost für '+lucky.name+'!');
  }

  function spawnMeteorShower(g){
    var alive=g.players.filter(function(p){return p.alive});
    if(!alive.length)return;
    var numMeteors=5+Math.floor(Math.random()*4);
    var targets=[];
    for(var i=0;i<Math.min(numMeteors,alive.length+2);i++){
      var tx=50+Math.random()*300;var ty=80+Math.random()*200;
      targets.push({x:tx,y:ty});
    }
    // Damage 2-4 random players
    var hitCount=2+Math.floor(Math.random()*3);
    var shuffled=shuffle(alive);
    for(var j=0;j<Math.min(hitCount,shuffled.length);j++){
      var dmg=15+Math.floor(Math.random()*11);
      shuffled[j].hp=Math.max(0,shuffled[j].hp-dmg);
      if(shuffled[j].hp<=0){shuffled[j].alive=false;shuffled[j].elimFlash=1;}
    }
    // React overlay: set meteor state
    setMeteors(targets.map(function(t,i){return{id:Date.now()+i,x:t.x,y:t.y,dx:-40+Math.random()*80};}));
    later(function(){setMeteors([]);},1500);
  }

  function spawnHealingStation(g){
    var alive=g.players.filter(function(p){return p.alive});
    if(!alive.length)return;
    var lucky=alive[Math.floor(Math.random()*alive.length)];
    var oldHp=lucky.hp;
    lucky.hp=Math.min(100,Math.max(lucky.hp,50));
    var healed=lucky.hp-oldHp;
    if(healed>0){
      var healId=Date.now();
      setHealFloats(function(prev){return prev.concat([{id:healId,name:lucky.name,amount:healed,x:lucky.x,y:lucky.y}]);});
      later(function(){setHealFloats(function(prev){return prev.filter(function(h){return h.id!==healId;});});},1200);
      setStatusText('\u{1F4DA} '+lucky.name+' findet ein Lernbuch!');
    }
  }

  /* ── PHYSICS + DAMAGE ── */
  function updateGame(g,dt,now){
    if(g.done)return;
    var z=g.zone;
    // Smooth zone shrink
    var zSpeed=0.012*dt;
    z.cx+=(z.targetCx-z.cx)*zSpeed;z.cy+=(z.targetCy-z.cy)*zSpeed;
    z.r+=(z.targetR-z.r)*zSpeed*0.8;

    // Drop animation
    if(g.dropPhase){
      g.players.forEach(function(p){
        if(!p.dropped){p.dropY+=4*dt;if(p.dropY>=0){p.dropY=0;p.dropped=true;}}
      });
      return;
    }

    var alive=g.players.filter(function(p){return p.alive});

    // Move players
    g.players.forEach(function(p){
      if(!p.alive)return;
      // Random direction changes
      if(Math.random()<0.02*dt){var ang=Math.random()*Math.PI*2;var spd=0.8+Math.random()*1.2;p.vx=Math.cos(ang)*spd;p.vy=Math.sin(ang)*spd;}
      // Gravitate toward zone center when outside
      var dx=p.x-z.cx;var dy=p.y-z.cy;var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>z.r*0.5){
        var pull=0.03*dt*(dist/(z.r+1));
        p.vx-=dx/dist*pull;p.vy-=dy/dist*pull;
      }
      // Flee from red zones
      g.redZones.forEach(function(rz){
        if(!rz.active)return;
        var rdx=p.x-rz.x;var rdy=p.y-rz.y;var rd=Math.sqrt(rdx*rdx+rdy*rdy);
        if(rd<rz.r*1.5&&rd>0&&p.shieldT<=0){
          p.vx+=rdx/rd*0.5*dt;p.vy+=rdy/rd*0.5*dt;
        }
      });
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      // Bounce walls
      if(p.x<BR){p.x=BR;p.vx=Math.abs(p.vx)*0.8;}
      if(p.x>AW-BR){p.x=AW-BR;p.vx=-Math.abs(p.vx)*0.8;}
      if(p.y<BR){p.y=BR;p.vy=Math.abs(p.vy)*0.8;}
      if(p.y>AH-BR){p.y=AH-BR;p.vy=-Math.abs(p.vy)*0.8;}
      // Ball-ball collision
      g.players.forEach(function(q){
        if(q.id<=p.id||!q.alive)return;
        var cdx=p.x-q.x;var cdy=p.y-q.y;var cd=Math.sqrt(cdx*cdx+cdy*cdy);
        if(cd<BR*2&&cd>0){
          var nx=cdx/cd;var ny=cdy/cd;var overlap=(BR*2-cd)/2;
          p.x+=nx*overlap;p.y+=ny*overlap;q.x-=nx*overlap;q.y-=ny*overlap;
          var dvx=p.vx-q.vx;var dvy=p.vy-q.vy;var dot=dvx*nx+dvy*ny;
          if(dot>0){p.vx-=dot*nx*0.5;p.vy-=dot*ny*0.5;q.vx+=dot*nx*0.5;q.vy+=dot*ny*0.5;}
        }
      });
      // Shield countdown
      if(p.shieldT>0)p.shieldT-=dt;
      // Storm damage
      if(dist>z.r&&p.shieldT<=0){
        var dmgRate=z.phase>=3?2.5:z.phase>=2?1.5:0.8;
        var overflow=Math.max(0,(dist-z.r)/50);
        p.hp-=(dmgRate+overflow*0.5)*dt;
        p.stormDmgAcc+=dt;
        if(p.stormDmgAcc>8){
          p.stormDmgAcc=0;
          g.dmgNums.push({x:p.x,y:p.y-BR,val:Math.round(dmgRate*8),t:0,maxT:30});
        }
      }else{
        p.stormDmgAcc=0;
      }
    });

    // Red zone damage
    g.redZones.forEach(function(rz){
      if(!rz.active)return;
      rz.t+=dt;
      if(rz.t>rz.maxT){rz.active=false;return;}
      if(rz.t>15){
        g.players.forEach(function(p){
          if(!p.alive||p.shieldT>0)return;
          var rdx=p.x-rz.x;var rdy=p.y-rz.y;
          if(Math.sqrt(rdx*rdx+rdy*rdy)<rz.r){
            p.hp-=3*dt;
            if(Math.random()<0.05*dt)g.dmgNums.push({x:p.x+(-10+Math.random()*20),y:p.y-BR,val:Math.round(3*dt*10),t:0,maxT:30});
          }
        });
      }
    });

    // Airdrop animations
    g.airdrops.forEach(function(ad){ad.t+=dt;});

    // Damage number cleanup
    g.dmgNums.forEach(function(dn){dn.t+=dt;});
    g.dmgNums=g.dmgNums.filter(function(dn){return dn.t<dn.maxT;});

    // Elim flash cleanup
    g.elimFlashes.forEach(function(ef){ef.t+=dt;});
    g.elimFlashes=g.elimFlashes.filter(function(ef){return ef.t<20;});

    // Check eliminations
    g.players.forEach(function(p){
      if(!p.alive||p.hp>0)return;
      p.alive=false;p.elimT=now;
      var aliveNow=g.players.filter(function(q){return q.alive}).length;
      var cause=g.redZones.some(function(rz){return rz.active&&Math.sqrt(Math.pow(p.x-rz.x,2)+Math.pow(p.y-rz.y,2))<rz.r})?'fragen':'nebel';
      addTicker(p.name,cause,aliveNow);
      playElimSound();
      g.elimFlashes.push({x:p.x,y:p.y,t:0});
      setSurviving(aliveNow);
      setEliminated(function(prev){return prev.concat(p.name);});
      if(aliveNow===1){
        var w=g.players.filter(function(q){return q.alive})[0];
        g.done=true;
        later(function(){
          setWinner(w.name);setPhase('done');setStatusText('\u{1F3C6} WISSENSSIEG!');onResult(w.name);
          playVictorySound();
          later(function(){setShowConfetti(true);},300);
        },800);
      }
    });
  }

  function forceWinner(g){
    if(g.done)return;
    var alive=g.players.filter(function(p){return p.alive});
    if(alive.length===0)return;
    // Sort by HP, kill all except highest
    alive=rankByHp(alive,secureRandom);
    for(var i=1;i<alive.length;i++){
      alive[i].alive=false;alive[i].hp=0;
      addTicker(alive[i].name,'finale',alive.length-i);
      g.elimFlashes.push({x:alive[i].x,y:alive[i].y,t:0});
    }
    g.done=true;
    setEliminated(function(prev){return prev.concat(alive.slice(1).map(function(p){return p.name}));});
    setSurviving(1);
    later(function(){
      setWinner(alive[0].name);setPhase('done');setStatusText('\u{1F3C6} WISSENSSIEG!');onResult(alive[0].name);
      playVictorySound();
      later(function(){setShowConfetti(true);},300);
    },800);
  }

  /* ── DRAW ── */
  function brRnd(seed){var s=seed;return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}

  function buildTerrain(){
    var c=document.createElement('canvas');
    c.width=AW*2;c.height=AH*2;
    var t=c.getContext('2d');t.setTransform(2,0,0,2,0,0);
    var R=brRnd(20260728);

    // Grasboden
    var gg=t.createLinearGradient(0,0,0,AH);
    gg.addColorStop(0,'#1d3a2a');gg.addColorStop(0.5,'#193324');gg.addColorStop(1,'#12271c');
    t.fillStyle=gg;t.fillRect(0,0,AW,AH);
    // Grasflecken
    for(var i=0;i<70;i++){
      var px=R()*AW,py=R()*AH,pr=14+R()*46;
      t.fillStyle='rgba('+(30+R()*40|0)+','+(70+R()*50|0)+','+(40+R()*30|0)+',0.35)';
      t.beginPath();t.ellipse(px,py,pr,pr*0.62,R()*3,0,Math.PI*2);t.fill();
    }
    // Feldwege
    t.lineCap='round';
    for(var w=0;w<2;w++){
      t.strokeStyle='rgba(120,96,64,0.40)';t.lineWidth=w===0?26:18;
      t.beginPath();
      if(w===0){t.moveTo(-20,AH*0.72);t.bezierCurveTo(AW*0.3,AH*0.55,AW*0.55,AH*0.85,AW+20,AH*0.62);}
      else{t.moveTo(AW*0.22,-20);t.bezierCurveTo(AW*0.35,AH*0.4,AW*0.62,AH*0.5,AW*0.78,AH+20);}
      t.stroke();
      t.strokeStyle='rgba(150,124,84,0.22)';t.lineWidth=w===0?12:8;t.stroke();
    }
    // See
    t.save();
    t.beginPath();
    t.ellipse(AW*0.76,AH*0.24,64,40,0.35,0,Math.PI*2);
    var lg=t.createRadialGradient(AW*0.74,AH*0.21,6,AW*0.76,AH*0.24,66);
    lg.addColorStop(0,'#2b6c8f');lg.addColorStop(0.6,'#1c4c69');lg.addColorStop(1,'#123449');
    t.fillStyle=lg;t.fill();
    t.strokeStyle='rgba(148,214,255,0.35)';t.lineWidth=2;t.stroke();
    t.clip();
    t.strokeStyle='rgba(190,230,255,0.16)';t.lineWidth=1.4;
    for(var lw=0;lw<8;lw++){
      t.beginPath();
      for(var lx=AW*0.62;lx<AW*0.92;lx+=8)t.lineTo(lx,AH*0.10+lw*10+Math.sin(lx*0.14+lw)*2.4);
      t.stroke();
    }
    t.restore();
    // Sandstrand
    t.strokeStyle='rgba(196,168,112,0.30)';t.lineWidth=7;
    t.beginPath();t.ellipse(AW*0.76,AH*0.24,68,44,0.35,0,Math.PI*2);t.stroke();

    // Häuser
    var houses=[[AW*0.16,AH*0.30],[AW*0.42,AH*0.78],[AW*0.62,AH*0.60]];
    for(var hI=0;hI<houses.length;hI++){
      var hx=houses[hI][0],hy=houses[hI][1];
      t.fillStyle='rgba(0,0,0,0.30)';
      t.beginPath();t.ellipse(hx+3,hy+15,26,7,0,0,Math.PI*2);t.fill();
      t.fillStyle='#5b4636';t.fillRect(hx-20,hy-8,40,22);
      t.fillStyle='#6d5643';t.fillRect(hx-20,hy-8,40,5);
      t.fillStyle='#7f2f21';
      t.beginPath();t.moveTo(hx-25,hy-8);t.lineTo(hx,hy-26);t.lineTo(hx+25,hy-8);t.closePath();t.fill();
      t.fillStyle='#2b2118';t.fillRect(hx-5,hy+1,10,13);
      t.fillStyle='rgba(251,191,36,0.55)';t.fillRect(hx+8,hy-2,7,7);
    }

    // Bäume
    for(var tr=0;tr<26;tr++){
      var tx=18+R()*(AW-36),ty=24+R()*(AH-44);
      var d2=Math.pow(tx-AW*0.76,2)+Math.pow(ty-AH*0.24,2);
      if(d2<80*80)continue;
      var ts=0.75+R()*0.6;
      t.fillStyle='rgba(0,0,0,0.30)';
      t.beginPath();t.ellipse(tx+3*ts,ty+11*ts,11*ts,4*ts,0,0,Math.PI*2);t.fill();
      t.fillStyle='#4a3524';t.fillRect(tx-2*ts,ty-2*ts,4*ts,13*ts);
      t.fillStyle='#1f6b3d';
      t.beginPath();t.arc(tx-6*ts,ty-4*ts,7.5*ts,0,Math.PI*2);t.fill();
      t.beginPath();t.arc(tx+6*ts,ty-3*ts,7*ts,0,Math.PI*2);t.fill();
      t.beginPath();t.arc(tx,ty-11*ts,9*ts,0,Math.PI*2);t.fill();
      t.fillStyle='rgba(74,222,128,0.35)';
      t.beginPath();t.arc(tx-3*ts,ty-13*ts,5*ts,0,Math.PI*2);t.fill();
    }
    // Felsen
    for(var rk=0;rk<12;rk++){
      var rx=20+R()*(AW-40),ry=26+R()*(AH-48);var rs=0.7+R()*0.7;
      t.fillStyle='rgba(0,0,0,0.28)';
      t.beginPath();t.ellipse(rx+2,ry+5*rs,11*rs,4*rs,0,0,Math.PI*2);t.fill();
      t.fillStyle='#5b6779';
      t.beginPath();t.ellipse(rx,ry,11*rs,8*rs,R()*2,0,Math.PI*2);t.fill();
      t.fillStyle='rgba(203,213,225,0.35)';
      t.beginPath();t.ellipse(rx-3*rs,ry-3*rs,5*rs,3*rs,0.4,0,Math.PI*2);t.fill();
    }
    // Kisten
    for(var bx=0;bx<7;bx++){
      var cx2=30+R()*(AW-60),cy2=30+R()*(AH-60);
      t.fillStyle='rgba(0,0,0,0.28)';t.fillRect(cx2-8,cy2+6,18,4);
      t.fillStyle='#8a6134';t.fillRect(cx2-9,cy2-9,18,16);
      t.fillStyle='#a97a45';t.fillRect(cx2-9,cy2-9,18,4);
      t.strokeStyle='rgba(60,40,20,0.7)';t.lineWidth=1.4;
      t.beginPath();t.moveTo(cx2-9,cy2-1);t.lineTo(cx2+9,cy2-1);t.stroke();
    }
    // Vignette
    var vg=t.createRadialGradient(AW/2,AH/2,AH*0.30,AW/2,AH/2,AH*0.92);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
    t.fillStyle=vg;t.fillRect(0,0,AW,AH);
    return c;
  }

  function drawFrame(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);
    var z=g.zone;

    if(!g.terrain)g.terrain=buildTerrain();
    ctx.drawImage(g.terrain,0,0,AW,AH);

    // ── Sturm außerhalb der Zone
    ctx.save();
    ctx.beginPath();ctx.rect(0,0,AW,AH);
    ctx.arc(z.cx,z.cy,Math.max(0,z.r),0,Math.PI*2,true);
    ctx.closePath();ctx.clip();
    var sg=ctx.createRadialGradient(z.cx,z.cy,Math.max(1,z.r),z.cx,z.cy,Math.max(2,z.r+180));
    sg.addColorStop(0,'rgba(147,51,234,0.20)');
    sg.addColorStop(0.35,'rgba(126,34,206,0.48)');
    sg.addColorStop(1,'rgba(59,7,100,0.80)');
    ctx.fillStyle=sg;ctx.fillRect(0,0,AW,AH);
    // wirbelnde Schleier
    for(var wi=0;wi<7;wi++){
      var wa=now*0.00035*(1+wi*0.18)+wi*0.9;
      var wr=z.r+26+wi*22;
      ctx.strokeStyle='rgba(216,180,254,'+(0.10-wi*0.011)+')';ctx.lineWidth=12;
      ctx.beginPath();ctx.arc(z.cx,z.cy,wr,wa,wa+1.9);ctx.stroke();
    }
    // Funken
    for(var sp=0;sp<26;sp++){
      var sa=(sp/26)*Math.PI*2+now*0.0009;
      var sr=z.r+8+((now*0.05+sp*37)%150);
      var sx=z.cx+Math.cos(sa)*sr,sy=z.cy+Math.sin(sa)*sr;
      ctx.fillStyle='rgba(233,213,255,'+(0.45*(1-((sr-z.r)/160)))+')';
      ctx.beginPath();ctx.arc(sx,sy,1.6,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();

    // Blitze am Sturmrand
    if(Math.random()<0.06){
      var la=Math.random()*Math.PI*2;
      var lx=z.cx+Math.cos(la)*(z.r+6),ly=z.cy+Math.sin(la)*(z.r+6);
      ctx.strokeStyle='rgba(233,213,255,0.85)';ctx.lineWidth=1.8;
      ctx.beginPath();ctx.moveTo(lx,ly);
      var cx3=lx,cy3=ly;
      for(var lb=0;lb<4;lb++){
        cx3+=Math.cos(la)*13+(Math.random()-0.5)*16;
        cy3+=Math.sin(la)*13+(Math.random()-0.5)*16;
        ctx.lineTo(cx3,cy3);
      }
      ctx.stroke();
    }

    // ── Zonenring
    var zp=0.5+0.5*Math.sin(now*0.004);
    ctx.save();
    ctx.shadowColor='rgba(168,85,247,0.9)';ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(z.cx,z.cy,Math.max(0,z.r),0,Math.PI*2);
    ctx.strokeStyle='rgba(216,180,254,'+(0.75+zp*0.25)+')';ctx.lineWidth=3;ctx.stroke();
    ctx.restore();
    ctx.beginPath();ctx.arc(z.cx,z.cy,Math.max(0,z.r-4),0,Math.PI*2);
    ctx.strokeStyle='rgba(168,85,247,0.18)';ctx.lineWidth=9;ctx.stroke();

    // Ziel-Zone
    ctx.save();
    ctx.setLineDash([9,7]);ctx.lineDashOffset=-now*0.02;
    ctx.beginPath();ctx.arc(z.cx,z.cy,Math.max(0,z.targetR),0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.42)';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();

    // ── Rote Zonen
    g.redZones.forEach(function(rz){
      if(!rz.active)return;
      var prog=rz.t/rz.maxT;
      var pl=0.5+0.5*Math.sin(rz.t*0.35);
      ctx.save();
      var rg=ctx.createRadialGradient(rz.x,rz.y,rz.r*0.15,rz.x,rz.y,rz.r);
      rg.addColorStop(0,'rgba(245,158,11,'+(0.30+pl*0.20)+')');
      rg.addColorStop(1,'rgba(120,53,15,0.05)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(rz.x,rz.y,rz.r,0,Math.PI*2);ctx.fill();
      ctx.setLineDash([8,6]);ctx.lineDashOffset=now*0.03;
      ctx.strokeStyle='rgba(251,191,36,'+(0.55+pl*0.35)+')';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(rz.x,rz.y,rz.r,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);
      // Innerer Pulsring statt Fadenkreuz (kein Zielvisier)
      ctx.strokeStyle='rgba(251,191,36,0.45)';ctx.lineWidth=1.2;
      ctx.beginPath();ctx.arc(rz.x,rz.y,rz.r*(0.35+pl*0.12),0,Math.PI*2);ctx.stroke();
      if(rz.t>15){
        for(var ei=0;ei<3;ei++){
          var ea=Math.random()*Math.PI*2;var er=Math.random()*rz.r;
          ctx.fillStyle='rgba(251,191,36,0.75)';
          ctx.beginPath();ctx.arc(rz.x+Math.cos(ea)*er,rz.y+Math.sin(ea)*er,1.8+Math.random()*1.6,0,Math.PI*2);ctx.fill();
        }
      }
      ctx.fillStyle='rgba(254,240,199,'+(0.5+pl*0.4)+')';
      ctx.font='bold 10px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('❓ FRAGENHAGEL',rz.x,rz.y-rz.r-8);
      ctx.restore();
    });

    // ── Airdrops mit Fallschirm
    g.airdrops.forEach(function(ad){
      if(ad.t>ad.maxT)return;
      var s=Math.min(1,ad.t/10);
      ctx.save();
      ctx.globalAlpha=Math.max(0,1-ad.t/ad.maxT);
      ctx.translate(ad.x,ad.y);
      ctx.fillStyle='rgba(0,0,0,0.30)';
      ctx.beginPath();ctx.ellipse(0,13*s,11*s,4*s,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(226,232,240,0.75)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-9*s,-8*s);ctx.lineTo(-5*s,-1*s);
      ctx.moveTo(9*s,-8*s);ctx.lineTo(5*s,-1*s);ctx.stroke();
      ctx.fillStyle='rgba(248,250,252,0.85)';
      ctx.beginPath();ctx.arc(0,-10*s,11*s,Math.PI,0);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(239,68,68,0.85)';
      ctx.beginPath();ctx.arc(0,-10*s,11*s,Math.PI*1.25,Math.PI*1.55);ctx.lineTo(0,-10*s);ctx.closePath();ctx.fill();
      ctx.fillStyle='#b45309';ctx.fillRect(-7*s,-2*s,14*s,13*s);
      ctx.fillStyle='#f59e0b';ctx.fillRect(-7*s,-2*s,14*s,3.5*s);
      ctx.strokeStyle='#fef3c7';ctx.lineWidth=1.2;ctx.strokeRect(-7*s,-2*s,14*s,13*s);
      ctx.restore();
    });

    // ── Spielfiguren
    var order=g.players.slice().sort(function(a,b){return a.y-b.y;});
    order.forEach(function(p){
      if(!p.alive&&(!p.elimT||now-p.elimT>1500))return;
      var drawY=p.y+(g.dropPhase?p.dropY:0);
      var alpha=p.alive?1:Math.max(0,1-(now-p.elimT)/1000);
      var sc=p.alive?1:Math.max(0.35,1-(now-p.elimT)/900);
      var spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
      var u=BR*0.92*sc;

      // Fallschirm beim Einschweben ins Lernfeld
      if(g.dropPhase&&p.dropY<-4){
        ctx.save();ctx.globalAlpha=alpha*0.9;
        ctx.strokeStyle='rgba(226,232,240,0.7)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(p.x-11,drawY-BR*2.2);ctx.lineTo(p.x-4,drawY-BR*1.2);
        ctx.moveTo(p.x+11,drawY-BR*2.2);ctx.lineTo(p.x+4,drawY-BR*1.2);ctx.stroke();
        ctx.fillStyle=p.color+'cc';
        ctx.beginPath();ctx.arc(p.x,drawY-BR*2.2,14,Math.PI,0);ctx.closePath();ctx.fill();
        ctx.restore();
      }

      if(p.shieldT>0&&p.alive){
        ctx.save();ctx.globalAlpha=alpha;
        var shp=0.5+0.5*Math.sin(now*0.008);
        ctx.strokeStyle='rgba(251,191,36,'+(0.35+shp*0.35)+')';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(p.x,drawY-u*0.2,u*1.7,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='rgba(251,191,36,0.08)';
        ctx.beginPath();ctx.arc(p.x,drawY-u*0.2,u*1.7,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }

      drawHero(ctx,{x:p.x,y:drawY+u*0.5,s:u,color:p.color,
        walk:now*0.011*(0.5+spd*1.4)+p.id*1.7,
        face:p.vx<-0.05?-1:1,alpha:alpha,hair:p.id%6,skin:(p.id*3)%4,
        gear:'cap',dead:!p.alive,
        glow:(g.done&&p.alive)?'rgba(251,191,36,0.9)':null});

      // HP-Balken
      if(p.alive&&p.hp<100){
        var barW=u*2.1,barH=3.4,barY=drawY+u*1.55;
        ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(p.x-barW/2-1,barY-1,barW+2,barH+2);
        var hp=Math.max(0,p.hp/100);
        ctx.fillStyle=hp>0.5?'#22c55e':hp>0.25?'#f59e0b':'#ef4444';
        ctx.fillRect(p.x-barW/2,barY,barW*hp,barH);
      }

      // Namensschild
      ctx.save();ctx.globalAlpha=alpha;
      var pn=truncName(p.name,NMAX);
      var lf=fitFont(ctx,pn,u*3.4,FS,8);
      var tw=ctx.measureText(pn).width;
      var ly=drawY-u*1.95;
      ctx.fillStyle='rgba(2,6,23,0.62)';
      hRR(ctx,p.x-tw/2-5,ly-lf*0.72,tw+10,lf*1.44,lf*0.5);ctx.fill();
      ctx.fillStyle=p.color;ctx.fillRect(p.x-tw/2-5,ly-lf*0.72,2.5,lf*1.44);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(pn,p.x,ly);
      ctx.restore();
    });

    // Eliminierungs-Blitze
    g.elimFlashes.forEach(function(ef){
      var prog=ef.t/20;
      ctx.save();
      ctx.strokeStyle='rgba(196,181,253,'+(0.8*(1-prog))+')';ctx.lineWidth=3*(1-prog)+1;
      ctx.beginPath();ctx.arc(ef.x,ef.y,BR*(1+prog*2.6),0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='rgba(139,92,246,'+(0.35*(1-prog))+')';
      ctx.beginPath();ctx.arc(ef.x,ef.y,BR*(1+prog*2.2),0,Math.PI*2);ctx.fill();
      ctx.restore();
    });

    // Schadenszahlen
    g.dmgNums.forEach(function(dn){
      var prog=dn.t/dn.maxT;
      ctx.save();ctx.globalAlpha=1-prog;
      ctx.font='bold 12px Inter,sans-serif';ctx.textAlign='center';
      ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=3;ctx.lineJoin='round';
      ctx.strokeText('-'+dn.val+' Wissen',dn.x,dn.y-prog*26);
      ctx.fillStyle='#fcd34d';ctx.fillText('-'+dn.val+' Wissen',dn.x,dn.y-prog*26);
      ctx.restore();
    });

    // ── HUD
    var aliveCount=g.players.filter(function(p){return p.alive}).length;
    ctx.save();
    ctx.fillStyle='rgba(2,6,23,0.68)';
    hRR(ctx,AW-108,8,100,30,8);ctx.fill();
    ctx.strokeStyle='rgba(168,85,247,0.45)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#e9d5ff';ctx.font='bold 14px Inter,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText('\u{1F464} '+aliveCount+'/'+names.length,AW-16,23);
    ctx.restore();

    // ── Minimap
    var mmS=74;var mmX=AW-mmS-10;var mmY=AH-mmS-10;
    ctx.save();
    ctx.fillStyle='rgba(2,6,23,0.66)';
    hRR(ctx,mmX,mmY,mmS,mmS,7);ctx.fill();
    ctx.strokeStyle='rgba(148,163,184,0.35)';ctx.lineWidth=1;ctx.stroke();
    ctx.save();
    hRR(ctx,mmX,mmY,mmS,mmS,7);ctx.clip();
    ctx.fillStyle='rgba(34,197,94,0.10)';ctx.fillRect(mmX,mmY,mmS,mmS);
    var mzx=mmX+z.cx/AW*mmS,mzy=mmY+z.cy/AH*mmS,mzr=z.r/Math.max(AW,AH)*mmS;
    ctx.beginPath();ctx.arc(mzx,mzy,Math.max(1,mzr),0,Math.PI*2);
    ctx.fillStyle='rgba(168,85,247,0.12)';ctx.fill();
    ctx.strokeStyle='rgba(216,180,254,0.75)';ctx.lineWidth=1.2;ctx.stroke();
    var tzx=mmX+z.targetCx/AW*mmS,tzy=mmY+z.targetCy/AH*mmS,tzr=z.targetR/Math.max(AW,AH)*mmS;
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.arc(tzx,tzy,Math.max(1,tzr),0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;ctx.stroke();
    ctx.setLineDash([]);
    g.players.forEach(function(p){
      if(!p.alive)return;
      ctx.beginPath();ctx.arc(mmX+p.x/AW*mmS,mmY+p.y/AH*mmS,1.7,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
    });
    ctx.restore();
    ctx.restore();
  }

  function reset(){doCleanup();setPhase('idle');setStatusText('Bereit f\u00FCr die erste Runde!');setEliminated([]);setWinner(null);setShowConfetti(false);setSurviving(0);setTickerFeed([]);setZonePhase(0);}

  function confetti(){
    if(!showConfetti)return null;
    var pieces=[];for(var i=0;i<60;i++){
      var left=Math.random()*100;var dur=1.5+Math.random()*2;var delay=Math.random()*0.8;
      var color=['#8b5cf6','#3b82f6','#22c55e','#f59e0b','#ef4444','#ec4899','#fbbf24'][Math.floor(Math.random()*7)];
      var size=4+Math.random()*6;
      pieces.push(html`<div key=${i} className="confetti-piece" style=${{left:left+'%',width:size+'px',height:size+'px',background:color,animationDuration:dur+'s',animationDelay:delay+'s',borderRadius:Math.random()>.5?'50%':'2px'}}/>`);
    }
    return pieces;
  }

  var zoneColors=['text-gray-600','text-violet-700','text-amber-700','text-orange-700','text-red-700'];

  return html`<div className="max-w-6xl mx-auto px-4 py-6 fade-in-up">
    ${confetti()}
    <div className="flex items-center justify-between mb-4">
      <div className="w-16" aria-hidden="true"></div>
      <div className="text-center">
        <h2 className="text-xl font-bold gradient-text">\u{1F9E0} Wissens-Arena</h2>
        <p role="status" aria-live="polite" className=${"text-xs font-semibold mt-1 "+zoneColors[zonePhase]}>${statusText}</p>
      </div>
      <div className="bg-info text-gray-500 text-xs">${surviving>0&&phase==='running'?'\u{1F464} '+surviving+'/'+names.length:''}</div>
    </div>

    ${(phase==='running'||phase==='done')&&html`<div className="mb-3 mx-auto" style=${{maxWidth:'900px'}}>
      <div className="flex items-center gap-2 mb-1">
        ${[1,2,3,4].map(function(p){return html`<div key=${p} className="flex-1 h-1.5 rounded-full transition-all duration-500 "
          style=${{background:zonePhase>=p?'linear-gradient(90deg,#8b5cf6,#6366f1)':'#e5e7eb'}}/>`;
        })}
      </div>
      <div className="flex justify-between text-xs text-gray-400 px-0.5">
        <span>Start</span>
        <span className=${zonePhase>=1?"text-violet-500 font-semibold":""}>Runde 1</span>
        <span className=${zonePhase>=2?"text-amber-500 font-semibold":""}>Runde 2</span>
        <span className=${zonePhase>=3?"text-orange-500 font-semibold":""}>Runde 3</span>
        <span className=${zonePhase>=4?"text-red-500 font-semibold":""}>Finale</span>
      </div>
    </div>`}

    <div className="relative rounded-2xl overflow-hidden border border-violet-500/20 bg-gray-950 shadow-2xl shadow-violet-500/5 mx-auto" style=${{maxWidth:'900px'}}>
      <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Wissens-Arena Spielfeld"/>
      ${meteors.map(function(m){return html`<div key=${m.id} className="meteor-emoji" style=${{left:(m.x/AW*100)+'%',top:'20px','--mdx':m.dx+'px'}}>\u{1F4D0}</div>`;})}
      ${healFloats.map(function(h){return html`<div key=${h.id} className="heal-float-el" style=${{left:(Math.min(h.x,AW-60)/AW*100)+'%',top:(Math.max(h.y-20,10)/AH*100)+'%'}}>+${h.amount} Wissen \u{1F4DA}</div>`;})}
    </div>

    ${tickerFeed.length>0&&html`<div className="mt-3 mx-auto" style=${{maxWidth:'900px'}}>
      <div className="bg-white/90 rounded-xl border border-gray-200 p-3 shadow-sm">
        <div className="text-xs text-gray-500 mb-1 font-semibold">\u{1F4CB} Ticker</div>
        ${tickerFeed.slice().reverse().map(function(k,i){
          return html`<div key=${k.time+'-'+i} className="text-xs text-gray-700 py-0.5 fade-in">${k.text}</div>`;
        })}
      </div>
    </div>`}

    ${winner&&html`<div data-result className="mt-6 text-center br-victory">
      <div className="inline-block bg-gradient-to-br from-amber-600 via-yellow-600 to-amber-700 border border-amber-400/30 rounded-2xl px-8 py-6 shadow-2xl shadow-amber-500/25">
        <div className="text-3xl mb-2">\u{1F3C6}</div>
        <div className="text-amber-100 text-sm font-semibold uppercase tracking-widest mb-1">Wissenssieg</div>
        <div className="text-2xl font-black text-white">${winner}</div>
        <${CopyButton} modeName="Wissens-Arena" winner=${winner}/>
      </div>
    </div>`}

    ${eliminated.length>0&&!winner&&html`<div className="mt-3 flex flex-wrap gap-1 justify-center">
      ${eliminated.map(function(n,i){
        return html`<span key=${i} className="px-2 py-0.5 bg-gray-100 text-gray-400 text-xs rounded-full border border-gray-200 line-through">${n}</span>`;
      })}
    </div>`}

    <div data-result-actions className="mt-5 text-center">
      ${phase==='idle'&&html`<button onClick=${startBR} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white shadow-lg shadow-violet-500/25 transition-all hover:shadow-violet-500/40 hover:scale-105 active:scale-95 text-sm">\u{1F9E0} Runde starten</button>`}
      ${phase==='done'&&html`<span className="inline-flex gap-3">
        <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-violet-50 text-violet-700 border border-violet-200 hover:bg-violet-100 transition-all mr-3">Nochmal</button>
        <button onClick=${function(){doCleanup();onDone();}} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button>
      </span>`}
      ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">\u2715 Abbrechen</button>`}
    </div>
  </div>`;
}


/* ═══════════════════════════════════════════════════════
   VORTEX PORTAL GROUP MODE
   ═══════════════════════════════════════════════════════ */
function VortexPortalMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('pick');var phase=_ph[0];var setPhase=_ph[1];
  var _ng=useState(2);var numGroups=_ng[0];var setNumGroups=_ng[1];
  var _gr=useState([]);var groups=_gr[0];var setGroups=_gr[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];
  var _ab=useState(0);var absorbed=_ab[0];var setAbsorbed=_ab[1];
  var canvasRef=useRef(null);
  var gRef=useRef(null);
  var rafRef=useRef(null);
  var timers=useRef([]);
  var audioRef=useRef(null);

  var AW=600;var AH=500;
  var CX=AW/2;var CY=AH/2;

  var PORTAL_COLORS=['#8b5cf6','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4','#84cc16','#f97316','#e11d48'];
  var PORTAL_NAMES=['Violett','Blau','Gr\u00FCn','Gold','Rot','Pink','Cyan','Lime','Orange','Karmin'];

  var maxGroups=Math.min(10,Math.floor(names.length/2));

  useEffect(function(){return function(){doCleanup();}},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='pick'){e.preventDefault();startVortex();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  });

  function doCleanup(){
    timers.current.forEach(clearTimeout);timers.current=[];
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}

  /* ── AUDIO ── */
  function startAudio(){
    try{
      var ah=createAudioCtx();if(!ah)return;audioRef.current=ah;
      var ctx=ah.ctx;var master=ah.master;master.gain.value=0.4;
      // Ethereal pad
      var pad=ctx.createOscillator();pad.type='sine';pad.frequency.value=130.81;
      var pad2=ctx.createOscillator();pad2.type='sine';pad2.frequency.value=196;
      var pg=ctx.createGain();pg.gain.value=0.15;
      var pf=ctx.createBiquadFilter();pf.type='lowpass';pf.frequency.value=400;
      pad.connect(pf);pad2.connect(pf);pf.connect(pg);pg.connect(master);pad.start();pad2.start();
      // LFO wobble
      var lfo=ctx.createOscillator();lfo.frequency.value=0.5;
      var lfoG=ctx.createGain();lfoG.gain.value=15;
      lfo.connect(lfoG);lfoG.connect(pad.frequency);lfo.start();
      // Rhythmic pings
      var now=ctx.currentTime;
      for(var i=0;i<60;i++){
        var t=now+i*0.4;
        if(i%4===0)aT(ctx,master,523.25,t,0.2,0.06,'sine');
        if(i%4===2)aT(ctx,master,659.25,t,0.15,0.04,'sine');
        if(i%8===0&&i>0)aC(ctx,master,t,[261.63,329.63,392],0.05,0.6,'triangle');
      }
    }catch(e){}
  }
  function playAbsorbSound(idx){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;var now=ctx.currentTime;
      var baseFreq=300+idx*40;
      aT(ctx,dest,baseFreq,now,0.15,0.15,'sine');
      aT(ctx,dest,baseFreq*1.5,now+0.05,0.1,0.1,'triangle');
    }catch(e){}
  }
  function playCompleteSound(){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;var now=ctx.currentTime;
      var fanfare=[392,493.88,587.33,783.99];
      for(var i=0;i<fanfare.length;i++)aT(ctx,dest,fanfare[i],now+i*0.12,0.35,0.2,'triangle');
      aC(ctx,dest,now+0.6,[392,493.88,587.33,783.99],0.15,1.5,'triangle');
    }catch(e){}
  }

  /* ── ASSIGN GROUPS (equal size) ── */
  function assignGroups(ng){
    var shuffled=shuffleApart(names,roundRobinGroup(ng),APART_RULES);
    var result=[];
    for(var i=0;i<ng;i++)result.push([]);
    for(var j=0;j<shuffled.length;j++){
      result[j%ng].push(shuffled[j]);
    }
    return result;
  }

  /* ── START ── */
  function startVortex(){
    doCleanup();
    var ng=numGroups;
    var assigned=assignGroups(ng);
    setGroups(assigned);setShowConfetti(false);setAbsorbed(0);
    setStatusText('\u{1F300} Vortex \u00F6ffnet sich...');

    // Build player data with group assignments
    var players=[];var pidx=0;
    for(var gi=0;gi<assigned.length;gi++){
      for(var pi=0;pi<assigned[gi].length;pi++){
        var ang=Math.random()*Math.PI*2;
        var orbitR=80+Math.random()*50;
        players.push({id:pidx,name:assigned[gi][pi],group:gi,
          color:BALL_COLORS[pidx%BALL_COLORS.length],
          angle:ang,orbitR:orbitR,orbitSpeed:0.3+Math.random()*0.4,
          phase:'orbit',absorbT:0,absorbDur:0,
          startX:0,startY:0,trail:[]});
        pidx++;
      }
    }

    // Portal positions in a circle
    var portals=[];
    // 0.35 statt 0.42 — sonst rutschen Beschriftung und Zähler des unteren Portals aus dem Bild
    var portalR=Math.min(AW,AH)*0.35;
    for(var k=0;k<ng;k++){
      var pa=-Math.PI/2+k*(Math.PI*2/ng);
      portals.push({x:CX+Math.cos(pa)*portalR,y:CY+Math.sin(pa)*portalR,
        angle:pa,color:PORTAL_COLORS[k%PORTAL_COLORS.length],
        name:PORTAL_NAMES[k%PORTAL_NAMES.length],
        pulsePhase:Math.random()*Math.PI*2,members:0,targetMembers:assigned[k].length});
    }

    var g={players:players,portals:portals,vortexAngle:0,vortexPulse:0,
      particles:[],absorbQueue:[],absorbIdx:0,done:false,startT:performance.now()};
    gRef.current=g;

    setPhase('running');
    startAudio();

    // Build absorb schedule: stagger players being sucked into portals
    var order=shuffle(players.slice());
    var delay=1500; // initial orbit time
    var stagger=Math.max(100,Math.min(350,6000/names.length));
    for(var oi=0;oi<order.length;oi++){
      (function(p,t){
        later(function(){
          if(g.done)return;
          // Calculate current position
          var elapsed=(performance.now()-g.startT)/1000;
          p.startX=CX+Math.cos(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
          p.startY=CY+Math.sin(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
          p.phase='absorb';p.absorbT=0;
          p.absorbDur=25+Math.random()*15; // frames
          playAbsorbSound(oi);
          setAbsorbed(function(prev){return prev+1;});
          setStatusText('\u{1F300} '+p.name+' \u2192 Portal '+(p.group+1));
        },t);
      })(order[oi],delay+oi*stagger);
    }

    // Finish
    var finishT=delay+order.length*stagger+800;
    later(function(){
      g.done=true;
      setPhase('done');setStatusText('\u2728 Alle Gruppen gebildet!');onResult(numGroups+' Gruppen');
      playCompleteSound();
      later(function(){setShowConfetti(true);},300);
    },finishT);

    // Animation loop
    var last=performance.now();
    function loop(now){
      var dt=Math.min((now-last)/16.67,3);last=now;
      updateVortex(g,dt,now);drawVortex(g,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  /* ── UPDATE ── */
  function updateVortex(g,dt,now){
    g.vortexAngle+=0.02*dt;
    g.vortexPulse=Math.sin(now*0.003)*0.15;
    var elapsed=(now-g.startT)/1000;

    // Spawn particles
    if(Math.random()<0.3*dt){
      var pa=Math.random()*Math.PI*2;var pr=10+Math.random()*30;
      g.particles.push({x:CX+Math.cos(pa)*pr,y:CY+Math.sin(pa)*pr,
        vx:Math.cos(pa+Math.PI/2)*1.5,vy:Math.sin(pa+Math.PI/2)*1.5,
        life:30+Math.random()*20,maxLife:30+Math.random()*20,
        color:PORTAL_COLORS[Math.floor(Math.random()*g.portals.length)]});
    }
    // Update particles
    g.particles.forEach(function(pt){
      pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;
      // Spiral outward
      var dx=pt.x-CX;var dy=pt.y-CY;var d=Math.sqrt(dx*dx+dy*dy);
      if(d>0){pt.x+=dx/d*0.3*dt;pt.y+=dy/d*0.3*dt;}
    });
    g.particles=g.particles.filter(function(pt){return pt.life>0;});

    // Update players
    g.players.forEach(function(p){
      if(p.phase==='orbit'){
        // Orbit around center
        var cx=CX+Math.cos(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
        var cy=CY+Math.sin(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
        p.trail.push({x:cx,y:cy,t:now});
        if(p.trail.length>12)p.trail.shift();
      }else if(p.phase==='absorb'){
        p.absorbT+=dt;
        var prog=Math.min(1,p.absorbT/p.absorbDur);
        // Ease in-out
        var ease=prog<0.5?2*prog*prog:1-Math.pow(-2*prog+2,2)/2;
        var portal=g.portals[p.group];
        var cx2=p.startX+(portal.x-p.startX)*ease;
        var cy2=p.startY+(portal.y-p.startY)*ease;
        p.trail.push({x:cx2,y:cy2,t:now});
        if(p.trail.length>15)p.trail.shift();
        if(prog>=1){
          p.phase='done';
          portal.members++;
          // Spawn burst particles at portal
          for(var bi=0;bi<6;bi++){
            var ba=Math.random()*Math.PI*2;
            g.particles.push({x:portal.x+Math.cos(ba)*15,y:portal.y+Math.sin(ba)*15,
              vx:Math.cos(ba)*2,vy:Math.sin(ba)*2,life:20,maxLife:20,color:portal.color});
          }
        }
      }
    });
  }

  /* ── DRAW ── */
  function drawVortex(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);
    var elapsed=(now-g.startT)/1000;

    // Background
    ctx.fillStyle='#060918';ctx.fillRect(0,0,AW,AH);

    // Starfield
    ctx.fillStyle='rgba(255,255,255,0.4)';
    for(var si=0;si<40;si++){
      var sx=(si*137.5+now*0.005*((si%3)+1))%AW;
      var sy=(si*241.3+now*0.003*((si%2)+1))%AH;
      var sr=0.5+Math.sin(now*0.005+si)*0.5;
      ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
    }

    // Central vortex glow
    var vGrad=ctx.createRadialGradient(CX,CY,5,CX,CY,100+g.vortexPulse*30);
    vGrad.addColorStop(0,'rgba(139,92,246,0.35)');
    vGrad.addColorStop(0.4,'rgba(99,102,241,0.15)');
    vGrad.addColorStop(1,'transparent');
    ctx.fillStyle=vGrad;ctx.beginPath();ctx.arc(CX,CY,120,0,Math.PI*2);ctx.fill();

    // Vortex spiral arms
    ctx.lineWidth=2;
    for(var arm=0;arm<4;arm++){
      ctx.beginPath();
      ctx.strokeStyle='rgba(139,92,246,'+(0.15+g.vortexPulse*0.3)+')';
      for(var r=8;r<90;r+=2){
        var a=g.vortexAngle+arm*(Math.PI/2)+r*0.08;
        var x=CX+Math.cos(a)*r;var y=CY+Math.sin(a)*r;
        if(r===8)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    // Vortex center orb
    var cGrad=ctx.createRadialGradient(CX-3,CY-3,2,CX,CY,18);
    cGrad.addColorStop(0,'rgba(255,255,255,0.6)');
    cGrad.addColorStop(0.5,'rgba(167,139,250,0.5)');
    cGrad.addColorStop(1,'rgba(99,102,241,0.1)');
    ctx.fillStyle=cGrad;ctx.beginPath();ctx.arc(CX,CY,18,0,Math.PI*2);ctx.fill();

    // Connection lines from center to portals (faint)
    g.portals.forEach(function(portal){
      ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(portal.x,portal.y);
      ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.stroke();
    });

    // Particles
    g.particles.forEach(function(pt){
      var alpha=(pt.life/pt.maxLife)*0.6;
      ctx.beginPath();ctx.arc(pt.x,pt.y,2,0,Math.PI*2);
      ctx.fillStyle=pt.color.replace(')',','+alpha+')').replace('rgb','rgba');
      // Simpler: use global alpha
      ctx.globalAlpha=alpha;ctx.fillStyle=pt.color;ctx.fill();ctx.globalAlpha=1;
    });

    // Portals
    g.portals.forEach(function(portal,pi){
      var pulse=Math.sin(now*0.004+portal.pulsePhase)*0.2;
      var portalSize=22+pulse*8;
      // Outer glow
      var pGrad=ctx.createRadialGradient(portal.x,portal.y,portalSize*0.3,portal.x,portal.y,portalSize*2.5);
      pGrad.addColorStop(0,portal.color);
      pGrad.addColorStop(0.5,portal.color+'66');
      pGrad.addColorStop(1,'transparent');
      ctx.fillStyle=pGrad;ctx.beginPath();ctx.arc(portal.x,portal.y,portalSize*2.5,0,Math.PI*2);ctx.fill();
      // Inner ring
      ctx.beginPath();ctx.arc(portal.x,portal.y,portalSize,0,Math.PI*2);
      ctx.strokeStyle=portal.color;ctx.lineWidth=3;ctx.stroke();
      // Inner fill
      ctx.beginPath();ctx.arc(portal.x,portal.y,portalSize*0.7,0,Math.PI*2);
      ctx.fillStyle=portal.color+'44';ctx.fill();
      // Spinning ring
      ctx.beginPath();
      ctx.arc(portal.x,portal.y,portalSize+4,g.vortexAngle*2+pi,g.vortexAngle*2+pi+Math.PI*0.6);
      ctx.strokeStyle=portal.color+'88';ctx.lineWidth=2;ctx.stroke();
      // Label
      ctx.fillStyle='#fff';ctx.font='bold 14px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor=portal.color;ctx.shadowBlur=6;
      ctx.fillText('Gruppe '+(pi+1),portal.x,portal.y+portalSize+18);
      ctx.shadowBlur=0;
      // Member count
      ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='12px Inter,sans-serif';
      ctx.fillText(portal.members+'/'+portal.targetMembers,portal.x,portal.y+portalSize+34);
    });

    // Player trails + balls
    var ballR=names.length>30?13:names.length>18?15:names.length>12?17:20;
    var fontSize=names.length>30?10:names.length>18?11:names.length>12?12:14;
    var nMax=names.length>30?7:names.length>18?8:names.length>12?9:11;

    g.players.forEach(function(p){
      if(p.phase==='done')return;
      // Trail
      if(p.trail.length>1){
        ctx.beginPath();ctx.moveTo(p.trail[0].x,p.trail[0].y);
        for(var ti=1;ti<p.trail.length;ti++){
          ctx.lineTo(p.trail[ti].x,p.trail[ti].y);
        }
        ctx.strokeStyle=p.color+'44';ctx.lineWidth=2;ctx.stroke();
      }
      // Current position
      var cx,cy;
      if(p.phase==='orbit'){
        cx=CX+Math.cos(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
        cy=CY+Math.sin(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
      }else{
        var last=p.trail[p.trail.length-1];
        cx=last?last.x:p.startX;cy=last?last.y:p.startY;
      }
      // Glow during absorb
      if(p.phase==='absorb'){
        var portal=g.portals[p.group];
        ctx.beginPath();ctx.arc(cx,cy,ballR+6,0,Math.PI*2);
        ctx.fillStyle=portal.color+'33';ctx.fill();
      }
      // Ball
      var bGrad=ctx.createRadialGradient(cx-ballR*0.3,cy-ballR*0.3,ballR*0.1,cx,cy,ballR);
      bGrad.addColorStop(0,'rgba(255,255,255,0.35)');bGrad.addColorStop(1,p.color);
      ctx.beginPath();ctx.arc(cx,cy,ballR,0,Math.PI*2);ctx.fillStyle=bGrad;ctx.fill();
      // Name — mit Kontur für maximale Lesbarkeit
      var pn=truncName(p.name,nMax);
      fitFont(ctx,pn,ballR*2.05,fontSize,8);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=3;ctx.lineJoin='round';
      ctx.strokeText(pn,cx,cy);
      ctx.fillStyle='#fff';ctx.fillText(pn,cx,cy);
    });

    // HUD
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath();ctx.moveTo(8,8);ctx.lineTo(130,8);ctx.lineTo(130,30);ctx.lineTo(8,30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 11px Inter,sans-serif';ctx.textAlign='left';
    var doneCount=g.players.filter(function(p){return p.phase==='done'}).length;
    ctx.fillText('\u{1F300} '+doneCount+'/'+names.length+' zugeordnet',14,22);
  }

  function reset(){doCleanup();setPhase('pick');setGroups([]);setShowConfetti(false);setStatusText('');setAbsorbed(0);}

  function confetti(){
    if(!showConfetti)return null;
    var pieces=[];for(var i=0;i<60;i++){
      var left=Math.random()*100;var dur=1.5+Math.random()*2;var delay=Math.random()*0.8;

/* ═══════════════════════════════════════════════════════
   GLÜCKSRAD MODE

function WheelMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _winner=useState(null);var winner=_winner[0];var setWinner=_winner[1];
  var dragRef=useRef(null);
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _angle=useState(0);var angle=_angle[0];var setAngle=_angle[1];
  var _spinMsg=useState('');var spinMsg=_spinMsg[0];var setSpinMsg=_spinMsg[1];

    ctx.clearRect(0,0,W,H);

    // Outer decorative ring with tick marks
    ctx.save();

      var ta=ti*(Math.PI/N)+angle;
      var isMajor=(ti%2===0);

      ctx.moveTo(cx+Math.cos(ta)*(tickR-(!isMajor?4:8)),cy+Math.sin(ta)*(tickR-(!isMajor?4:8)));

    ctx.save();
    ctx.translate(cx,cy);ctx.rotate(angle);

      var sa=i*segAngle-Math.PI/2;var ea=sa+segAngle;
      var col=BALL_COLORS[i%BALL_COLORS.length];
      // Highlight winner segment when stopped
      var isWinner=(phase==='winner'&&i===winIdx);
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,sa,ea);ctx.closePath();
      if(isWinner){
        ctx.shadowBlur=30;ctx.shadowColor='rgba(251,191,36,0.9)';
        ctx.fillStyle=col;ctx.fill();
        ctx.shadowBlur=0;
        // Bright overlay
        ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,sa,ea);ctx.closePath();
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fill();
      }else{
        ctx.fillStyle=col;ctx.fill();
      }
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;ctx.stroke();
      ctx.save();
      ctx.rotate(sa+segAngle/2);
      ctx.fillStyle='#ffffff';
      var fs=Math.max(10,Math.min(22,Math.round(R*2.8/N)));
      ctx.font='bold '+fs+'px Inter,sans-serif';
      ctx.lineJoin='round';ctx.lineWidth=3.5;ctx.strokeStyle='rgba(0,0,0,0.65)';
      var wn=truncName(names[i],N>30?10:14);

      var absA=(angle+sa+segAngle/2)%(2*Math.PI);if(absA<0)absA+=2*Math.PI;
      var tx=R-16;
      if(absA>Math.PI/2&&absA<Math.PI*1.5){ctx.rotate(Math.PI);ctx.textAlign='left';tx=-(R-16);}
      else{ctx.textAlign='right';}

      ctx.fillText(wn,tx,fs*0.34);
      ctx.restore();
    }

    // Center knob
    ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);
    var grad=ctx.createRadialGradient(cx-5,cy-5,2,cx,cy,22);

    ctx.strokeStyle='rgba(251,191,36,0.7)';ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(cx-5,cy-5,6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();

    // Pointer (top) — bigger and more visible
    ctx.save();ctx.translate(cx,cy-R-2);
    ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(-13,-8);ctx.lineTo(13,-8);ctx.closePath();

  function handleDragMove(clientX,clientY){

  function handleDragEnd(){

    if(phase==='spinning')return;

    var dur=(7000+Math.random()*5000);
    var wi=Math.floor(secureRandom()*N);
    setWinIdx(wi);
    var extraSpins=7+Math.floor(Math.random()*5);
    var winCenter=wi*segAngle+segAngle/2;
    var startA=angle%(2*Math.PI);
    // endA must satisfy: (-endA) mod 2π = winCenter mod 2π

        setAngle(endA%(2*Math.PI));

        if(ah){
          // Victory chime
          var ctx2=ah.ctx;var m=ah.master;var now=ctx2.currentTime;
          [523.25,659.25,783.99,1046.5].forEach(function(f,fi){aT(ctx2,m,f,now+fi*0.1,0.25,0.2,'triangle');});

        }

  }

    <h2 className="text-lg font-bold text-gray-800 mb-4">\u{1F3A1} Gl\u00FCcksrad</h2>

    ${winner&&html`<div className="winner-enter mb-4 w-full max-w-sm text-center">
