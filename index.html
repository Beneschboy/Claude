      aT(ctx,d,523.25,ct+0.07,0.14,0.13,'triangle');
      aT(ctx,d,130,ct+0.02,0.12,0.10,'sine');}catch(e){}
  }
  function playFull(){
    try{var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var d=ah.master;var ct=ctx.currentTime;
      aT(ctx,d,300,ct,0.09,0.16,'square');
      aT(ctx,d,200,ct+0.08,0.14,0.14,'square');}catch(e){}
  }
  function playComplete(){
    try{var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var d=ah.master;var ct=ctx.currentTime;
      [261.63,329.63,392,523.25].forEach(function(f,i){aT(ctx,d,f,ct+i*0.14,0.3,0.16,'triangle');});
      aC(ctx,d,ct+0.62,[261.63,329.63,392,523.25],0.11,1.3,'triangle');}catch(e){}
  }

  /* ── BRETT ── */
  function buildBoard(ng,BR){
    var fieldW=FIELD_R-FIELD_L;
    var LW=fieldW/ng;

    var cups=[];
    for(var i=0;i<ng;i++){
      cups.push({gi:i,x0:FIELD_L+i*LW,x1:FIELD_L+(i+1)*LW,cx:FIELD_L+(i+0.5)*LW,
        w:LW,fill:0,cap:0,closed:false,flash:0,lidT:0});
    }
    // Trennspitzen zwischen den Bechern
    var apex=[];
    for(var d=1;d<ng;d++)apex.push({x:FIELD_L+d*LW,y:CUP_TOP-14,r:8,hit:0});

    // Spinner (kreisförmige Knöpfe)
    var spinners=[
      {x:FIELD_L+fieldW*0.30,y:FIELD_T+188,r:Math.min(46,fieldW*0.09),a:0.4,spd:0.030,knob:7,hit:0},
      {x:FIELD_L+fieldW*0.70,y:FIELD_T+330,r:Math.min(46,fieldW*0.09),a:2.1,spd:-0.026,knob:7,hit:0}
    ];
    // Bumper
    var bumpers=[
      {x:FIELD_L+fieldW*0.50,y:FIELD_T+124,r:17,hit:0},
      {x:FIELD_L+fieldW*0.18,y:FIELD_T+300,r:15,hit:0},
      {x:FIELD_L+fieldW*0.82,y:FIELD_T+228,r:15,hit:0},
      {x:FIELD_L+fieldW*0.50,y:FIELD_T+404,r:17,hit:0}
    ];

    // Stifte im Versatzraster — überall passierbar
    var pins=[];
    var stepX=Math.max(BR*2.9,44);
    var stepY=Math.max(BR*2.6,40);
    var rowI=0;
    for(var y=FIELD_T+96;y<CUP_TOP-46;y+=stepY){
      var off=(rowI%2)*stepX/2;
      for(var x=FIELD_L+20+off;x<FIELD_R-16;x+=stepX){
        var ok=true;
        for(var s=0;s<spinners.length;s++){
          var sp=spinners[s];
          if(Math.pow(x-sp.x,2)+Math.pow(y-sp.y,2)<Math.pow(sp.r+26,2)){ok=false;break;}
        }
        if(ok)for(var b2=0;b2<bumpers.length;b2++){
          var bm=bumpers[b2];
          if(Math.pow(x-bm.x,2)+Math.pow(y-bm.y,2)<Math.pow(bm.r+24,2)){ok=false;break;}
        }
        if(ok)pins.push({x:x,y:y,r:5.5,hit:0});
      }
      rowI++;
    }
    return{cups:cups,apex:apex,pins:pins,spinners:spinners,bumpers:bumpers,LW:LW};
  }

  /* ── STATISCHER HINTERGRUND ── */
  function cacheBg(board){
    var off=document.createElement('canvas');off.width=AW*2;off.height=AH*2;
    var c=off.getContext('2d');c.setTransform(2,0,0,2,0,0);

    var fg=c.createLinearGradient(0,0,AW,AH);
    fg.addColorStop(0,'#C9A94F');fg.addColorStop(0.32,'#A08530');
    fg.addColorStop(0.65,'#C4A84E');fg.addColorStop(1,'#7C5D12');
    c.fillStyle=fg;c.fillRect(0,0,AW,AH);
    c.fillStyle='#6B590F';c.fillRect(7,7,AW-14,AH-14);
    c.fillStyle='#9B7E2A';c.fillRect(11,11,AW-22,AH-22);
    c.fillStyle='#C9A94F';c.fillRect(15,15,AW-30,AH-30);
    c.fillStyle='#7C5D12';c.fillRect(19,19,AW-38,AH-38);
    [[16,16],[AW-16,16],[16,AH-16],[AW-16,AH-16]].forEach(function(s){
      var sg=c.createRadialGradient(s[0]-2,s[1]-2,1,s[0],s[1],7);
      sg.addColorStop(0,'#FFE9A8');sg.addColorStop(0.5,'#C9A227');sg.addColorStop(1,'#6B4E0B');
      c.beginPath();c.arc(s[0],s[1],7,0,Math.PI*2);c.fillStyle=sg;c.fill();
      c.strokeStyle='rgba(0,0,0,0.4)';c.lineWidth=1.4;
      c.beginPath();c.moveTo(s[0]-4,s[1]);c.lineTo(s[0]+4,s[1]);c.stroke();
    });

    var wg=c.createLinearGradient(0,FIELD_T,0,FIELD_B);
    wg.addColorStop(0,'#EFD3A0');wg.addColorStop(0.22,'#E0BC8B');
    wg.addColorStop(0.55,'#D2A876');wg.addColorStop(1,'#C08F5E');
    c.fillStyle=wg;c.fillRect(FIELD_L,FIELD_T,FIELD_R-FIELD_L,FIELD_B-FIELD_T);
    c.save();c.globalAlpha=0.05;c.strokeStyle='#7B4A20';c.lineWidth=1;
    for(var gy=FIELD_T;gy<FIELD_B;gy+=5){
      c.beginPath();c.moveTo(FIELD_L,gy);
      for(var gx=FIELD_L;gx<FIELD_R;gx+=16)c.lineTo(gx+9,gy+Math.sin(gx*0.045+gy*0.02)*2.6);
      c.stroke();
    }
    c.restore();

    // Einwurfschlitz
    c.fillStyle='rgba(0,0,0,0.14)';
    c.beginPath();
    c.moveTo(FIELD_L+40,FIELD_T);c.lineTo(FIELD_R-40,FIELD_T);
    c.lineTo(FIELD_R-90,FIELD_T+34);c.lineTo(FIELD_L+90,FIELD_T+34);
    c.closePath();c.fill();
    c.strokeStyle='rgba(90,60,25,0.4)';c.lineWidth=2;c.stroke();
    c.fillStyle='#7C5D12';c.font='bold 11px Inter,sans-serif';
    c.textAlign='center';c.textBaseline='middle';
    c.fillText('▼  E I N W U R F  ▼',AW/2,FIELD_T+16);

    // Trennspitzen
    board.apex.forEach(function(a){
      c.fillStyle='rgba(0,0,0,0.22)';
      c.beginPath();
      c.moveTo(a.x-13,CUP_TOP+3);c.lineTo(a.x,a.y-5);c.lineTo(a.x+13,CUP_TOP+3);c.closePath();c.fill();
      var tg=c.createLinearGradient(a.x-13,0,a.x+13,0);
      tg.addColorStop(0,'#3F2A18');tg.addColorStop(0.45,'#7A5230');tg.addColorStop(1,'#3F2A18');
      c.fillStyle=tg;
      c.beginPath();
      c.moveTo(a.x-12,CUP_TOP);c.lineTo(a.x,a.y-6);c.lineTo(a.x+12,CUP_TOP);c.closePath();c.fill();
      c.fillStyle='#8B6914';
      c.beginPath();c.arc(a.x,a.y-6,4.5,0,Math.PI*2);c.fill();
    });

    // Becherkästen
    board.cups.forEach(function(cp){
      var col=MAZE_COLORS[cp.gi%MAZE_COLORS.length];
      var bx=cp.x0+5,bw=cp.w-10,by=CUP_TOP+4,bh=FIELD_B-by-5;
      c.fillStyle='rgba(0,0,0,0.26)';c.fillRect(bx+2,by+3,bw,bh);
      var cg=c.createLinearGradient(bx,by,bx+bw,by);
      cg.addColorStop(0,'#2A1B10');cg.addColorStop(0.5,'#43301D');cg.addColorStop(1,'#2A1B10');
      c.fillStyle=cg;c.fillRect(bx,by,bw,bh);
      c.strokeStyle=col;c.lineWidth=3;c.strokeRect(bx+1.5,by+1.5,bw-3,bh-3);
      c.fillStyle=col;c.fillRect(bx,by,bw,5);
      c.font='bold 16px Inter,sans-serif';c.textAlign='center';c.textBaseline='middle';
      c.strokeStyle='rgba(0,0,0,0.55)';c.lineWidth=3.5;c.lineJoin='round';
      c.strokeText('G'+(cp.gi+1),cp.cx,by+bh-13);
      c.fillStyle='#FFF3D6';c.fillText('G'+(cp.gi+1),cp.cx,by+bh-13);
    });

    c.strokeStyle='rgba(0,0,0,0.20)';c.lineWidth=2;
    c.strokeRect(FIELD_L+1,FIELD_T+1,FIELD_R-FIELD_L-2,FIELD_B-FIELD_T-2);
    bgCanvasRef.current=off;
  }

  /* ── START ── */
  function startPlinko(){
    var ng=NUM_GROUPS;
    doCleanup();
    var BR=names.length>30?10:12;
    var board=buildBoard(ng,BR);
    cacheBg(board);

    // Kapazitäten: gleichmäßig, Rest zufällig verteilt
    var base=Math.floor(names.length/ng),rem=names.length%ng;
    var extra=shuffle(board.cups.map(function(_,i){return i;})).slice(0,rem);
    board.cups.forEach(function(cp,i){cp.cap=base+(extra.indexOf(i)>=0?1:0);});

    var sh=shuffle(names.slice());
    var balls=sh.map(function(nm,i){
      return{id:i,name:nm,color:BALL_COLORS[i%BALL_COLORS.length],
        x:AW/2,y:FIELD_T+22,vx:0,vy:0,
        active:false,done:false,cup:-1,
        trail:[],angle:0,stuck:0,age:0,rescue:false};
    });

    var g={board:board,balls:balls,particles:[],floats:[],
      dropIdx:0,dropT:0,dropEvery:Math.max(170,Math.min(500,Math.round(8500/names.length))),
      done:false,BR:BR,landedCount:0,score:0,shake:0,
      startT:performance.now(),numGroups:ng,tiltX:0};
    gRef.current=g;

    setGroups(Array.from({length:ng},function(){return [];}));
    setCaps(board.cups.map(function(cp){return cp.cap;}));
    setPhase('tilting');setIsTilting(true);setDropped(0);setLanded(0);setScore(0);setShowConfetti(false);
    later(function(){setIsTilting(false);setPhase('running');startAudio();},700);

    later(function(){
      var gg=gRef.current;if(!gg||gg.done)return;
      gg.balls.forEach(function(b){if(b.active&&!b.done)b.rescue=true;});
    },30000);
    later(function(){
      var gg=gRef.current;if(!gg||gg.done)return;
      gg.balls.forEach(function(b){if(!b.done){b.active=true;landBall(gg,b,nearestOpen(gg,b.x));}});
      finish(gg);
    },36000);

    var last=performance.now();
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min((now-last)/16.67,2.5);last=now;
      gg.tiltX=Math.max(-1,Math.min(1,(mouseRef.current.x-0.5)*2))*0.06;
      updateMaze(gg,dt);drawMaze(gg,now);
      if(!gg.done)rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function nearestOpen(g,x){
    var best=null,bd=1e9;
    g.board.cups.forEach(function(cp){
      if(cp.closed)return;
      var d=Math.abs(cp.cx-x);
      if(d<bd){bd=d;best=cp;}
    });
    if(!best)best=g.board.cups[g.board.cups.length-1];
    return best;
  }

  function finish(g){
    if(g.done)return;
    g.done=true;
    later(function(){
      setPhase('done');onResult(g.numGroups+' Gruppen');playComplete();
      later(function(){setShowConfetti(true);},250);
    },500);
  }

  function landBall(g,b,cp){
    if(b.done)return;
    b.done=true;b.cup=cp.gi;
    cp.fill++;cp.flash=1;
    if(cp.fill>=cp.cap&&!cp.closed){cp.closed=true;cp.lidT=0;playFull();}
    g.landedCount++;g.score+=250;
    g.shake=Math.min(1,g.shake+0.3);
    setLanded(g.landedCount);setScore(g.score);
    setGroups(function(prev){return prev.map(function(gr,gi){return gi===cp.gi?gr.concat([b.name]):gr;});});
    playCupDrop();
    for(var i=0;i<12;i++){
      var a=Math.random()*Math.PI*2;
      g.particles.push({x:cp.cx,y:CUP_TOP+18,vx:Math.cos(a)*2.2,vy:-Math.abs(Math.sin(a))*2.8-0.5,
        life:22,maxLife:22,color:MAZE_COLORS[cp.gi%MAZE_COLORS.length],r:2.1});
    }
    g.floats.push({x:cp.cx,y:CUP_TOP-6,txt:'+250',color:'#FFE9A8',life:38,maxLife:38});
  }

  /* Kreis-Kollision: schiebt immer sauber heraus, nie klemmen */
  function hitCircle(b,BR,cx,cy,cr,bounce,extra){
    var dx=b.x-cx,dy=b.y-cy;
    var d=Math.sqrt(dx*dx+dy*dy);
    var minD=cr+BR;
    if(d>=minD)return 0;
    var nx,ny;
    if(d<0.001){nx=0;ny=-1;d=0.001;}else{nx=dx/d;ny=dy/d;}
    b.x=cx+nx*minD;b.y=cy+ny*minD;
    var dot=b.vx*nx+b.vy*ny;
    if(dot<0){
      b.vx-=(1+bounce)*dot*nx;
      b.vy-=(1+bounce)*dot*ny;
    }
    if(extra){b.vx+=nx*extra;b.vy+=ny*extra;}
    b.vx+=(Math.random()-0.5)*0.9;
    return Math.abs(dot)+1;
  }

  /* ── PHYSIK ── */
  function updateMaze(g,dt){
    if(g.done)return;
    var BR=g.BR;var board=g.board;
    if(g.shake>0)g.shake=Math.max(0,g.shake-0.05*dt);

    g.dropT+=dt*16.67;
    if(g.dropIdx<g.balls.length&&g.dropT>=g.dropEvery){
      g.dropT=0;
      var nb=g.balls[g.dropIdx];
      nb.active=true;
      nb.x=FIELD_L+70+Math.random()*(FIELD_R-FIELD_L-140);
      nb.y=FIELD_T+24;nb.vx=(Math.random()-0.5)*1.4;nb.vy=1.4;
      g.dropIdx++;setDropped(g.dropIdx);
    }

    board.spinners.forEach(function(sp){
      sp.a+=sp.spd*dt;
      if(sp.hit>0)sp.hit=Math.max(0,sp.hit-0.06*dt);
    });
    board.bumpers.forEach(function(bm){if(bm.hit>0)bm.hit=Math.max(0,bm.hit-0.05*dt);});
    board.pins.forEach(function(p){if(p.hit>0)p.hit=Math.max(0,p.hit-0.06*dt);});
    board.apex.forEach(function(a){if(a.hit>0)a.hit=Math.max(0,a.hit-0.06*dt);});
    board.cups.forEach(function(cp){
      if(cp.flash>0)cp.flash=Math.max(0,cp.flash-0.03*dt);
      if(cp.closed&&cp.lidT<1)cp.lidT=Math.min(1,cp.lidT+0.07*dt);
    });

    var GRAV=0.32;

    g.balls.forEach(function(b){
      if(!b.active||b.done)return;
      b.age+=dt;

      if(b.rescue||b.age>760){
        var tgt=nearestOpen(g,b.x);
        b.vx*=0.5;
        b.x+=(tgt.cx-b.x)*0.10*dt;
        b.y+=Math.max(2.4,(CUP_TOP+40-b.y)*0.05)*dt;
        b.angle+=0.12*dt;
        if(b.y>CUP_TOP+26)landBall(g,b,tgt);
        return;
      }

      b.vy+=GRAV*dt;
      b.vx+=g.tiltX*dt;
      b.vx*=0.991;
      if(b.vy>8.5)b.vy=8.5;
      if(b.vy<-8)b.vy=-8;
      if(b.vx>6)b.vx=6;if(b.vx<-6)b.vx=-6;
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      b.angle+=(b.vx/BR)*dt*0.6;

      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>9)b.trail.shift();

      // Außenwände
      if(b.x<FIELD_L+BR){b.x=FIELD_L+BR;b.vx=Math.abs(b.vx)*0.45+0.3;playBounceThrottled('wood',2);}
      if(b.x>FIELD_R-BR){b.x=FIELD_R-BR;b.vx=-Math.abs(b.vx)*0.45-0.3;playBounceThrottled('wood',2);}
      if(b.y<FIELD_T+BR){b.y=FIELD_T+BR;b.vy=Math.abs(b.vy)*0.3;}

      if(b.y<CUP_TOP+4){
        // Stifte
        for(var pi=0;pi<board.pins.length;pi++){
          var p=board.pins[pi];
          if(Math.abs(p.x-b.x)>40||Math.abs(p.y-b.y)>40)continue;
          var im=hitCircle(b,BR,p.x,p.y,p.r,0.55,0);
          if(im){p.hit=1;g.score+=5;playBounceThrottled('pin',im);
            g.particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*2,vy:-Math.random()*1.4,
              life:11,maxLife:11,color:'#FFE9A8',r:1.5});}
        }
        // Trennspitzen
        for(var ai=0;ai<board.apex.length;ai++){
          var ap=board.apex[ai];
          var im2=hitCircle(b,BR,ap.x,ap.y,ap.r,0.5,0);
          if(im2){ap.hit=1;playBounceThrottled('wood',im2);}
        }
        // Spinner
        for(var si=0;si<board.spinners.length;si++){
          var sp=board.spinners[si];
          for(var k=0;k<3;k++){
            var ka=sp.a+k*Math.PI*2/3;
            var kx=sp.x+Math.cos(ka)*sp.r,ky=sp.y+Math.sin(ka)*sp.r*0.6;
            var im3=hitCircle(b,BR,kx,ky,sp.knob,0.7,1.8);
            if(im3){
              sp.hit=1;g.score+=25;playBounceThrottled('spin',im3);
              b.vx+=-Math.sin(ka)*sp.spd*90;
              for(var q=0;q<3;q++)
                g.particles.push({x:kx,y:ky,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3,
                  life:15,maxLife:15,color:'#93C5FD',r:1.7});
            }
          }
        }
        // Bumper
        for(var bi=0;bi<board.bumpers.length;bi++){
          var bm=board.bumpers[bi];
          var im4=hitCircle(b,BR,bm.x,bm.y,bm.r,0.35,4.6);
          if(im4){
            bm.hit=1;g.score+=100;g.shake=Math.min(1,g.shake+0.2);
            playBounceThrottled('bumper',im4);
            g.floats.push({x:bm.x,y:bm.y-20,txt:'+100',color:'#FDE68A',life:30,maxLife:30});
            for(var q2=0;q2<8;q2++){
              var sa=Math.random()*Math.PI*2;
              g.particles.push({x:bm.x+Math.cos(sa)*bm.r,y:bm.y+Math.sin(sa)*bm.r,
                vx:Math.cos(sa)*2.4,vy:Math.sin(sa)*2.4,life:18,maxLife:18,color:'#FCA5A5',r:1.9});
            }
          }
        }
      }

      // Becherzone
      if(b.y>CUP_TOP-BR){
        var idx=Math.floor((b.x-FIELD_L)/board.LW);
        if(idx<0)idx=0;if(idx>board.cups.length-1)idx=board.cups.length-1;
        var cp2=board.cups[idx];
        if(cp2.closed){
          // Deckel: abprallen und Richtung offener Becher schubsen
          b.y=CUP_TOP-BR-1;
          b.vy=-Math.abs(b.vy)*0.42-1.6;
          var op=nearestOpen(g,b.x);
          var dir=op.cx>b.x?1:-1;
          b.vx=dir*(1.8+Math.random()*1.6);
          cp2.flash=Math.max(cp2.flash,0.5);
          playBounceThrottled('lid',3);
        }else{
          // im Becher: seitlich führen, dann landen
          var l=cp2.x0+BR+5,r2=cp2.x1-BR-5;
          if(l>r2){l=cp2.cx;r2=cp2.cx;}
          if(b.x<l){b.x=l;b.vx=Math.abs(b.vx)*0.3;}
          if(b.x>r2){b.x=r2;b.vx=-Math.abs(b.vx)*0.3;}
          b.vx+=(cp2.cx-b.x)*0.02*dt;
          if(b.y>CUP_TOP+24){landBall(g,b,cp2);return;}
        }
      }

      // Anti-Hänger: immer nach OBEN befreien
      var sp2=b.vx*b.vx+b.vy*b.vy;
      if(sp2<0.5){
        b.stuck+=dt;
        if(b.stuck>26){b.vy=-2.6;b.vx=(Math.random()<0.5?-1:1)*(2.2+Math.random()*1.8);b.stuck=0;}
      }else b.stuck=0;
    });

    // Kugel-Kugel
    var act=[];
    g.balls.forEach(function(b){if(b.active&&!b.done&&!b.rescue)act.push(b);});
    for(var i=0;i<act.length;i++){
      for(var j=i+1;j<act.length;j++){
        var a=act[i],bb=act[j];
        var ddx=a.x-bb.x,ddy=a.y-bb.y;
        var dd=Math.sqrt(ddx*ddx+ddy*ddy);
        var mind=BR*2;
        if(dd<mind&&dd>0.1){
          var nnx=ddx/dd,nny=ddy/dd,ov=(mind-dd)*0.5;
          a.x+=nnx*ov;a.y+=nny*ov;bb.x-=nnx*ov;bb.y-=nny*ov;
          var rv=(a.vx-bb.vx)*nnx+(a.vy-bb.vy)*nny;
          if(rv<0){
            a.vx-=rv*nnx*0.4;a.vy-=rv*nny*0.4;
            bb.vx+=rv*nnx*0.4;bb.vy+=rv*nny*0.4;
          }
        }
      }
    }

    for(var pp=g.particles.length-1;pp>=0;pp--){
      var pt=g.particles[pp];
      pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=0.05*dt;pt.life-=dt;
      if(pt.life<=0)g.particles.splice(pp,1);
    }
    for(var ff=g.floats.length-1;ff>=0;ff--){
      var fo=g.floats[ff];
      fo.y-=0.6*dt;fo.life-=dt;
      if(fo.life<=0)g.floats.splice(ff,1);
    }

    if(!g.done&&g.dropIdx>=g.balls.length){
      var all=true;
      for(var q3=0;q3<g.balls.length;q3++)if(!g.balls[q3].done){all=false;break;}
      if(all)finish(g);
    }
  }

  /* ── ZEICHNEN ── */
  function drawMaze(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    var sh=g.shake;
    var ox=sh>0?(Math.random()-0.5)*sh*4:0;
    var oy=sh>0?(Math.random()-0.5)*sh*4:0;
    ctx.setTransform(2,0,0,2,ox*2,oy*2);
    var BR=g.BR;var board=g.board;

    if(bgCanvasRef.current)ctx.drawImage(bgCanvasRef.current,0,0,AW,AH);

    // Stifte
    board.pins.forEach(function(p){
      if(p.hit>0.05){
        ctx.beginPath();ctx.arc(p.x,p.y,p.r+6,0,Math.PI*2);
        ctx.fillStyle='rgba(255,225,150,'+(p.hit*0.35)+')';ctx.fill();
      }
      ctx.beginPath();ctx.arc(p.x+1,p.y+1.4,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.22)';ctx.fill();
      var pg=ctx.createRadialGradient(p.x-p.r*0.35,p.y-p.r*0.35,0.5,p.x,p.y,p.r);
      pg.addColorStop(0,'#F5F5F5');pg.addColorStop(0.42,'#9AA0A6');pg.addColorStop(1,'#4B5158');
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=pg;ctx.fill();
    });

    // Trennspitzen-Glanz
    board.apex.forEach(function(a){
      if(a.hit>0.05){
        ctx.beginPath();ctx.arc(a.x,a.y,a.r+6*a.hit,0,Math.PI*2);
        ctx.strokeStyle='rgba(255,225,150,'+a.hit+')';ctx.lineWidth=2;ctx.stroke();
      }
    });

    // Spinner
    board.spinners.forEach(function(sp){
      ctx.save();
      for(var k=0;k<3;k++){
        var ka=sp.a+k*Math.PI*2/3;
        var kx=sp.x+Math.cos(ka)*sp.r,ky=sp.y+Math.sin(ka)*sp.r*0.6;
        ctx.strokeStyle='rgba(0,0,0,0.18)';ctx.lineWidth=4;
        ctx.beginPath();ctx.moveTo(sp.x,sp.y+2);ctx.lineTo(kx,ky+2);ctx.stroke();
        ctx.strokeStyle=sp.hit>0.05?'#FDE68A':'#8B6914';ctx.lineWidth=3.5;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(sp.x,sp.y);ctx.lineTo(kx,ky);ctx.stroke();
        var kg=ctx.createRadialGradient(kx-2,ky-2,0.5,kx,ky,sp.knob);
        kg.addColorStop(0,'#DBEAFE');kg.addColorStop(0.5,'#60A5FA');kg.addColorStop(1,'#1D4ED8');
        ctx.beginPath();ctx.arc(kx,ky,sp.knob,0,Math.PI*2);ctx.fillStyle=kg;ctx.fill();
        if(sp.hit>0.05){
          ctx.beginPath();ctx.arc(kx,ky,sp.knob+5*sp.hit,0,Math.PI*2);
          ctx.strokeStyle='rgba(147,197,253,'+sp.hit+')';ctx.lineWidth=2;ctx.stroke();
        }
      }
      ctx.beginPath();ctx.arc(sp.x,sp.y,5,0,Math.PI*2);
      ctx.fillStyle='#3F2A18';ctx.fill();
      ctx.strokeStyle='#C9A94F';ctx.lineWidth=1.5;ctx.stroke();
      ctx.restore();
    });

    // Bumper
    board.bumpers.forEach(function(bm){
      ctx.save();
      var pulse=1+bm.hit*0.22;
      ctx.beginPath();ctx.arc(bm.x,bm.y+2,bm.r*pulse+2,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fill();
      var bg2=ctx.createRadialGradient(bm.x-bm.r*0.3,bm.y-bm.r*0.3,1,bm.x,bm.y,bm.r*pulse);
      bg2.addColorStop(0,'#FFE4E6');bg2.addColorStop(0.45,'#F87171');bg2.addColorStop(1,'#991B1B');
      ctx.beginPath();ctx.arc(bm.x,bm.y,bm.r*pulse,0,Math.PI*2);ctx.fillStyle=bg2;ctx.fill();
      ctx.strokeStyle='#FFF1F2';ctx.lineWidth=2;ctx.stroke();
      ctx.beginPath();ctx.arc(bm.x,bm.y,bm.r*0.42,0,Math.PI*2);
      ctx.fillStyle=bm.hit>0.1?'#FFFBEB':'#FCA5A5';ctx.fill();
      if(bm.hit>0.05){
        ctx.beginPath();ctx.arc(bm.x,bm.y,bm.r*(1.5+bm.hit),0,Math.PI*2);
        ctx.strokeStyle='rgba(254,240,138,'+bm.hit+')';ctx.lineWidth=2.5;ctx.stroke();
      }
      ctx.restore();
    });

    // Becher: Füllung, Deckel, Zähler
    board.cups.forEach(function(cp){
      var col=MAZE_COLORS[cp.gi%MAZE_COLORS.length];
      var bx=cp.x0+7,bw=cp.w-14,by=CUP_TOP+8,bh=FIELD_B-by-8;
      if(cp.fill>0){
        var perRow=Math.max(2,Math.floor(bw/(BR*1.5)));
        var maxRows=Math.max(1,Math.floor(bh/(BR*1.2)));
        var shown=Math.min(cp.fill,perRow*maxRows);
        for(var q=0;q<shown;q++){
          var rr=Math.floor(q/perRow),cc=q%perRow;
          var mx=bx+bw*((cc+0.5)/perRow);
          var my=FIELD_B-12-rr*(BR*1.15);
          ctx.beginPath();ctx.arc(mx,my,BR*0.54,0,Math.PI*2);
          ctx.fillStyle=col;ctx.fill();
          ctx.fillStyle='rgba(255,255,255,0.42)';
          ctx.beginPath();ctx.arc(mx-BR*0.17,my-BR*0.17,BR*0.17,0,Math.PI*2);ctx.fill();
        }
        if(cp.fill>shown){
          ctx.font='bold 11px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle='#FFF3D6';ctx.fillText('+'+(cp.fill-shown),cp.cx,FIELD_B-12-maxRows*(BR*1.15));
        }
      }
      // Zähler über dem Becher
      ctx.save();
      ctx.font='bold 11px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      var lbl=cp.fill+'/'+cp.cap;
      var lw=ctx.measureText(lbl).width+14;
      ctx.fillStyle=cp.closed?'rgba(90,20,20,0.85)':'rgba(40,26,10,0.72)';
      hRR(ctx,cp.cx-lw/2,CUP_TOP-24,lw,17,8);ctx.fill();
      ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.stroke();
      ctx.fillStyle=cp.closed?'#FCA5A5':'#FFF3D6';
      ctx.fillText(lbl,cp.cx,CUP_TOP-15.5);
      ctx.restore();
      // Deckel
      if(cp.closed){
        var t=cp.lidT;
        ctx.save();
        var lx=cp.x0+4,lw2=(cp.w-8)*t;
        var lgr=ctx.createLinearGradient(0,CUP_TOP-6,0,CUP_TOP+8);
        lgr.addColorStop(0,'#8A5C36');lgr.addColorStop(0.5,'#5C3A21');lgr.addColorStop(1,'#3B2413');
        ctx.fillStyle=lgr;
        hRR(ctx,lx,CUP_TOP-5,lw2,12,5);ctx.fill();
        ctx.strokeStyle='#2A1B10';ctx.lineWidth=1.6;ctx.stroke();
        ctx.fillStyle='rgba(255,255,255,0.14)';
        hRR(ctx,lx+2,CUP_TOP-3.5,Math.max(0,lw2-4),3,1.5);ctx.fill();
        if(t>0.85){
          ctx.font='900 10px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
          ctx.fillStyle='#FCA5A5';ctx.fillText('VOLL',cp.cx,CUP_TOP+1);
        }
        ctx.restore();
      }
      if(cp.flash>0.03){
        ctx.save();
        ctx.strokeStyle='rgba(255,240,180,'+cp.flash+')';ctx.lineWidth=3;
        ctx.strokeRect(cp.x0+5,CUP_TOP+4,cp.w-10,FIELD_B-(CUP_TOP+4)-5);
        ctx.restore();
      }
    });

    // Partikel
    g.particles.forEach(function(p){
      ctx.globalAlpha=Math.max(0,(p.life/p.maxLife)*0.85);
      ctx.beginPath();ctx.arc(p.x,p.y,p.r||1.6,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
    });
    ctx.globalAlpha=1;

    // Kugeln
    g.balls.forEach(function(b){
      if(!b.active||b.done)return;
      var drawR=BR;
      if(b.trail.length>1){
        for(var ti=0;ti<b.trail.length-1;ti++){
          var tf=(ti+1)/b.trail.length;
          ctx.globalAlpha=tf*0.28;
          ctx.beginPath();ctx.arc(b.trail[ti].x,b.trail[ti].y,drawR*(0.20+tf*0.34),0,Math.PI*2);
          ctx.fillStyle=b.color;ctx.fill();
        }
        ctx.globalAlpha=1;
      }
      ctx.beginPath();ctx.arc(b.x+1.4,b.y+1.8,drawR,0,Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,0.24)';ctx.fill();
      var gr=ctx.createRadialGradient(b.x-drawR*0.34,b.y-drawR*0.34,drawR*0.08,b.x,b.y,drawR);
      gr.addColorStop(0,'rgba(255,255,255,0.62)');
      gr.addColorStop(0.34,b.color);gr.addColorStop(1,hShade(b.color,-0.35));
      ctx.beginPath();ctx.arc(b.x,b.y,drawR,0,Math.PI*2);ctx.fillStyle=gr;ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.22)';ctx.lineWidth=0.8;ctx.stroke();
      var hlx=b.x+Math.cos(b.angle||0)*drawR*0.34;
      var hly=b.y+Math.sin(b.angle||0)*drawR*0.34;
      ctx.beginPath();ctx.arc(hlx,hly,drawR*0.20,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fill();
      var nm=truncName(b.name,8);
      var fs=fitFont(ctx,nm,drawR*3.0,10,7);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.92)';ctx.lineWidth=3;ctx.lineJoin='round';
      ctx.strokeText(nm,b.x,b.y-drawR-7);
      ctx.fillStyle='#fff';ctx.fillText(nm,b.x,b.y-drawR-7);
    });

    // Floats
    g.floats.forEach(function(fo){
      ctx.save();ctx.globalAlpha=Math.max(0,fo.life/fo.maxLife);
      ctx.font='900 13px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineWidth=3.5;ctx.lineJoin='round';
      ctx.strokeText(fo.txt,fo.x,fo.y);
      ctx.fillStyle=fo.color;ctx.fillText(fo.txt,fo.x,fo.y);
      ctx.restore();
    });

    // HUD
    var totalN=names.length;
    var hw=210,hx=AW/2-hw/2,hy=FIELD_T+40;
    ctx.save();
    ctx.fillStyle='rgba(70,46,14,0.80)';
    hRR(ctx,hx,hy,hw,38,9);ctx.fill();
    ctx.strokeStyle='rgba(255,233,168,0.45)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#FFF3D6';ctx.font='bold 11px Inter,sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(g.dropIdx+'/'+totalN+' geworfen · '+g.landedCount+' gelandet · '+g.score+' Pkt',AW/2,hy+12);
    var barW=hw-24,barX=AW/2-barW/2,barY=hy+22;
    ctx.fillStyle='rgba(255,255,255,0.16)';
    hRR(ctx,barX,barY,barW,7,3.5);ctx.fill();
    var prog=totalN>0?g.landedCount/totalN:0;
    if(prog>0){
      var bf=ctx.createLinearGradient(barX,0,barX+barW,0);
      bf.addColorStop(0,'#F39C12');bf.addColorStop(1,'#27AE60');
      ctx.fillStyle=bf;hRR(ctx,barX,barY,barW*prog,7,3.5);ctx.fill();
    }
    ctx.restore();
  }

  function handleMouseMove(e){
    var rect=canvasRef.current&&canvasRef.current.getBoundingClientRect();
    if(!rect)return;
    mouseRef.current={x:(e.clientX-rect.left)/rect.width,y:(e.clientY-rect.top)/rect.height};
    if(canvasRef.current&&canvasRef.current.parentElement){
      var rx=((e.clientY-rect.top)/rect.height-0.5)*-6;
      var ry=((e.clientX-rect.left)/rect.width-0.5)*7;
      canvasRef.current.parentElement.style.transform='perspective(1000px) rotateX('+rx+'deg) rotateY('+ry+'deg)';
    }
  }
  function handleMouseLeave(){
    mouseRef.current={x:0.5,y:0.5};
    if(canvasRef.current&&canvasRef.current.parentElement)canvasRef.current.parentElement.style.transform='';
  }
  function handleTouchMove(e){
    e.preventDefault();
    var t=e.touches[0];
    var rect=canvasRef.current&&canvasRef.current.getBoundingClientRect();
    if(!rect)return;
    mouseRef.current={x:(t.clientX-rect.left)/rect.width,y:(t.clientY-rect.top)/rect.height};
  }
  function reset(){
    doCleanup();mouseRef.current={x:0.5,y:0.5};
    setPhase('pick');setGroups(Array.from({length:NUM_GROUPS},function(){return [];}));
    setCaps([]);setShowConfetti(false);setDropped(0);setLanded(0);setScore(0);
  }

  function confetti(){
    if(!showConfetti)return null;
    var pieces=[];for(var i=0;i<60;i++){
      var left=Math.random()*100;var dur=1.5+Math.random()*2;var delay=Math.random()*0.8;
      var color=['#C0392B','#2980B9','#27AE60','#F39C12','#8E44AD','#E67E22'][Math.floor(Math.random()*6)];
      var size=4+Math.random()*6;
      pieces.push(html`<div key=${i} className="confetti-piece" style=${{left:left+'%',width:size+'px',height:size+'px',background:color,animationDuration:dur+'s',animationDelay:delay+'s',borderRadius:Math.random()>.5?'50%':'2px'}}/>`);
    }
    return pieces;
  }

  var perGroup=Math.floor(names.length/NUM_GROUPS);
  var remainder=names.length%NUM_GROUPS;
  var sizeInfo=remainder===0?perGroup+' pro Gruppe':perGroup+'–'+(perGroup+1)+' pro Gruppe';
  var gridClass=NUM_GROUPS<=3?'grid-cols-'+NUM_GROUPS:NUM_GROUPS===4?'grid-cols-2 sm:grid-cols-4':NUM_GROUPS===5?'grid-cols-3 sm:grid-cols-5':'grid-cols-3 sm:grid-cols-6';

  return html`<div className="max-w-5xl mx-auto px-4 py-6 fade-in-up">
    ${confetti()}
    <div className="flex items-center justify-between mb-4">
      <button onClick=${function(){doCleanup();onDone();}} className="text-gray-500 hover:text-gray-900 transition-colors text-sm flex items-center gap-1">← Zurück</button>
      <div className="text-center">
        <h2 className="text-xl font-bold" style=${{color:'#8B6914'}}>\u{1F3B2} Labyrinth</h2>
        ${phase==='running'&&html`<p className="text-xs font-semibold mt-1" style=${{color:'#A0761C'}}>${dropped}/${names.length} geworfen · ${landed} gelandet · ${score} Punkte</p>`}
      </div>
      <div className="text-gray-500 text-xs">${phase==='running'?landed+'/'+names.length:''}</div>
    </div>

    ${phase==='pick'&&html`<div className="text-center mb-6 fade-in-up">
      <p className="text-gray-600 text-sm mb-1">Die Kugeln kullern frei über das ganze Brett — durch Stifte, Spinner und Bumper.</p>
      <p className="text-gray-400 text-xs mb-4">Ist ein Becher voll, klappt sein Deckel zu und die Kugeln rollen weiter zum nächsten. Maus bewegen kippt das Brett.</p>
      <div className="flex items-center justify-center gap-3 mb-4">
        <span className="text-gray-600 text-sm font-semibold">Gruppen:</span>
        ${[2,3,4,5,6].map(function(n){return html`<button key=${n} onClick=${function(){setNumGroups(n)}} className=${"px-4 py-1.5 rounded-lg text-sm font-bold border-2 transition-all "+(NUM_GROUPS===n?'border-amber-500 bg-amber-50 text-amber-700':'border-gray-200 bg-white text-gray-500 hover:border-amber-300')}>${n}</button>`;})}</div>
      <p className="text-gray-500 text-xs mb-5">${names.length} Personen → ca. ${sizeInfo}</p>
      <button onClick=${startPlinko}
        className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all hover:scale-105 active:scale-95 text-sm"
        style=${{background:'linear-gradient(135deg, #8B6914, #BFA04B)',boxShadow:'0 4px 15px rgba(139,105,20,0.4)'}}>
        \u{1F3B2} Labyrinth starten
      </button>
    </div>`}

    ${(phase==='tilting'||phase==='running'||phase==='done')&&html`<div className=${"relative rounded-2xl overflow-hidden border-2 shadow-2xl mx-auto"+(isTilting?' board-tilt':'')} style=${{maxWidth:'760px',borderColor:'#8B6914',boxShadow:'0 10px 38px rgba(0,0,0,0.45)',transition:'transform 0.08s linear'}}>
      <canvas ref=${canvasRef} width=${AW*2} height=${AH*2}
        onMouseMove=${handleMouseMove}
        onMouseLeave=${handleMouseLeave}
        onTouchMove=${handleTouchMove}
        style=${{width:'100%',height:'auto',display:'block',cursor:phase==='running'?'crosshair':'default'}}/>
      ${phase==='running'&&html`<div style=${{position:'absolute',bottom:'6px',left:'50%',transform:'translateX(-50%)',fontSize:'10px',color:'rgba(255,255,255,0.42)',pointerEvents:'none',whiteSpace:'nowrap'}}>Maus bewegen zum Kippen</div>`}
    </div>`}

    ${(phase==='running'||phase==='done')&&groups.length>0&&html`<div className=${"mt-6 grid gap-4 "+gridClass}>
      ${groups.map(function(grp,gi){
        var full=caps[gi]!==undefined&&grp.length>=caps[gi];
        return html`<div key=${gi} className="rounded-xl border overflow-hidden shadow-md" style=${{borderColor:MAZE_COLORS[gi%MAZE_COLORS.length]+'66'}}>
          <div className="px-4 py-2 text-sm font-bold text-white flex items-center justify-between" style=${{background:'linear-gradient(135deg,'+MAZE_COLORS[gi%MAZE_COLORS.length]+'ee,'+MAZE_COLORS[gi%MAZE_COLORS.length]+'99)'}}>
            <span>Gruppe ${gi+1}</span>
            <span className="text-xs font-normal opacity-90">${grp.length}${caps[gi]!==undefined?'/'+caps[gi]:''}${full?' ✓':''}</span>
          </div>
          <div className="px-4 py-3 space-y-1 bg-white border-t border-gray-100 min-h-8">
            ${grp.map(function(name,ni){
              return html`<div key=${ni} className=${"text-sm text-gray-700 flex items-center gap-2 fade-in "+(ni===grp.length-1?"name-pop":"")}>
                <span className="w-2 h-2 rounded-full inline-block" style=${{background:MAZE_COLORS[gi%MAZE_COLORS.length]}}/>
                ${name}
              </div>`;
            })}
          </div>
        </div>`;
      })}
    </div>`}

    <div className="mt-5 text-center">
      ${phase==='done'&&html`<span className="inline-flex gap-3">
        <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold text-white border border-amber-700/40 hover:opacity-80 transition-all mr-3" style=${{background:'linear-gradient(135deg,#8B6914,#BFA04B)'}}>Nochmal</button>
        <button onClick=${function(){doCleanup();onDone();}} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
      </span>`}
    </div>
  </div>`;
}


/* ═══════════════════════════════════════════════════════
   BATTLE ROYALE MODE
   ═══════════════════════════════════════════════════════ */
function BattleRoyaleMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _st=useState('Bereit zum Absprung!');var statusText=_st[0];var setStatusText=_st[1];
  var _el=useState([]);var eliminated=_el[0];var setEliminated=_el[1];
  var _wn=useState(null);var winner=_wn[0];var setWinner=_wn[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _sv=useState(0);var surviving=_sv[0];var setSurviving=_sv[1];
  var _kf=useState([]);var killFeed=_kf[0];var setKillFeed=_kf[1];
  var _zp=useState(0);var zonePhase=_zp[0];var setZonePhase=_zp[1];
  var _mt=useState([]);var meteors=_mt[0];var setMeteors=_mt[1];
  var _hf=useState([]);var healFloats=_hf[0];var setHealFloats=_hf[1];
  var canvasRef=useRef(null);
  var gRef=useRef(null);
  var rafRef=useRef(null);
  var timers=useRef([]);
  var audioRef=useRef(null);

  var AW=620;var AH=400;
  var BR=names.length>30?13:names.length>18?15:names.length>12?18:21;
  var FS=names.length>30?9:names.length>18?10:names.length>12?11:13;
  var NMAX=names.length>30?7:names.length>18?8:names.length>12?9:11;

  useEffect(function(){return function(){doCleanup();}},[]);

  function doCleanup(){
    timers.current.forEach(clearTimeout);timers.current=[];
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}

  var KILL_MSGS=['\u{1F4DA} Wissen aufgebraucht!','\u{1F32B}\uFE0F Vom Nebel erwischt!','\u2753 Keine Antwort mehr!','\u{1F4A8} Rausgerutscht!','\u{1F634} Konzentration weg!','\u{1F9E0} Blackout!','\u{1F4C9} Punkte alle!','\u23F1\uFE0F Zeit abgelaufen!'];
  var CLOSE_MSGS=['\u{1F3C6} Ganz knapp!','\u{1F62E} Fast geschafft!','\u{1F44F} Starke Leistung!'];

  function addKill(name,cause,aliveLeft){
    var msgs=aliveLeft<=2?CLOSE_MSGS:KILL_MSGS;
    var comment=msgs[Math.floor(Math.random()*msgs.length)];
    var causeEmoji={storm:'\u{1F32B}\uFE0F',redzone:'\u2753',airstrike:'\u2753',finalzone:'\u{1F9E0}'};
    var entry={text:(causeEmoji[cause]||'\u{1F32A}')+' '+name+' \u2014 '+comment,time:Date.now()};
    setKillFeed(function(prev){return prev.concat(entry).slice(-5);});
  }

  /* ── AUDIO ── */
  function startAudio(){
    try{
      var ah=createAudioCtx();if(!ah)return;audioRef.current=ah;
      var ctx=ah.ctx;var master=ah.master;
      master.gain.value=0.45;
      // Wind drone
      var buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
      var d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.15;
      var wind=ctx.createBufferSource();wind.buffer=buf;wind.loop=true;
      var wf=ctx.createBiquadFilter();wf.type='lowpass';wf.frequency.value=300;
      var wg=ctx.createGain();wg.gain.value=0.3;
      wind.connect(wf);wf.connect(wg);wg.connect(master);wind.start();
      if(ah.oscs)ah.oscs.push(wind);
      // Deep bass pulse
      var drone=ctx.createOscillator();drone.type='sawtooth';drone.frequency.value=45;
      var dg=ctx.createGain();dg.gain.value=0.25;
      var df=ctx.createBiquadFilter();df.type='lowpass';df.frequency.value=150;
      drone.connect(df);df.connect(dg);dg.connect(master);drone.start();
      if(ah.oscs)ah.oscs.push(drone);
      // Rhythmic tension
      var now=ctx.currentTime;var b=60/110;
      for(var si=0;si<80;si++){
        var t=now+si*b*0.5;
        if(si%4===0){aT(ctx,master,50,t,0.25,0.5);aT(ctx,master,37,t+0.01,0.15,0.35);}
        if(si%4===2){aT(ctx,master,70,t,0.1,0.3);}
        if(si%8===0&&si>8){aC(ctx,master,t,[196,246.94,293.66],0.12,0.6,'triangle');}
        if(si%16===0&&si>16){aC(ctx,master,t,[392,493.88,587.33],0.08,1.0,'triangle');}
        if(si>50){aT(ctx,master,55+si*0.5,t,0.15,0.15+((si-50)/30)*0.3,'triangle');}
      }
      master.gain.linearRampToValueAtTime(0.65,ctx.currentTime+8);
      master.gain.linearRampToValueAtTime(0.85,ctx.currentTime+15);
    }catch(e){}
  }
  function playElimSound(){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;var now=ctx.currentTime;
      aT(ctx,dest,90,now,0.12,0.8);aT(ctx,dest,140,now+0.02,0.08,0.5,'square');
      var buf=ctx.createBuffer(1,ctx.sampleRate*0.1,ctx.sampleRate);
      var dd=buf.getChannelData(0);for(var i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*0.5;
      var src=ctx.createBufferSource();src.buffer=buf;
      var ng=ctx.createGain();ng.gain.setValueAtTime(0.6,now);ng.gain.exponentialRampToValueAtTime(0.001,now+0.1);
      src.connect(ng);ng.connect(dest);src.start(now);
    }catch(e){}
  }
  function playVictorySound(){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;var now=ctx.currentTime;
      var fanfare=[523.25,659.25,783.99,1046.5];
      for(var i=0;i<fanfare.length;i++){aT(ctx,dest,fanfare[i],now+i*0.15,0.4,0.3,'triangle');}
      aC(ctx,dest,now+0.7,[523.25,659.25,783.99,1046.5],0.25,1.5,'triangle');
    }catch(e){}
  }

  /* ── INIT ── */
  function initPlayers(){
    var players=[];var margin=BR*3;
    for(var i=0;i<names.length;i++){
      var attempts=0,x,y;
      do{x=margin+Math.random()*(AW-margin*2);y=margin+Math.random()*(AH-margin*2);attempts++;}
      while(attempts<80&&players.some(function(p){return Math.sqrt(Math.pow(p.x-x,2)+Math.pow(p.y-y,2))<BR*2.8}));
      var ang=Math.random()*Math.PI*2;var spd=0.8+Math.random()*1.2;
      players.push({id:i,name:names[i],color:BALL_COLORS[i%BALL_COLORS.length],
        x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
        hp:100,alive:true,elimT:0,dropY:-60-Math.random()*80,dropped:false,
        stormDmgAcc:0,shieldT:0});
    }
    return players;
  }

  /* ── ZONE ── */
  function makeZone(){
    return{cx:AW/2,cy:AH/2,r:Math.max(AW,AH)*0.7,
      targetCx:AW/2,targetCy:AH/2,targetR:Math.max(AW,AH)*0.7,
      shrinking:false,phase:0};
  }

  /* ── START ── */
  function startBR(){
    doCleanup();
    var g={players:initPlayers(),zone:makeZone(),events:[],dmgNums:[],elimFlashes:[],done:false,
      startT:performance.now(),dropPhase:true,redZones:[],airdrops:[]};
    gRef.current=g;
    setEliminated([]);setWinner(null);setShowConfetti(false);setSurviving(names.length);setKillFeed([]);setZonePhase(0);
    setPhase('running');setStatusText('\u{1FA82} Absprung!');
    startAudio();
    scheduleGame(g);
    var last=performance.now();
    function loop(now){
      var dt=Math.min((now-last)/16.67,3);last=now;
      var alive=g.players.filter(function(p){return p.alive}).length;
      if(alive<=3&&alive>0)dt*=0.55;
      updateGame(g,dt,now);drawFrame(g,now);
      if(!g.done)rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  /* ── GAME SCHEDULE ── */
  function scheduleGame(g){
    var n=names.length;var t=0;

    // Drop phase: 1.5s
    later(function(){
      g.dropPhase=false;
      setStatusText('\u{1F30D} Zone aktiv \u2014 Phase 1');setZonePhase(1);
    },1500);

    // Phase 1: Zone shrinks to 60%, 3s
    t=1800;
    later(function(){
      if(g.done)return;
      var cx=AW*0.3+Math.random()*AW*0.4;var cy=AH*0.3+Math.random()*AH*0.4;
      g.zone.targetCx=cx;g.zone.targetCy=cy;
      g.zone.targetR=Math.max(AW,AH)*0.42;g.zone.shrinking=true;g.zone.phase=1;
    },t);
    // Red zone event
    later(function(){
      if(g.done)return;
      setStatusText('❓ Fragenhagel!');
      spawnRedZone(g);
    },t+1200);

    // Phase 2: Zone shrinks to 35%, 3s
    t=5500;
    later(function(){
      if(g.done)return;
      setStatusText('\u26A0 Zone schrumpft \u2014 Phase 2');setZonePhase(2);
      var cx=g.zone.cx+(-0.15+Math.random()*0.3)*(AW*0.2);
      var cy=g.zone.cy+(-0.15+Math.random()*0.3)*(AH*0.2);
      cx=Math.max(AW*0.2,Math.min(AW*0.8,cx));cy=Math.max(AH*0.2,Math.min(AH*0.8,cy));
      g.zone.targetCx=cx;g.zone.targetCy=cy;
      g.zone.targetR=Math.max(AW,AH)*0.28;g.zone.phase=2;
    },t);
    later(function(){if(g.done)return;spawnRedZone(g);setStatusText('❓ Fragenhagel!');},t+1500);
    later(function(){if(g.done)return;spawnAirdrop(g);},t+800);
    later(function(){if(g.done)return;spawnMeteorShower(g);setStatusText('\u{1F4DD} Formel-Regen!');},t+2200);
    later(function(){if(g.done)return;spawnHealingStation(g);},t+3200);

    // Phase 3: Zone shrinks to 18%
    t=9000;
    later(function(){
      if(g.done)return;
      setStatusText('\u{1F525} Endgame \u2014 Phase 3!');setZonePhase(3);
      g.zone.targetR=Math.max(AW,AH)*0.15;g.zone.phase=3;
    },t);
    later(function(){if(g.done)return;spawnRedZone(g);},t+1000);

    // Phase 4: Final zone
    t=12500;
    later(function(){
      if(g.done)return;
      setStatusText('\u26A1 FINALE!');setZonePhase(4);
      g.zone.targetR=Math.max(AW,AH)*0.06;g.zone.phase=4;
    },t);

    // Force end
    later(function(){if(!g.done)forceWinner(g);},18000);
  }

  function spawnRedZone(g){
    var alive=g.players.filter(function(p){return p.alive});
    if(alive.length<2)return;
    var target=alive[Math.floor(Math.random()*alive.length)];
    var rz={x:target.x+(-30+Math.random()*60),y:target.y+(-30+Math.random()*60),
      r:40+Math.random()*30,t:0,maxT:80,active:true};
    g.redZones.push(rz);
  }

  function spawnAirdrop(g){
    var alive=g.players.filter(function(p){return p.alive});
    if(alive.length<2)return;
    var lucky=alive[Math.floor(Math.random()*alive.length)];
    lucky.shieldT=120;
    g.airdrops.push({x:lucky.x,y:lucky.y,t:0,maxT:40,name:lucky.name});
    setStatusText('\u{1F4E6} Wissens-Boost für '+lucky.name+'!');
  }

  function spawnMeteorShower(g){
    var alive=g.players.filter(function(p){return p.alive});
    if(!alive.length)return;
    var numMeteors=5+Math.floor(Math.random()*4);
    var targets=[];
    for(var i=0;i<Math.min(numMeteors,alive.length+2);i++){
      var tx=50+Math.random()*300;var ty=80+Math.random()*200;
      targets.push({x:tx,y:ty});
    }
    // Damage 2-4 random players
    var hitCount=2+Math.floor(Math.random()*3);
    var shuffled=shuffle(alive);
    for(var j=0;j<Math.min(hitCount,shuffled.length);j++){
      var dmg=15+Math.floor(Math.random()*11);
      shuffled[j].hp=Math.max(0,shuffled[j].hp-dmg);
      if(shuffled[j].hp<=0){shuffled[j].alive=false;shuffled[j].elimFlash=1;}
    }
    // React overlay: set meteor state
    setMeteors(targets.map(function(t,i){return{id:Date.now()+i,x:t.x,y:t.y,dx:-40+Math.random()*80};}));
    later(function(){setMeteors([]);},1500);
  }

  function spawnHealingStation(g){
    var alive=g.players.filter(function(p){return p.alive});
    if(!alive.length)return;
    var lucky=alive[Math.floor(Math.random()*alive.length)];
    var oldHp=lucky.hp;
    lucky.hp=Math.min(100,Math.max(lucky.hp,50));
    var healed=lucky.hp-oldHp;
    if(healed>0){
      var healId=Date.now();
      setHealFloats(function(prev){return prev.concat([{id:healId,name:lucky.name,amount:healed,x:lucky.x,y:lucky.y}]);});
      later(function(){setHealFloats(function(prev){return prev.filter(function(h){return h.id!==healId;});});},1200);
      setStatusText('\u{1F4DA} '+lucky.name+' findet ein Lernbuch!');
    }
  }

  /* ── PHYSICS + DAMAGE ── */
  function updateGame(g,dt,now){
    if(g.done)return;
    var z=g.zone;
    // Smooth zone shrink
    var zSpeed=0.012*dt;
    z.cx+=(z.targetCx-z.cx)*zSpeed;z.cy+=(z.targetCy-z.cy)*zSpeed;
    z.r+=(z.targetR-z.r)*zSpeed*0.8;

    // Drop animation
    if(g.dropPhase){
      g.players.forEach(function(p){
        if(!p.dropped){p.dropY+=4*dt;if(p.dropY>=0){p.dropY=0;p.dropped=true;}}
      });
      return;
    }

    var alive=g.players.filter(function(p){return p.alive});

    // Move players
    g.players.forEach(function(p){
      if(!p.alive)return;
      // Random direction changes
      if(Math.random()<0.02*dt){var ang=Math.random()*Math.PI*2;var spd=0.8+Math.random()*1.2;p.vx=Math.cos(ang)*spd;p.vy=Math.sin(ang)*spd;}
      // Gravitate toward zone center when outside
      var dx=p.x-z.cx;var dy=p.y-z.cy;var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist>z.r*0.5){
        var pull=0.03*dt*(dist/(z.r+1));
        p.vx-=dx/dist*pull;p.vy-=dy/dist*pull;
      }
      // Flee from red zones
      g.redZones.forEach(function(rz){
        if(!rz.active)return;
        var rdx=p.x-rz.x;var rdy=p.y-rz.y;var rd=Math.sqrt(rdx*rdx+rdy*rdy);
        if(rd<rz.r*1.5&&rd>0&&p.shieldT<=0){
          p.vx+=rdx/rd*0.5*dt;p.vy+=rdy/rd*0.5*dt;
        }
      });
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      // Bounce walls
      if(p.x<BR){p.x=BR;p.vx=Math.abs(p.vx)*0.8;}
      if(p.x>AW-BR){p.x=AW-BR;p.vx=-Math.abs(p.vx)*0.8;}
      if(p.y<BR){p.y=BR;p.vy=Math.abs(p.vy)*0.8;}
      if(p.y>AH-BR){p.y=AH-BR;p.vy=-Math.abs(p.vy)*0.8;}
      // Ball-ball collision
      g.players.forEach(function(q){
        if(q.id<=p.id||!q.alive)return;
        var cdx=p.x-q.x;var cdy=p.y-q.y;var cd=Math.sqrt(cdx*cdx+cdy*cdy);
        if(cd<BR*2&&cd>0){
          var nx=cdx/cd;var ny=cdy/cd;var overlap=(BR*2-cd)/2;
          p.x+=nx*overlap;p.y+=ny*overlap;q.x-=nx*overlap;q.y-=ny*overlap;
          var dvx=p.vx-q.vx;var dvy=p.vy-q.vy;var dot=dvx*nx+dvy*ny;
          if(dot>0){p.vx-=dot*nx*0.5;p.vy-=dot*ny*0.5;q.vx+=dot*nx*0.5;q.vy+=dot*ny*0.5;}
        }
      });
      // Shield countdown
      if(p.shieldT>0)p.shieldT-=dt;
      // Storm damage
      if(dist>z.r&&p.shieldT<=0){
        var dmgRate=z.phase>=3?2.5:z.phase>=2?1.5:0.8;
        var overflow=Math.max(0,(dist-z.r)/50);
        p.hp-=(dmgRate+overflow*0.5)*dt;
        p.stormDmgAcc+=dt;
        if(p.stormDmgAcc>8){
          p.stormDmgAcc=0;
          g.dmgNums.push({x:p.x,y:p.y-BR,val:Math.round(dmgRate*8),t:0,maxT:30});
        }
      }else{
        p.stormDmgAcc=0;
      }
    });

    // Red zone damage
    g.redZones.forEach(function(rz){
      if(!rz.active)return;
      rz.t+=dt;
      if(rz.t>rz.maxT){rz.active=false;return;}
      if(rz.t>15){
        g.players.forEach(function(p){
          if(!p.alive||p.shieldT>0)return;
          var rdx=p.x-rz.x;var rdy=p.y-rz.y;
          if(Math.sqrt(rdx*rdx+rdy*rdy)<rz.r){
            p.hp-=3*dt;
            if(Math.random()<0.05*dt)g.dmgNums.push({x:p.x+(-10+Math.random()*20),y:p.y-BR,val:Math.round(3*dt*10),t:0,maxT:30});
          }
        });
      }
    });

    // Airdrop animations
    g.airdrops.forEach(function(ad){ad.t+=dt;});

    // Damage number cleanup
    g.dmgNums.forEach(function(dn){dn.t+=dt;});
    g.dmgNums=g.dmgNums.filter(function(dn){return dn.t<dn.maxT;});

    // Elim flash cleanup
    g.elimFlashes.forEach(function(ef){ef.t+=dt;});
    g.elimFlashes=g.elimFlashes.filter(function(ef){return ef.t<20;});

    // Check eliminations
    g.players.forEach(function(p){
      if(!p.alive||p.hp>0)return;
      p.alive=false;p.elimT=now;
      var aliveNow=g.players.filter(function(q){return q.alive}).length;
      var cause=g.redZones.some(function(rz){return rz.active&&Math.sqrt(Math.pow(p.x-rz.x,2)+Math.pow(p.y-rz.y,2))<rz.r})?'redzone':'storm';
      addKill(p.name,cause,aliveNow);
      playElimSound();
      g.elimFlashes.push({x:p.x,y:p.y,t:0});
      setSurviving(aliveNow);
      setEliminated(function(prev){return prev.concat(p.name);});
      if(aliveNow===1){
        var w=g.players.filter(function(q){return q.alive})[0];
        g.done=true;
        later(function(){
          setWinner(w.name);setPhase('done');setStatusText('\u{1F3C6} WISSENSSIEG!');onResult(w.name);
          playVictorySound();
          later(function(){setShowConfetti(true);},300);
        },800);
      }
    });
  }

  function forceWinner(g){
    if(g.done)return;
    var alive=g.players.filter(function(p){return p.alive});
    if(alive.length===0)return;
    // Sort by HP, kill all except highest
    alive.sort(function(a,b){return b.hp-a.hp;});
    for(var i=1;i<alive.length;i++){
      alive[i].alive=false;alive[i].hp=0;
      addKill(alive[i].name,'finalzone',alive.length-i);
      g.elimFlashes.push({x:alive[i].x,y:alive[i].y,t:0});
    }
    g.done=true;
    setEliminated(function(prev){return prev.concat(alive.slice(1).map(function(p){return p.name}));});
    setSurviving(1);
    later(function(){
      setWinner(alive[0].name);setPhase('done');setStatusText('\u{1F3C6} WISSENSSIEG!');onResult(alive[0].name);
      playVictorySound();
      later(function(){setShowConfetti(true);},300);
    },800);
  }

  /* ── DRAW ── */
  function brRnd(seed){var s=seed;return function(){s=(s*1664525+1013904223)%4294967296;return s/4294967296;};}

  function buildTerrain(){
    var c=document.createElement('canvas');
    c.width=AW*2;c.height=AH*2;
    var t=c.getContext('2d');t.setTransform(2,0,0,2,0,0);
    var R=brRnd(20260728);

    // Grasboden
    var gg=t.createLinearGradient(0,0,0,AH);
    gg.addColorStop(0,'#1d3a2a');gg.addColorStop(0.5,'#193324');gg.addColorStop(1,'#12271c');
    t.fillStyle=gg;t.fillRect(0,0,AW,AH);
    // Grasflecken
    for(var i=0;i<70;i++){
      var px=R()*AW,py=R()*AH,pr=14+R()*46;
      t.fillStyle='rgba('+(30+R()*40|0)+','+(70+R()*50|0)+','+(40+R()*30|0)+',0.35)';
      t.beginPath();t.ellipse(px,py,pr,pr*0.62,R()*3,0,Math.PI*2);t.fill();
    }
    // Feldwege
    t.lineCap='round';
    for(var w=0;w<2;w++){
      t.strokeStyle='rgba(120,96,64,0.40)';t.lineWidth=w===0?26:18;
      t.beginPath();
      if(w===0){t.moveTo(-20,AH*0.72);t.bezierCurveTo(AW*0.3,AH*0.55,AW*0.55,AH*0.85,AW+20,AH*0.62);}
      else{t.moveTo(AW*0.22,-20);t.bezierCurveTo(AW*0.35,AH*0.4,AW*0.62,AH*0.5,AW*0.78,AH+20);}
      t.stroke();
      t.strokeStyle='rgba(150,124,84,0.22)';t.lineWidth=w===0?12:8;t.stroke();
    }
    // See
    t.save();
    t.beginPath();
    t.ellipse(AW*0.76,AH*0.24,64,40,0.35,0,Math.PI*2);
    var lg=t.createRadialGradient(AW*0.74,AH*0.21,6,AW*0.76,AH*0.24,66);
    lg.addColorStop(0,'#2b6c8f');lg.addColorStop(0.6,'#1c4c69');lg.addColorStop(1,'#123449');
    t.fillStyle=lg;t.fill();
    t.strokeStyle='rgba(148,214,255,0.35)';t.lineWidth=2;t.stroke();
    t.clip();
    t.strokeStyle='rgba(190,230,255,0.16)';t.lineWidth=1.4;
    for(var lw=0;lw<8;lw++){
      t.beginPath();
      for(var lx=AW*0.62;lx<AW*0.92;lx+=8)t.lineTo(lx,AH*0.10+lw*10+Math.sin(lx*0.14+lw)*2.4);
      t.stroke();
    }
    t.restore();
    // Sandstrand
    t.strokeStyle='rgba(196,168,112,0.30)';t.lineWidth=7;
    t.beginPath();t.ellipse(AW*0.76,AH*0.24,68,44,0.35,0,Math.PI*2);t.stroke();

    // Häuser
    var houses=[[AW*0.16,AH*0.30],[AW*0.42,AH*0.78],[AW*0.62,AH*0.60]];
    for(var hI=0;hI<houses.length;hI++){
      var hx=houses[hI][0],hy=houses[hI][1];
      t.fillStyle='rgba(0,0,0,0.30)';
      t.beginPath();t.ellipse(hx+3,hy+15,26,7,0,0,Math.PI*2);t.fill();
      t.fillStyle='#5b4636';t.fillRect(hx-20,hy-8,40,22);
      t.fillStyle='#6d5643';t.fillRect(hx-20,hy-8,40,5);
      t.fillStyle='#7f2f21';
      t.beginPath();t.moveTo(hx-25,hy-8);t.lineTo(hx,hy-26);t.lineTo(hx+25,hy-8);t.closePath();t.fill();
      t.fillStyle='#2b2118';t.fillRect(hx-5,hy+1,10,13);
      t.fillStyle='rgba(251,191,36,0.55)';t.fillRect(hx+8,hy-2,7,7);
    }

    // Bäume
    for(var tr=0;tr<26;tr++){
      var tx=18+R()*(AW-36),ty=24+R()*(AH-44);
      var d2=Math.pow(tx-AW*0.76,2)+Math.pow(ty-AH*0.24,2);
      if(d2<80*80)continue;
      var ts=0.75+R()*0.6;
      t.fillStyle='rgba(0,0,0,0.30)';
      t.beginPath();t.ellipse(tx+3*ts,ty+11*ts,11*ts,4*ts,0,0,Math.PI*2);t.fill();
      t.fillStyle='#4a3524';t.fillRect(tx-2*ts,ty-2*ts,4*ts,13*ts);
      t.fillStyle='#1f6b3d';
      t.beginPath();t.arc(tx-6*ts,ty-4*ts,7.5*ts,0,Math.PI*2);t.fill();
      t.beginPath();t.arc(tx+6*ts,ty-3*ts,7*ts,0,Math.PI*2);t.fill();
      t.beginPath();t.arc(tx,ty-11*ts,9*ts,0,Math.PI*2);t.fill();
      t.fillStyle='rgba(74,222,128,0.35)';
      t.beginPath();t.arc(tx-3*ts,ty-13*ts,5*ts,0,Math.PI*2);t.fill();
    }
    // Felsen
    for(var rk=0;rk<12;rk++){
      var rx=20+R()*(AW-40),ry=26+R()*(AH-48);var rs=0.7+R()*0.7;
      t.fillStyle='rgba(0,0,0,0.28)';
      t.beginPath();t.ellipse(rx+2,ry+5*rs,11*rs,4*rs,0,0,Math.PI*2);t.fill();
      t.fillStyle='#5b6779';
      t.beginPath();t.ellipse(rx,ry,11*rs,8*rs,R()*2,0,Math.PI*2);t.fill();
      t.fillStyle='rgba(203,213,225,0.35)';
      t.beginPath();t.ellipse(rx-3*rs,ry-3*rs,5*rs,3*rs,0.4,0,Math.PI*2);t.fill();
    }
    // Kisten
    for(var bx=0;bx<7;bx++){
      var cx2=30+R()*(AW-60),cy2=30+R()*(AH-60);
      t.fillStyle='rgba(0,0,0,0.28)';t.fillRect(cx2-8,cy2+6,18,4);
      t.fillStyle='#8a6134';t.fillRect(cx2-9,cy2-9,18,16);
      t.fillStyle='#a97a45';t.fillRect(cx2-9,cy2-9,18,4);
      t.strokeStyle='rgba(60,40,20,0.7)';t.lineWidth=1.4;
      t.beginPath();t.moveTo(cx2-9,cy2-1);t.lineTo(cx2+9,cy2-1);t.stroke();
    }
    // Vignette
    var vg=t.createRadialGradient(AW/2,AH/2,AH*0.30,AW/2,AH/2,AH*0.92);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
    t.fillStyle=vg;t.fillRect(0,0,AW,AH);
    return c;
  }

  function drawFrame(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);
    var z=g.zone;

    if(!g.terrain)g.terrain=buildTerrain();
    ctx.drawImage(g.terrain,0,0,AW,AH);

    // ── Sturm außerhalb der Zone
    ctx.save();
    ctx.beginPath();ctx.rect(0,0,AW,AH);
    ctx.arc(z.cx,z.cy,Math.max(0,z.r),0,Math.PI*2,true);
    ctx.closePath();ctx.clip();
    var sg=ctx.createRadialGradient(z.cx,z.cy,Math.max(1,z.r),z.cx,z.cy,Math.max(2,z.r+180));
    sg.addColorStop(0,'rgba(147,51,234,0.20)');
    sg.addColorStop(0.35,'rgba(126,34,206,0.48)');
    sg.addColorStop(1,'rgba(59,7,100,0.80)');
    ctx.fillStyle=sg;ctx.fillRect(0,0,AW,AH);
    // wirbelnde Schleier
    for(var wi=0;wi<7;wi++){
      var wa=now*0.00035*(1+wi*0.18)+wi*0.9;
      var wr=z.r+26+wi*22;
      ctx.strokeStyle='rgba(216,180,254,'+(0.10-wi*0.011)+')';ctx.lineWidth=12;
      ctx.beginPath();ctx.arc(z.cx,z.cy,wr,wa,wa+1.9);ctx.stroke();
    }
    // Funken
    for(var sp=0;sp<26;sp++){
      var sa=(sp/26)*Math.PI*2+now*0.0009;
      var sr=z.r+8+((now*0.05+sp*37)%150);
      var sx=z.cx+Math.cos(sa)*sr,sy=z.cy+Math.sin(sa)*sr;
      ctx.fillStyle='rgba(233,213,255,'+(0.45*(1-((sr-z.r)/160)))+')';
      ctx.beginPath();ctx.arc(sx,sy,1.6,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();

    // Blitze am Sturmrand
    if(Math.random()<0.06){
      var la=Math.random()*Math.PI*2;
      var lx=z.cx+Math.cos(la)*(z.r+6),ly=z.cy+Math.sin(la)*(z.r+6);
      ctx.strokeStyle='rgba(233,213,255,0.85)';ctx.lineWidth=1.8;
      ctx.beginPath();ctx.moveTo(lx,ly);
      var cx3=lx,cy3=ly;
      for(var lb=0;lb<4;lb++){
        cx3+=Math.cos(la)*13+(Math.random()-0.5)*16;
        cy3+=Math.sin(la)*13+(Math.random()-0.5)*16;
        ctx.lineTo(cx3,cy3);
      }
      ctx.stroke();
    }

    // ── Zonenring
    var zp=0.5+0.5*Math.sin(now*0.004);
    ctx.save();
    ctx.shadowColor='rgba(168,85,247,0.9)';ctx.shadowBlur=16;
    ctx.beginPath();ctx.arc(z.cx,z.cy,Math.max(0,z.r),0,Math.PI*2);
    ctx.strokeStyle='rgba(216,180,254,'+(0.75+zp*0.25)+')';ctx.lineWidth=3;ctx.stroke();
    ctx.restore();
    ctx.beginPath();ctx.arc(z.cx,z.cy,Math.max(0,z.r-4),0,Math.PI*2);
    ctx.strokeStyle='rgba(168,85,247,0.18)';ctx.lineWidth=9;ctx.stroke();

    // Ziel-Zone
    ctx.save();
    ctx.setLineDash([9,7]);ctx.lineDashOffset=-now*0.02;
    ctx.beginPath();ctx.arc(z.cx,z.cy,Math.max(0,z.targetR),0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.42)';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();

    // ── Rote Zonen
    g.redZones.forEach(function(rz){
      if(!rz.active)return;
      var prog=rz.t/rz.maxT;
      var pl=0.5+0.5*Math.sin(rz.t*0.35);
      ctx.save();
      var rg=ctx.createRadialGradient(rz.x,rz.y,rz.r*0.15,rz.x,rz.y,rz.r);
      rg.addColorStop(0,'rgba(239,68,68,'+(0.30+pl*0.20)+')');
      rg.addColorStop(1,'rgba(127,29,29,0.05)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(rz.x,rz.y,rz.r,0,Math.PI*2);ctx.fill();
      ctx.setLineDash([8,6]);ctx.lineDashOffset=now*0.03;
      ctx.strokeStyle='rgba(248,113,113,'+(0.55+pl*0.35)+')';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(rz.x,rz.y,rz.r,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);
      // Fadenkreuz
      ctx.strokeStyle='rgba(248,113,113,0.5)';ctx.lineWidth=1.2;
      ctx.beginPath();
      ctx.moveTo(rz.x-rz.r,rz.y);ctx.lineTo(rz.x-rz.r*0.35,rz.y);
      ctx.moveTo(rz.x+rz.r*0.35,rz.y);ctx.lineTo(rz.x+rz.r,rz.y);
      ctx.moveTo(rz.x,rz.y-rz.r);ctx.lineTo(rz.x,rz.y-rz.r*0.35);
      ctx.moveTo(rz.x,rz.y+rz.r*0.35);ctx.lineTo(rz.x,rz.y+rz.r);
      ctx.stroke();
      if(rz.t>15){
        for(var ei=0;ei<3;ei++){
          var ea=Math.random()*Math.PI*2;var er=Math.random()*rz.r;
          ctx.fillStyle='rgba(251,191,36,0.75)';
          ctx.beginPath();ctx.arc(rz.x+Math.cos(ea)*er,rz.y+Math.sin(ea)*er,1.8+Math.random()*1.6,0,Math.PI*2);ctx.fill();
        }
      }
      ctx.fillStyle='rgba(254,202,202,'+(0.5+pl*0.4)+')';
      ctx.font='bold 10px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('❓ FRAGENHAGEL',rz.x,rz.y-rz.r-8);
      ctx.restore();
    });

    // ── Airdrops mit Fallschirm
    g.airdrops.forEach(function(ad){
      if(ad.t>ad.maxT)return;
      var s=Math.min(1,ad.t/10);
      ctx.save();
      ctx.globalAlpha=Math.max(0,1-ad.t/ad.maxT);
      ctx.translate(ad.x,ad.y);
      ctx.fillStyle='rgba(0,0,0,0.30)';
      ctx.beginPath();ctx.ellipse(0,13*s,11*s,4*s,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(226,232,240,0.75)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-9*s,-8*s);ctx.lineTo(-5*s,-1*s);
      ctx.moveTo(9*s,-8*s);ctx.lineTo(5*s,-1*s);ctx.stroke();
      ctx.fillStyle='rgba(248,250,252,0.85)';
      ctx.beginPath();ctx.arc(0,-10*s,11*s,Math.PI,0);ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(239,68,68,0.85)';
      ctx.beginPath();ctx.arc(0,-10*s,11*s,Math.PI*1.25,Math.PI*1.55);ctx.lineTo(0,-10*s);ctx.closePath();ctx.fill();
      ctx.fillStyle='#b45309';ctx.fillRect(-7*s,-2*s,14*s,13*s);
      ctx.fillStyle='#f59e0b';ctx.fillRect(-7*s,-2*s,14*s,3.5*s);
      ctx.strokeStyle='#fef3c7';ctx.lineWidth=1.2;ctx.strokeRect(-7*s,-2*s,14*s,13*s);
      ctx.restore();
    });

    // ── Spielfiguren
    var order=g.players.slice().sort(function(a,b){return a.y-b.y;});
    order.forEach(function(p){
      if(!p.alive&&(!p.elimT||now-p.elimT>1500))return;
      var drawY=p.y+(g.dropPhase?p.dropY:0);
      var alpha=p.alive?1:Math.max(0,1-(now-p.elimT)/1000);
      var sc=p.alive?1:Math.max(0.35,1-(now-p.elimT)/900);
      var spd=Math.sqrt(p.vx*p.vx+p.vy*p.vy);
      var u=BR*0.92*sc;

      // Fallschirm beim Absprung
      if(g.dropPhase&&p.dropY<-4){
        ctx.save();ctx.globalAlpha=alpha*0.9;
        ctx.strokeStyle='rgba(226,232,240,0.7)';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(p.x-11,drawY-BR*2.2);ctx.lineTo(p.x-4,drawY-BR*1.2);
        ctx.moveTo(p.x+11,drawY-BR*2.2);ctx.lineTo(p.x+4,drawY-BR*1.2);ctx.stroke();
        ctx.fillStyle=p.color+'cc';
        ctx.beginPath();ctx.arc(p.x,drawY-BR*2.2,14,Math.PI,0);ctx.closePath();ctx.fill();
        ctx.restore();
      }

      if(p.shieldT>0&&p.alive){
        ctx.save();ctx.globalAlpha=alpha;
        var shp=0.5+0.5*Math.sin(now*0.008);
        ctx.strokeStyle='rgba(251,191,36,'+(0.35+shp*0.35)+')';ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(p.x,drawY-u*0.2,u*1.7,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle='rgba(251,191,36,0.08)';
        ctx.beginPath();ctx.arc(p.x,drawY-u*0.2,u*1.7,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }

      drawHero(ctx,{x:p.x,y:drawY+u*0.5,s:u,color:p.color,

        gear:'helmet',dead:!p.alive,

      // HP-Balken
      if(p.alive&&p.hp<100){
        var barW=u*2.1,barH=3.4,barY=drawY+u*1.55;
        ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(p.x-barW/2-1,barY-1,barW+2,barH+2);
        var hp=Math.max(0,p.hp/100);
        ctx.fillStyle=hp>0.5?'#22c55e':hp>0.25?'#f59e0b':'#ef4444';
        ctx.fillRect(p.x-barW/2,barY,barW*hp,barH);
      }

      // Namensschild
      ctx.save();ctx.globalAlpha=alpha;
      var pn=truncName(p.name,NMAX);
      var lf=fitFont(ctx,pn,u*3.4,FS,8);
      var tw=ctx.measureText(pn).width;
      var ly=drawY-u*1.95;
      ctx.fillStyle='rgba(2,6,23,0.62)';
      hRR(ctx,p.x-tw/2-5,ly-lf*0.72,tw+10,lf*1.44,lf*0.5);ctx.fill();
      ctx.fillStyle=p.color;ctx.fillRect(p.x-tw/2-5,ly-lf*0.72,2.5,lf*1.44);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(pn,p.x,ly);
      ctx.restore();
    });

    // Eliminierungs-Blitze
    g.elimFlashes.forEach(function(ef){
      var prog=ef.t/20;
      ctx.save();
      ctx.strokeStyle='rgba(248,113,113,'+(0.8*(1-prog))+')';ctx.lineWidth=3*(1-prog)+1;
      ctx.beginPath();ctx.arc(ef.x,ef.y,BR*(1+prog*2.6),0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='rgba(239,68,68,'+(0.35*(1-prog))+')';
      ctx.beginPath();ctx.arc(ef.x,ef.y,BR*(1+prog*2.2),0,Math.PI*2);ctx.fill();
      ctx.restore();
    });

    // Schadenszahlen
    g.dmgNums.forEach(function(dn){
      var prog=dn.t/dn.maxT;
      ctx.save();ctx.globalAlpha=1-prog;
      ctx.font='bold 12px Inter,sans-serif';ctx.textAlign='center';
      ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=3;ctx.lineJoin='round';
      ctx.strokeText('-'+dn.val+' W',dn.x,dn.y-prog*26);
      ctx.fillStyle='#fca5a5';ctx.fillText('-'+dn.val+' W',dn.x,dn.y-prog*26);
      ctx.restore();
    });

    // ── HUD
    var aliveCount=g.players.filter(function(p){return p.alive}).length;
    ctx.save();
    ctx.fillStyle='rgba(2,6,23,0.68)';
    hRR(ctx,AW-108,8,100,30,8);ctx.fill();
    ctx.strokeStyle='rgba(168,85,247,0.45)';ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle='#e9d5ff';ctx.font='bold 14px Inter,sans-serif';
    ctx.textAlign='right';ctx.textBaseline='middle';
    ctx.fillText('\u{1F464} '+aliveCount+'/'+names.length,AW-16,23);
    ctx.restore();

    // ── Minimap
    var mmS=74;var mmX=AW-mmS-10;var mmY=AH-mmS-10;
    ctx.save();
    ctx.fillStyle='rgba(2,6,23,0.66)';
    hRR(ctx,mmX,mmY,mmS,mmS,7);ctx.fill();
    ctx.strokeStyle='rgba(148,163,184,0.35)';ctx.lineWidth=1;ctx.stroke();
    ctx.save();
    hRR(ctx,mmX,mmY,mmS,mmS,7);ctx.clip();
    ctx.fillStyle='rgba(34,197,94,0.10)';ctx.fillRect(mmX,mmY,mmS,mmS);
    var mzx=mmX+z.cx/AW*mmS,mzy=mmY+z.cy/AH*mmS,mzr=z.r/Math.max(AW,AH)*mmS;
    ctx.beginPath();ctx.arc(mzx,mzy,Math.max(1,mzr),0,Math.PI*2);
    ctx.fillStyle='rgba(168,85,247,0.12)';ctx.fill();
    ctx.strokeStyle='rgba(216,180,254,0.75)';ctx.lineWidth=1.2;ctx.stroke();
    var tzx=mmX+z.targetCx/AW*mmS,tzy=mmY+z.targetCy/AH*mmS,tzr=z.targetR/Math.max(AW,AH)*mmS;
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.arc(tzx,tzy,Math.max(1,tzr),0,Math.PI*2);
    ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=1;ctx.stroke();
    ctx.setLineDash([]);
    g.players.forEach(function(p){
      if(!p.alive)return;
      ctx.beginPath();ctx.arc(mmX+p.x/AW*mmS,mmY+p.y/AH*mmS,1.7,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
    });
    ctx.restore();
    ctx.restore();
  }

  function reset(){doCleanup();setPhase('idle');setStatusText('Bereit zum Absprung!');setEliminated([]);setWinner(null);setShowConfetti(false);setSurviving(0);setKillFeed([]);setZonePhase(0);}

  function confetti(){
    if(!showConfetti)return null;
    var pieces=[];for(var i=0;i<60;i++){
      var left=Math.random()*100;var dur=1.5+Math.random()*2;var delay=Math.random()*0.8;
      var color=['#8b5cf6','#3b82f6','#22c55e','#f59e0b','#ef4444','#ec4899','#fbbf24'][Math.floor(Math.random()*7)];

    }

  }

  var zoneColors=['text-gray-400','text-violet-400','text-amber-400','text-orange-400','text-red-400'];

    </div>

    ${(phase==='running'||phase==='done')&&html`<div className="mb-3 mx-auto" style=${{maxWidth:'900px'}}>
      <div className="flex items-center gap-2 mb-1">
        ${[1,2,3,4].map(function(p){return html`<div key=${p} className="flex-1 h-1.5 rounded-full transition-all duration-500 "
          style=${{background:zonePhase>=p?'linear-gradient(90deg,#8b5cf6,#6366f1)':'#e5e7eb'}}/>`;
        })}

      <div className="flex justify-between text-xs text-gray-400 px-0.5">
        <span>Absprung</span>
        <span className=${zonePhase>=1?"text-violet-500 font-semibold":""}>Zone</span>
        <span className=${zonePhase>=2?"text-amber-500 font-semibold":""}>Schrumpft</span>
        <span className=${zonePhase>=3?"text-orange-500 font-semibold":""}>Endgame</span>
        <span className=${zonePhase>=4?"text-red-500 font-semibold":""}>Finale</span>

    <div className="relative rounded-2xl overflow-hidden border border-violet-500/20 bg-gray-950 shadow-2xl shadow-violet-500/5 mx-auto" style=${{maxWidth:'900px'}}>
      <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Battle Royale Spielfeld"/>
      ${meteors.map(function(m){return html`<div key=${m.id} className="meteor-emoji" style=${{left:(m.x/AW*100)+'%',top:'20px','--mdx':m.dx+'px'}}>\u2604\uFE0F</div>`;})}
      ${healFloats.map(function(h){return html`<div key=${h.id} className="heal-float-el" style=${{left:(Math.min(h.x,AW-60)/AW*100)+'%',top:(Math.max(h.y-20,10)/AH*100)+'%'}}>+${h.amount} Wissen \u{1F4DA}</div>`;})}
    </div>

    ${killFeed.length>0&&html`<div className="mt-3 mx-auto" style=${{maxWidth:'900px'}}>
      <div className="bg-white/90 rounded-xl border border-gray-200 p-3 shadow-sm">
        <div className="text-xs text-gray-500 mb-1 font-semibold">\u{1F4AC} Kill Feed</div>
        ${killFeed.slice().reverse().map(function(k,i){
          return html`<div key=${k.time+'-'+i} className="text-xs text-gray-700 py-0.5 fade-in">${k.text}</div>`;
        })}

    ${winner&&html`<div className="mt-6 text-center br-victory">
      <div className="inline-block bg-gradient-to-br from-amber-600 via-yellow-600 to-amber-700 border border-amber-400/30 rounded-2xl px-8 py-6 shadow-2xl shadow-amber-500/25">
        <div className="text-3xl mb-2">\u{1F3C6}</div>
        <div className="text-amber-100 text-sm font-semibold uppercase tracking-widest mb-1">Victory Royale</div>
        <div className="text-2xl font-black text-white">${winner}</div>
