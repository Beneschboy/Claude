    </div>`}

    ${eliminated.length>0&&!winner&&html`<div className="mt-3 flex flex-wrap gap-1 justify-center">
      ${eliminated.map(function(n,i){
        return html`<span key=${i} className="px-2 py-0.5 bg-gray-100 text-gray-400 text-xs rounded-full border border-gray-200 line-through">${n}</span>`;
      })}
    </div>`}

    <div className="mt-5 text-center">
      ${phase==='idle'&&html`<button onClick=${startBR} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-violet-600 to-blue-600 hover:from-violet-500 hover:to-blue-500 text-white shadow-lg shadow-violet-500/25 transition-all hover:shadow-violet-500/40 hover:scale-105 active:scale-95 text-sm">\u{1FA82} Absprung starten</button>`}
      ${phase==='done'&&html`<span className="inline-flex gap-3">
        <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-violet-50 text-violet-700 border border-violet-200 hover:bg-violet-100 transition-all mr-3">Nochmal</button>
        <button onClick=${function(){doCleanup();onDone();}} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button>
      </span>`}
      ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">\u2715 Abbrechen</button>`}
    </div>
  </div>`;
}


/* ═══════════════════════════════════════════════════════
   VORTEX PORTAL GROUP MODE
   ═══════════════════════════════════════════════════════ */
function VortexPortalMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('pick');var phase=_ph[0];var setPhase=_ph[1];
  var _ng=useState(2);var numGroups=_ng[0];var setNumGroups=_ng[1];
  var _gr=useState([]);var groups=_gr[0];var setGroups=_gr[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];
  var _ab=useState(0);var absorbed=_ab[0];var setAbsorbed=_ab[1];
  var canvasRef=useRef(null);
  var gRef=useRef(null);
  var rafRef=useRef(null);
  var timers=useRef([]);
  var audioRef=useRef(null);

  var AW=600;var AH=500;
  var CX=AW/2;var CY=AH/2;

  var PORTAL_COLORS=['#8b5cf6','#3b82f6','#10b981','#f59e0b','#ef4444','#ec4899','#06b6d4','#84cc16','#f97316','#e11d48'];
  var PORTAL_NAMES=['Violett','Blau','Gr\u00FCn','Gold','Rot','Pink','Cyan','Lime','Orange','Karmin'];

  var maxGroups=Math.min(10,Math.floor(names.length/2));

  useEffect(function(){return function(){doCleanup();}},[]);

  function doCleanup(){
    timers.current.forEach(clearTimeout);timers.current=[];
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}

  /* ── AUDIO ── */
  function startAudio(){
    try{
      var ah=createAudioCtx();if(!ah)return;audioRef.current=ah;
      var ctx=ah.ctx;var master=ah.master;master.gain.value=0.4;
      // Ethereal pad
      var pad=ctx.createOscillator();pad.type='sine';pad.frequency.value=130.81;
      var pad2=ctx.createOscillator();pad2.type='sine';pad2.frequency.value=196;
      var pg=ctx.createGain();pg.gain.value=0.15;
      var pf=ctx.createBiquadFilter();pf.type='lowpass';pf.frequency.value=400;
      pad.connect(pf);pad2.connect(pf);pf.connect(pg);pg.connect(master);pad.start();pad2.start();
      // LFO wobble
      var lfo=ctx.createOscillator();lfo.frequency.value=0.5;
      var lfoG=ctx.createGain();lfoG.gain.value=15;
      lfo.connect(lfoG);lfoG.connect(pad.frequency);lfo.start();
      // Rhythmic pings
      var now=ctx.currentTime;
      for(var i=0;i<60;i++){
        var t=now+i*0.4;
        if(i%4===0)aT(ctx,master,523.25,t,0.2,0.06,'sine');
        if(i%4===2)aT(ctx,master,659.25,t,0.15,0.04,'sine');
        if(i%8===0&&i>0)aC(ctx,master,t,[261.63,329.63,392],0.05,0.6,'triangle');
      }
    }catch(e){}
  }
  function playAbsorbSound(idx){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;var now=ctx.currentTime;
      var baseFreq=300+idx*40;
      aT(ctx,dest,baseFreq,now,0.15,0.15,'sine');
      aT(ctx,dest,baseFreq*1.5,now+0.05,0.1,0.1,'triangle');
    }catch(e){}
  }
  function playCompleteSound(){
    try{
      var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var dest=ah.master;var now=ctx.currentTime;
      var fanfare=[392,493.88,587.33,783.99];
      for(var i=0;i<fanfare.length;i++)aT(ctx,dest,fanfare[i],now+i*0.12,0.35,0.2,'triangle');
      aC(ctx,dest,now+0.6,[392,493.88,587.33,783.99],0.15,1.5,'triangle');
    }catch(e){}
  }

  /* ── ASSIGN GROUPS (equal size) ── */
  function assignGroups(ng){
    var shuffled=shuffle(names.slice());
    var result=[];
    for(var i=0;i<ng;i++)result.push([]);
    for(var j=0;j<shuffled.length;j++){
      result[j%ng].push(shuffled[j]);
    }
    return result;
  }

  /* ── START ── */
  function startVortex(){
    doCleanup();
    var ng=numGroups;
    var assigned=assignGroups(ng);
    setGroups(assigned);setShowConfetti(false);setAbsorbed(0);
    setStatusText('\u{1F300} Vortex \u00F6ffnet sich...');

    // Build player data with group assignments
    var players=[];var pidx=0;
    for(var gi=0;gi<assigned.length;gi++){
      for(var pi=0;pi<assigned[gi].length;pi++){
        var ang=Math.random()*Math.PI*2;
        var orbitR=80+Math.random()*50;
        players.push({id:pidx,name:assigned[gi][pi],group:gi,
          color:BALL_COLORS[pidx%BALL_COLORS.length],
          angle:ang,orbitR:orbitR,orbitSpeed:0.3+Math.random()*0.4,
          phase:'orbit',absorbT:0,absorbDur:0,
          startX:0,startY:0,trail:[]});
        pidx++;
      }
    }

    // Portal positions in a circle
    var portals=[];
    // 0.35 statt 0.42 — sonst rutschen Beschriftung und Zähler des unteren Portals aus dem Bild
    var portalR=Math.min(AW,AH)*0.35;
    for(var k=0;k<ng;k++){
      var pa=-Math.PI/2+k*(Math.PI*2/ng);
      portals.push({x:CX+Math.cos(pa)*portalR,y:CY+Math.sin(pa)*portalR,
        angle:pa,color:PORTAL_COLORS[k%PORTAL_COLORS.length],
        name:PORTAL_NAMES[k%PORTAL_NAMES.length],
        pulsePhase:Math.random()*Math.PI*2,members:0,targetMembers:assigned[k].length});
    }

    var g={players:players,portals:portals,vortexAngle:0,vortexPulse:0,
      particles:[],absorbQueue:[],absorbIdx:0,done:false,startT:performance.now()};
    gRef.current=g;

    setPhase('running');
    startAudio();

    // Build absorb schedule: stagger players being sucked into portals
    var order=shuffle(players.slice());
    var delay=1500; // initial orbit time
    var stagger=Math.max(100,Math.min(350,6000/names.length));
    for(var oi=0;oi<order.length;oi++){
      (function(p,t){
        later(function(){
          if(g.done)return;
          // Calculate current position
          var elapsed=(performance.now()-g.startT)/1000;
          p.startX=CX+Math.cos(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
          p.startY=CY+Math.sin(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
          p.phase='absorb';p.absorbT=0;
          p.absorbDur=25+Math.random()*15; // frames
          playAbsorbSound(oi);
          setAbsorbed(function(prev){return prev+1;});
          setStatusText('\u{1F300} '+p.name+' \u2192 Portal '+(p.group+1));
        },t);
      })(order[oi],delay+oi*stagger);
    }

    // Finish
    var finishT=delay+order.length*stagger+800;
    later(function(){
      g.done=true;
      setPhase('done');setStatusText('\u2728 Alle Gruppen gebildet!');onResult(numGroups+' Gruppen');
      playCompleteSound();
      later(function(){setShowConfetti(true);},300);
    },finishT);

    // Animation loop
    var last=performance.now();
    function loop(now){
      var dt=Math.min((now-last)/16.67,3);last=now;
      updateVortex(g,dt,now);drawVortex(g,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  /* ── UPDATE ── */
  function updateVortex(g,dt,now){
    g.vortexAngle+=0.02*dt;
    g.vortexPulse=Math.sin(now*0.003)*0.15;
    var elapsed=(now-g.startT)/1000;

    // Spawn particles
    if(Math.random()<0.3*dt){
      var pa=Math.random()*Math.PI*2;var pr=10+Math.random()*30;
      g.particles.push({x:CX+Math.cos(pa)*pr,y:CY+Math.sin(pa)*pr,
        vx:Math.cos(pa+Math.PI/2)*1.5,vy:Math.sin(pa+Math.PI/2)*1.5,
        life:30+Math.random()*20,maxLife:30+Math.random()*20,
        color:PORTAL_COLORS[Math.floor(Math.random()*g.portals.length)]});
    }
    // Update particles
    g.particles.forEach(function(pt){
      pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.life-=dt;
      // Spiral outward
      var dx=pt.x-CX;var dy=pt.y-CY;var d=Math.sqrt(dx*dx+dy*dy);
      if(d>0){pt.x+=dx/d*0.3*dt;pt.y+=dy/d*0.3*dt;}
    });
    g.particles=g.particles.filter(function(pt){return pt.life>0;});

    // Update players
    g.players.forEach(function(p){
      if(p.phase==='orbit'){
        // Orbit around center
        var cx=CX+Math.cos(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
        var cy=CY+Math.sin(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
        p.trail.push({x:cx,y:cy,t:now});
        if(p.trail.length>12)p.trail.shift();
      }else if(p.phase==='absorb'){
        p.absorbT+=dt;
        var prog=Math.min(1,p.absorbT/p.absorbDur);
        // Ease in-out
        var ease=prog<0.5?2*prog*prog:1-Math.pow(-2*prog+2,2)/2;
        var portal=g.portals[p.group];
        var cx2=p.startX+(portal.x-p.startX)*ease;
        var cy2=p.startY+(portal.y-p.startY)*ease;
        p.trail.push({x:cx2,y:cy2,t:now});
        if(p.trail.length>15)p.trail.shift();
        if(prog>=1){
          p.phase='done';
          portal.members++;
          // Spawn burst particles at portal
          for(var bi=0;bi<6;bi++){
            var ba=Math.random()*Math.PI*2;
            g.particles.push({x:portal.x+Math.cos(ba)*15,y:portal.y+Math.sin(ba)*15,
              vx:Math.cos(ba)*2,vy:Math.sin(ba)*2,life:20,maxLife:20,color:portal.color});
          }
        }
      }
    });
  }

  /* ── DRAW ── */
  function drawVortex(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);
    var elapsed=(now-g.startT)/1000;

    // Background
    ctx.fillStyle='#060918';ctx.fillRect(0,0,AW,AH);

    // Starfield
    ctx.fillStyle='rgba(255,255,255,0.4)';
    for(var si=0;si<40;si++){
      var sx=(si*137.5+now*0.005*((si%3)+1))%AW;
      var sy=(si*241.3+now*0.003*((si%2)+1))%AH;
      var sr=0.5+Math.sin(now*0.005+si)*0.5;
      ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
    }

    // Central vortex glow
    var vGrad=ctx.createRadialGradient(CX,CY,5,CX,CY,100+g.vortexPulse*30);
    vGrad.addColorStop(0,'rgba(139,92,246,0.35)');
    vGrad.addColorStop(0.4,'rgba(99,102,241,0.15)');
    vGrad.addColorStop(1,'transparent');
    ctx.fillStyle=vGrad;ctx.beginPath();ctx.arc(CX,CY,120,0,Math.PI*2);ctx.fill();

    // Vortex spiral arms
    ctx.lineWidth=2;
    for(var arm=0;arm<4;arm++){
      ctx.beginPath();
      ctx.strokeStyle='rgba(139,92,246,'+(0.15+g.vortexPulse*0.3)+')';
      for(var r=8;r<90;r+=2){
        var a=g.vortexAngle+arm*(Math.PI/2)+r*0.08;
        var x=CX+Math.cos(a)*r;var y=CY+Math.sin(a)*r;
        if(r===8)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }

    // Vortex center orb
    var cGrad=ctx.createRadialGradient(CX-3,CY-3,2,CX,CY,18);
    cGrad.addColorStop(0,'rgba(255,255,255,0.6)');
    cGrad.addColorStop(0.5,'rgba(167,139,250,0.5)');
    cGrad.addColorStop(1,'rgba(99,102,241,0.1)');
    ctx.fillStyle=cGrad;ctx.beginPath();ctx.arc(CX,CY,18,0,Math.PI*2);ctx.fill();

    // Connection lines from center to portals (faint)
    g.portals.forEach(function(portal){
      ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(portal.x,portal.y);
      ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;ctx.stroke();
    });

    // Particles
    g.particles.forEach(function(pt){
      var alpha=(pt.life/pt.maxLife)*0.6;
      ctx.beginPath();ctx.arc(pt.x,pt.y,2,0,Math.PI*2);
      ctx.fillStyle=pt.color.replace(')',','+alpha+')').replace('rgb','rgba');
      // Simpler: use global alpha
      ctx.globalAlpha=alpha;ctx.fillStyle=pt.color;ctx.fill();ctx.globalAlpha=1;
    });

    // Portals
    g.portals.forEach(function(portal,pi){
      var pulse=Math.sin(now*0.004+portal.pulsePhase)*0.2;
      var portalSize=22+pulse*8;
      // Outer glow
      var pGrad=ctx.createRadialGradient(portal.x,portal.y,portalSize*0.3,portal.x,portal.y,portalSize*2.5);
      pGrad.addColorStop(0,portal.color);
      pGrad.addColorStop(0.5,portal.color+'66');
      pGrad.addColorStop(1,'transparent');
      ctx.fillStyle=pGrad;ctx.beginPath();ctx.arc(portal.x,portal.y,portalSize*2.5,0,Math.PI*2);ctx.fill();
      // Inner ring
      ctx.beginPath();ctx.arc(portal.x,portal.y,portalSize,0,Math.PI*2);
      ctx.strokeStyle=portal.color;ctx.lineWidth=3;ctx.stroke();
      // Inner fill
      ctx.beginPath();ctx.arc(portal.x,portal.y,portalSize*0.7,0,Math.PI*2);
      ctx.fillStyle=portal.color+'44';ctx.fill();
      // Spinning ring
      ctx.beginPath();
      ctx.arc(portal.x,portal.y,portalSize+4,g.vortexAngle*2+pi,g.vortexAngle*2+pi+Math.PI*0.6);
      ctx.strokeStyle=portal.color+'88';ctx.lineWidth=2;ctx.stroke();
      // Label
      ctx.fillStyle='#fff';ctx.font='bold 14px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor=portal.color;ctx.shadowBlur=6;
      ctx.fillText('Gruppe '+(pi+1),portal.x,portal.y+portalSize+18);
      ctx.shadowBlur=0;
      // Member count
      ctx.fillStyle='rgba(255,255,255,0.75)';ctx.font='12px Inter,sans-serif';
      ctx.fillText(portal.members+'/'+portal.targetMembers,portal.x,portal.y+portalSize+34);
    });

    // Player trails + balls
    var ballR=names.length>30?13:names.length>18?15:names.length>12?17:20;
    var fontSize=names.length>30?10:names.length>18?11:names.length>12?12:14;
    var nMax=names.length>30?7:names.length>18?8:names.length>12?9:11;

    g.players.forEach(function(p){
      if(p.phase==='done')return;
      // Trail
      if(p.trail.length>1){
        ctx.beginPath();ctx.moveTo(p.trail[0].x,p.trail[0].y);
        for(var ti=1;ti<p.trail.length;ti++){
          ctx.lineTo(p.trail[ti].x,p.trail[ti].y);
        }
        ctx.strokeStyle=p.color+'44';ctx.lineWidth=2;ctx.stroke();
      }
      // Current position
      var cx,cy;
      if(p.phase==='orbit'){
        cx=CX+Math.cos(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
        cy=CY+Math.sin(p.angle+elapsed*p.orbitSpeed)*p.orbitR;
      }else{
        var last=p.trail[p.trail.length-1];
        cx=last?last.x:p.startX;cy=last?last.y:p.startY;
      }
      // Glow during absorb
      if(p.phase==='absorb'){
        var portal=g.portals[p.group];
        ctx.beginPath();ctx.arc(cx,cy,ballR+6,0,Math.PI*2);
        ctx.fillStyle=portal.color+'33';ctx.fill();
      }
      // Ball
      var bGrad=ctx.createRadialGradient(cx-ballR*0.3,cy-ballR*0.3,ballR*0.1,cx,cy,ballR);
      bGrad.addColorStop(0,'rgba(255,255,255,0.35)');bGrad.addColorStop(1,p.color);
      ctx.beginPath();ctx.arc(cx,cy,ballR,0,Math.PI*2);ctx.fillStyle=bGrad;ctx.fill();
      // Name — mit Kontur für maximale Lesbarkeit
      var pn=truncName(p.name,nMax);
      fitFont(ctx,pn,ballR*2.05,fontSize,8);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=3;ctx.lineJoin='round';
      ctx.strokeText(pn,cx,cy);
      ctx.fillStyle='#fff';ctx.fillText(pn,cx,cy);
    });

    // HUD
    ctx.fillStyle='rgba(0,0,0,0.4)';
    ctx.beginPath();ctx.moveTo(8,8);ctx.lineTo(130,8);ctx.lineTo(130,30);ctx.lineTo(8,30);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 11px Inter,sans-serif';ctx.textAlign='left';
    var doneCount=g.players.filter(function(p){return p.phase==='done'}).length;
    ctx.fillText('\u{1F300} '+doneCount+'/'+names.length+' zugeordnet',14,22);
  }

  function reset(){doCleanup();setPhase('pick');setGroups([]);setShowConfetti(false);setStatusText('');setAbsorbed(0);}

  function confetti(){
    if(!showConfetti)return null;
    var pieces=[];for(var i=0;i<60;i++){
      var left=Math.random()*100;var dur=1.5+Math.random()*2;var delay=Math.random()*0.8;
      var color=['#8b5cf6','#3b82f6','#22c55e','#f59e0b','#ef4444','#ec4899','#fbbf24'][Math.floor(Math.random()*7)];
      var size=4+Math.random()*6;
      pieces.push(html`<div key=${i} className="confetti-piece" style=${{left:left+'%',width:size+'px',height:size+'px',background:color,animationDuration:dur+'s',animationDelay:delay+'s',borderRadius:Math.random()>.5?'50%':'2px'}}/>`);
    }
    return pieces;
  }

  // Group size info
  var perGroup=Math.floor(names.length/numGroups);
  var remainder=names.length%numGroups;
  var sizeInfo=remainder===0?perGroup+' pro Gruppe':perGroup+'\u2013'+(perGroup+1)+' pro Gruppe';

  return html`<div className="max-w-4xl mx-auto px-4 py-6 fade-in-up">
    ${confetti()}
    <div className="flex items-center justify-between mb-4">
      <button onClick=${function(){doCleanup();onDone();}} className="text-gray-500 hover:text-gray-900 transition-colors text-sm flex items-center gap-1">\u2190 Zur\u00FCck</button>
      <div className="text-center">
        <h2 className="text-xl font-bold gradient-text">\u{1F300} Dimensions-Portal</h2>
        ${statusText&&html`<p role="status" aria-live="polite" className="text-xs text-violet-600 font-semibold mt-1">${statusText}</p>`}
      </div>
      <div className="text-gray-500 text-xs">${phase==='running'?absorbed+'/'+names.length:''}</div>
    </div>

    ${phase==='pick'&&html`<div className="text-center mb-6 fade-in-up">
      <p className="text-gray-600 text-sm mb-4">Wie viele Gruppen?</p>
      <div className="flex items-center justify-center gap-3 mb-3">
        <button onClick=${function(){if(numGroups>2)setNumGroups(numGroups-1)}}
          className=${"w-10 h-10 rounded-xl font-bold text-lg transition-all "+(numGroups>2?"bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300":"bg-gray-50 text-gray-300 border border-gray-200 cursor-not-allowed")}>\u2212</button>
        <span className="text-3xl font-black gradient-text w-14 text-center">${numGroups}</span>
        <button onClick=${function(){if(numGroups<maxGroups)setNumGroups(numGroups+1)}}
          className=${"w-10 h-10 rounded-xl font-bold text-lg transition-all "+(numGroups<maxGroups?"bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-300":"bg-gray-50 text-gray-300 border border-gray-200 cursor-not-allowed")}>+</button>
      </div>
      <p className="text-gray-500 text-xs mb-5">${names.length} Personen \u2192 ${sizeInfo}</p>
      <button onClick=${startVortex}
        className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white shadow-lg shadow-violet-500/25 transition-all hover:shadow-violet-500/40 hover:scale-105 active:scale-95 text-sm">
        \u{1F300} Portal \u00F6ffnen
      </button>
    </div>`}

    ${(phase==='running'||phase==='done')&&html`<div className="relative rounded-2xl overflow-hidden border border-violet-500/20 bg-gray-950 shadow-2xl shadow-violet-500/5 mx-auto" style=${{maxWidth:'860px'}}>
      <canvas ref=${canvasRef} width=${AW*2} height=${AH*2} style=${{width:'100%',height:'auto',display:'block'}} role="img" aria-label="Vortex Portal Gruppen-Zuweisung"/>
    </div>`}

    ${phase==='done'&&groups.length>0&&html`<div className="mt-6 grid gap-4" style=${{gridTemplateColumns:'repeat('+Math.min(groups.length,4)+', minmax(0, 1fr))'}}>
      ${groups.map(function(grp,gi){
        var delay=gi*0.1;
        return html`<div key=${gi} className="vortex-result-pop rounded-xl border overflow-hidden" style=${{borderColor:PORTAL_COLORS[gi%PORTAL_COLORS.length]+'44',animationDelay:delay+'s',opacity:0}}>
          <div className="px-4 py-2 text-sm font-bold text-white" style=${{background:'linear-gradient(135deg,'+PORTAL_COLORS[gi%PORTAL_COLORS.length]+'44,'+PORTAL_COLORS[gi%PORTAL_COLORS.length]+'22)'}}>
            Gruppe ${gi+1} <span className="text-xs font-normal opacity-60">(${grp.length})</span>
          </div>
          <div className="px-4 py-3 space-y-1 bg-white">
            ${grp.map(function(name,ni){
              return html`<div key=${ni} className="text-sm text-gray-700 flex items-center gap-2">
                <span className="w-2 h-2 rounded-full inline-block" style=${{background:PORTAL_COLORS[gi%PORTAL_COLORS.length]}}/>
                ${name}
              </div>`;
            })}
          </div>
        </div>`;
      })}
    </div>`}

    <div className="mt-5 text-center">
      ${phase==='done'&&html`<span className="inline-flex gap-3">
        <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-violet-50 text-violet-700 border border-violet-200 hover:bg-violet-100 transition-all mr-3">Nochmal</button>
        <button onClick=${function(){doCleanup();onDone();}} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button>
      </span>`}
      ${phase==='running'&&html`<p role="status" aria-live="polite" className="text-gray-500 text-xs mt-2">Teilnehmer werden den Portalen zugeordnet...</p>`}
    </div>
  </div>`;
}



/* ═══════════════════════════════════════════════════════
   GLÜCKSRAD MODE
   ═══════════════════════════════════════════════════════ */
function WheelMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _winner=useState(null);var winner=_winner[0];var setWinner=_winner[1];
  var dragRef=useRef(null);
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _angle=useState(0);var angle=_angle[0];var setAngle=_angle[1];
  var _spinMsg=useState('');var spinMsg=_spinMsg[0];var setSpinMsg=_spinMsg[1];
  var _winIdx=useState(-1);var winIdx=_winIdx[0];var setWinIdx=_winIdx[1];
  var canvasRef=useRef(null);
  var animRef=useRef(null);
  var timers=useRef([]);
  function clearT(){timers.current.forEach(clearTimeout);timers.current=[]}
  useEffect(function(){return function(){clearT();if(animRef.current)cancelAnimationFrame(animRef.current);};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();spin();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  var N=names.length;
  var segAngle=(2*Math.PI)/N;

  useEffect(function(){
    if(!canvasRef.current)return;
    var canvas=canvasRef.current;
    var ctx=canvas.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);
    var W=canvas.width/2;var H=canvas.height/2;
    var cx=W/2;var cy=H/2;var R=Math.min(cx,cy)-26;
    ctx.clearRect(0,0,W,H);

    // Outer decorative ring with tick marks
    ctx.save();
    var tickR=R+14;
    for(var ti=0;ti<N*2;ti++){
      var ta=ti*(Math.PI/N)+angle;
      var isMajor=(ti%2===0);
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(ta)*(tickR-(!isMajor?4:8)),cy+Math.sin(ta)*(tickR-(!isMajor?4:8)));
      ctx.lineTo(cx+Math.cos(ta)*(tickR+2),cy+Math.sin(ta)*(tickR+2));
      ctx.strokeStyle=isMajor?'rgba(251,191,36,0.85)':'rgba(200,180,100,0.4)';
      ctx.lineWidth=isMajor?2:1;ctx.stroke();
    }
    // Outer border ring
    ctx.beginPath();ctx.arc(cx,cy,tickR+4,0,Math.PI*2);
    ctx.strokeStyle='rgba(109,40,217,0.35)';ctx.lineWidth=6;ctx.stroke();
    ctx.beginPath();ctx.arc(cx,cy,tickR+6,0,Math.PI*2);
    ctx.strokeStyle='rgba(251,191,36,0.25)';ctx.lineWidth=2;ctx.stroke();
    ctx.restore();

    // Wheel segments
    ctx.save();
    ctx.translate(cx,cy);ctx.rotate(angle);
    for(var i=0;i<N;i++){
      var sa=i*segAngle-Math.PI/2;var ea=sa+segAngle;
      var col=BALL_COLORS[i%BALL_COLORS.length];
      // Highlight winner segment when stopped
      var isWinner=(phase==='winner'&&i===winIdx);
      ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,sa,ea);ctx.closePath();
      if(isWinner){
        ctx.shadowBlur=30;ctx.shadowColor='rgba(251,191,36,0.9)';
        ctx.fillStyle=col;ctx.fill();
        ctx.shadowBlur=0;
        // Bright overlay
        ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,sa,ea);ctx.closePath();
        ctx.fillStyle='rgba(255,255,255,0.18)';ctx.fill();
      }else{
        ctx.fillStyle=col;ctx.fill();
      }
      ctx.strokeStyle='rgba(0,0,0,0.3)';ctx.lineWidth=2;ctx.stroke();
      ctx.save();
      ctx.rotate(sa+segAngle/2);
      ctx.fillStyle='#ffffff';
      var fs=Math.max(10,Math.min(22,Math.round(R*2.8/N)));
      ctx.font='bold '+fs+'px Inter,sans-serif';
      ctx.lineJoin='round';ctx.lineWidth=3.5;ctx.strokeStyle='rgba(0,0,0,0.65)';
      var wn=truncName(names[i],N>30?10:14);
      // Auf der linken Radhälfte den Text drehen, damit er nie kopfüber steht
      var absA=(angle+sa+segAngle/2)%(2*Math.PI);if(absA<0)absA+=2*Math.PI;
      var tx=R-16;
      if(absA>Math.PI/2&&absA<Math.PI*1.5){ctx.rotate(Math.PI);ctx.textAlign='left';tx=-(R-16);}
      else{ctx.textAlign='right';}
      ctx.strokeText(wn,tx,fs*0.34);
      ctx.fillText(wn,tx,fs*0.34);
      ctx.restore();
    }
    ctx.restore();

    // Center knob
    ctx.beginPath();ctx.arc(cx,cy,22,0,Math.PI*2);
    var grad=ctx.createRadialGradient(cx-5,cy-5,2,cx,cy,22);
    grad.addColorStop(0,'#4c1d95');grad.addColorStop(1,'#1e1b4b');
    ctx.fillStyle=grad;ctx.fill();
    ctx.strokeStyle='rgba(251,191,36,0.7)';ctx.lineWidth=3;ctx.stroke();
    ctx.beginPath();ctx.arc(cx-5,cy-5,6,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();

    // Pointer (top) — bigger and more visible
    ctx.save();ctx.translate(cx,cy-R-2);
    ctx.beginPath();ctx.moveTo(0,20);ctx.lineTo(-13,-8);ctx.lineTo(13,-8);ctx.closePath();
    ctx.fillStyle='#fbbf24';
    ctx.shadowBlur=16;ctx.shadowColor='rgba(251,191,36,0.9)';
    ctx.fill();
    ctx.strokeStyle='rgba(180,120,0,0.8)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  },[angle,N,names,phase,winIdx]);

  function wheelCenter(){
    var c=canvasRef.current;if(!c)return{x:200,y:200};
    var r=c.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};
  }
  function angleFrom(cx,cy,ex,ey){return Math.atan2(ey-cy,ex-cx);}
  function handleDragStart(clientX,clientY){
    if(phase==='spinning')return;
    var c=wheelCenter();
    dragRef.current={lastAngle:angleFrom(c.x,c.y,clientX,clientY),velocity:0,prevTime:performance.now()};
  }
  function handleDragMove(clientX,clientY){
    if(!dragRef.current||phase==='spinning')return;
    var c=wheelCenter();
    var a=angleFrom(c.x,c.y,clientX,clientY);
    var da=a-dragRef.current.lastAngle;
    if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;
    var dt=Math.max(1,performance.now()-dragRef.current.prevTime);
    dragRef.current.velocity=da/dt;
    dragRef.current.lastAngle=a;
    dragRef.current.prevTime=performance.now();
    setAngle(function(prev){return prev+da;});
  }
  function handleDragEnd(){
    if(!dragRef.current)return;
    var v=dragRef.current.velocity;
    dragRef.current=null;
    if(Math.abs(v)>0.001)spin();
  }

  function spin(){
    if(phase==='spinning')return;
    if(animRef.current){cancelAnimationFrame(animRef.current);animRef.current=null;}
    setPhase('spinning');setWinner(null);setShowConfetti(false);setWinIdx(-1);setSpinMsg('\u{1F4AB} Dreht sich...');
    var dur=(7000+Math.random()*5000);
    var wi=Math.floor(Math.random()*N);
    setWinIdx(wi);
    var extraSpins=7+Math.floor(Math.random()*5);
    var winCenter=wi*segAngle+segAngle/2;
    var startA=angle%(2*Math.PI);
    // endA must satisfy: (-endA) mod 2π = winCenter mod 2π
    // i.e. endA ≡ -winCenter (mod 2π)
    var targetA=(2*Math.PI-winCenter%(2*Math.PI))%(2*Math.PI);
    var needed=(targetA-startA+2*Math.PI)%(2*Math.PI);
    var totalRot=extraSpins*2*Math.PI+needed;
    var endA=startA+totalRot;
    var t0=null;
    var ah=createAudioCtx();var lastTick=0;var slowMsgShown=false;var verySlowMsgShown=false;
    function animate(ts){
      if(!t0)t0=ts;
      var el=ts-t0;var p=Math.min(1,el/dur);
      var eased=1-Math.pow(1-p,3);
      var cur=startA+totalRot*eased;
      setAngle(cur);
      var speed=(totalRot*(3*Math.pow(1-p,2))/dur)*1000;
      var tickMs=Math.max(35,700/(speed+0.5));
      if(ah&&ts-lastTick>tickMs){
        var pitch=Math.max(200,Math.min(1000,300+speed*0.8));
        aT(ah.ctx,ah.master,pitch,ah.ctx.currentTime,0.02,0.08,'square');
        lastTick=ts;
      }
      if(!slowMsgShown&&p>0.6){slowMsgShown=true;setSpinMsg('\u231B Verlangsamt sich...');}
      if(!verySlowMsgShown&&p>0.85){verySlowMsgShown=true;setSpinMsg('\u{1F610} Gleich ist es soweit...');}
      if(p<1){animRef.current=requestAnimationFrame(animate);}
      else{
        setAngle(endA%(2*Math.PI));
        setWinner(names[wi]);setPhase('winner');setShowConfetti(true);setSpinMsg('');onResult(names[wi]);
        if(ah){
          // Victory chime
          var ctx2=ah.ctx;var m=ah.master;var now=ctx2.currentTime;
          [523.25,659.25,783.99,1046.5].forEach(function(f,fi){aT(ctx2,m,f,now+fi*0.1,0.25,0.2,'triangle');});
          setTimeout(function(){stopAH(ah);},1500);
        }
      }
    }
    animRef.current=requestAnimationFrame(animate);
  }

  return html`<div className="flex flex-col items-center w-full max-w-xl">
    ${showConfetti&&html`<${Confetti}/>`}
    <h2 className="text-lg font-bold text-gray-800 mb-4">\u{1F3A1} Gl\u00FCcksrad</h2>
    <div className="relative mb-4" style=${{filter:phase==='winner'?'drop-shadow(0 0 20px rgba(251,191,36,0.5))':'none',transition:'filter 0.5s'}}>
      <canvas ref=${canvasRef} width="1120" height="1120"
        style=${{borderRadius:'50%',display:'block',width:'min(560px,86vw)',height:'auto',cursor:phase==='spinning'?'default':'grab',touchAction:'none'}}
        onMouseDown=${function(e){handleDragStart(e.clientX,e.clientY)}}
        onMouseMove=${function(e){handleDragMove(e.clientX,e.clientY)}}
        onMouseUp=${handleDragEnd}
        onMouseLeave=${handleDragEnd}
        onTouchStart=${function(e){var t=e.touches[0];handleDragStart(t.clientX,t.clientY)}}
        onTouchMove=${function(e){e.preventDefault();var t=e.touches[0];handleDragMove(t.clientX,t.clientY)}}
        onTouchEnd=${handleDragEnd}
        onClick=${function(){if(phase==='idle'&&!dragRef.current)spin();}}
      />
    </div>
    ${spinMsg&&html`<div role="status" aria-live="polite" className="text-center mb-3 text-gray-700 font-semibold text-sm animate-pulse">${spinMsg}</div>`}
    ${winner&&html`<div className="winner-enter mb-4 w-full max-w-sm text-center">
      <div className="winner-card rounded-2xl px-8 py-5 text-white shadow-2xl border-2 border-amber-400/40" style=${{background:'linear-gradient(135deg,#4c1d95,#1e40af)'}}>
        <div className="text-amber-200 text-xs font-semibold tracking-widest uppercase mb-1">Gl\u00FCcksrad \u2014 Gewinner</div>
        <div className="text-3xl font-black">${winner}</div>
        <div className="mt-2 text-xl">\u{1F389}\u{1F3C6}\u{1F389}</div>
        <${CopyButton} modeName="Gl\u00FCcksrad" winner=${winner}/>
      </div>
    </div>`}
    <div className="flex gap-3 mt-2 flex-wrap justify-center">
      ${phase==='idle'&&html`<button onClick=${spin} className="px-8 py-3 rounded-xl font-bold bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-black shadow-lg transition-all active:scale-95">\u{1F3A1} Drehen!</button>`}
      ${phase==='spinning'&&html`<div className="text-gray-500 text-sm">Das Rad dreht sich...</div>`}
      ${phase==='winner'&&html`<span className="flex gap-3">
        <button onClick=${spin} className="px-6 py-3 rounded-xl font-semibold bg-amber-100 text-amber-700 border border-amber-200 hover:bg-amber-200 transition-all">Nochmal</button>
        <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zur\u00FCck</button>
      </span>`}
    </div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════
   SPACE RACE MODE (Dodge-em-up through the asteroid field)
   ═══════════════════════════════════════════════════════ */
function SpaceRaceMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _winner=useState(null);var winner=_winner[0];var setWinner=_winner[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var _countdown=useState(null);var countdown=_countdown[0];var setCountdown=_countdown[1];
  var _alive=useState(0);var aliveCount=_alive[0];var setAliveCount=_alive[1];
  var _msg=useState('');var commentary=_msg[0];var setCommentary=_msg[1];
  var canvasRef=useRef(null);
  var audioRef=useRef(null);
  var animRef=useRef(null);
  var gRef=useRef(null);
  var timers=useRef([]);
  function clearT(){timers.current.forEach(clearTimeout);timers.current=[]}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms))}
  useEffect(function(){return function(){clearT();if(animRef.current)cancelAnimationFrame(animRef.current);stopAH(audioRef.current);};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();startRace();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  var AW=700;var AH=480;
  // Fun flying vehicles — cycled by index
  var VEHICLES=['\u{1F680}','\u{1F6F8}','\u{1F6E9}\uFE0F','\u{1F388}','\u2708\uFE0F','\u{1F681}','\u{1FA81}','\u{1F985}','\u{1F98B}','\u{1F409}','\u{1F984}','\u{1F47D}','\u{1F383}','\u{1F31F}'];

  function playBeep(freq){try{var ah=audioRef.current;if(!ah)return;aT(ah.ctx,ah.master,freq,ah.ctx.currentTime,0.15,0.2,'sine');}catch(e){}}
  function playExplosion(){try{var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var d=ah.master;var now=ctx.currentTime;aT(ctx,d,90,now,0.25,0.3,'sawtooth');aT(ctx,d,140,now+0.02,0.2,0.25,'square');aT(ctx,d,40,now+0.1,0.15,0.2,'triangle');}catch(e){}}
  function playWin(){try{var ah=audioRef.current;if(!ah)return;var ctx=ah.ctx;var d=ah.master;var now=ctx.currentTime;[523.25,659.25,783.99,1046.5].forEach(function(f,fi){aT(ctx,d,f,now+fi*0.12,0.3,0.25,'triangle');});}catch(e){}}
  function playEngineHum(){
    try{
      var ah=audioRef.current;if(!ah)return;
      var ctx=ah.ctx;var m=ah.master;
      var osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.value=55;
      var f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=200;
      var g=ctx.createGain();g.gain.value=0.05;
      osc.connect(f);f.connect(g);g.connect(m);osc.start();
      if(ah.oscs)ah.oscs.push(osc);
    }catch(e){}
  }

  function startRace(){
    clearT();if(animRef.current)cancelAnimationFrame(animRef.current);
    stopAH(audioRef.current);
    var ah=createAudioCtx();audioRef.current=ah;
    setWinner(null);setShowConfetti(false);setCommentary('');
    setPhase('countdown');
    var winnerIdx=Math.floor(Math.random()*names.length);

    var ships=names.map(function(n,i){
      return {
        id:i,name:n,
        color:BALL_COLORS[i%BALL_COLORS.length],
        emoji:VEHICLES[i%VEHICLES.length],
        x:82+Math.random()*16,y:0,
        vx:0,vy:0,
        alive:true,exploding:false,explodeT:0,
        trail:[],wobble:Math.random()*Math.PI*2,
        laneX:0,laneY:0,
        wobbleSpd:0.055+Math.random()*0.07,
        wobbleAmp:0.18+Math.random()*0.45
      };
    });
    var count=ships.length;
    // Startspalten weit auseinander ziehen und im Zickzack vergeben:
    // vertikal benachbarte Bahnen liegen so horizontal weit auseinander → Namensschilder überlappen nicht
    var xLanes=[];for(var xl=0;xl<count;xl++){xLanes.push(60+(count===1?0.5:xl/(count-1))*280);}
    var zig=[];var zLo=0;var zHi=xLanes.length-1;
    while(zLo<=zHi){zig.push(xLanes[zLo++]);if(zLo<=zHi)zig.push(xLanes[zHi--]);}
    xLanes=zig;
    for(var iy=0;iy<count;iy++){
      var tt=count===1?0.5:iy/(count-1);
      ships[iy].y=58+tt*(AH-116)+(Math.random()-0.5)*10;
      ships[iy].laneY=ships[iy].y;
      ships[iy].laneX=xLanes[iy];
      ships[iy].x=xLanes[iy]+(Math.random()-0.5)*8;
    }

    var stars=[];
    for(var si=0;si<160;si++){
      stars.push({x:Math.random()*AW,y:Math.random()*AH,r:Math.random()*1.4+0.3,vx:-(0.4+Math.random()*1.8),alpha:0.25+Math.random()*0.7});
    }

    // Schedule staggered eliminations — winner is last alive
    // Countdown 3.5 s + Rennen bis 14 s + Abspann => Gesamtlauf bleibt unter 20 s
    var elimOrder=[];for(var eo=0;eo<names.length;eo++){if(eo!==winnerIdx)elimOrder.push(eo);}
    elimOrder=shuffle(elimOrder);
    var elimStart=2200;var elimEnd=14000;
    var elimN=elimOrder.length;
    var elimSchedule=elimOrder.map(function(idx,i){
      var at=elimN<=1?elimEnd:(elimStart+i*(elimEnd-elimStart)/(elimN-1));
      return {victim:idx,at:at};
    });

    gRef.current={
      ships:ships,obstacles:[],particles:[],stars:stars,
      elimSchedule:elimSchedule,winnerIdx:winnerIdx,
      startT:0,obstacleTimer:0,done:false,lastAlive:ships.length
    };
    setAliveCount(ships.length);

    setCountdown(3);
    later(function(){playBeep(440);},0);
    later(function(){setCountdown(2);playBeep(440);},900);
    later(function(){setCountdown(1);playBeep(440);},1800);
    later(function(){setCountdown('ABFLUG! \u{1F680}');playBeep(880);},2700);
    later(function(){setCountdown(null);setPhase('racing');playEngineHum();startLoop();},3500);
  }

  function startLoop(){
    var g=gRef.current;if(!g)return;
    g.startT=performance.now();
    var lastT=g.startT;
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-lastT)/16.67);lastT=now;
      update(gg,dt);draw(gg);
      animRef.current=requestAnimationFrame(loop);
    }
    animRef.current=requestAnimationFrame(loop);
  }

  function update(g,dt){
    var elapsed=performance.now()-g.startT;

    // Scrolling stars
    for(var si=0;si<g.stars.length;si++){
      var s=g.stars[si];s.x+=s.vx*dt;
      if(s.x<-2){s.x=AW+2;s.y=Math.random()*AH;}
    }

    if(!g.done){
      g.obstacleTimer+=dt;
      if(g.obstacleTimer>9){g.obstacleTimer=0;spawnRandomObstacle(g);}
      while(g.elimSchedule.length&&g.elimSchedule[0].at<=elapsed){
        var ev=g.elimSchedule.shift();
        var victim=g.ships[ev.victim];
        if(victim&&victim.alive&&!victim.exploding){spawnHomingObstacle(g,ev.victim);}
      }
    }

    // Update ships
    var aliveShips=0;
    for(var i=0;i<g.ships.length;i++){
      var sh=g.ships[i];
      if(sh.exploding){
        sh.explodeT+=dt;
        if(sh.explodeT<5){
          for(var pp=0;pp<2;pp++){
            g.particles.push({x:sh.x+(Math.random()-0.5)*18,y:sh.y+(Math.random()-0.5)*18,vx:(Math.random()-0.5)*2.5,vy:(Math.random()-0.5)*2.5,life:18,maxLife:18,color:pp%2?'#FFB84D':'#FF3B30',size:2+Math.random()*2});
          }
        }
        if(sh.explodeT>12){sh.alive=false;sh.exploding=false;}
        continue;
      }
      if(!sh.alive)continue;
      aliveShips++;

      // AI dodge — scan for closest obstacle ahead (ignore mines targeting other ships)
      var dodge=0;var closest=null;var cd=99999;
      for(var oi=0;oi<g.obstacles.length;oi++){
        var o=g.obstacles[oi];if(o.consumed)continue;
        if(o.homing&&o.target!==i)continue; // ignore mines meant for others
        var dxo=o.x-sh.x;if(dxo<-30||dxo>220)continue;
        var dyo=o.y-sh.y;
        var dd=Math.sqrt(dxo*dxo+dyo*dyo);
        if(dd<cd){cd=dd;closest=o;}
      }
      if(closest&&cd<90){
        var ddy=closest.y-sh.y;
        dodge=ddy>0?-1:1;
        if(Math.abs(ddy)<6)dodge=Math.sin(sh.wobble)>0?-1:1;
      }else{
        dodge=(sh.laneY-sh.y)*0.005; // return to own lane, not shared center
      }
      sh.wobble+=sh.wobbleSpd*dt;
      sh.vy+=dodge*0.75*dt;
      sh.vy*=0.88;
      sh.y+=sh.vy*dt;
      sh.y+=Math.sin(sh.wobble)*sh.wobbleAmp*dt;
      if(sh.y<36){sh.y=36;sh.vy=Math.abs(sh.vy)*0.3;}
      if(sh.y>AH-36){sh.y=AH-36;sh.vy=-Math.abs(sh.vy)*0.3;}
      sh.x+=(sh.laneX-sh.x)*0.005*dt+Math.sin(sh.wobble*1.3)*0.18*dt;
      // Grenzen müssen den Bereich der Startspalten abdecken, sonst rutschen alle Schiffe
      // in eine schmale Säule und die Namensschilder liegen übereinander
      if(sh.x<44)sh.x=44;
      if(sh.x>360)sh.x=360;

      sh.trail.push({x:sh.x,y:sh.y});
      if(sh.trail.length>9)sh.trail.shift();

      // Any obstacle eliminates on collision — homing mines only hit their target
      for(var oj=0;oj<g.obstacles.length;oj++){
        var obj=g.obstacles[oj];
        if(obj.consumed)continue;
        if(obj.homing&&obj.target!==i)continue; // homing mine targets specific ship only
        if(!obj.homing&&i===g.winnerIdx)continue; // winner is immune to random obstacles
        var cdx=obj.x-sh.x;var cdy=obj.y-sh.y;
        var cdd=Math.sqrt(cdx*cdx+cdy*cdy);
        var hitR=obj.homing?obj.r+15:obj.r+10;
        if(cdd<hitR){
          sh.exploding=true;sh.explodeT=0;
          obj.consumed=true;
          // Remove from pending elim schedule
          g.elimSchedule=g.elimSchedule.filter(function(ev){return ev.victim!==i;});
          playExplosion();
          for(var bp=0;bp<20;bp++){
            g.particles.push({x:sh.x,y:sh.y,vx:(Math.random()-0.5)*5.5,vy:(Math.random()-0.5)*5.5,life:24,maxLife:24,color:bp%3===0?'#FF3B30':(bp%3===1?'#FFB84D':'#FFEA00'),size:2.5+Math.random()*2.5});
          }
          (function(nm){
            setCommentary('\u{1F4A5} '+nm+' ausgeschieden!');
            later(function(){setCommentary('');},1100);
          })(sh.name);
          break;
        }
      }
    }

    if(g.lastAlive!==aliveShips){g.lastAlive=aliveShips;setAliveCount(aliveShips);}

    // Update obstacles
    for(var ok=g.obstacles.length-1;ok>=0;ok--){
      var ob=g.obstacles[ok];
      if(ob.homing&&!ob.consumed){
        var vs=g.ships[ob.target];
        if(vs&&vs.alive&&!vs.exploding){
          var tdx=vs.x-ob.x;var tdy=vs.y-ob.y;
          var tdd=Math.sqrt(tdx*tdx+tdy*tdy);
          if(tdd>0.1){
            var sp=5.5;
            ob.vx+=(tdx/tdd*sp-ob.vx)*0.2;
            ob.vy+=(tdy/tdd*sp-ob.vy)*0.2;
          }
        }
      }
      ob.x+=ob.vx*dt;ob.y+=ob.vy*dt;
      ob.rot+=ob.rotV*dt;
      if(ob.x<-70||ob.x>AW+80||ob.y<-80||ob.y>AH+80){g.obstacles.splice(ok,1);}
    }

    // Particles
    for(var pk=g.particles.length-1;pk>=0;pk--){
      var pt=g.particles[pk];
      pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;
      pt.vy+=0.04*dt;
      pt.life-=dt;
      if(pt.life<=0)g.particles.splice(pk,1);
    }

    // Winner detection — always use the predetermined winnerIdx
    if(!g.done&&aliveShips<=1&&elapsed>2200){
      g.done=true;
      var winName=g.ships[g.winnerIdx].name;
      (function(nm){
        later(function(){setPhase('winner');setWinner(nm);setShowConfetti(true);playWin();onResult(nm);},700);
      })(winName);
    }
    if(!g.done&&elapsed>26000){
      g.done=true;
      var _winNm=g.ships[g.winnerIdx].name;setPhase('winner');setWinner(_winNm);setShowConfetti(true);playWin();onResult(_winNm);
    }
  }

  function spawnRandomObstacle(g){
    var types=['asteroid','asteroid','asteroid','comet','debris'];
    var type=types[Math.floor(Math.random()*types.length)];
    var r=14+Math.random()*14;
    g.obstacles.push({
      type:type,x:AW+40,y:40+Math.random()*(AH-80),
      vx:-(1.8+Math.random()*1.7),vy:(Math.random()-0.5)*0.5,
      r:r,rot:Math.random()*Math.PI*2,rotV:(Math.random()-0.5)*0.06,
      homing:false,consumed:false
    });
  }

  function spawnHomingObstacle(g,targetIdx){
    var ts=g.ships[targetIdx];if(!ts)return;
    g.obstacles.push({
      type:'mine',x:AW+30,y:ts.y+(Math.random()-0.5)*50,
      vx:-4,vy:0,r:19,rot:0,rotV:0.12,
      homing:true,target:targetIdx,consumed:false
    });
  }

  function draw(g){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);

    // Deep space gradient
    var bg=ctx.createLinearGradient(0,0,0,AH);
    bg.addColorStop(0,'#030318');bg.addColorStop(0.5,'#0a0a28');bg.addColorStop(1,'#140828');
    ctx.fillStyle=bg;ctx.fillRect(0,0,AW,AH);

    // Nebulas
    var nb=ctx.createRadialGradient(AW*0.3,AH*0.35,10,AW*0.3,AH*0.35,320);
    nb.addColorStop(0,'rgba(139,92,246,0.18)');nb.addColorStop(1,'rgba(139,92,246,0)');
    ctx.fillStyle=nb;ctx.fillRect(0,0,AW,AH);
    var nb2=ctx.createRadialGradient(AW*0.78,AH*0.7,10,AW*0.78,AH*0.7,280);
    nb2.addColorStop(0,'rgba(236,72,153,0.13)');nb2.addColorStop(1,'rgba(236,72,153,0)');
    ctx.fillStyle=nb2;ctx.fillRect(0,0,AW,AH);

    // Stars
    for(var si=0;si<g.stars.length;si++){
      var s=g.stars[si];
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+s.alpha+')';ctx.fill();
    }

    // Obstacles
    for(var oi=0;oi<g.obstacles.length;oi++){
      var o=g.obstacles[oi];
      ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);
      if(o.type==='asteroid'){
        var grd=ctx.createRadialGradient(-o.r*0.3,-o.r*0.3,o.r*0.1,0,0,o.r);
        grd.addColorStop(0,'#9B8466');grd.addColorStop(0.6,'#5D4A37');grd.addColorStop(1,'#2E2218');
        ctx.fillStyle=grd;
        ctx.beginPath();
        var pts=9;
        for(var pi2=0;pi2<pts;pi2++){
          var a=pi2*Math.PI*2/pts;
          var rr=o.r*(0.82+Math.sin(a*4+o.rotV*100)*0.18);
          var px=Math.cos(a)*rr;var py=Math.sin(a)*rr;
          if(pi2===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();ctx.fill();
        ctx.fillStyle='rgba(0,0,0,0.4)';
        ctx.beginPath();ctx.arc(-o.r*0.28,-o.r*0.15,o.r*0.22,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(o.r*0.22,o.r*0.28,o.r*0.15,0,Math.PI*2);ctx.fill();
        ctx.beginPath();ctx.arc(o.r*0.15,-o.r*0.35,o.r*0.1,0,Math.PI*2);ctx.fill();
      }else if(o.type==='comet'){
        ctx.rotate(-o.rot);
        var tg=ctx.createLinearGradient(-o.r*3.2,0,0,0);
        tg.addColorStop(0,'rgba(100,200,255,0)');tg.addColorStop(1,'rgba(200,240,255,0.85)');
        ctx.fillStyle=tg;
        ctx.beginPath();
        ctx.moveTo(-o.r*3.2,-o.r*0.4);ctx.lineTo(0,-o.r);ctx.lineTo(0,o.r);ctx.lineTo(-o.r*3.2,o.r*0.4);
        ctx.closePath();ctx.fill();
        var hg=ctx.createRadialGradient(0,0,0,0,0,o.r);
        hg.addColorStop(0,'#ffffff');hg.addColorStop(0.4,'#9fdbff');hg.addColorStop(1,'#2a6bb0');
        ctx.fillStyle=hg;
        ctx.beginPath();ctx.arc(0,0,o.r,0,Math.PI*2);ctx.fill();
      }else if(o.type==='debris'){
        ctx.fillStyle='#4B5563';ctx.fillRect(-o.r,-o.r*0.35,o.r*2,o.r*0.7);
        ctx.fillStyle='#1F2937';ctx.fillRect(-o.r*0.9,-o.r*0.65,o.r*0.45,o.r*1.3);
        ctx.strokeStyle='#9CA3AF';ctx.lineWidth=1;
        ctx.strokeRect(-o.r,-o.r*0.35,o.r*2,o.r*0.7);
        ctx.fillStyle='#FBBF24';ctx.fillRect(-o.r*0.2,-o.r*0.1,o.r*0.12,o.r*0.2);
      }else if(o.type==='mine'){
        var mg=ctx.createRadialGradient(0,0,2,0,0,o.r);
        mg.addColorStop(0,'#ff8080');mg.addColorStop(0.65,'#a01818');mg.addColorStop(1,'#300000');
        ctx.fillStyle=mg;
        ctx.beginPath();ctx.arc(0,0,o.r*0.72,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#b91c1c';
        for(var k=0;k<8;k++){
          ctx.save();ctx.rotate(k*Math.PI/4);
          ctx.beginPath();
          ctx.moveTo(o.r*0.7,-3.2);ctx.lineTo(o.r*1.25,0);ctx.lineTo(o.r*0.7,3.2);
          ctx.closePath();ctx.fill();
          ctx.restore();
        }
        var pulse=0.5+0.5*Math.sin(performance.now()*0.018);
        ctx.fillStyle='rgba(255,220,120,'+pulse+')';
        ctx.beginPath();ctx.arc(0,0,o.r*0.28,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }

    // Particles
    for(var pi3=0;pi3<g.particles.length;pi3++){
      var p=g.particles[pi3];
      ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
      ctx.beginPath();ctx.arc(p.x,p.y,p.size||2,0,Math.PI*2);
      ctx.fillStyle=p.color;ctx.fill();
    }
    ctx.globalAlpha=1;

    // Ships
    for(var shi=0;shi<g.ships.length;shi++){
      var sh=g.ships[shi];
      if(!sh.alive&&!sh.exploding)continue;

      if(!sh.exploding&&sh.trail.length>1){
        ctx.strokeStyle=sh.color+'55';
        ctx.lineWidth=3;ctx.lineCap='round';
        ctx.beginPath();
        for(var ti=0;ti<sh.trail.length;ti++){
          var tp=sh.trail[ti];
          if(ti===0)ctx.moveTo(tp.x-10,tp.y);
          else ctx.lineTo(tp.x-10,tp.y);
        }
        ctx.stroke();
      }

      var alpha=sh.exploding?Math.max(0,1-sh.explodeT/10):1;
      ctx.globalAlpha=alpha;

      if(!sh.exploding){
        var fl=4+Math.sin(performance.now()*0.02+shi)*1.8;
        var fg=ctx.createRadialGradient(sh.x-14,sh.y,0,sh.x-14,sh.y,12);
        fg.addColorStop(0,'rgba(255,240,100,0.92)');
        fg.addColorStop(0.4,'rgba(255,120,50,0.7)');
        fg.addColorStop(1,'rgba(255,50,0,0)');
        ctx.fillStyle=fg;
        ctx.beginPath();
        ctx.ellipse(sh.x-14-fl*0.5,sh.y,11+fl,4.5,0,0,Math.PI*2);
        ctx.fill();
      }

      ctx.font='26px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(sh.emoji,sh.x,sh.y);

      if(!sh.exploding){
        ctx.font='bold 14px Inter,sans-serif';
        ctx.textAlign='center';ctx.textBaseline='top';
        ctx.strokeStyle='rgba(0,0,0,0.9)';
        ctx.lineWidth=4;ctx.lineJoin='round';
        var nm=truncName(sh.name,12);

var PODIUM=['#f59e0b','#94a3b8','#b45309'];

function ReihenfolgeMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var _ph=useState('idle');var phase=_ph[0];var setPhase=_ph[1];
  var _or=useState([]);var order=_or[0];var setOrder=_or[1];
  var _pl=useState(function(){return names.map(function(_,i){return i;});});var pool=_pl[0];var setPool=_pl[1];
  var _hi=useState(-1);var hiIdx=_hi[0];var setHiIdx=_hi[1];
  var _st=useState('Bereit für die Auslosung');var statusText=_st[0];var setStatusText=_st[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var timers=useRef([]);
  var audioRef=useRef(null);

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  useEffect(function(){return function(){clearT();stopAH(audioRef.current);audioRef.current=null;};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  function start(){
    if(phase==='running')return;
    clearT();stopAH(audioRef.current);
    var ah=createAudioCtx();audioRef.current=ah;playOrderMusic(ah);
    var n=names.length;
    var drawn=shuffle(names.map(function(_,i){return i;}));
    setOrder([]);setPool(names.map(function(_,i){return i;}));setHiIdx(-1);
    setShowConfetti(false);setPhase('running');setStatusText('Die Reihenfolge wird ausgelost…');

    // Gesamtdauer bleibt unter 20 s, egal ob 2 oder 50 Namen
    var per=Math.max(260,Math.min(1300,Math.round(12000/n)));
    var rem=names.map(function(_,i){return i;});
    var t=350;
    drawn.forEach(function(idx,i){
      var scans=Math.max(2,Math.min(6,Math.floor(per/120)));
      for(var s=0;s<scans;s++){
        (function(si,snapshot){
          later(function(){
            if(!snapshot.length)return;
            setHiIdx(snapshot[Math.floor(Math.random()*snapshot.length)]);
          },t+si*(per*0.55/scans));
        })(s,rem.slice());
      }
      later(function(){
        setHiIdx(-1);
        setOrder(function(p){return p.concat([idx]);});
        setPool(function(p){return p.filter(function(x){return x!==idx;});});
        setStatusText('Platz '+(i+1)+': '+names[idx]);
      },t+per*0.66);
      rem.splice(rem.indexOf(idx),1);
      t+=per;
    });

    later(function(){
      setPhase('done');setShowConfetti(true);
      setStatusText('\u{1F3C1} Reihenfolge steht — '+names[drawn[0]]+' fängt an!');
      onResult(names[drawn[0]]+' beginnt');
      stopAH(audioRef.current);audioRef.current=null;
    },t+350);
  }

  function reset(){
    clearT();stopAH(audioRef.current);audioRef.current=null;
    setPhase('idle');setOrder([]);setPool(names.map(function(_,i){return i;}));
    setHiIdx(-1);setShowConfetti(false);setStatusText('Bereit für die Auslosung');
  }

  var listCols=names.length<=8?1:names.length<=22?2:3;
  var listRows=Math.ceil(names.length/listCols);
  var copyText=order.map(function(idx,i){return (i+1)+'. '+names[idx];}).join(' · ');

  return(
    html`<div className="flex flex-col items-center w-full max-w-4xl screen-enter">
      ${showConfetti&&html`<${Confetti}/>`}
      <div className="text-center mb-4">
        <h2 className="text-2xl font-black mb-1" style=${{background:'linear-gradient(90deg,#b45309,#d97706,#6d28d9)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text'}}>\u{1F522} Reihenfolge</h2>
        <p role="status" aria-live="polite" className="text-gray-700 text-base font-medium">${statusText}</p>
        ${phase==='running'&&html`<p className="text-gray-500 text-xs mt-0.5">${order.length}/${names.length} vergeben</p>`}
      </div>

      ${pool.length>0&&html`<div className="w-full mb-5">
        <p className="text-gray-500 text-center mb-2" style=${{fontSize:10,textTransform:'uppercase',letterSpacing:'0.1em'}}>Noch im Topf (${pool.length})</p>
        <div className="flex flex-wrap gap-2 justify-center bg-gray-50 rounded-2xl p-3 border border-gray-200">
          ${pool.map(function(idx){
            var isHi=hiIdx===idx;
            return html`<span key=${idx} className=${"rf-chip"+(isHi?" spinning":"")} style=${{background:BALL_COLORS[idx%BALL_COLORS.length],opacity:isHi?1:0.82,boxShadow:isHi?'0 0 0 3px rgba(251,191,36,.65),0 4px 14px rgba(0,0,0,.2)':undefined}}>${names[idx]}</span>`;
          })}
        </div>
      </div>`}

      <div className="w-full grid gap-2 mb-5" style=${{gridTemplateColumns:'repeat('+listCols+',minmax(0,1fr))',gridTemplateRows:'repeat('+listRows+',auto)',gridAutoFlow:'column'}}>
        ${names.map(function(_,slot){
          var idx=order[slot];
          var pod=slot<3?PODIUM[slot]:null;
          if(idx===undefined){
            return html`<div key=${slot} className="rf-slot empty">
              <span className="rf-num plain">${slot+1}</span>
              <span className="text-gray-300 text-sm italic">—</span>
            </div>`;
          }
          return html`<div key=${slot} className="rf-slot rf-land" style=${{borderColor:pod?pod+'66':'#e5e7eb'}}>
            <span className=${"rf-num "+(pod?"podium":"plain")} style=${pod?{background:pod}:undefined}>${slot+1}</span>
            <span className="font-bold text-gray-900 text-base truncate">${names[idx]}</span>
          </div>`;
        })}
      </div>

      ${phase==='done'&&html`<div className="winner-enter mb-5 w-full max-w-md">
        <div className="winner-card rounded-2xl px-8 py-5 text-white text-center shadow-2xl border-2 border-amber-400/40" style=${{background:'linear-gradient(135deg,#b45309,#7c2d12)'}}>
          <div className="text-amber-200 text-xs font-semibold tracking-widest uppercase mb-1">\u{1F947} Startet</div>
          <div className="text-3xl font-black tracking-tight">${names[order[0]]}</div>
          <${CopyButton} modeName="Reihenfolge" winner=${copyText}/>

      <div className="flex gap-3 mt-1 flex-wrap justify-center">
        ${phase==='idle'&&html`<button onClick=${start} className="px-8 py-3 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95" style=${{background:'linear-gradient(135deg,#d97706,#b45309)',boxShadow:'0 8px 24px rgba(217,119,6,0.28)'}}>\u{1F522} Reihenfolge auslosen</button>`}
        ${phase==='running'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='done'&&html`<span className="flex gap-3">
          <button onClick=${reset} className="px-6 py-3 rounded-xl font-semibold bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition-all">Nochmal</button>
          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </span>`}
      </div>
    </div>`
  );
}

function PartnerMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};

  var _lens=useState(null);var lens=_lens[0];var setLens=_lens[1];
  var _focus=useState(null);var focus=_focus[0];var setFocus=_focus[1];
  var _cel=useState(null);var celebrate=_cel[0];var setCelebrate=_cel[1];
  var _prog=useState([0,0]);var progress=_prog[0];var setProgress=_prog[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var timers=useRef([]);
  var audioRef=useRef(null);
  var boardRef=useRef(null);var cardRefs=useRef({});

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  useEffect(function(){return function(){clearT();stopAH(audioRef.current);audioRef.current=null;};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='idle'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase]);

  function playTick(){
    try{var ah=audioRef.current;if(!ah)return;
      aT(ah.ctx,ah.master,290+Math.random()*80,ah.ctx.currentTime,0.04,0.07,'square');}catch(e){}
  }
  function playFlip(step){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      aT(c,m,step===0?440:660,now,0.09,0.18,'square');
      aT(c,m,step===0?660:880,now+0.05,0.09,0.12,'triangle');}catch(e){}
  }
  function playDrum(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      for(var i=0;i<7;i++)aT(c,m,150+i*6,now+i*0.045,0.05,0.13,'triangle');}catch(e){}
  }
  function playMatch(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){aT(c,m,f,now+i*0.07,0.24,0.20,'triangle');});
      aC(c,m,now+0.30,[659.25,783.99,1046.5],0.16,0.5,'sine');}catch(e){}
  }

  function cardCenter(ci){
    var b=boardRef.current;var el=cardRefs.current[ci];
    if(!b||!el)return null;
    var br=b.getBoundingClientRect();var er=el.getBoundingClientRect();
    return{x:er.left-br.left+er.width/2,y:er.top-br.top+er.height/2};
  }

  function start(){
    if(phase==='running')return;
    clearT();stopAH(audioRef.current);
    var ah=createAudioCtx();audioRef.current=ah;playMazeMusic(ah);

    var shuffledIdx=shuffle(names.map(function(_,i){return i;}));
    var groupsIdx=[];
    for(var i=0;i+1<shuffledIdx.length;i+=2)groupsIdx.push([shuffledIdx[i],shuffledIdx[i+1]]);
    if(shuffledIdx.length%2===1){
      if(groupsIdx.length===0)groupsIdx.push([shuffledIdx[0]]);
      else groupsIdx[groupsIdx.length-1].push(shuffledIdx[shuffledIdx.length-1]);
    }

    var cards=[];
    groupsIdx.forEach(function(g,gi){g.forEach(function(ni){cards.push({nameIdx:ni,pair:gi});});});
    cards=shuffle(cards);

    setDeck(cards);
    setFlipped(cards.map(function(){return false;}));
    setMatched(cards.map(function(){return false;}));
    setDuos([]);setShowConfetti(false);setPhase('running');
    setLens(null);setFocus(null);setCelebrate(null);
    setProgress([0,groupsIdx.length]);
    setStatusText('Karten werden gemischt…');
    setHintText('Die Lupe sucht das erste Kartenpaar.');

    var pairs=groupsIdx.length;
    var f=Math.max(0.42,Math.min(1,24000/(pairs*2960)));
    var stepIn=Math.round(380*f);
    var stepFlip=Math.round(350*f);
    var t=700;

    function lensTo(ci,mode){
      var c=cardCenter(ci);
      if(c)setLens({x:c.x,y:c.y});
      setFocus({idx:ci,mode:mode});
    }

    groupsIdx.forEach(function(g,gi){
      var positions=[];
      cards.forEach(function(c,ci){if(c.pair===gi)positions.push(ci);});
      var pool=[];
      cards.forEach(function(c,ci){if(c.pair!==gi)pool.push(ci);});
      var decoys=shuffle(pool).slice(0,positions.length+1);

      var tc=t;
      later(function(){
        setStatusText('\u{1F50D} Team '+(gi+1)+' von '+pairs+' — die Lupe sucht…');
        setHintText('Wer gehört zusammen?');
      },tc);

      positions.forEach(function(ci,k){
        var dk=decoys[k];
        if(dk!==undefined){
          later(function(){lensTo(dk,'peek');playTick();},tc);

        tc+=stepIn;
        later(function(){lensTo(ci,'lift');playTick();},tc);

        tc+=Math.round(stepFlip*1.4);

      later(function(){playDrum();setHintText('Passt das zusammen…?');},tc-Math.round(stepFlip*0.6));

      later(function(){
        setMatched(function(p){var n2=p.slice();positions.forEach(function(ci){n2[ci]=true;});return n2;});
        setDuos(function(p){return p.concat([g.map(function(ni){return names[ni];})]);});
        setProgress(function(p){return [p[0]+1,p[1]];});
        setFocus(null);
        var a=cardCenter(positions[0]);
        var b=cardCenter(positions[positions.length-1]);
        if(a&&b){
          var sparks=[];
          for(var s=0;s<14;s++){
            var sa=Math.random()*Math.PI*2;var sd=26+Math.random()*46;
            sparks.push({dx:Math.round(Math.cos(sa)*sd),dy:Math.round(Math.sin(sa)*sd),

            color:BALL_COLORS[gi%BALL_COLORS.length],sparks:sparks,
            txt:g.length>2?'\u{1F91D} TRIO!':'\u{1F91D} MATCH!'});
          later(function(){setCelebrate(null);},1300);
        }
        setStatusText((g.length>2?'\u{1F91D} Trio':'\u{1F91D} Team')+' '+(gi+1)+': '+g.map(function(ni){return names[ni];}).join(' + '));
        setHintText('Perfektes Paar!');
        playMatch();
      },tc+Math.round(200*f));

      tc+=Math.round(200*f)+Math.round(540*f);
      t=tc;
    });

    later(function(){
      setLens(null);setFocus(null);
      setPhase('done');setShowConfetti(true);
      setStatusText('\u{1F91D} '+groupsIdx.length+' Teams stehen!');
      setHintText('Alle Karten aufgedeckt.');
      onResult(groupsIdx.length+' Teams');
      stopAH(audioRef.current);audioRef.current=null;
    },t+500);

  var cardFS=cols>=10?11:cols>=8?12:cols>=6?13:15;
  var cardMax=cols>=10?11:cols>=8?12:14;
  var duoCols=Math.min(4,Math.max(1,duos.length));

  if(phase==='idle'){
    return(
      html`<div className="flex flex-col items-center w-full max-w-lg text-center screen-enter">

          <div className="text-3xl">\u{1F50D}</div>

            return html`<div key=${ci} ref=${function(el){cardRefs.current[ci]=el;}}
              className=${"mem-card"+(isFlipped?" flipped":"")+(isMatched?" matched":"")+fx+idle}
              style=${{height:cardH,animationDelay:((ci%7)*0.22)+'s'}}>

        ${celebrate&&html`<svg key=${'b'+celebrate.key} className="mem-beam" width="100%" height="100%">

        })}

        ${celebrate&&html`<div key=${'g'+celebrate.key} className="mem-badge" style=${{left:celebrate.cx,top:celebrate.cy,fontSize:14}}>${celebrate.txt}</div>`}

        ${lens&&html`<div className="mem-lens" style=${{left:lens.x,top:lens.y}}>
          <div className="mem-lens-inner">
            <svg width="54" height="54" viewBox="0 0 54 54">
              <circle cx="22" cy="22" r="15" fill="rgba(186,230,253,0.22)" stroke="#e2e8f0" strokeWidth="3.5"/>
              <circle cx="22" cy="22" r="15" fill="none" stroke="rgba(255,255,255,0.65)" strokeWidth="1"/>
              <path d="M17 15 Q13 18 12.5 23" stroke="rgba(255,255,255,0.85)" strokeWidth="2.2" fill="none" strokeLinecap="round"/>
              <rect x="31" y="31" width="17" height="7" rx="3.5" fill="#a16207" transform="rotate(45 31 31)"/>
              <rect x="31" y="31" width="9" height="7" rx="3.5" fill="#ca8a04" transform="rotate(45 31 31)"/>
            </svg>
