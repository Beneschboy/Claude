function ebPick(a){return a[Math.floor(Math.random()*a.length)];}
function ebRi(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function ebQueue(pool){
  var bag=shuffle(pool.slice());var i=0;
  return function(){
    if(i>=bag.length){bag=shuffle(pool.slice());i=0;}
    return bag[i++];
  };
}

/* ── Baukasten: Zustand + Bausteine, aus denen ein Archetyp seinen Verlauf setzt ── */
function ebMakeKit(){
  var B={s:[],t:0,bHp:100,pHp:100};
  B.nextP=ebQueue(EB_P_LINES);
  B.nextB=ebQueue(EB_B_LINES);
  B.nextCrit=ebQueue(EB_CRITS);
  B.nextLow=ebQueue(EB_LOWS);
  B.nextMiss=ebQueue(EB_MISS);
  B.beatLo=2020;B.beatHi=2480;
  B.beat=function(){return ebRi(B.beatLo,B.beatHi);};

  B.A=function(dt,who,dmg,text,opt){
    B.t+=dt;B.s.push(Object.assign({t:B.t,who:who,dmg:dmg,text:text},opt||{}));
  };
  /* Herausforderer drückt Benesch auf 'target' Wissen */
  B.pTo=function(target,opt,line){
    var d=Math.max(1,Math.round(B.bHp-target));B.bHp-=d;
    var L=line||B.nextP();
    B.A(B.beat(),'p',d,L.t,Object.assign({proj:L.p},opt||{}));
  };
  /* Benesch drückt den Herausforderer auf 'target' Wissen */
  B.bTo=function(target,opt,line){
    var d=Math.max(1,Math.round(B.pHp-target));B.pHp-=d;
    var L=line||B.nextB();
    B.A(B.beat(),'b',d,L.t,Object.assign({proj:L.p},opt||{}));
  };
  /* Schlagabtausch über n Runden, beide Kurven linear auf ihr Ziel */
  B.exchange=function(n,bEnd,pEnd,pFirst){
    var b0=B.bHp,p0=B.pHp;
    var first=Math.random()<(pFirst===undefined?0.6:pFirst);
    for(var i=1;i<=n;i++){
      var bt=Math.round(b0+(bEnd-b0)*(i/n));
      var pt=Math.round(p0+(pEnd-p0)*(i/n));
      if(first){B.pTo(bt);B.bTo(pt);}else{B.bTo(pt);B.pTo(bt);}
    }
  };
  B.miss=function(){
    var ms=B.nextMiss();
    B.A(B.beat(),'miss',0,ms.t,{proj:ebPick(['question','plane','book']),banner:ms.b,bcolor:'#94a3b8'});
  };
  /* Crit + „Benesch überlegt" — er sinkt auf lowTo */
  B.fakeOut=function(lowTo){
    var c=B.nextCrit();
    B.pTo(Math.min(B.bHp-1,lowTo+ebRi(14,24)),{crit:true,banner:c.b},{t:c.t,p:c.p});
    var low=B.nextLow();
    B.pTo(lowTo,{banner:low.b,bcolor:'#4ade80'},{t:low.t,p:ebPick(EB_P_LINES).p});
  };
  B.phase2=function(healTo,lines){
    B.A(ebRi(2200,2600),'x',0,ebPick(EB_PRE),{pause:true});
    var ph=ebPick(lines||EB_PHASE2);
    B.A(ebRi(1400,1800),'rage',0,ph.t,{banner:ph.b,bcolor:'#ef4444',heal:healTo});
    B.bHp=healTo;
  };
  /* Grosser Abschluss mit Vorbereitung und Ultimate */
  B.ultimate=function(){
    B.A(ebRi(2100,2600),'x',0,ebPick(EB_PRE),{pause:true,banner:'…',bcolor:'#f59e0b',bsize:30});
    var fin=Math.random()<0.10
      ?{t:'Angesagte Schularbeit — ohne Ansage.',b:'SURPRISE-TEST!!!',p:'test'}
      :ebPick(EB_FINISH);
    B.A(ebRi(1500,1900),'ult',0,fin.b.replace('!!!','!'),
      {banner:fin.b,bcolor:'#ef4444',bsize:fin.b.length>12?32:40});
    B.A(ebRi(1300,1700),'b',99,fin.t,{proj:fin.p,crit:true,final:true});
    B.pHp=0;
  };
  /* Leises Ende: der Rest geht als gewöhnlicher Treffer, kein „-ALLES" */
  B.quietEnd=function(){
    if(B.pHp<=0)return;
    var q=ebPick(EB_QUIET_END);
    B.bTo(0,{banner:q.b,bcolor:'#f59e0b',bsize:32},{t:q.t,p:q.p});
  };
  return B;
}

/* Kein Archetyp zweimal hintereinander */
var ebLastArch=null;
function ebPickArchetype(){
  var pool=EB_ARCHETYPES.filter(function(a){return a.id!==ebLastArch;});
  if(!pool.length)pool=EB_ARCHETYPES;
  var total=0;pool.forEach(function(a){total+=a.weight;});
  var r=Math.random()*total;
  for(var i=0;i<pool.length;i++){
    r-=pool[i].weight;
    if(r<=0){ebLastArch=pool[i].id;return pool[i];}
  }
  ebLastArch=pool[pool.length-1].id;return pool[pool.length-1];
}

/* Die Boss-Musik läuft 60 s und loopt nicht — OFFSET 3200 + Nachlauf 2100 abgezogen */
var EB_MAX_T=54000;
function ebFitBudget(s){
  if(!s.length)return s;
  var last=s[s.length-1].t;
  if(last<=EB_MAX_T)return s;
  var k=EB_MAX_T/last;
  for(var i=0;i<s.length;i++)s[i].t=Math.round(s[i].t*k);
  return s;
}

function ebBuildScript(){
  var arch=ebPickArchetype();
  var B=ebMakeKit();
  arch.build(B);
  B.quietEnd(); // Sicherung, falls ein Archetyp den Herausforderer stehen lässt
  ebFitBudget(B.s);
  return {events:B.s,arch:arch};
}

        }
        if(ev.who==='x'){gg.bPose=0;gg.pPose=0;return;}

        var fromP=(ev.who==='p'||ev.who==='miss');
        if(fromP){gg.pPose=1;later(function(){var g3=gRef.current;if(g3)g3.pPose=0;},420);}
        else{gg.bPose=1;later(function(){var g3=gRef.current;if(g3)g3.bPose=0;},420);}
        sSwing();

        if(ev.proj){
          gg.proj.push({x:fromP?PX+34:BX-38,y:GROUND-(fromP?52:78),
            tx:fromP?BX-24:PX+22,ty:GROUND-(fromP?76:52),
            t:0,dur:fromP?26:24,type:ev.proj,rot:0,miss:ev.who==='miss',
            crit:!!ev.crit,dmg:ev.dmg,toBoss:fromP,final:!!ev.final});
        }
      },OFFSET+ev.t);
    });

    var lastT=script.length?script[script.length-1].t:0;
    later(function(){
      var gg=gRef.current;if(!gg)return;
      gg.ended=true;
      setPhase('done');
      setLogText(arch.outro);
      showBanner(arch.endBanner,'#ef4444',34);
      sDefeat();
      onResult('Prof. Benesch');
      later(function(){stopAH(audioRef.current);audioRef.current=null;},2200);
    },OFFSET+lastT+2100);

    var last=performance.now();
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-last)/16.67);last=now;
      update(gg,dt);draw(gg,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function applyDamage(g,pr){
    var dmg=pr.dmg;
    if(pr.toBoss){
      g.bHp=Math.max(pr.final?0:1,g.bHp-dmg);
      g.bHit=1;setHpB(Math.round(g.bHp));
      if(g.bHp<=12)g.bKnee=1;
    }else{
      g.pHp=Math.max(0,g.pHp-(pr.final?g.pHp:dmg));
      g.pHit=1;setHpP(Math.round(g.pHp));
    }
    g.shake=Math.min(1,g.shake+(pr.crit?0.9:0.45));
    g.dmgs.push({x:pr.tx,y:pr.ty-20,txt:'-'+(pr.final?'ALLES':dmg)+' Wissen',
      color:pr.crit?'#fde68a':'#fca5a5',life:44,maxLife:44,big:!!pr.crit});
    if(pr.crit)sCrit();else sHit(dmg);
    for(var i=0;i<(pr.crit?26:14);i++){
      var a=Math.random()*Math.PI*2;var sp=1.6+Math.random()*(pr.crit?5:3);
      g.parts.push({x:pr.tx,y:pr.ty,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,
        life:26,maxLife:26,c:pr.crit?'#fde68a':(pr.toBoss?'#fca5a5':'#93c5fd'),r:2.2});
    }
  }

  function update(g,dt){
    g.t+=dt;
    if(g.shake>0)g.shake=Math.max(0,g.shake-0.05*dt);
    if(g.flash>0)g.flash=Math.max(0,g.flash-0.035*dt);
    if(g.pHit>0)g.pHit=Math.max(0,g.pHit-0.06*dt);
    if(g.bHit>0)g.bHit=Math.max(0,g.bHit-0.06*dt);
    if(g.rage>0&&g.rage<1)g.rage=Math.min(1,g.rage+0.02*dt);
    if(g.bKnee>0&&g.bHp>20)g.bKnee=Math.max(0,g.bKnee-0.02*dt);

    for(var i=g.proj.length-1;i>=0;i--){
      var pr=g.proj[i];
      pr.t+=dt;pr.rot+=0.28*dt;
      var k=Math.min(1,pr.t/pr.dur);
      pr.cx=pr.x+(pr.tx-pr.x)*k;
      pr.cy=pr.y+(pr.ty-pr.y)*k-Math.sin(k*Math.PI)*46;
      if(k>=1){
        if(pr.miss){
          g.dmgs.push({x:pr.tx,y:pr.ty-24,txt:'DANEBEN',color:'#cbd5e1',life:40,maxLife:40});
        }else if(pr.dmg>0){
          applyDamage(g,pr);
        }
        g.proj.splice(i,1);
      }
    }
    for(var p=g.parts.length-1;p>=0;p--){
      var pt=g.parts[p];
      pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vy+=0.13*dt;pt.life-=dt;
      if(pt.life<=0)g.parts.splice(p,1);
    }
    for(var d=g.dmgs.length-1;d>=0;d--){
      var dm=g.dmgs[d];
      dm.y-=0.65*dt;dm.life-=dt;
      if(dm.life<=0)g.dmgs.splice(d,1);
    }
    if(Math.random()<0.15*dt){
      g.dust.push({x:Math.random()*AW,y:AH,vy:-0.25-Math.random()*0.4,
        x0:Math.random()*6,life:150,maxLife:150,r:0.8+Math.random()*1.4});
    }
    for(var u=g.dust.length-1;u>=0;u--){
      var du=g.dust[u];
      du.y+=du.vy*dt;du.life-=dt;
      if(du.life<=0)g.dust.splice(u,1);
    }
  }

    t.strokeStyle='rgba(255,255,255,0.05)';t.lineWidth=1;
    for(var l=0;l<10;l++){
      t.beginPath();t.moveTo(l*AW/10,GROUND);t.lineTo(l*AW/10-40,AH);t.stroke();
    }
    // Vignette
    var vg=t.createRadialGradient(AW/2,AH/2,AH*0.22,AW/2,AH/2,AH*0.95);

  }

  function draw(g,now){
    var cv=canvasRef.current;if(!cv)return;

    var sh=g.shake;
    var ox=sh>0?(Math.random()-0.5)*sh*11:0;

    if(!g._bg)g._bg=buildArena();

    // Scheinwerfer
    [[PX,'rgba(96,165,250,'],[BX,g.rage>0?'rgba(239,68,68,':'rgba(251,191,36,']].forEach(function(sp){
      var lg=ctx.createRadialGradient(sp[0],GROUND-160,10,sp[0],GROUND,230);

      lg.addColorStop(1,sp[1]+'0)');

      ctx.beginPath();ctx.moveTo(sp[0]-40,0);ctx.lineTo(sp[0]+40,0);

    });

    // Rage-Aura
    if(g.rage>0){
      var ra=0.10+0.06*Math.sin(now/160);
      ctx.fillStyle='rgba(127,29,29,'+ra+')';ctx.fillRect(0,0,AW,AH);

    });
    ctx.globalAlpha=1;

    g.dmgs.forEach(function(dm){
      ctx.save();ctx.globalAlpha=Math.max(0,dm.life/dm.maxLife);
      ctx.font='900 '+(dm.big?30:21)+'px Inter,sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.strokeStyle='rgba(0,0,0,0.9)';ctx.lineWidth=5;ctx.lineJoin='round';

    // Namen unter den Kämpfern
    ctx.save();
    ctx.font='900 13px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineWidth=4;ctx.lineJoin='round';
    ctx.strokeText(truncName(hero,14),PX,GROUND+22);
    ctx.fillStyle='#93c5fd';ctx.fillText(truncName(hero,14),PX,GROUND+22);
    ctx.strokeText('PROF. BENESCH',BX,GROUND+22);
    ctx.fillStyle=g.rage>0?'#fca5a5':'#fcd34d';ctx.fillText('PROF. BENESCH',BX,GROUND+22);
    ctx.restore();

    if(g.flash>0.02){
      ctx.fillStyle='rgba(255,255,255,'+(g.flash*0.55)+')';
      ctx.fillRect(0,0,AW,AH);
    }
  }

  function reset(){

    setPhase('idle');setHpP(100);setHpB(100);setLogText('');setBanner(null);
    setRage(false);setRoundN(0);
    if(canvasRef.current){var c=canvasRef.current.getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,AW*2,AH*2);}

  if(phase==='idle'){
    return(

  var bossPct=Math.max(0,Math.min(100,hpB));
  var heroPct=Math.max(0,Math.min(100,hpP));

  return(
    html`<div className="flex flex-col items-center w-full max-w-5xl screen-enter">

      ${phase==='done'&&html`<div data-result className="winner-enter mb-5 w-full max-w-lg">

          <div className="text-3xl font-black text-white tracking-tight mb-2">Prof. Benesch</div>
          <p className="text-red-200/80 text-sm">${archInfo?archInfo.defeat.replace('{H}',truncName(hero,18)):truncName(hero,18)+' hat tapfer mitgedacht.'}</p>

      <div data-result-actions className="flex gap-3 mt-1 flex-wrap justify-center">
        ${phase==='fight'&&html`<button onClick=${function(){reset();onDone();}} className="px-5 py-2 rounded-xl font-semibold bg-gray-100 text-gray-500 border border-gray-200 hover:bg-gray-200 transition-all text-sm">✕ Abbrechen</button>`}
        ${phase==='done'&&html`<span className="flex gap-3">

          <button onClick=${onDone} className="px-6 py-3 rounded-xl font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 border border-gray-200 transition-all">Zurück</button>
        </span>`}

/* ═══════════════════════════════════════════════════════
   STAFFELLAUF — hier gewinnt eine ganze Gruppe
   ═══════════════════════════════════════════════════════ */
function StaffellaufMode(props){
  var names=props.names;var onDone=props.onDone;var onResult=props.onResult||function(){};
  var maxGroups=Math.min(6,Math.max(2,Math.floor(names.length/2)));
  var _ng=useState(function(){return Math.min(3,maxGroups);});var numGroups=_ng[0];var setNumGroups=_ng[1];
  var _ph=useState('pick');var phase=_ph[0];var setPhase=_ph[1];
  var _st=useState('');var statusText=_st[0];var setStatusText=_st[1];
  var _groups=useState([]);var groups=_groups[0];var setGroups=_groups[1];
  var _rank=useState([]);var ranking=_rank[0];var setRanking=_rank[1];
  var _cd=useState(null);var countdown=_cd[0];var setCountdown=_cd[1];
  var _cf=useState(false);var showConfetti=_cf[0];var setShowConfetti=_cf[1];
  var canvasRef=useRef(null);var gRef=useRef(null);var rafRef=useRef(null);
  var timers=useRef([]);var audioRef=useRef(null);

  var AW=820;
  var laneH=78;
  var AH=0;

  function clearT(){timers.current.forEach(clearTimeout);timers.current=[];}
  function later(fn,ms){timers.current.push(setTimeout(fn,ms));}
  function doCleanup(){
    clearT();
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    stopAH(audioRef.current);audioRef.current=null;
  }
  useEffect(function(){return function(){doCleanup();};},[]);
  useEffect(function(){
    function onKey(e){if((e.code==='Space'||e.key===' ')&&phase==='pick'){e.preventDefault();start();}}
    window.addEventListener('keydown',onKey);return function(){window.removeEventListener('keydown',onKey);};
  },[phase,numGroups]);

  function playBeep(f){try{var ah=audioRef.current;if(!ah)return;aT(ah.ctx,ah.master,f,ah.ctx.currentTime,0.16,0.24,'square');}catch(e){}}
  function playPass(){try{var ah=audioRef.current;if(!ah)return;aT(ah.ctx,ah.master,660,ah.ctx.currentTime,0.07,0.15,'triangle');}catch(e){}}
  function playFinish(){
    try{var ah=audioRef.current;if(!ah)return;var c=ah.ctx;var m=ah.master;var now=c.currentTime;
      [523.25,659.25,783.99,1046.5].forEach(function(f,i){aT(c,m,f,now+i*0.1,0.28,0.2,'triangle');});}catch(e){}
  }

  function start(){
    if(phase==='running')return;
    doCleanup();
    var ah=createAudioCtx();audioRef.current=ah;

    var ng=numGroups;
    var built=splitGroups(names.length,ng,names);
    var winnerGroup=Math.floor(secureRandom()*ng);
    var others=[];for(var i=0;i<ng;i++){if(i!==winnerGroup)others.push(i);}
    others=shuffle(others);
    var finishOrder=[winnerGroup].concat(others);

    var RACE_MS=12000;
    var finishAt={};
    finishOrder.forEach(function(gi,pos){finishAt[gi]=RACE_MS-((finishOrder.length-1-pos)*0)+pos*520;});

    var lanes=built.map(function(g,gi){
      return {gi:gi,members:g,finishAt:finishAt[gi],p:0,lastRunner:-1,arrived:false,
        wob:Math.random()*Math.PI*2};
    });

    AH=Math.round(58+(ng-0.5)*laneH+16);
    if(canvasRef.current){canvasRef.current.width=AW*2;canvasRef.current.height=AH*2;}

    var g2={lanes:lanes,ng:ng,AH:AH,startT:0,done:false,confetti:[],order:[]};
    gRef.current=g2;
    setGroups(built);setRanking([]);setShowConfetti(false);
    setPhase('running');setStatusText('');

    setCountdown(3);
    later(function(){setCountdown(2);playBeep(440);},800);
    later(function(){setCountdown(1);playBeep(440);},1600);
    later(function(){setCountdown('LOS! \u{1F3C3}');playBeep(880);},2400);
    later(function(){
      setCountdown(null);setStatusText('\u{1F3C3} Der Staffellauf läuft!');
      var gg=gRef.current;if(gg)gg.startT=performance.now();
    },3200);

    finishOrder.forEach(function(gi,pos){
      later(function(){
        var gg=gRef.current;if(!gg)return;
        var lane=gg.lanes[gi];if(!lane||lane.arrived)return;
        lane.arrived=true;lane.p=1;
        gg.order.push(gi);
        setRanking(function(prev){return prev.concat([gi]);});
        if(pos===0){
          playFinish();
          setStatusText('\u{1F3C6} Gruppe '+(gi+1)+' gewinnt den Staffellauf!');
        }
      },3200+finishAt[gi]);
    });

    later(function(){
      var gg=gRef.current;if(!gg)return;
      gg.done=true;
      setPhase('done');setShowConfetti(true);
      onResult('Gruppe '+(winnerGroup+1));
      stopAH(audioRef.current);audioRef.current=null;
      later(function(){if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}},1600);
    },3200+finishAt[finishOrder[finishOrder.length-1]]+700);

    var last=performance.now();
    function loop(now){
      var gg=gRef.current;if(!gg)return;
      var dt=Math.min(3,(now-last)/16.67);last=now;
      update(gg,dt,now);draw(gg,now);
      rafRef.current=requestAnimationFrame(loop);
    }
    rafRef.current=requestAnimationFrame(loop);
  }

  function update(g,dt,now){
    if(!g.startT)return;
    var el=now-g.startT;
    for(var i=0;i<g.lanes.length;i++){
      var lane=g.lanes[i];
      lane.wob+=0.07*dt;
      if(lane.arrived){lane.p=1;continue;}
      var raw=Math.min(1,el/lane.finishAt);
      // Leichtes Auf und Ab, damit sich die Führung anfühlt wie ein echtes Rennen
      lane.p=Math.max(0,Math.min(0.995,raw+Math.sin(lane.wob*0.6)*0.018*(1-raw)));
      var runnerIdx=Math.min(lane.members.length-1,Math.floor(lane.p*lane.members.length));
      if(runnerIdx!==lane.lastRunner){
        if(lane.lastRunner>=0)playPass();
        lane.lastRunner=runnerIdx;
      }
    }
  }

  function draw(g,now){
    var cv=canvasRef.current;if(!cv)return;
    var ctx=cv.getContext('2d');
    ctx.setTransform(2,0,0,2,0,0);
    var H=g.AH;

    ctx.fillStyle='#132018';ctx.fillRect(0,0,AW,H);
    var trackX0=118;var trackX1=AW-52;

    // Ziel-Zielflagge
    for(var cy2=0;cy2<H;cy2+=12){
      for(var cx2=0;cx2<2;cx2++){
        ctx.fillStyle=((Math.floor(cy2/12)+cx2)%2===0)?'#ffffff':'#111827';
        ctx.fillRect(trackX1+cx2*9,cy2,9,12);
      }
    }
    ctx.fillStyle='rgba(255,255,255,0.35)';ctx.fillRect(trackX0-2,0,2,H);

    for(var i=0;i<g.lanes.length;i++){
      var lane=g.lanes[i];
      var y=58+i*laneH;
      var col=groupPalette(lane.gi).light;

      // Bahn
      ctx.fillStyle=i%2===0?'rgba(255,255,255,0.030)':'rgba(255,255,255,0.055)';
      ctx.fillRect(0,y-laneH/2+6,AW,laneH-12);
      ctx.strokeStyle='rgba(255,255,255,0.09)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(trackX0,y+laneH/2-6);ctx.lineTo(trackX1,y+laneH/2-6);ctx.stroke();

      // Gruppenlabel links
      ctx.fillStyle=col;
      ctx.beginPath();ctx.arc(30,y,15,0,Math.PI*2);ctx.fill();
      ctx.font='bold 14px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(String(lane.gi+1),30,y);
      ctx.font='bold 12px Inter,sans-serif';ctx.textAlign='left';
      ctx.fillStyle='rgba(255,255,255,0.72)';
      ctx.fillText('Gruppe '+(lane.gi+1)+' ('+lane.members.length+')',50,y);

      // Wechselzonen
      var segs=lane.members.length;
      for(var s=1;s<segs;s++){
        var sx=trackX0+(trackX1-trackX0)*(s/segs);
        ctx.strokeStyle='rgba(255,255,255,0.13)';ctx.lineWidth=1;
        ctx.setLineDash([3,4]);
        ctx.beginPath();ctx.moveTo(sx,y-laneH/2+10);ctx.lineTo(sx,y+laneH/2-10);ctx.stroke();
        ctx.setLineDash([]);
      }

      // Fortschrittsbalken
      var px=trackX0+(trackX1-trackX0)*lane.p;
      ctx.strokeStyle=col+'66';ctx.lineWidth=4;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(trackX0,y+laneH/2-14);ctx.lineTo(px,y+laneH/2-14);ctx.stroke();

      // Läufer mit Namen
      var ri=Math.min(lane.members.length-1,Math.floor(lane.p*lane.members.length));
      var runnerName=names[lane.members[ri]]||'';
      var bob=Math.sin(lane.wob*2)*2.5;
      ctx.font='24px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(lane.arrived?'\u{1F3C6}':'\u{1F3C3}',px,y-6+bob);

      var nm=truncName(runnerName,14);
      ctx.font='bold 13px Inter,sans-serif';
      var tw=ctx.measureText(nm).width;
      var bx=Math.max(trackX0+tw/2+6,Math.min(trackX1-tw/2-6,px));
      ctx.fillStyle=col;
      var rw=tw+14;var rh=19;
      ctx.beginPath();
      ctx.moveTo(bx-rw/2+6,y+16-rh/2);ctx.lineTo(bx+rw/2-6,y+16-rh/2);
      ctx.quadraticCurveTo(bx+rw/2,y+16-rh/2,bx+rw/2,y+16-rh/2+6);
      ctx.lineTo(bx+rw/2,y+16+rh/2-6);
      ctx.quadraticCurveTo(bx+rw/2,y+16+rh/2,bx+rw/2-6,y+16+rh/2);
      ctx.lineTo(bx-rw/2+6,y+16+rh/2);
      ctx.quadraticCurveTo(bx-rw/2,y+16+rh/2,bx-rw/2,y+16+rh/2-6);
      ctx.lineTo(bx-rw/2,y+16-rh/2+6);
      ctx.quadraticCurveTo(bx-rw/2,y+16-rh/2,bx-rw/2+6,y+16-rh/2);
      ctx.closePath();ctx.fill();
      ctx.font='bold 13px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#fff';ctx.fillText(nm,bx,y+16);

      // Platzierung
      var pos=g.order.indexOf(lane.gi);
      if(pos>=0){
        ctx.font='bold 15px Inter,sans-serif';ctx.textAlign='left';
        ctx.fillStyle=pos===0?'#fbbf24':'rgba(255,255,255,0.6)';
        ctx.fillText((pos+1)+'.',trackX1+24,y);
      }
    }

    ctx.font='bold 12px Inter,sans-serif';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillStyle='rgba(255,255,255,0.45)';

/* Kopiert Text; ohne Clipboard-API (z. B. unsichere Verbindung) über ein verstecktes Textfeld */
function copyToClipboard(text){
  function fallback(){
    try{
      var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');
      ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      var ok=document.execCommand('copy');document.body.removeChild(ta);
      return ok?Promise.resolve():Promise.reject(new Error('copy'));
    }catch(e){return Promise.reject(e);}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(text).catch(fallback);
  return fallback();
}
/* props: text (fertiger Text) oder modeName + winner/winners */
function CopyButton(props){

  function show(s){setSt(s);clearTimeout(tRef.current);tRef.current=setTimeout(function(){setSt('idle');},s==='fail'?2500:1500);}
  function doCopy(){copyToClipboard(text).then(function(){show('ok');},function(){show('fail');});}

/* Setzt den Tastaturfokus auf das Ergebnis, ohne zu scrollen — Tab führt von dort zu Kopieren/Nochmal/Zurück */
function focusResult(){
  var main=document.querySelector('main');if(!main)return;
  var res=main.querySelector('[data-result], .winner-card');if(!res||res.contains(document.activeElement))return;
  if(!res.hasAttribute('tabindex'))res.setAttribute('tabindex','-1');
  res.focus({preventScroll:true});
}

/* Holt nach der Auflösung Ergebnis und Nochmal/Zurück ins Bild — am Beamer ohne Scrollen sichtbar */
function prefersReducedMotion(){try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}}
function revealResult(){
  var main=document.querySelector('main');if(!main)return;
  var acts=main.querySelectorAll('[data-result-actions]');var act=acts.length?acts[acts.length-1]:null;
  var res=main.querySelector('[data-result], .winner-card');
  if(!act&&!res)return;
  var vh=window.innerHeight,m=12;
  var bottom=(act||res).getBoundingClientRect().bottom;
  var top=(res||act).getBoundingClientRect().top;
  if(top>=m&&bottom<=vh-m)return;
  var delta=bottom-(vh-m);              // Buttons unten ins Bild holen …
  if(top-delta<m)delta=top-m;           // … ohne den Anfang des Ergebnisses abzuschneiden
  if(Math.abs(delta)<4)return;
  window.scrollBy({top:delta,behavior:prefersReducedMotion()?'auto':'smooth'});
}

/* Liest Textdateien; Excel-CSV (Windows-1252) wird an kaputten Umlauten erkannt und neu dekodiert */
function readTextFile(file,onText,onError){
  var rd=new FileReader();
  rd.onload=function(){
    var t=String(rd.result||'');
    if(t.indexOf('\uFFFD')<0){onText(t);return;}
    var rd2=new FileReader();
    rd2.onload=function(){onText(String(rd2.result||''));};
    rd2.onerror=function(){onText(t);};
    rd2.readAsText(file,'windows-1252');
  };
  rd.onerror=onError;
  rd.readAsText(file);
}

    if(r.duplicates.length)parts.push(r.duplicates.length+' doppelte übersprungen: '+r.duplicates.join(', '));
    if(r.overflow.length)parts.push(r.overflow.length+' passten nicht mehr (höchstens '+MAX_NAMES+')');

  function removeName(idx){

    showNotice('„'+entry.name+'“ entfernt','info',{label:'Rückgängig',run:function(){
      setLists(function(p){return p.map(function(l){
        if(l.id!==id||l.names.some(function(n){return n.name===entry.name}))return l;
        var ns=l.names.slice();ns.splice(Math.min(idx,ns.length),0,entry);

  /* Namensliste als ein Tab-Stopp: ↑/↓ wählt den Namen, Entf entfernt, Alt+↑/↓ verschiebt */
  function nameRowKey(e,i){

    if(e.altKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
      var j=e.key==='ArrowUp'?i-1:i+1;if(j<0||j>=n)return;
      e.preventDefault();reorderNames(i,j);setRovIdx(j);focusToggleRef.current=j;return;
    }
    if(e.key==='ArrowDown')to=Math.min(n-1,i+1);
    else if(e.key==='ArrowUp')to=Math.max(0,i-1);
    else if(e.key==='Home')to=0;
    else if(e.key==='End')to=n-1;
    else if(e.key==='Delete'||e.key==='Backspace'){
      e.preventDefault();removeName(i);var next=Math.max(0,Math.min(i,n-2));setRovIdx(next);if(n>1)focusToggleRef.current=next;return;

                    <span className="badge-time" title="Ungefähre Dauer bis zum Ergebnis"><span aria-hidden="true">⏱</span> ca. 18 Sek.</span>
                  </div>
                  <div className="text-base font-bold text-gray-900 mb-1">Labyrinth</div>
                  <p className="text-sm text-gray-800 leading-relaxed">Murmeln rollen durch ein Holz-Labyrinth in 2 bis 6 Becher, einen pro Gruppe!</p>
                </button>

                <button onClick=${function(){launchMode('vortex')}} disabled=${checkedNames.length<2} onMouseMove=${trackMouse}
                  className=${"mode-card group rounded-2xl p-5 text-left border "+(checkedNames.length>=2?"bg-gradient-to-br from-indigo-600 to-violet-600 border-transparent cursor-pointer shadow-lg shadow-indigo-200":"bg-gray-100 border-gray-200 cursor-not-allowed opacity-40")}
                  style=${{['--card-glow']:'rgba(139,92,246,0.15)'}}>
                  <div className="flex items-start justify-between mb-2">
                    <div className="text-2xl">\u{1F300}</div>
                    <span className="badge-time" title="Ungefähre Dauer bis zum Ergebnis"><span aria-hidden="true">⏱</span> ca. 7 Sek.</span>
                  </div>
                  <div className="text-base font-bold text-white mb-1">Dimensions-Portal</div>
                  <p className="text-sm text-white leading-relaxed">Wirbel saugt alle in farbige Portale \u2014 gleich gro\u00DFe Gruppen!</p>
                </button>

                <button onClick=${function(){launchMode('partner')}} disabled=${checkedNames.length<2} onMouseMove=${trackMouse}
                  className=${"mode-card group rounded-2xl p-5 text-left border "+(checkedNames.length>=2?"bg-gradient-to-br from-violet-600 to-blue-700 border-transparent cursor-pointer shadow-lg shadow-violet-200":"bg-gray-100 border-gray-200 cursor-not-allowed opacity-40")}
                  style=${{['--card-glow']:'rgba(124,58,237,0.15)'}}>
                  <div className="flex items-start justify-between mb-2">
                    <div className="text-2xl">\u{1F0CF}</div>
                    <span className="badge-time" title="Ungefähre Dauer bis zum Ergebnis"><span aria-hidden="true">⏱</span> ca. 21 Sek.</span>
                  </div>
                  <div className="text-base font-bold text-white mb-1">Partner finden</div>
                  <p className="text-sm text-white leading-relaxed">Memory-Karten decken auf, wer mit wem im Zweierteam landet.</p>
                </button>

                <button onClick=${function(){launchMode('hut')}} disabled=${checkedNames.length<2} onMouseMove=${trackMouse}
                  className=${"mode-card group rounded-2xl p-5 text-left border "+(checkedNames.length>=2?"bg-gradient-to-br from-amber-700 to-red-900 border-transparent cursor-pointer shadow-lg shadow-amber-200":"bg-gray-100 border-gray-200 cursor-not-allowed opacity-40")}
                  style=${{['--card-glow']:'rgba(124,45,18,0.15)'}}>
                  <div className="flex items-start justify-between mb-2">
                    <div className="text-2xl">\u{1F3A9}</div>
                    <span className="badge-time" title="Ungefähre Dauer bis zum Ergebnis"><span aria-hidden="true">⏱</span> ca. 25 Sek.</span>
                  </div>
                  <div className="text-base font-bold text-white mb-1">Sprechender Hut</div>
                  <p className="text-sm text-white leading-relaxed">Vier Häuser, ein Stuhl — der Hut ruft das Haus aus.</p>
                </button>

                <button onClick=${function(){launchMode('tau')}} disabled=${checkedNames.length<2} onMouseMove=${trackMouse}
                  className=${"mode-card group rounded-2xl p-5 text-left border "+(checkedNames.length>=2?"bg-gradient-to-br from-lime-700 to-green-800 border-transparent cursor-pointer shadow-lg shadow-lime-200":"bg-gray-100 border-gray-200 cursor-not-allowed opacity-40")}
                  style=${{['--card-glow']:'rgba(101,163,13,0.15)'}}>
                  <div className="flex items-start justify-between mb-2">
                    <div className="text-2xl">\u{1FAA2}</div>
                    <span className="badge-time" title="Ungefähre Dauer bis zum Ergebnis"><span aria-hidden="true">⏱</span> ca. 16 Sek.</span>
                  </div>
                  <div className="text-base font-bold text-white mb-1">Tauziehen</div>
                  <p className="text-sm text-white leading-relaxed">Jedes Team zieht seine Leute vom Seil zu sich herüber.</p>
                </button>

                <button onClick=${function(){launchMode('staffel')}} disabled=${checkedNames.length<2} onMouseMove=${trackMouse}
                  className=${"mode-card group rounded-2xl p-5 text-left border "+(checkedNames.length>=2?"bg-gradient-to-br from-emerald-700 to-green-800 border-transparent cursor-pointer shadow-lg shadow-emerald-200":"bg-gray-100 border-gray-200 cursor-not-allowed opacity-40")}
                  style=${{['--card-glow']:'rgba(5,150,105,0.15)'}}>
                  <div className="flex items-start justify-between mb-2">
                    <div className="text-2xl">\u{1F3C3}</div>
                    <span className="badge-time" title="Ungefähre Dauer bis zum Ergebnis"><span aria-hidden="true">⏱</span> ca. 15 Sek.</span>
                  </div>
                  <div className="text-base font-bold text-white mb-1">Staffellauf</div>
                  <p className="text-sm text-white leading-relaxed">Gruppen treten gegeneinander an — hier gewinnt ein ganzes Team.</p>
                </button>
              </div>

              <div className="flex items-center justify-center gap-3 mb-5 mt-8">
                <div className="section-divider flex-1"/>
                <h2 className="category-label category-label-amber">\u{1F5C2}\uFE0F Organisation</h2>
                <div className="section-divider flex-1"/>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <button onClick=${function(){launchMode('reihenfolge')}} disabled=${checkedNames.length<2} onMouseMove=${trackMouse}
                  className=${"mode-card group rounded-2xl p-5 text-left border "+(checkedNames.length>=2?"bg-gradient-to-br from-amber-700 to-orange-700 border-transparent cursor-pointer shadow-lg shadow-amber-200":"bg-gray-100 border-gray-200 cursor-not-allowed opacity-40")}
                  style=${{['--card-glow']:'rgba(217,119,6,0.15)'}}>
                  <div className="flex items-start justify-between mb-2">
                    <div className="text-2xl">\u{1F522}</div>
                    <span className="badge-time" title="Ungefähre Dauer bis zum Ergebnis"><span aria-hidden="true">⏱</span> ca. 13 Sek.</span>
                  </div>
                  <div className="text-base font-bold text-white mb-1">Reihenfolge</div>
                  <p className="text-sm text-white leading-relaxed">Wer pr\u00E4sentiert wann? Komplette Startaufstellung 1 bis N.</p>
                </button>
              </div>
            </section>
          </div>`
        )}
        <${ErrorBoundary} onReset=${function(){setScreen('input')}}>
          ${screen==='lotto'&&html`<${LottoMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Lotto-Ziehung',w)}}/>`}
          ${screen==='battle'&&html`<${BattleMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Turnier',w)}}/>`}
          ${screen==='groupquick'&&html`<${GroupQuickMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Gruppen sofort',w)}} onGroups=${attachGroupDetail}/>`}
          ${screen==='groupanim'&&html`<${GroupAnimMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Super Mario',w)}} onGroups=${attachGroupDetail}/>`}
          ${screen==='endboss'&&html`<${EndbossMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Endboss',w)}}/>`}
          ${screen==='chaos'&&html`<${ChaosArenaMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Chaos Arena',w)}}/>`}
          ${screen==='maze'&&html`<${MarbleMazeMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Labyrinth',w)}} onGroups=${attachGroupDetail}/>`}
          ${screen==='wissensarena'&&html`<${WissensArenaMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Wissens-Arena',w)}}/>`}
          ${screen==='vortex'&&html`<${VortexPortalMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Dimensions-Portal',w)}} onGroups=${attachGroupDetail}/>`}
          ${screen==='wheel'&&html`<${WheelMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Glücksrad',w)}}/>`}
          ${screen==='spacerace'&&html`<${SpaceRaceMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Space Race',w)}}/>`}
          ${screen==='spielplatz'&&html`<${SpielplatzMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Spielplatz',w)}}/>`}
          ${screen==='reihenfolge'&&html`<${ReihenfolgeMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Reihenfolge',w)}}/>`}
          ${screen==='partner'&&html`<${PartnerMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Partner finden',w)}} onGroups=${attachGroupDetail}/>`}
          ${screen==='zombie'&&html`<${ZombieMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Zombie-Ausbruch',w)}}/>`}
          ${screen==='jerusalem'&&html`<${ReiseJerusalemMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Reise nach Jerusalem',w)}}/>`}
          ${screen==='eis'&&html`<${EisschollenMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Pushy Penguins',w)}}/>`}
          ${screen==='karten'&&html`<${KartenduellMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Kartenduell',w)}}/>`}
          ${screen==='ballon'&&html`<${BallonMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Ballon-Wettpumpen',w)}}/>`}
          ${screen==='hut'&&html`<${SortierhutMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Sprechender Hut',w)}} onGroups=${attachGroupDetail}/>`}
          ${screen==='tau'&&html`<${TauziehenMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Tauziehen',w)}} onGroups=${attachGroupDetail}/>`}
          ${screen==='staffel'&&html`<${StaffellaufMode} names=${gameNames} onDone=${function(){setScreen('input')}} onResult=${function(w){recordResult('Staffellauf',w)}}/>`}
        </${ErrorBoundary}>
      </main>
      ${!inGame&&html`<footer className="footer-glass text-center py-5 relative" style=${{zIndex:1}}>
        <div className="text-gray-700 text-sm font-bold tracking-widest uppercase mb-1">🎲 Beneschgenerator</div>
        <div className="text-gray-400 text-xs">22 Modi \u00B7 Bis zu 50 Teilnehmer \u00B7 Zufall entscheidet</div>
        <div className="text-gray-300 text-xs mt-2">\u00A9 2026 Beneschgenerator</div>
      </footer>`}
      <div className="sr-only" role="status" aria-live="polite" aria-atomic="true" data-announce>${announcement}</div>
      <div data-notice role="status" aria-live="polite" className=${"notice-toast"+(notice?" show "+notice.kind:"")+(notice&&notice.action?" has-action":"")}>${notice?notice.text:''}${notice&&notice.action&&html`<button type="button" className="notice-action" onClick=${notice.action.run}>${notice.action.label}</button>`}</div>
    </div>`
  );
}

var root=ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
